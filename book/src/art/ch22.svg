<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Bins, a crab, stands on the sand beside 4 crates labeled with the 2-bit digits 00, 01, 10 and 11. Chalked on each crate is the number of keys with that digit, 1, 2, 3 and 2, and above each crate the place where its first key goes, 0, 1, 3 and 6. Bins holds up a pebble marked 5, binary 101, on its way to crate 01. A tag reads count, scan, then place.">
