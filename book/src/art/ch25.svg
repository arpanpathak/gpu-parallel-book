<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="4 geese stand in a ring on a meadow at dusk, each one a GPU of a ring all-reduce. A dashed path with arrows joins them in a circle. Each goose holds a parcel in its beak and faces the next goose, to which it hands its parcel. Around the ring from rank 0 the parcels read 1, 3, 6 and 10: a partial sum that grows as it travels. A tag says pass a chunk on, add your own, pass it on.">
