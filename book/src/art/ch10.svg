<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Hoot, an owl, sits on a tree stump at dusk and watches a rope of lanterns. The first 4 lanterns glow; a brace beneath them reads in scope. The last 2 hang dark; a brace beneath them reads scope ended. Nobody walked along the rope to put them out: each lantern switched itself off when its scope ended, as a C++ destructor releases what a constructor took.">
