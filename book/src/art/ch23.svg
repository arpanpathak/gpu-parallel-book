<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Knock, a woodpecker, clings to a tree trunk and taps its beak on a brass doorbell plate fixed to the bark, marked with a register address. Beside the tree hangs a board with a ring of 8 slots: 5 of them hold work tickets, a PUT marker points past the last ticket written and a GET marker at the first ticket not yet done. A tag says write the work, then knock: the rule of a doorbell.">
