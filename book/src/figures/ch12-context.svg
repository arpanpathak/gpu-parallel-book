<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 476" width="660" height="476" role="img" aria-label="On the left, 3 callers: the runtime API with cudaMalloc, cudaMemcpy and triple angle brackets; the driver API with cuModuleLoadData, cuLaunchKernel and cuModuleUnload; and cuda-core with CudaContext::new, load_module_from_image and launch_kernel_on_stream. On the right, 1 primary context of GPU 0 holds the memory X, Y and C from cudaMalloc, the module from the fatbin with polyGeneric, and the module from NVRTC with poly. All 3 callers reach it.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="476" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">1 context, 3 callers</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The runtime API and the driver API share the primary context.</text>
  <rect x="24" y="100" width="196" height="84" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M36,100.7 H30 V183.3 H36 A11.3,11.3 0 0 1 24.7,172 V112 A11.3,11.3 0 0 1 36,100.7 Z" fill="#2F6FDB"/>
  <text x="44.0" y="120.0" class="name" text-anchor="start" xml:space="preserve">runtime API</text>
  <text x="44.0" y="138.0" class="sub" text-anchor="start" xml:space="preserve">cudaMalloc</text>
  <text x="44.0" y="156.0" class="sub" text-anchor="start" xml:space="preserve">cudaMemcpy</text>
  <text x="44.0" y="174.0" class="sub" text-anchor="start" xml:space="preserve">&lt;&lt;&lt;...&gt;&gt;&gt;</text>
  <rect x="24" y="212" width="196" height="84" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M36,212.7 H30 V295.3 H36 A11.3,11.3 0 0 1 24.7,284 V224 A11.3,11.3 0 0 1 36,212.7 Z" fill="#1F8A70"/>
  <text x="44.0" y="232.0" class="name" text-anchor="start" xml:space="preserve">driver API</text>
  <text x="44.0" y="250.0" class="sub" text-anchor="start" xml:space="preserve">cuModuleLoadData</text>
  <text x="44.0" y="268.0" class="sub" text-anchor="start" xml:space="preserve">cuLaunchKernel</text>
  <text x="44.0" y="286.0" class="sub" text-anchor="start" xml:space="preserve">cuModuleUnload</text>
  <rect x="24" y="324" width="196" height="84" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M36,324.7 H30 V407.3 H36 A11.3,11.3 0 0 1 24.7,396 V336 A11.3,11.3 0 0 1 36,324.7 Z" fill="#B7791F"/>
  <text x="44.0" y="344.0" class="name" text-anchor="start" xml:space="preserve">cuda-core</text>
  <text x="44.0" y="362.0" class="sub" text-anchor="start" xml:space="preserve">CudaContext::new</text>
  <text x="44.0" y="380.0" class="sub" text-anchor="start" xml:space="preserve">load_module_from_image</text>
  <text x="44.0" y="398.0" class="sub" text-anchor="start" xml:space="preserve">launch_kernel_on_stream</text>
  <rect x="260" y="100" width="384" height="308" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="278" y="89" width="216.8" height="22" rx="11" fill="#1B2430"/>
  <text x="386.4" y="104.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">PRIMARY CONTEXT OF GPU 0</text>
  <rect x="284" y="132" width="336" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M296,132.7 H290 V195.3 H296 A11.3,11.3 0 0 1 284.7,184 V144 A11.3,11.3 0 0 1 296,132.7 Z" fill="#2F6FDB"/>
  <text x="304.0" y="160.0" class="name" text-anchor="start" xml:space="preserve">memory</text>
  <text x="304.0" y="178.0" class="sub" text-anchor="start" xml:space="preserve">X, Y and C from cudaMalloc</text>
  <rect x="284" y="212" width="336" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M296,212.7 H290 V275.3 H296 A11.3,11.3 0 0 1 284.7,264 V224 A11.3,11.3 0 0 1 296,212.7 Z" fill="#1F8A70"/>
  <text x="304.0" y="240.0" class="name" text-anchor="start" xml:space="preserve">module from the fatbin</text>
  <text x="304.0" y="258.0" class="sub" text-anchor="start" xml:space="preserve">polyGeneric, built by nvcc</text>
  <rect x="284" y="292" width="336" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M296,292.7 H290 V355.3 H296 A11.3,11.3 0 0 1 284.7,344 V304 A11.3,11.3 0 0 1 296,292.7 Z" fill="#7A4FD0"/>
  <text x="304.0" y="320.0" class="name" text-anchor="start" xml:space="preserve">module from NVRTC</text>
  <text x="304.0" y="338.0" class="sub" text-anchor="start" xml:space="preserve">poly, built while the program ran</text>
  <path class="wire" d="M220,142 L260,142" marker-end="url(#head)"/>
  <path class="wire" d="M220,254 L260,254" marker-end="url(#head)"/>
  <path class="wire" d="M220,366 L260,366" marker-end="url(#head)"/>
  <text x="24.0" y="438.0" class="note" text-anchor="start" xml:space="preserve">cuDevicePrimaryCtxRetain hands out the context the runtime API uses, so a pointer</text>
  <text x="24.0" y="456.0" class="note" text-anchor="start" xml:space="preserve">from cudaMalloc is valid in cuLaunchKernel. cuda-core retains the same context.</text>
</svg>
