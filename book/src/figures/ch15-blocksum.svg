<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" width="640" height="344" role="img" aria-label="The block sum with shuffles. Each of the 8 warps of a 256-thread block sums its 32 values with 5 shuffles, and lane 0 stores the warp sum in w[0] to w[7] in shared memory. After 1 barrier, warp 0 reads the 8 values and sums them with 5 more shuffles; thread 0 holds the block sum.">
