<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 236" width="660" height="236" role="img" aria-label="4 boxes joined by arrows: global memory holding A and B, shared memory holding tileA and tileB, registers holding sum, and global memory holding C. Under the arrows: load, 2 values per phase; read, 2T values per phase; store, 1 value.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="236" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The path of data through 1 thread</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The tiled kernel stages operands in shared memory and sums in a register.</text>
  <rect x="24" y="110" width="128" height="62" rx="10" fill="#EEF0F3" stroke="#9AA5B1" stroke-width="1.3"/>
  <text x="88.0" y="137.0" text-anchor="middle" xml:space="preserve" style="font-size:13px;font-weight:700;fill:#1B2430">global memory</text>
  <text x="88.0" y="156.0" text-anchor="middle" xml:space="preserve" style="font-size:11.5px;fill:#5D6B7A">A and B</text>
  <path class="wire" d="M152,141 L182,141" marker-end="url(#head)"/>
  <rect x="182" y="110" width="128" height="62" rx="10" fill="#D9F1E7" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="246.0" y="137.0" text-anchor="middle" xml:space="preserve" style="font-size:13px;font-weight:700;fill:#1B2430">shared memory</text>
  <text x="246.0" y="156.0" text-anchor="middle" xml:space="preserve" style="font-size:11.5px;fill:#5D6B7A">tileA, tileB</text>
  <path class="wire" d="M310,141 L340,141" marker-end="url(#head)"/>
  <rect x="340" y="110" width="128" height="62" rx="10" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="404.0" y="137.0" text-anchor="middle" xml:space="preserve" style="font-size:13px;font-weight:700;fill:#1B2430">registers</text>
  <text x="404.0" y="156.0" text-anchor="middle" xml:space="preserve" style="font-size:11.5px;fill:#5D6B7A">sum</text>
  <path class="wire" d="M468,141 L498,141" marker-end="url(#head)"/>
  <rect x="498" y="110" width="128" height="62" rx="10" fill="#EEF0F3" stroke="#9AA5B1" stroke-width="1.3"/>
  <text x="562.0" y="137.0" text-anchor="middle" xml:space="preserve" style="font-size:13px;font-weight:700;fill:#1B2430">global memory</text>
  <text x="562.0" y="156.0" text-anchor="middle" xml:space="preserve" style="font-size:11.5px;fill:#5D6B7A">C</text>
  <text x="167.0" y="206.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">load: 2 per phase</text>
  <text x="325.0" y="206.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">read: 2T per phase</text>
  <text x="483.0" y="206.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">store: 1</text>
</svg>
