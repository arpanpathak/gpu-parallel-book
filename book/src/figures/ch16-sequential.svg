<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 316" width="660" height="316" role="img" aria-label="C as a 4 by 4 grid whose cells hold the order in which the sequential algorithm visits them, 1 to 16 row by row. Visit 7, entry c12, is highlighted. The text says that at visit 7 line 5 runs for inner = 0 to 3 and computes c12 = 5 times 2 + 6 times 1 + 7 times 0 + 8 times 1 = 24, and that 16 visits of 4 steps make 64 multiply-adds, performed one after another.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="660" height="316" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The sequential algorithm</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Matrix-Multiply fills C 1 entry at a time.</text>
  <defs>
    <marker id="tip-ink" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker>
    <marker id="tip-deep" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3B47B0"/></marker>
    <marker id="tip-mint" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#1F8A70"/></marker>
  </defs>
  <text x="146.0" y="100.0" text-anchor="middle" font-size="12" style="fill:#5D6B7A" xml:space="preserve">order of visits to C</text>
  <rect x="60.0" y="112.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="80.0" y="136.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">1</text>
  <rect x="104.0" y="112.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="124.0" y="136.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">2</text>
  <rect x="148.0" y="112.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="168.0" y="136.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">3</text>
  <rect x="192.0" y="112.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="212.0" y="136.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">4</text>
  <rect x="60.0" y="156.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="80.0" y="180.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">5</text>
  <rect x="104.0" y="156.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="124.0" y="180.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">6</text>
  <rect x="148.0" y="156.0" width="40.0" height="40.0" rx="8" fill="#A2ADE9" stroke="none" stroke-width="1.2"/>
  <text x="168.0" y="180.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">7</text>
  <rect x="192.0" y="156.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="212.0" y="180.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">8</text>
  <rect x="60.0" y="200.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="80.0" y="224.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">9</text>
  <rect x="104.0" y="200.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="124.0" y="224.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">10</text>
  <rect x="148.0" y="200.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="168.0" y="224.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">11</text>
  <rect x="192.0" y="200.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="212.0" y="224.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">12</text>
  <rect x="60.0" y="244.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="80.0" y="268.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">13</text>
  <rect x="104.0" y="244.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="124.0" y="268.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">14</text>
  <rect x="148.0" y="244.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="168.0" y="268.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">15</text>
  <rect x="192.0" y="244.0" width="40.0" height="40.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="212.0" y="268.7" text-anchor="middle" font-size="13" style="fill:#1B2430" xml:space="preserve">16</text>
  <text x="280.0" y="130.0" text-anchor="start" font-size="12.5" style="fill:#1B2430" xml:space="preserve">Lines 1 and 2 visit the 16 entries of C row by row:</text>
  <text x="280.0" y="149.0" text-anchor="start" font-size="12.5" style="fill:#1B2430" xml:space="preserve">visit 1 is c00, visit 16 is c33.</text>
  <text x="280.0" y="186.0" text-anchor="start" font-size="12.5" style="fill:#1B2430" xml:space="preserve">At visit 7 (c12), line 5 runs inner = 0, 1, 2, 3:</text>
  <text x="280.0" y="208.0" text-anchor="start" font-size="13" font-weight="650" style="fill:#3B47B0" xml:space="preserve">c12 = 5·2 + 6·1 + 7·0 + 8·1 = 24</text>
  <text x="280.0" y="248.0" text-anchor="start" font-size="12.5" style="fill:#5D6B7A" xml:space="preserve">In all: 16 visits × 4 steps = 64 multiply-adds,</text>
  <text x="280.0" y="267.0" text-anchor="start" font-size="12.5" style="fill:#5D6B7A" xml:space="preserve">performed one after another.</text>
</svg>
