<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 388" width="660" height="388" role="img" aria-label="Two streams, each a queue of copy in, kernel and copy out. The queues feed 3 units of the GPU: a copy engine for host to device, the SMs for kernels, and a copy engine for device to host. Work in 1 stream runs in order; work in different streams may overlap.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="388" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Streams</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each stream is an ordered queue; different streams are independent.</text>
  <rect x="16" y="104" width="400" height="210" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="256.1" height="22" rx="11" fill="#1B2430"/>
  <text x="162.1" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2 STREAMS, FILLED BY THE HOST</text>
  <text x="36.0" y="152.0" class="name" text-anchor="start" xml:space="preserve">stream 0</text>
  <text x="36.0" y="238.0" class="name" text-anchor="start" xml:space="preserve">stream 1</text>
  <rect x="120.0" y="132.0" width="88.0" height="32.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="164.0" y="152.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">copy in 0</text>
  <rect x="216.0" y="132.0" width="88.0" height="32.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="260.0" y="152.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">kernel 0</text>
  <rect x="312.0" y="132.0" width="88.0" height="32.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="356.0" y="152.0" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">copy out 0</text>
  <rect x="120.0" y="218.0" width="88.0" height="32.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="164.0" y="238.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">copy in 1</text>
  <rect x="216.0" y="218.0" width="88.0" height="32.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="260.0" y="238.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">kernel 1</text>
  <rect x="312.0" y="218.0" width="88.0" height="32.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="356.0" y="238.0" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">copy out 1</text>
  <text x="36.0" y="290.0" class="note" text-anchor="start" xml:space="preserve">in order within a stream</text>
  <rect x="460" y="112" width="176" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M472,112.7 H466 V161.3 H472 A11.3,11.3 0 0 1 460.7,150 V124 A11.3,11.3 0 0 1 472,112.7 Z" fill="#B7791F"/>
  <rect x="476" y="121.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(482.0,127.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="518.0" y="133.0" class="name" text-anchor="start" xml:space="preserve">copy engine</text>
  <text x="518.0" y="151.0" class="sub" text-anchor="start" xml:space="preserve">host → device</text>
  <rect x="460" y="184" width="176" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M472,184.7 H466 V233.3 H472 A11.3,11.3 0 0 1 460.7,222 V196 A11.3,11.3 0 0 1 472,184.7 Z" fill="#1F8A70"/>
  <rect x="476" y="193.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(482.0,199.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="518.0" y="205.0" class="name" text-anchor="start" xml:space="preserve">SMs</text>
  <text x="518.0" y="223.0" class="sub" text-anchor="start" xml:space="preserve">kernels</text>
  <rect x="460" y="256" width="176" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M472,256.7 H466 V305.3 H472 A11.3,11.3 0 0 1 460.7,294 V268 A11.3,11.3 0 0 1 472,256.7 Z" fill="#7A4FD0"/>
  <rect x="476" y="265.0" width="32" height="32" rx="8" fill="#F0EAFB"/>
  <g transform="translate(482.0,271.0) scale(0.8333)"><path d="M7 4 2 9l5 5v-3.5h9V8H7zm10 6v3.5H8V16h9v3.5l5-5z" fill="#7A4FD0" fill-rule="evenodd"/></g>
  <text x="518.0" y="277.0" class="name" text-anchor="start" xml:space="preserve">copy engine</text>
  <text x="518.0" y="295.0" class="sub" text-anchor="start" xml:space="preserve">device → host</text>
  <path class="wire" d="M416,148 L429,148 Q438,148 438.0,142.5 L438.0,142.5 Q438,137 447,137 L460,137" marker-end="url(#head)"/>
  <path class="wire" d="M416,209 L460,209" marker-end="url(#head)"/>
  <path class="wire" d="M416,270 L429,270 Q438,270 438.0,275.5 L438.0,275.5 Q438,281 447,281 L460,281" marker-end="url(#head)"/>
  <text x="16.0" y="348.0" class="note" text-anchor="start" xml:space="preserve">Work in 1 stream runs in the order it was queued. Work in different streams has no</text>
  <text x="16.0" y="366.0" class="note" text-anchor="start" xml:space="preserve">order between them, so the GPU may run a copy of 1 stream during a kernel of another.</text>
</svg>
