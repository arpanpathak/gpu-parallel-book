<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 496" width="660" height="496" role="img" aria-label="8 keys 3, 8, 1, 9, 4, 7, 2, 6 with flags 0, 1, 0, 1, 0, 1, 0, 1 for x &gt;= 5. The inclusive scan of the flags is 0, 1, 1, 2, 2, 3, 3, 4 and the exclusive scan 0, 0, 1, 1, 2, 2, 3, 3. Arrows take the kept keys 8, 9, 7 and 6 from their exclusive positions 0, 1, 2, 3 to the output 8, 9, 7, 6.">
