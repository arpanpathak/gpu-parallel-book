<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 510" width="660" height="510" role="img" aria-label="2 bands. User space: libcuda.so, the user-mode driver, which implements the CUDA API and builds pushbuffers and ring entries, and the pages mapped into the process: ring, pushbuffer, USERD and the doorbell page. Kernel space: the kernel-mode driver, nvgpu and nvmap for a platform-device GPU and nvidia with nvidia_uvm for a PCIe-function GPU, which owns the BARs, interrupts and SMMU, and the device files a CUDA process opens: /dev/nvgpu/igpu0/ctrl and /dev/nvmap for the first, /dev/nvidia0, /dev/nvidiactl and /dev/nvidia-uvm for the second. ioctl calls are for setup only; the pages reach the process through mmap.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="510" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">2 drivers, 1 GPU</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The kernel sets things up; the process submits work by itself.</text>
  <rect x="16" y="104" width="628" height="150" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="216.8" height="22" rx="11" fill="#1B2430"/>
  <text x="142.4" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">USER SPACE: YOUR PROCESS</text>
  <rect x="36" y="136" width="280" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M48,136.7 H42 V231.3 H48 A11.3,11.3 0 0 1 36.7,220 V148 A11.3,11.3 0 0 1 48,136.7 Z" fill="#2F6FDB"/>
  <rect x="52" y="168.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(58.0,174.0) scale(0.8333)"><path d="M10.3 2h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7L2 13.7v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="94.0" y="162.0" class="name" text-anchor="start" xml:space="preserve">libcuda.so (UMD)</text>
  <text x="94.0" y="180.0" class="sub" text-anchor="start" xml:space="preserve">CUDA API, contexts, launches</text>
  <text x="94.0" y="198.0" class="sub" text-anchor="start" xml:space="preserve">builds pushbuffers and ring</text>
  <text x="94.0" y="216.0" class="sub" text-anchor="start" xml:space="preserve">entries in mapped memory</text>
  <rect x="344" y="136" width="280" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M356,136.7 H350 V231.3 H356 A11.3,11.3 0 0 1 344.7,220 V148 A11.3,11.3 0 0 1 356,136.7 Z" fill="#1F8A70"/>
  <text x="364.0" y="162.0" class="name" text-anchor="start" xml:space="preserve">mapped pages</text>
  <text x="364.0" y="180.0" class="sub" text-anchor="start" xml:space="preserve">ring, pushbuffer, USERD</text>
  <text x="364.0" y="198.0" class="sub" text-anchor="start" xml:space="preserve">doorbell page (MMIO)</text>
  <text x="364.0" y="216.0" class="sub" text-anchor="start" xml:space="preserve">no system call to use</text>
  <path class="wire" d="M316,184 L344,184" marker-end="url(#head)"/>
  <rect x="16" y="290" width="628" height="150" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="279" width="122.4" height="22" rx="11" fill="#1B2430"/>
  <text x="95.2" y="294.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">KERNEL SPACE</text>
  <rect x="36" y="322" width="280" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M48,322.7 H42 V417.3 H48 A11.3,11.3 0 0 1 36.7,406 V334 A11.3,11.3 0 0 1 48,322.7 Z" fill="#7A4FD0"/>
  <rect x="52" y="354.0" width="32" height="32" rx="8" fill="#F0EAFB"/>
  <g transform="translate(58.0,360.0) scale(0.8333)"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2.2 0h5.6V7a2.8 2.8 0 0 0-5.6 0zM12 13.5a1.6 1.6 0 0 0-.8 3v2h1.6v-2a1.6 1.6 0 0 0-.8-3z" fill="#7A4FD0" fill-rule="evenodd"/></g>
  <text x="94.0" y="348.0" class="name" text-anchor="start" xml:space="preserve">kernel-mode driver</text>
  <text x="94.0" y="366.0" class="sub" text-anchor="start" xml:space="preserve">platform: nvgpu, nvmap</text>
  <text x="94.0" y="384.0" class="sub" text-anchor="start" xml:space="preserve">PCIe fn: nvidia, nvidia_uvm</text>
  <text x="94.0" y="402.0" class="sub" text-anchor="start" xml:space="preserve">owns BARs, IRQs, SMMU</text>
  <rect x="344" y="322" width="280" height="96" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M356,322.7 H350 V417.3 H356 A11.3,11.3 0 0 1 344.7,406 V334 A11.3,11.3 0 0 1 356,322.7 Z" fill="#B7791F"/>
  <text x="364.0" y="348.0" class="name" text-anchor="start" xml:space="preserve">device files it opens</text>
  <text x="364.0" y="366.0" class="sub" text-anchor="start" xml:space="preserve">platform: /dev/nvgpu/igpu0/ctrl,</text>
  <text x="364.0" y="384.0" class="sub" text-anchor="start" xml:space="preserve">/dev/nvmap. PCIe fn: /dev/nvidia0,</text>
  <text x="364.0" y="402.0" class="sub" text-anchor="start" xml:space="preserve">/dev/nvidiactl, /dev/nvidia-uvm</text>
  <path class="wire" d="M260,232 L260,322" marker-end="url(#head)"/>
  <rect x="196.9" y="268.0" width="126.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="260.0" y="280.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">ioctl: setup only</text>
  <path class="wire idle" d="M484,322 L484,232" marker-end="url(#head-idle)"/>
  <rect x="463.8" y="268.0" width="40.4" height="18" rx="9" fill="#FBFAF6" stroke="#7F8EA0" stroke-width="1"/>
  <text x="484.0" y="280.8" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">mmap</text>
  <text x="16.0" y="470.0" class="note" text-anchor="start" xml:space="preserve">Allocating memory, creating a channel and mapping pages go through ioctl calls on the</text>
  <text x="16.0" y="488.0" class="note" text-anchor="start" xml:space="preserve">device nodes. Submitting work does not: libcuda writes the mapped pages and the doorbell.</text>
</svg>
