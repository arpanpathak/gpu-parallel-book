<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 452" width="660" height="452" role="img" aria-label="3 cards. Index1D, from Chapter 13: the witness is i, None if i is at least the length. Index2D with width W: W is part of the type of c, the witness is row times W plus col, None if col is at least W. Runtime2DIndex: the width is bound on the host by RowWidth, the witness stores row and col, None if col is at least the width. Below, the same if-let write used by all 3, with the note that get_mut returns None past the end of c and that 2 threads never hold the same witness.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="452" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Index spaces</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A witness names 1 element of c and belongs to 1 thread.</text>
  <rect x="24" y="120" width="196" height="112" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M36,120.7 H30 V231.3 H36 A11.3,11.3 0 0 1 24.7,220 V132 A11.3,11.3 0 0 1 36,120.7 Z" fill="#7F8EA0"/>
  <text x="44.0" y="154.0" class="name" text-anchor="start" xml:space="preserve">Index1D</text>
  <text x="44.0" y="172.0" class="sub" text-anchor="start" xml:space="preserve">Chapter 13: 1 dimension</text>
  <text x="44.0" y="190.0" class="sub" text-anchor="start" xml:space="preserve">witness: i</text>
  <text x="44.0" y="208.0" class="sub" text-anchor="start" xml:space="preserve">None if i ≥ len</text>
  <rect x="232" y="120" width="196" height="112" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M244,120.7 H238 V231.3 H244 A11.3,11.3 0 0 1 232.7,220 V132 A11.3,11.3 0 0 1 244,120.7 Z" fill="#2F6FDB"/>
  <text x="252.0" y="154.0" class="name" text-anchor="start" xml:space="preserve">Index2D&lt;W&gt;</text>
  <text x="252.0" y="172.0" class="sub" text-anchor="start" xml:space="preserve">W in the type of c</text>
  <text x="252.0" y="190.0" class="sub" text-anchor="start" xml:space="preserve">witness: row × W + col</text>
  <text x="252.0" y="208.0" class="sub" text-anchor="start" xml:space="preserve">None if col ≥ W</text>
  <rect x="440" y="120" width="196" height="112" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M452,120.7 H446 V231.3 H452 A11.3,11.3 0 0 1 440.7,220 V132 A11.3,11.3 0 0 1 452,120.7 Z" fill="#2E8B3D"/>
  <text x="460.0" y="154.0" class="name" text-anchor="start" xml:space="preserve">Runtime2DIndex</text>
  <text x="460.0" y="172.0" class="sub" text-anchor="start" xml:space="preserve">width bound by RowWidth</text>
  <text x="460.0" y="190.0" class="sub" text-anchor="start" xml:space="preserve">witness: (row, col)</text>
  <text x="460.0" y="208.0" class="sub" text-anchor="start" xml:space="preserve">None if col ≥ width</text>
  <rect x="16" y="262" width="628" height="168" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="251" width="271.8" height="22" rx="11" fill="#1B2430"/>
  <text x="169.9" y="266.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">THE SAME WRITE IN ALL 3 KERNELS</text>
  <text x="40.0" y="312.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">if let Some(idx) = &lt;witness&gt;</text>
  <text x="40.0" y="334.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">    &amp;&amp; let Some(out) = c.get_mut(idx)</text>
  <text x="40.0" y="356.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">{</text>
  <text x="40.0" y="378.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">    *out = sum;</text>
  <text x="40.0" y="400.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">}</text>
  <text x="360.0" y="312.0" class="note" text-anchor="start" xml:space="preserve">get_mut returns None when the</text>
  <text x="360.0" y="330.0" class="note" text-anchor="start" xml:space="preserve">element lies past the end of c.</text>
  <text x="360.0" y="360.0" class="note" text-anchor="start" xml:space="preserve">2 threads never hold the same</text>
  <text x="360.0" y="378.0" class="note" text-anchor="start" xml:space="preserve">witness, so 2 threads never</text>
  <text x="360.0" y="396.0" class="note" text-anchor="start" xml:space="preserve">write the same element.</text>
</svg>
