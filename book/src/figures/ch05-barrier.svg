<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 462" width="660" height="462" role="img" aria-label="Six warps of a block write shared memory and reach __syncthreads at different times. Each early warp waits, shown dashed, at a vertical line marking the barrier. When the last warp arrives, all 6 start phase 2 together and can read what the others wrote.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="462" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A block barrier</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">No thread of the block passes __syncthreads() until all of them reach it.</text>
  <text x="150.0" y="118.0" class="sub" text-anchor="start" xml:space="preserve">phase 1: write shared memory</text>
  <text x="446.0" y="118.0" class="sub" text-anchor="start" xml:space="preserve">phase 2: read it</text>
  <text x="136.0" y="152.0" class="name" text-anchor="end" xml:space="preserve">warp 0</text>
  <rect x="150.0" y="132.0" width="190.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <line x1="340.0" y1="146.0" x2="426.0" y2="146.0" stroke="#7F8EA0" stroke-width="1.6" stroke-dasharray="4 4"/>
  <rect x="440.0" y="132.0" width="150.0" height="28.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="136.0" y="192.0" class="name" text-anchor="end" xml:space="preserve">warp 1</text>
  <rect x="150.0" y="172.0" width="250.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <line x1="400.0" y1="186.0" x2="426.0" y2="186.0" stroke="#7F8EA0" stroke-width="1.6" stroke-dasharray="4 4"/>
  <rect x="440.0" y="172.0" width="150.0" height="28.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="136.0" y="232.0" class="name" text-anchor="end" xml:space="preserve">warp 2</text>
  <rect x="150.0" y="212.0" width="120.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <line x1="270.0" y1="226.0" x2="426.0" y2="226.0" stroke="#7F8EA0" stroke-width="1.6" stroke-dasharray="4 4"/>
  <rect x="440.0" y="212.0" width="150.0" height="28.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="136.0" y="272.0" class="name" text-anchor="end" xml:space="preserve">warp 3</text>
  <rect x="150.0" y="252.0" width="270.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <line x1="420.0" y1="266.0" x2="426.0" y2="266.0" stroke="#7F8EA0" stroke-width="1.6" stroke-dasharray="4 4"/>
  <rect x="440.0" y="252.0" width="150.0" height="28.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="136.0" y="312.0" class="name" text-anchor="end" xml:space="preserve">warp 4</text>
  <rect x="150.0" y="292.0" width="210.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <line x1="360.0" y1="306.0" x2="426.0" y2="306.0" stroke="#7F8EA0" stroke-width="1.6" stroke-dasharray="4 4"/>
  <rect x="440.0" y="292.0" width="150.0" height="28.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="136.0" y="352.0" class="name" text-anchor="end" xml:space="preserve">warp 5</text>
  <rect x="150.0" y="332.0" width="160.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <line x1="310.0" y1="346.0" x2="426.0" y2="346.0" stroke="#7F8EA0" stroke-width="1.6" stroke-dasharray="4 4"/>
  <rect x="440.0" y="332.0" width="150.0" height="28.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <line x1="433.0" y1="124.0" x2="433.0" y2="372.0" stroke="#CF4526" stroke-width="2.4"/>
  <rect x="433.0" y="386" width="113.0" height="18" rx="9" fill="#FCEBE6"/>
  <text x="489.5" y="398.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">__syncthreads()</text>
  <rect x="150" y="416" width="14" height="14" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="171.0" y="427.5" class="note" text-anchor="start" xml:space="preserve">working</text>
  <rect x="239.2" y="416" width="14" height="14" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="260.2" y="427.5" class="note" text-anchor="start" xml:space="preserve">waiting</text>
  <rect x="328.4" y="416" width="14" height="14" rx="4" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="349.4" y="427.5" class="note" text-anchor="start" xml:space="preserve">after the barrier</text>
</svg>
