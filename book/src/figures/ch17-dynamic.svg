<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 366" width="660" height="366" role="img" aria-label="A bar of 2,048 bytes of dynamic shared memory for tiled with T = 16. Bytes 0 to 1,023 hold tile A, reached with DynamicSharedArray get; bytes 1,024 to 2,047 hold tile B, reached with offset of T times T times 4, which is 1,024. The launch asks for 2,048 bytes and the contract allows 512 to 8,192.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="366" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Tiles in dynamic shared memory</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The size is chosen when the kernel is launched.</text>
  <text x="60.0" y="128.0" class="sub" text-anchor="start" xml:space="preserve">dynamic shared memory of 1 block, 2,048 bytes</text>
  <rect x="60.0" y="140.0" width="267.0" height="44.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="193.5" y="166.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">tile A: bytes 0 to 1,023</text>
  <rect x="330.0" y="140.0" width="267.0" height="44.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="463.5" y="166.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">tile B: bytes 1,024 to 2,047</text>
  <line x1="60.0" y1="192.0" x2="60.0" y2="202.0" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="60.0" y="218.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <line x1="330.0" y1="192.0" x2="330.0" y2="202.0" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="330.0" y="218.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">1,024</text>
  <line x1="600.0" y1="192.0" x2="600.0" y2="202.0" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="600.0" y="218.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">2,048</text>
  <path class="wire" d="M120,262 L120,188" marker-end="url(#head)"/>
  <path class="wire" d="M390.0,262 L390.0,188" marker-end="url(#head)"/>
  <text x="60.0" y="282.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">DynamicSharedArray::&lt;f32&gt;::get()</text>
  <text x="330.0" y="282.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">::offset(T * T * 4) = offset(1,024)</text>
  <text x="60.0" y="326.0" class="note" text-anchor="start" xml:space="preserve">The launch configuration asks for 2 × 16 × 16 × 4 = 2,048 bytes; the contract</text>
  <text x="60.0" y="344.0" class="note" text-anchor="start" xml:space="preserve">dynamic_shared_range = (512, 8192) rejects a launch outside that range.</text>
</svg>
