  <text x="148.0" y="294.2" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">5</text>
  <rect x="200.0" y="144.0" width="60.0" height="40.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="230.0" y="168.2" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">1</text>
  <rect x="264.0" y="144.0" width="60.0" height="40.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="294.0" y="168.2" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">0</text>
  <rect x="200.0" y="196.0" width="60.0" height="60.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="230.0" y="222.0" class="mono" text-anchor="middle" xml:space="preserve">1 · 1</text>
  <text x="230.0" y="240.0" class="mono strong" text-anchor="middle" xml:space="preserve">= 1</text>
  <rect x="264.0" y="196.0" width="60.0" height="60.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="294.0" y="222.0" class="mono" text-anchor="middle" xml:space="preserve">1 · 0</text>
  <text x="294.0" y="240.0" class="mono strong" text-anchor="middle" xml:space="preserve">= 0</text>
  <rect x="200.0" y="260.0" width="60.0" height="60.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="230.0" y="286.0" class="mono" text-anchor="middle" xml:space="preserve">5 · 1</text>
  <text x="230.0" y="304.0" class="mono strong" text-anchor="middle" xml:space="preserve">= 5</text>
  <rect x="264.0" y="260.0" width="60.0" height="60.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.2"/>
  <text x="294.0" y="286.0" class="mono" text-anchor="middle" xml:space="preserve">5 · 0</text>
  <text x="294.0" y="304.0" class="mono strong" text-anchor="middle" xml:space="preserve">= 0</text>
  <text x="262.0" y="342.0" class="note" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">c00  c01 / c10  c11</text>
