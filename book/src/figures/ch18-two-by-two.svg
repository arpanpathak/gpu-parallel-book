  <text x="400.0" y="180.0" class="name" text-anchor="start" xml:space="preserve">4 reads</text>
  <text x="400.0" y="198.0" class="sub" text-anchor="start" xml:space="preserve">2 values of A, 2 values of B</text>
  <rect filter="url(#m3-shadow)" x="380" y="230" width="262" height="68" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1.3"/>
  <path d="M392,230.7 H386 V297.3 H392 A11.3,11.3 0 0 1 380.7,286 V242 A11.3,11.3 0 0 1 392,230.7 Z" fill="#2E8B3D"/>
  <text x="400.0" y="260.0" class="name" text-anchor="start" xml:space="preserve">4 multiply-adds</text>
  <text x="400.0" y="278.0" class="sub" text-anchor="start" xml:space="preserve">every value read is used twice</text>
  <rect filter="url(#m3-shadow)" x="380" y="310" width="262" height="52" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1.3"/>
  <path d="M392,310.7 H386 V361.3 H392 A11.3,11.3 0 0 1 380.7,350 V322 A11.3,11.3 0 0 1 392,310.7 Z" fill="#B7791F"/>
  <text x="400.0" y="341.0" class="name" text-anchor="start" xml:space="preserve">1 read per multiply-add</text>
</svg>
