<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 544" width="660" height="544" role="img" aria-label="Two panels. Random inputs: a band from minus 42.01 to plus 42.01 around the exact sum; the correct sum is 0.42 away and the sum that misses 1 element is 0.58 away, both inside the band, both PASSED. All ones: the exact sum is 16,777,216; the correct sum hits it, the sum that misses 1 element gives 16,777,215 and FAILED.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="544" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Tolerance and known answers</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The off-by-one sum passes 1 test and fails the other.</text>
  <rect x="16" y="104" width="628" height="172" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="264.0" height="22" rx="11" fill="#1B2430"/>
  <text x="166.0" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">RANDOM INPUTS: TOLERANCE 42.01</text>
  <rect x="16" y="302" width="628" height="152" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="291" width="193.2" height="22" rx="11" fill="#1B2430"/>
  <text x="130.6" y="306.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">ALL ONES: TOLERANCE 0</text>
  <rect x="70.0" y="160.0" width="520.0" height="30.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="330.0" y1="150.0" x2="330.0" y2="200.0" stroke="#1B2430" stroke-width="1.6"/>
  <text x="330.0" y="216.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">exact</text>
  <text x="70.0" y="216.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">−42.01</text>
  <text x="590.0" y="216.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">+42.01</text>
  <circle cx="332.6" cy="168" r="5" fill="#2F6FDB"/>
  <rect x="143.6" y="232" width="179.0" height="18" rx="9" fill="#EAF1FD"/>
  <text x="233.1" y="244.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">all n: error 0.42, PASSED</text>
  <circle cx="333.6" cy="182" r="5" fill="#CF4526"/>
  <rect x="343.6" y="232" width="179.0" height="18" rx="9" fill="#FCEBE6"/>
  <text x="433.1" y="244.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">n − 1: error 0.58, PASSED</text>
  <line x1="330.0" y1="340.0" x2="330.0" y2="400.0" stroke="#1B2430" stroke-width="1.6"/>
  <text x="330.0" y="418.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">16,777,216</text>
  <circle cx="330" cy="370" r="5" fill="#2F6FDB"/>
  <circle cx="270" cy="370" r="5" fill="#CF4526"/>
  <text x="270.0" y="400.0" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">16,777,215</text>
  <rect x="342.0" y="346" width="146.0" height="18" rx="9" fill="#EAF1FD"/>
  <text x="415.0" y="358.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">all n: exact, PASSED</text>
  <rect x="92.2" y="346" width="165.8" height="18" rx="9" fill="#FCEBE6"/>
  <text x="175.1" y="358.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">n − 1: off by 1, FAILED</text>
  <text x="16.0" y="486.0" class="note" text-anchor="start" xml:space="preserve">The missing element is less than 1, far inside a tolerance of 42. With ones, every</text>
  <text x="16.0" y="504.0" class="note" text-anchor="start" xml:space="preserve">partial sum is a whole number a float holds exactly, so the right answer is exact and</text>
  <text x="16.0" y="522.0" class="note" text-anchor="start" xml:space="preserve">any difference at all is a bug.</text>
</svg>
