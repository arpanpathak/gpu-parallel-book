<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 436" width="660" height="436" role="img" aria-label="Additions and steps of the 3 scans. For n = 8: sequential 7 additions in 7 steps, Hillis-Steele 17 in 3, Blelloch 14 in 6. For n = 1,024: 1,023 in 1,023, 9,217 in 10, and 2,046 in 20.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="660" height="436" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Work and steps of 3 scans</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Fewer steps cost more additions, unless the algorithm is work-efficient.</text>
  <text x="32.0" y="104.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">additions for n = 8</text>
  <text x="360.0" y="104.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">steps for n = 8</text>
  <text x="150.0" y="139.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">sequential</text>
  <rect filter="url(#m3-shadow)" x="160.0" y="120.0" width="63.0" height="28.0" rx="8" fill="#F1F4F7" stroke="none" stroke-width="1.3"/>
  <text x="229.0" y="139.0" class="mono" text-anchor="start" xml:space="preserve">7</text>
  <rect filter="url(#m3-shadow)" x="380.0" y="120.0" width="168.0" height="28.0" rx="8" fill="#F1F4F7" stroke="none" stroke-width="1.3"/>
  <text x="554.0" y="139.0" class="mono" text-anchor="start" xml:space="preserve">7</text>
  <text x="150.0" y="183.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">Hillis-Steele</text>
  <rect x="160.0" y="164.0" width="153.0" height="28.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.3"/>
  <text x="319.0" y="183.0" class="mono" text-anchor="start" xml:space="preserve">17</text>
  <rect x="380.0" y="164.0" width="72.0" height="28.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.3"/>
  <text x="458.0" y="183.0" class="mono" text-anchor="start" xml:space="preserve">3</text>
  <text x="150.0" y="227.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">Blelloch</text>
  <rect x="160.0" y="208.0" width="126.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.3"/>
  <text x="292.0" y="227.0" class="mono" text-anchor="start" xml:space="preserve">14</text>
  <rect x="380.0" y="208.0" width="144.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.3"/>
  <text x="530.0" y="227.0" class="mono" text-anchor="start" xml:space="preserve">6</text>
  <text x="32.0" y="266.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">in general, and for n = 1,024</text>
  <text x="150.0" y="314.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">sequential</text>
  <text x="166.0" y="314.0" class="mono" text-anchor="start" xml:space="preserve">n - 1 = 1,023</text>
  <text x="396.0" y="314.0" class="mono" text-anchor="start" xml:space="preserve">n - 1 = 1,023</text>
  <text x="150.0" y="336.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">Hillis-Steele</text>
  <text x="166.0" y="336.0" class="mono" text-anchor="start" xml:space="preserve">n log n - (n - 1) = 9,217</text>
  <text x="396.0" y="336.0" class="mono" text-anchor="start" xml:space="preserve">log n = 10</text>
  <text x="150.0" y="358.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">Blelloch</text>
  <text x="166.0" y="358.0" class="mono" text-anchor="start" xml:space="preserve">2 (n - 1) = 2,046</text>
  <text x="396.0" y="358.0" class="mono" text-anchor="start" xml:space="preserve">2 log n = 20</text>
  <text x="166.0" y="292.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">additions</text>
  <text x="396.0" y="292.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">steps</text>
  <text x="32.0" y="398.0" class="note" text-anchor="start" xml:space="preserve">Hillis-Steele takes the fewest steps but does about log n times the work of the chain.</text>
  <text x="32.0" y="416.0" class="note" text-anchor="start" xml:space="preserve">Blelloch does twice the work of the chain in twice the steps of Hillis-Steele.</text>
</svg>
