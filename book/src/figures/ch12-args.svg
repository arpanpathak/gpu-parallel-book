<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 504" width="660" height="504" role="img" aria-label="Top zone, the correct form: args[0] = &amp;X points to the host variable X, which holds the device address 0x203a00000, 8 bytes; args[1] = &amp;Y points to Y, 8 bytes; args[2] = &amp;n points to n = 16,777,216, 4 bytes. The driver follows each pointer and copies 20 bytes of parameters into the kernel&#x27;s x, y and n. Bottom zone, the mistake: args[0] = X, so the driver reads 8 bytes at the device address 0x203a00000 on the CPU, and the program stops with a segmentation fault, exit code 139.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="504" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The argument array</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each entry is the address of 1 argument, not the argument.</text>
  <rect x="16" y="100" width="628" height="236" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="89" width="334.8" height="22" rx="11" fill="#1B2430"/>
  <text x="201.4" y="104.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">ARGS HOLDS THE ADDRESS OF EACH ARGUMENT</text>
  <rect x="16" y="368" width="628" height="116" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="357" width="264.0" height="22" rx="11" fill="#1B2430"/>
  <text x="166.0" y="372.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">ARGS HOLDS THE ARGUMENT ITSELF</text>
  <text x="36.0" y="140.0" class="note" text-anchor="start" xml:space="preserve">args[ ]</text>
  <rect x="36.0" y="150.0" width="80.0" height="36.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="76.0" y="172.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">&amp;X</text>
  <path d="M116,168 H193" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="196.0" y="150.0" width="196.0" height="36.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="294.0" y="172.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">X = 0x203a00000</text>
  <path d="M392,168 H437" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="440.0" y="150.0" width="84.0" height="36.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="482.0" y="172.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">8 bytes</text>
  <path d="M524,168 H537" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="36.0" y="202.0" width="80.0" height="36.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="76.0" y="224.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">&amp;Y</text>
  <path d="M116,220 H193" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="196.0" y="202.0" width="196.0" height="36.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="294.0" y="224.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">Y = 0x207a00000</text>
  <path d="M392,220 H437" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="440.0" y="202.0" width="84.0" height="36.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="482.0" y="224.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">8 bytes</text>
  <path d="M524,220 H537" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="36.0" y="254.0" width="80.0" height="36.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="76.0" y="276.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">&amp;n</text>
  <path d="M116,272 H193" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="196.0" y="254.0" width="196.0" height="36.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="294.0" y="276.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">n = 16,777,216</text>
  <path d="M392,272 H437" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="440.0" y="254.0" width="84.0" height="36.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="482.0" y="276.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">4 bytes</text>
  <path d="M524,272 H537" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="540" y="150" width="92" height="140" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M552,150.7 H546 V289.3 H552 A11.3,11.3 0 0 1 540.7,278 V162 A11.3,11.3 0 0 1 552,150.7 Z" fill="#1F8A70"/>
  <text x="560.0" y="198.0" class="name" text-anchor="start" xml:space="preserve">kernel</text>
  <text x="560.0" y="216.0" class="sub" text-anchor="start" xml:space="preserve">x</text>
  <text x="560.0" y="234.0" class="sub" text-anchor="start" xml:space="preserve">y</text>
  <text x="560.0" y="252.0" class="sub" text-anchor="start" xml:space="preserve">n</text>
  <text x="36.0" y="318.0" class="note" text-anchor="start" xml:space="preserve">The driver follows each pointer and copies 8 + 8 + 4 = 20 bytes of parameters.</text>
  <rect x="36.0" y="400.0" width="80.0" height="36.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <text x="76.0" y="422.0" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">X</text>
  <path d="M116,418 H193" fill="none" stroke="#CF4526" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head-danger)"/>
  <rect x="196.0" y="400.0" width="196.0" height="36.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <text x="294.0" y="422.0" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">0x203a00000</text>
  <text x="410.0" y="414.0" class="note" text-anchor="start" xml:space="preserve">the CPU reads device memory:</text>
  <text x="410.0" y="432.0" class="note" text-anchor="start" style="fill:#CF4526" xml:space="preserve">segmentation fault, exit 139</text>
  <text x="36.0" y="466.0" class="note" text-anchor="start" xml:space="preserve">The device address is taken for the address of an argument on the host.</text>
</svg>
