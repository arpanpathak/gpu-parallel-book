<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232" width="640" height="232" role="img" aria-label="A plain addition in place of an atomic one. Block 0 reads result = 0, then block 1 reads 0. Block 0 writes 32, and block 1 later writes 0 + 31. The result is 31 in place of 63.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="m-hi" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#4F52C4"/></marker>
    <marker id="m-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#8A94A3"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#C2412D"/></marker>
    <marker id="m-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#1F2633"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#2E8B57"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7275D6"/></marker>
    <marker id="m-mint" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F9F80"/></marker>
    <marker id="m-peach" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#D98654"/></marker>
    <marker id="m-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CC6A91"/></marker>
  </defs>
  <rect width="640" height="232" rx="12" fill="#FFFFFF"/>
  <text x="118.0" y="44.0" font-size="11.5" fill="#1F2633" text-anchor="end" font-weight="400" xml:space="preserve">block 0</text>
  <text x="118.0" y="104.0" font-size="11.5" fill="#1F2633" text-anchor="end" font-weight="400" xml:space="preserve">block 1</text>
  <rect x="130.0" y="30.0" width="130.0" height="26.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
  <text x="195.0" y="47.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">read result = 0</text>
  <rect x="330.0" y="30.0" width="150.0" height="26.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
  <text x="405.0" y="47.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">write 0 + 32 = 32</text>
  <rect x="160.0" y="90.0" width="130.0" height="26.0" rx="5" fill="#D5F0E6" stroke="#3F9F80" stroke-width="1.1"/>
  <text x="225.0" y="107.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">read result = 0</text>
  <rect x="510.0" y="90.0" width="110.0" height="26.0" rx="5" fill="#D5F0E6" stroke="#3F9F80" stroke-width="1.1"/>
  <text x="565.0" y="107.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">write 0 + 31</text>
  <line x1="130.0" y1="150.0" x2="620.0" y2="150.0" stroke="#8A94A3" stroke-width="1.1" marker-end="url(#m-grey)"/>
  <text x="620.0" y="166.0" font-size="11" fill="#8A94A3" text-anchor="end" font-weight="400" xml:space="preserve">time</text>
  <text x="130.0" y="194.0" font-size="12" fill="#1F2633" text-anchor="start" font-weight="400" xml:space="preserve">Both blocks read 0 before either writes. The later write wins:</text>
  <text x="130.0" y="216.0" font-size="13" fill="#C2412D" text-anchor="start" font-weight="700" xml:space="preserve">result = 31 in place of 63</text>
</svg>
