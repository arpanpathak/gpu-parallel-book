<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 438" width="660" height="438" role="img" aria-label="A timeline of 2 threads over 1 step and the start of the next. Each step is write slot, barrier 1, read, barrier 2. An arrow labelled read after write runs from thread (5, 0)&#x27;s write of slot 5 to thread (0, 0)&#x27;s read, across barrier 1. An arrow labelled write after read runs from thread (0, 0)&#x27;s read to thread (5, 0)&#x27;s next write, across barrier 2.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="438" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Why 2 barriers</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Barrier 1 orders write then read; barrier 2 orders read then overwrite.</text>
  <text x="92.0" y="124.0" class="sub" text-anchor="start" xml:space="preserve">step k0</text>
  <text x="508.0" y="124.0" class="sub" text-anchor="start" xml:space="preserve">step k0 + 16</text>
  <text x="132.0" y="144.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">write slot</text>
  <text x="236.0" y="144.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">barrier 1</text>
  <text x="340.0" y="144.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">read row/col</text>
  <text x="444.0" y="144.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">barrier 2</text>
  <text x="548.0" y="144.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">write slot</text>
  <text x="80.0" y="198.0" class="sub" text-anchor="end" xml:space="preserve">thread (0, 0)</text>
  <rect x="92.0" y="176.0" width="80.0" height="34.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="132.0" y="197.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">write</text>
  <rect x="300.0" y="176.0" width="80.0" height="34.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="340.0" y="197.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">read</text>
  <rect x="508.0" y="176.0" width="80.0" height="34.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="548.0" y="197.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">write</text>
  <text x="80.0" y="272.0" class="sub" text-anchor="end" xml:space="preserve">thread (5, 0)</text>
  <rect x="92.0" y="250.0" width="80.0" height="34.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="132.0" y="271.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">write</text>
  <rect x="300.0" y="250.0" width="80.0" height="34.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="340.0" y="271.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">read</text>
  <rect x="508.0" y="250.0" width="80.0" height="34.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="548.0" y="271.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">write</text>
  <rect x="230" y="170" width="12" height="128" rx="4" fill="#1B2430"/>
  <rect x="438" y="170" width="12" height="128" rx="4" fill="#1B2430"/>
  <path class="wire" d="M132,284 L132,313 Q132,322 141,322 L261,322 Q270,322 270,313 L270,202 Q270,193 279,193 L296,193" marker-end="url(#head)"/>
  <rect x="148.0" y="313" width="119.6" height="18" rx="9" fill="#F1F4F7"/>
  <text x="207.8" y="325.6" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">read after write</text>
  <path class="wire danger" d="M340,176 L340.0,168.0 Q340,160 349,160 L485,160 Q494,160 494,169 L494,258 Q494,267 499.0,267.0 L504,267" marker-end="url(#head-danger)"/>
  <rect x="374.0" y="151" width="119.6" height="18" rx="9" fill="#FCEBE6"/>
  <text x="433.8" y="163.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">write after read</text>
  <text x="16.0" y="362.0" class="note" text-anchor="start" xml:space="preserve">Thread (5, 0) writes slot 5 of TILE_A; thread (0, 0) reads it in its row. Barrier 1 keeps</text>
  <text x="16.0" y="380.0" class="note" text-anchor="start" xml:space="preserve">the read after the write. At the next step thread (5, 0) overwrites slot 5; barrier 2</text>
  <text x="16.0" y="398.0" class="note" text-anchor="start" xml:space="preserve">keeps that write after every read of the old value. Without either barrier the result</text>
  <text x="16.0" y="416.0" class="note" text-anchor="start" xml:space="preserve">depends on the order in which warps happen to run.</text>
</svg>
