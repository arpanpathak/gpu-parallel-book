  <text x="330.0" y="404.0" class="name" text-anchor="middle" xml:space="preserve">shared memory</text>
  <text x="330.0" y="422.0" class="sub" text-anchor="middle" xml:space="preserve">LPDDR5X, 128 GB,</text>
  <text x="330.0" y="440.0" class="sub" text-anchor="middle" xml:space="preserve">also the CPU&#x27;s</text>
  <rect x="257.0" y="203" width="146.0" height="18" rx="9" fill="#EAF1FD"/>
  <text x="330.0" y="215.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">on-chip PCIe 01:00.0</text>
  <rect x="444" y="104" width="200" height="400" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="462" y="93" width="177.5" height="22" rx="11" fill="#1B2430"/>
  <text x="550.7" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">PLATFORM-DEVICE GPU</text>
  <rect x="452" y="132" width="184" height="54" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M464,132.7 H458 V185.3 H464 A11.3,11.3 0 0 1 452.7,174 V144 A11.3,11.3 0 0 1 464,132.7 Z" fill="#2F6FDB"/>
