      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="594" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">3 ways to attach a GPU</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The GPU is a device the CPU reaches through addresses.</text>
