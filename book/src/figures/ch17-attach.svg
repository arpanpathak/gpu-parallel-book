<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 594" width="660" height="594" role="img" aria-label="3 columns. Discrete GPU: a CPU with a root complex joined by a PCIe 4.0 or 5.0 link of 16 lanes to a GPU card whose BAR0 holds registers and BAR1 a window on its own GDDR or HBM memory of 24 to 80 GB. Integrated GPU as a PCIe function: the CPU&#x27;s root port joined to an on-chip GPU that answers as PCIe function 01:00.0, vendor 10de device 2b00, with a 16 MiB BAR0 of registers and no memory window; memory is 128 GB of LPDDR5X shared with the CPU. Integrated GPU as a platform device: the CPU joined by an on-chip bus to the GPU platform device 17000000.gpu, with 3 register windows from the device tree, and 16 GB of LPDDR5 shared with the CPU.">
