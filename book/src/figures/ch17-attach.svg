  <text x="44.0" y="298.0" class="sub" text-anchor="start" xml:space="preserve">BAR1: memory window</text>
  <path d="M116,312 V365" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <path d="M40,377 A76.0,9 0 0 1 192,377 V443 A76.0,9 0 0 1 40,443 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
