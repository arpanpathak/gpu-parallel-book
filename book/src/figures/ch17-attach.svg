  <text x="472.0" y="262.0" class="name" text-anchor="start" xml:space="preserve">GPU 17000000.gpu</text>
  <text x="472.0" y="280.0" class="sub" text-anchor="start" xml:space="preserve">3 windows from the</text>
  <text x="472.0" y="298.0" class="sub" text-anchor="start" xml:space="preserve">device tree</text>
  <path d="M544,312 V365" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <path d="M468,377 A76.0,9 0 0 1 620,377 V443 A76.0,9 0 0 1 468,443 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="544.0" cy="377" rx="76.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="544.0" y="404.0" class="name" text-anchor="middle" xml:space="preserve">shared memory</text>
  <text x="544.0" y="422.0" class="sub" text-anchor="middle" xml:space="preserve">LPDDR5, 16 GB,</text>
  <text x="544.0" y="440.0" class="sub" text-anchor="middle" xml:space="preserve">also the CPU&#x27;s</text>
  <rect x="471.0" y="203" width="146.0" height="18" rx="9" fill="#EAF1FD"/>
  <text x="544.0" y="215.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">on-chip bus, no PCIe</text>
  <text x="16.0" y="534.0" class="note" text-anchor="start" xml:space="preserve">A discrete GPU is a card at the end of a PCIe link, with its own memory behind a window</text>
  <text x="16.0" y="552.0" class="note" text-anchor="start" xml:space="preserve">(BAR1). An integrated GPU is on the chip; it answers as a PCIe function, or it is a</text>
  <text x="16.0" y="570.0" class="note" text-anchor="start" xml:space="preserve">platform device described by the device tree. Both kinds share 1 memory with the CPU.</text>
</svg>
