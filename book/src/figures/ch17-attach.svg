  <rect x="248" y="93" width="161.7" height="22" rx="11" fill="#1B2430"/>
  <text x="328.9" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">PCIE-FUNCTION GPU</text>
