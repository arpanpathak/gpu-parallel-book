  <text x="258.0" y="262.0" class="name" text-anchor="start" xml:space="preserve">GPU, 10de:2b00</text>
  <text x="258.0" y="280.0" class="sub" text-anchor="start" xml:space="preserve">BAR0: 16 MiB registers</text>
  <text x="258.0" y="298.0" class="sub" text-anchor="start" xml:space="preserve">no memory window</text>
