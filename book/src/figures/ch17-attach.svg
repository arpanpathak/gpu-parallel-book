  <text x="510.0" y="155.0" class="name" text-anchor="start" xml:space="preserve">CPU</text>
  <text x="510.0" y="173.0" class="sub" text-anchor="start" xml:space="preserve">no PCIe link</text>
  <path d="M544,186 V235" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="452" y="238" width="184" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
