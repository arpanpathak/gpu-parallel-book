  <rect x="254" y="143.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(260.0,149.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="296.0" y="155.0" class="name" text-anchor="start" xml:space="preserve">CPU</text>
  <text x="296.0" y="173.0" class="sub" text-anchor="start" xml:space="preserve">with root port</text>
  <path d="M330,186 V235" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
