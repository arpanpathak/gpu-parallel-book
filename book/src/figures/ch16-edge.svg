  <rect x="36.0" y="220" width="231.8" height="18" rx="9" fill="#E7F5E9"/>
  <text x="151.9" y="232.6" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">col 992 to 999: inside C, compute</text>
  <rect x="332.0" y="220" width="218.6" height="18" rx="9" fill="#FCEBE6"/>
  <text x="441.3" y="232.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">col 1000 to 1007: col &lt; n fails</text>
  <text x="36.0" y="264.0" class="note" text-anchor="start" xml:space="preserve">1,000 ÷ 16 = 62.5, rounded up to 63 blocks: 63 × 16 = 1,008 threads per row and</text>
  <text x="36.0" y="282.0" class="note" text-anchor="start" xml:space="preserve">per column. Block 62 starts at 62 × 16 = 992; its threads x = 8 to 15 fall at</text>
  <text x="36.0" y="300.0" class="note" text-anchor="start" xml:space="preserve">columns 1,000 to 1,007, past the last column of C, and the guard stops them.</text>
</svg>
