  <rect x="34" y="93" width="374.1" height="22" rx="11" fill="#1B2430"/>
  <text x="221.1" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">THE LAST BLOCK OF A ROW OF BLOCKS, N = 1,000</text>
