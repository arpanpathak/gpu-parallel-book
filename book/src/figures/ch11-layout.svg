<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 534" width="660" height="534" role="img" aria-label="Top: 6 numbers in memory, 1 2 3 4 5 6. Left: read row by row as a 2 by 3 matrix, they are A, rows 1 2 3 and 4 5 6. Right: read column by column as a 3 by 2 matrix, the columns are 1 2 3 and 4 5 6, so the rows are 1 4, 2 5, 3 6: the transpose of A. Below, the rule: C = A B is the same as C transpose = B transpose A transpose, so a column-major library asked for B transpose times A transpose, with the operands swapped, writes C in row-major order.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="534" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Row-major and column-major</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">1 line of memory, 2 matrices.</text>
  <text x="40.0" y="120.0" class="sub" text-anchor="start" xml:space="preserve">memory</text>
  <rect x="140.0" y="102.0" width="40.0" height="30.0" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="160.0" y="121.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">1</text>
  <rect x="186.0" y="102.0" width="40.0" height="30.0" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="206.0" y="121.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">2</text>
  <rect x="232.0" y="102.0" width="40.0" height="30.0" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="252.0" y="121.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">3</text>
  <rect x="278.0" y="102.0" width="40.0" height="30.0" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="298.0" y="121.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">4</text>
  <rect x="324.0" y="102.0" width="40.0" height="30.0" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="344.0" y="121.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">5</text>
  <rect x="370.0" y="102.0" width="40.0" height="30.0" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="390.0" y="121.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">6</text>
  <rect x="16" y="168" width="300" height="210" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="157" width="201.1" height="22" rx="11" fill="#1B2430"/>
  <text x="134.5" y="172.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">READ ROW BY ROW: 2 × 3</text>
  <rect x="344" y="168" width="300" height="210" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="362" y="157" width="248.2" height="22" rx="11" fill="#1B2430"/>
  <text x="486.1" y="172.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">READ COLUMN BY COLUMN: 3 × 2</text>
  <rect x="70.0" y="210.0" width="44.0" height="36.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="92.0" y="232.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1</text>
  <rect x="120.0" y="210.0" width="44.0" height="36.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="142.0" y="232.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">2</text>
  <rect x="170.0" y="210.0" width="44.0" height="36.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="192.0" y="232.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">3</text>
  <text x="240.0" y="233.0" class="sub" text-anchor="start" xml:space="preserve">row 0</text>
  <rect x="70.0" y="254.0" width="44.0" height="36.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="92.0" y="276.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">4</text>
  <rect x="120.0" y="254.0" width="44.0" height="36.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="142.0" y="276.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">5</text>
  <rect x="170.0" y="254.0" width="44.0" height="36.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="192.0" y="276.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">6</text>
  <text x="240.0" y="277.0" class="sub" text-anchor="start" xml:space="preserve">row 1</text>
  <rect x="400.0" y="202.0" width="44.0" height="36.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="422.0" y="224.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1</text>
  <rect x="400.0" y="246.0" width="44.0" height="36.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="422.0" y="268.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">2</text>
  <rect x="400.0" y="290.0" width="44.0" height="36.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="422.0" y="312.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">3</text>
  <text x="408.0" y="350.0" class="sub" text-anchor="start" xml:space="preserve">col 0</text>
  <rect x="450.0" y="202.0" width="44.0" height="36.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="472.0" y="224.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">4</text>
  <rect x="450.0" y="246.0" width="44.0" height="36.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="472.0" y="268.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">5</text>
  <rect x="450.0" y="290.0" width="44.0" height="36.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="472.0" y="312.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">6</text>
  <text x="458.0" y="350.0" class="sub" text-anchor="start" xml:space="preserve">col 1</text>
  <text x="70.0" y="330.0" class="name" text-anchor="start" xml:space="preserve">A</text>
  <text x="110.0" y="330.0" class="sub" text-anchor="start" xml:space="preserve">as C and C++ store it</text>
  <text x="530.0" y="248.0" class="name" text-anchor="start" xml:space="preserve">Aᵀ:</text>
  <text x="530.0" y="268.0" class="sub" text-anchor="start" xml:space="preserve">rows and</text>
  <text x="530.0" y="286.0" class="sub" text-anchor="start" xml:space="preserve">columns</text>
  <text x="530.0" y="304.0" class="sub" text-anchor="start" xml:space="preserve">swapped</text>
  <rect x="16" y="404" width="628" height="108" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="393" width="83.1" height="22" rx="11" fill="#1B2430"/>
  <text x="75.5" y="408.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">THE FIX</text>
  <text x="40.0" y="446.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">(A B)ᵀ = Bᵀ Aᵀ</text>
  <text x="200.0" y="446.0" class="sub" text-anchor="start" xml:space="preserve">cuBLAS sees our A and B as Aᵀ and Bᵀ. Asked for</text>
  <text x="200.0" y="466.0" class="sub" text-anchor="start" xml:space="preserve">Bᵀ Aᵀ = Cᵀ, it writes Cᵀ column by column, which is</text>
  <text x="200.0" y="486.0" class="sub" text-anchor="start" xml:space="preserve">exactly C row by row. Swap the operands; copy nothing.</text>
</svg>
