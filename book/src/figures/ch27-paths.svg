<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 496" width="660" height="496" role="img" aria-label="Three rows. Staged through the host: GPU 0 to host memory over PCIe, then host memory to GPU 1 over PCIe. PCIe peer to peer: GPU 0 to a PCIe switch to GPU 1, without host memory. NVLink: GPU 0 straight to GPU 1 over NVLink.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="496" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">3 paths from GPU 0 to GPU 1</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The same cudaMemcpyPeer call takes whichever path exists.</text>
  <rect x="16" y="116" width="628" height="92" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="105" width="208.9" height="22" rx="11" fill="#1B2430"/>
  <text x="138.5" y="120.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">STAGED THROUGH THE HOST</text>
  <rect x="40.0" y="146.0" width="120.0" height="40.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="100.0" y="170.0" class="name" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">GPU 0</text>
  <rect x="270.0" y="146.0" width="120.0" height="40.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="330.0" y="170.0" class="name" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">host memory</text>
  <rect x="500.0" y="146.0" width="120.0" height="40.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="560.0" y="170.0" class="name" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">GPU 1</text>
  <path class="wire" d="M160,166 L270,166" marker-end="url(#head)"/>
  <rect x="194.8" y="157.0" width="40.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="215.0" y="169.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">PCIe</text>
  <path class="wire" d="M390,166 L500,166" marker-end="url(#head)"/>
  <rect x="424.8" y="157.0" width="40.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="445.0" y="169.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">PCIe</text>
  <rect x="16" y="228" width="628" height="92" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="217" width="161.7" height="22" rx="11" fill="#1B2430"/>
  <text x="114.9" y="232.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">PCIE PEER TO PEER</text>
  <rect x="40.0" y="258.0" width="120.0" height="40.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="100.0" y="282.0" class="name" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">GPU 0</text>
  <rect x="270.0" y="258.0" width="120.0" height="40.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="330.0" y="282.0" class="name" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">PCIe switch</text>
  <rect x="500.0" y="258.0" width="120.0" height="40.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="560.0" y="282.0" class="name" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">GPU 1</text>
  <path class="wire" d="M160,278 L270,278" marker-end="url(#head)"/>
  <rect x="194.8" y="269.0" width="40.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="215.0" y="281.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">PCIe</text>
  <path class="wire" d="M390,278 L500,278" marker-end="url(#head)"/>
  <rect x="424.8" y="269.0" width="40.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="445.0" y="281.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">PCIe</text>
  <rect x="16" y="340" width="628" height="92" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="329" width="75.2" height="22" rx="11" fill="#1B2430"/>
  <text x="71.6" y="344.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">NVLINK</text>
  <rect x="40.0" y="370.0" width="120.0" height="40.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="100.0" y="394.0" class="name" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">GPU 0</text>
  <rect x="500.0" y="370.0" width="120.0" height="40.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="560.0" y="394.0" class="name" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">GPU 1</text>
  <path class="wire" d="M160,390 L500,390" marker-end="url(#head)"/>
  <rect x="303.2" y="381.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="330.0" y="393.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">NVLink</text>
  <text x="24.0" y="456.0" class="note" text-anchor="start" xml:space="preserve">Staged: 2 copies, 2 crossings of PCIe, and the host memory carries the data twice. Peer</text>
  <text x="24.0" y="474.0" class="note" text-anchor="start" xml:space="preserve">to peer: 1 crossing, no host memory. NVLink: 1 direct link, 7 times as fast as PCIe 5.0.</text>
</svg>
