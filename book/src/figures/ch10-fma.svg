<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 512" width="660" height="512" role="img" aria-label="Two columns worked with 3 significant decimal digits. Left, 2 roundings: 1.23 times 4.56 = 5.6088, rounded to 5.61, minus 5.60 gives 0.0100. Right, 1 rounding: 1.23 times 4.56 minus 5.60 is exactly 0.0088, rounded to 0.00880. In the program, the polynomial written as x * y + z differs between CPU and GPU in 585,903 of 2,097,152 values; written with fmaf on both sides, in 0.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="512" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">1 rounding or 2</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A fused multiply-add rounds once; a multiply then an add rounds twice.</text>
  <rect x="16" y="104" width="304" height="300" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="271.8" height="22" rx="11" fill="#1B2430"/>
  <text x="169.9" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">MULTIPLY, THEN ADD: 2 ROUNDINGS</text>
  <rect x="340" y="104" width="304" height="300" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="358" y="93" width="161.7" height="22" rx="11" fill="#1B2430"/>
  <text x="438.9" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">FUSED: 1 ROUNDING</text>
  <rect x="40.0" y="140.0" width="256.0" height="34.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="168.0" y="161.2" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">1.23 × 4.56 = 5.6088</text>
  <path d="M168,174 V203" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="40.0" y="206.0" width="256.0" height="34.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="168.0" y="227.2" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">round to 3 digits: 5.61</text>
  <path d="M168,240 V269" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="40.0" y="272.0" width="256.0" height="34.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="168.0" y="293.2" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">5.61 − 5.60 = 0.0100</text>
  <rect x="364.0" y="140.0" width="256.0" height="34.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="492.0" y="161.2" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">1.23 × 4.56 − 5.60</text>
  <path d="M492,174 V203" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="364.0" y="206.0" width="256.0" height="34.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="492.0" y="227.2" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">exact: 0.0088</text>
  <path d="M492,240 V269" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="364.0" y="272.0" width="256.0" height="34.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="492.0" y="293.2" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">round to 3 digits: 0.00880</text>
  <text x="40.0" y="366.0" class="note" text-anchor="start" xml:space="preserve">the product is rounded before the add</text>
  <text x="364.0" y="366.0" class="note" text-anchor="start" xml:space="preserve">the product stays exact inside the add</text>
  <text x="16.0" y="436.0" class="note" text-anchor="start" xml:space="preserve">With 3 significant digits, the 2 results differ by 14%. A float keeps 24 binary digits,</text>
  <text x="16.0" y="454.0" class="note" text-anchor="start" xml:space="preserve">so the difference is in the last bit, but it is there. The GPU compiler fuses a × b + c</text>
  <text x="16.0" y="472.0" class="note" text-anchor="start" xml:space="preserve">into 1 FMA instruction; the host compiler did not. expPoly: 585,903 of 2,097,152</text>
  <text x="16.0" y="490.0" class="note" text-anchor="start" xml:space="preserve">values differ between CPU and GPU. expPolyFma, with fmaf written out: 0 differ.</text>
</svg>
