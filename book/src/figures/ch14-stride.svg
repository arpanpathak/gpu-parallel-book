  <text x="271.0" y="149.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">t4</text>
  <rect x="290.0" y="132.0" width="30.0" height="26.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="305.0" y="149.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">t5</text>
  <rect x="324.0" y="132.0" width="30.0" height="26.0" rx="4" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.2"/>
  <text x="339.0" y="149.0" class="pill" text-anchor="middle" style="fill:#5E9400" xml:space="preserve">t6</text>
  <rect x="358.0" y="132.0" width="30.0" height="26.0" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
