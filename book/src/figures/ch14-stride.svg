  <rect x="222.0" y="190.0" width="30.0" height="28.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="237.0" y="208.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">3</text>
  <rect x="256.0" y="190.0" width="30.0" height="28.0" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <text x="271.0" y="208.0" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">4</text>
  <rect x="290.0" y="190.0" width="30.0" height="28.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="305.0" y="208.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">5</text>
  <rect x="324.0" y="190.0" width="30.0" height="28.0" rx="4" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.2"/>
  <text x="339.0" y="208.0" class="mono" text-anchor="middle" style="fill:#5E9400" xml:space="preserve">6</text>
  <rect x="358.0" y="190.0" width="30.0" height="28.0" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="373.0" y="208.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">7</text>
  <text x="402.0" y="209.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">i = 0 to 7</text>
  <text x="40.0" y="259.0" class="name" text-anchor="start" xml:space="preserve">pass 1</text>
  <rect x="120.0" y="240.0" width="30.0" height="28.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="135.0" y="258.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">8</text>
  <rect x="154.0" y="240.0" width="30.0" height="28.0" rx="4" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.2"/>
  <text x="169.0" y="258.0" class="mono" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">9</text>
  <rect x="188.0" y="240.0" width="30.0" height="28.0" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="203.0" y="258.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">10</text>
  <rect x="222.0" y="240.0" width="30.0" height="28.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="237.0" y="258.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">11</text>
