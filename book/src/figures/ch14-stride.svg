  <rect x="324.0" y="240.0" width="30.0" height="28.0" rx="4" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.2"/>
  <text x="339.0" y="258.0" class="mono" text-anchor="middle" style="fill:#5E9400" xml:space="preserve">14</text>
  <rect x="358.0" y="240.0" width="30.0" height="28.0" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="373.0" y="258.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">15</text>
  <text x="402.0" y="259.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">i = 8 to 15</text>
  <text x="40.0" y="309.0" class="name" text-anchor="start" xml:space="preserve">pass 2</text>
  <rect x="120.0" y="290.0" width="30.0" height="28.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="135.0" y="308.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">16</text>
  <rect x="154.0" y="290.0" width="30.0" height="28.0" rx="4" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.2"/>
  <text x="169.0" y="308.0" class="mono" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">17</text>
  <rect x="188.0" y="290.0" width="30.0" height="28.0" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="203.0" y="308.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">18</text>
  <rect x="222.0" y="290.0" width="30.0" height="28.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="237.0" y="308.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">19</text>
  <rect x="256.0" y="290.0" width="30.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <rect x="290.0" y="290.0" width="30.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <rect x="324.0" y="290.0" width="30.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <rect x="358.0" y="290.0" width="30.0" height="28.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="402.0" y="309.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">i = 16 to 19</text>
  <text x="40.0" y="368.0" class="note" text-anchor="start" xml:space="preserve">Thread 3 handles elements 3, 11 and 19; thread 5 handles 5 and 13, and stops</text>
  <text x="40.0" y="386.0" class="note" text-anchor="start" xml:space="preserve">at 21 because 21 ≥ 20. In every pass, neighbouring threads touch neighbouring</text>
  <text x="40.0" y="404.0" class="note" text-anchor="start" xml:space="preserve">elements, and no element belongs to 2 threads: i mod 8 is the thread.</text>
</svg>
