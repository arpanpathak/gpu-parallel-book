  <text x="135.0" y="208.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">0</text>
  <rect x="154.0" y="190.0" width="30.0" height="28.0" rx="4" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.2"/>
  <text x="169.0" y="208.0" class="mono" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">1</text>
  <rect x="188.0" y="190.0" width="30.0" height="28.0" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
