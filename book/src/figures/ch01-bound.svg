<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Three programs, each with bars for CPU, memory and I/O use. SHA-256 hashing keeps the CPU at 98 percent and is CPU-bound. Vector addition keeps memory at 98 percent and is memory-bound. Copying 10 GB keeps the I/O at 98 percent and is I/O-bound.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="640" height="320" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The busy resource names the bound</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Three programs, each with one resource near 100%.</text>
  <rect x="16" y="100" width="196" height="196" rx="12" fill="#FFFFFF" stroke="#D5DBE3" filter="url(#lift)"/>
  <text x="32.0" y="128.0" class="name" text-anchor="start" xml:space="preserve">SHA-256 hashing</text>
  <text x="32.0" y="163.0" class="sub" text-anchor="start" xml:space="preserve">CPU</text>
  <rect x="92" y="150" width="100" height="16" rx="5" fill="#F1F4F7"/>
  <rect x="92" y="150" width="98" height="16" rx="5" fill="#CF4526"/>
  <text x="192.0" y="178.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">98%</text>
  <text x="32.0" y="197.0" class="sub" text-anchor="start" xml:space="preserve">memory</text>
  <rect x="92" y="184" width="100" height="16" rx="5" fill="#F1F4F7"/>
  <rect x="92" y="184" width="12" height="16" rx="5" fill="#7F8EA0"/>
  <text x="192.0" y="212.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">12%</text>
  <text x="32.0" y="231.0" class="sub" text-anchor="start" xml:space="preserve">I/O</text>
  <rect x="92" y="218" width="100" height="16" rx="5" fill="#F1F4F7"/>
  <rect x="92" y="218" width="3" height="16" rx="5" fill="#7F8EA0"/>
  <text x="192.0" y="246.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">3%</text>
  <rect x="32.0" y="264" width="73.4" height="18" rx="9" fill="#FCEBE6"/>
  <text x="68.7" y="276.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">CPU-bound</text>
  <rect x="166" y="258" width="30" height="30" rx="8" fill="#FCEBE6"/>
  <g transform="translate(171.0,263.0) scale(0.8333)"><path d="M14.5 2a7.5 7.5 0 0 0-7.2 9.6L2 16.9V22h5.1v-2.5h2.5V17h2.4l1-1a7.5 7.5 0 1 0 1.5-14zm2.2 4.3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="#CF4526" fill-rule="evenodd"/></g>
  <rect x="224" y="100" width="196" height="196" rx="12" fill="#FFFFFF" stroke="#D5DBE3" filter="url(#lift)"/>
  <text x="240.0" y="128.0" class="name" text-anchor="start" xml:space="preserve">vector addition</text>
  <text x="240.0" y="163.0" class="sub" text-anchor="start" xml:space="preserve">CPU</text>
  <rect x="300" y="150" width="100" height="16" rx="5" fill="#F1F4F7"/>
  <rect x="300" y="150" width="15" height="16" rx="5" fill="#7F8EA0"/>
  <text x="400.0" y="178.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">15%</text>
  <text x="240.0" y="197.0" class="sub" text-anchor="start" xml:space="preserve">memory</text>
  <rect x="300" y="184" width="100" height="16" rx="5" fill="#F1F4F7"/>
  <rect x="300" y="184" width="98" height="16" rx="5" fill="#CF4526"/>
  <text x="400.0" y="212.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">98%</text>
  <text x="240.0" y="231.0" class="sub" text-anchor="start" xml:space="preserve">I/O</text>
  <rect x="300" y="218" width="100" height="16" rx="5" fill="#F1F4F7"/>
  <rect x="300" y="218" width="2" height="16" rx="5" fill="#7F8EA0"/>
  <text x="400.0" y="246.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">2%</text>
  <rect x="240.0" y="264" width="93.2" height="18" rx="9" fill="#FCEBE6"/>
  <text x="286.6" y="276.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">memory-bound</text>
  <rect x="374" y="258" width="30" height="30" rx="8" fill="#FCEBE6"/>
  <g transform="translate(379.0,263.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#CF4526" fill-rule="evenodd"/></g>
  <rect x="432" y="100" width="196" height="196" rx="12" fill="#FFFFFF" stroke="#D5DBE3" filter="url(#lift)"/>
  <text x="448.0" y="128.0" class="name" text-anchor="start" xml:space="preserve">copying 10 GB</text>
  <text x="448.0" y="163.0" class="sub" text-anchor="start" xml:space="preserve">CPU</text>
  <rect x="508" y="150" width="100" height="16" rx="5" fill="#F1F4F7"/>
  <rect x="508" y="150" width="6" height="16" rx="5" fill="#7F8EA0"/>
  <text x="608.0" y="178.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">6%</text>
  <text x="448.0" y="197.0" class="sub" text-anchor="start" xml:space="preserve">memory</text>
  <rect x="508" y="184" width="100" height="16" rx="5" fill="#F1F4F7"/>
  <rect x="508" y="184" width="10" height="16" rx="5" fill="#7F8EA0"/>
  <text x="608.0" y="212.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">10%</text>
  <text x="448.0" y="231.0" class="sub" text-anchor="start" xml:space="preserve">I/O</text>
  <rect x="508" y="218" width="100" height="16" rx="5" fill="#F1F4F7"/>
  <rect x="508" y="218" width="98" height="16" rx="5" fill="#CF4526"/>
  <text x="608.0" y="246.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">98%</text>
  <rect x="448.0" y="264" width="73.4" height="18" rx="9" fill="#FCEBE6"/>
  <text x="484.7" y="276.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">I/O-bound</text>
  <rect x="582" y="258" width="30" height="30" rx="8" fill="#FCEBE6"/>
  <g transform="translate(587.0,263.0) scale(0.8333)"><path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm7 1.5V8h4.5zM8 11v1.6h8V11zm0 3.2v1.6h8v-1.6zm0 3.2V19h5v-1.6z" fill="#CF4526" fill-rule="evenodd"/></g>
</svg>
