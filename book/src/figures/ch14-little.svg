<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 534" width="660" height="534" role="img" aria-label="Bars of measured SAXPY rate for the grid-stride kernel against blocks per SM: 1 block 32.5 GB/s, 2 blocks 59.5, 3 blocks 79.1, 6 blocks 93.4, 12 blocks 91.9, 24 blocks 91.4, 48 blocks 88.2. A red line shows Little&#x27;s law with a latency of 0.50 microseconds: 32.5, 65, 97.5, then capped at 102 GB/s.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="534" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Enough loads in flight</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">SAXPY rate against blocks per SM, 1 GPU of 102 GB/s.</text>
  <rect x="110" y="94" width="14" height="14" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="131.0" y="105.5" class="note" text-anchor="start" xml:space="preserve">measured, grid-stride</text>
  <rect x="310" y="94" width="14" height="14" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="331.0" y="105.5" class="note" text-anchor="start" xml:space="preserve">Little&#x27;s law, capped at 102 GB/s</text>
  <line x1="110.0" y1="400.0" x2="590.0" y2="400.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="102.0" y="404.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <line x1="110.0" y1="356.7" x2="590.0" y2="356.7" stroke="#D5DBE3" stroke-width="1"/>
  <text x="102.0" y="360.7" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">20</text>
  <line x1="110.0" y1="313.3" x2="590.0" y2="313.3" stroke="#D5DBE3" stroke-width="1"/>
  <text x="102.0" y="317.3" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">40</text>
  <line x1="110.0" y1="270.0" x2="590.0" y2="270.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="102.0" y="274.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">60</text>
  <line x1="110.0" y1="226.7" x2="590.0" y2="226.7" stroke="#D5DBE3" stroke-width="1"/>
  <text x="102.0" y="230.7" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">80</text>
  <line x1="110.0" y1="183.3" x2="590.0" y2="183.3" stroke="#D5DBE3" stroke-width="1"/>
  <text x="102.0" y="187.3" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">100</text>
  <line x1="110.0" y1="140.0" x2="590.0" y2="140.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="102.0" y="144.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">120</text>
  <text x="50.0" y="132.0" class="sub" text-anchor="start" xml:space="preserve">GB/s</text>
  <line x1="110.0" y1="179.0" x2="590.0" y2="179.0" stroke="#CF4526" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="114.0" y="171.0" class="mono" text-anchor="start" style="fill:#CF4526" xml:space="preserve">102 GB/s</text>
  <rect x="124.3" y="329.6" width="40" height="70.4" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="144.3" y="347.6" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">32</text>
  <text x="144.3" y="418.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">1</text>
  <circle cx="144.3" cy="329.6" r="4" fill="#CF4526"/>
  <rect x="192.9" y="271.1" width="40" height="128.9" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="212.9" y="289.1" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">60</text>
  <text x="212.9" y="418.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">2</text>
  <circle cx="212.9" cy="259.2" r="4" fill="#CF4526"/>
  <line x1="144.3" y1="329.6" x2="212.9" y2="259.2" stroke="#CF4526" stroke-width="1.4"/>
  <rect x="261.4" y="228.6" width="40" height="171.4" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="281.4" y="246.6" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">79</text>
  <text x="281.4" y="418.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">3</text>
  <circle cx="281.4" cy="188.8" r="4" fill="#CF4526"/>
  <line x1="212.9" y1="259.2" x2="281.4" y2="188.8" stroke="#CF4526" stroke-width="1.4"/>
  <rect x="330.0" y="197.6" width="40" height="202.4" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="350.0" y="215.6" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">93</text>
  <text x="350.0" y="418.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">6</text>
  <circle cx="350.0" cy="179.0" r="4" fill="#CF4526"/>
  <line x1="281.4" y1="188.8" x2="350.0" y2="179.0" stroke="#CF4526" stroke-width="1.4"/>
  <rect x="398.6" y="200.9" width="40" height="199.1" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="418.6" y="218.9" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">92</text>
  <text x="418.6" y="418.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">12</text>
  <circle cx="418.6" cy="179.0" r="4" fill="#CF4526"/>
  <line x1="350.0" y1="179.0" x2="418.6" y2="179.0" stroke="#CF4526" stroke-width="1.4"/>
  <rect x="467.1" y="202.0" width="40" height="198.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="487.1" y="220.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">91</text>
  <text x="487.1" y="418.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">24</text>
  <circle cx="487.1" cy="179.0" r="4" fill="#CF4526"/>
  <line x1="418.6" y1="179.0" x2="487.1" y2="179.0" stroke="#CF4526" stroke-width="1.4"/>
  <rect x="535.7" y="208.9" width="40" height="191.1" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="555.7" y="226.9" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">88</text>
  <text x="555.7" y="418.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">48</text>
  <circle cx="555.7" cy="179.0" r="4" fill="#CF4526"/>
  <line x1="487.1" y1="179.0" x2="555.7" y2="179.0" stroke="#CF4526" stroke-width="1.4"/>
  <text x="350.0" y="440.0" class="sub" text-anchor="middle" xml:space="preserve">blocks of 256 threads per SM</text>
  <text x="40.0" y="476.0" class="note" text-anchor="start" xml:space="preserve">1 block per SM keeps 8 × 256 × 8 bytes = 16 KiB of loads in flight and moved</text>
  <text x="40.0" y="494.0" class="note" text-anchor="start" xml:space="preserve">32.5 GB/s, so a load takes 16,384 B ÷ 32.5 GB/s = 0.50 µs. Twice the bytes</text>
  <text x="40.0" y="512.0" class="note" text-anchor="start" xml:space="preserve">in flight give about twice the rate, until the memory bandwidth caps it.</text>
</svg>
