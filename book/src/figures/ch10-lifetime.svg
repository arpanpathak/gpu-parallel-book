<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 546" width="660" height="546" role="img" aria-label="A column of steps inside a zone labelled 1 scope. DeviceBuffer&lt;float&gt; in(host) calls the constructor, which allocates with cudaMallocAsync and copies; kernels then read in.view(). 3 ways out branch from there: return false, check() throws, and the closing brace. All 3 join into 1 box, the destructor, which calls cudaFreeAsync and gives the 8 MiB back to the pool.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="546" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The lifetime of a DeviceBuffer</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">3 ways out of a scope, 1 destructor.</text>
  <rect x="16" y="104" width="470" height="420" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="83.1" height="22" rx="11" fill="#1B2430"/>
  <text x="75.5" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1 SCOPE</text>
  <rect x="90.0" y="130.0" width="320.0" height="32.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="250.0" y="150.2" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">DeviceBuffer&lt;float&gt; in(host);</text>
  <path d="M250,162 V181" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="90.0" y="184.0" width="320.0" height="32.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="250.0" y="204.2" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">constructor: cudaMallocAsync, copy</text>
  <path d="M250,216 V235" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="90.0" y="238.0" width="320.0" height="32.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="250.0" y="258.2" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">use: kernels read in.view()</text>
  <path d="M250,270 V292 M100,292 H400" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="250" cy="292" r="3" fill="#3F5873"/>
  <path d="M100,292 V311" fill="none" stroke="#3F5873" stroke-width="1.6" stroke-linecap="round" marker-end="url(#head)"/>
  <path d="M250,292 V311" fill="none" stroke="#3F5873" stroke-width="1.6" stroke-linecap="round" marker-end="url(#head)"/>
  <path d="M400,292 V311" fill="none" stroke="#3F5873" stroke-width="1.6" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="34.0" y="314.0" width="132.0" height="32.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="100.0" y="334.2" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">return false;</text>
  <rect x="184.0" y="314.0" width="132.0" height="32.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="250.0" y="334.2" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">check() throws</text>
  <rect x="334.0" y="314.0" width="132.0" height="32.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="400.0" y="334.2" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">closing }</text>
  <path d="M100,368 H400" fill="none" stroke="#3F5873" stroke-width="1.8"/>
  <path d="M100,346 V368" fill="none" stroke="#3F5873" stroke-width="1.6"/>
  <path d="M250,346 V368" fill="none" stroke="#3F5873" stroke-width="1.6"/>
  <path d="M400,346 V368" fill="none" stroke="#3F5873" stroke-width="1.6"/>
  <circle cx="250" cy="368" r="3" fill="#3F5873"/>
  <path d="M250,368 V387" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="90.0" y="390.0" width="320.0" height="32.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="250.0" y="410.2" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">destructor: cudaFreeAsync</text>
  <path d="M250,422 V441" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="90.0" y="444.0" width="320.0" height="32.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="250.0" y="464.2" class="mono" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">8 MiB back in the pool</text>
  <text x="504.0" y="150.0" class="note" text-anchor="start" xml:space="preserve">The compiler places</text>
  <text x="504.0" y="168.0" class="note" text-anchor="start" xml:space="preserve">the destructor call</text>
  <text x="504.0" y="186.0" class="note" text-anchor="start" xml:space="preserve">on every path that</text>
  <text x="504.0" y="204.0" class="note" text-anchor="start" xml:space="preserve">leaves the scope:</text>
  <text x="504.0" y="222.0" class="note" text-anchor="start" xml:space="preserve">a return, an</text>
  <text x="504.0" y="240.0" class="note" text-anchor="start" xml:space="preserve">exception passing</text>
  <text x="504.0" y="258.0" class="note" text-anchor="start" xml:space="preserve">through, or the end</text>
  <text x="504.0" y="276.0" class="note" text-anchor="start" xml:space="preserve">of the block.</text>
  <text x="504.0" y="312.0" class="note" text-anchor="start" xml:space="preserve">Nothing in the</text>
  <text x="504.0" y="330.0" class="note" text-anchor="start" xml:space="preserve">function body asks</text>
  <text x="504.0" y="348.0" class="note" text-anchor="start" xml:space="preserve">for it, so nothing</text>
  <text x="504.0" y="366.0" class="note" text-anchor="start" xml:space="preserve">can forget it.</text>
</svg>
