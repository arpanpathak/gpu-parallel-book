<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 536" width="680" height="536" role="img" aria-label="The Hillis-Steele scan of 3, 1, 7, 0, 4, 1, 6, 3. After offset 1: 3, 4, 8, 7, 4, 5, 7, 9. After offset 2: 3, 4, 11, 11, 12, 12, 11, 14. After offset 4: 3, 4, 11, 11, 15, 16, 22, 25. Under each cell, the range of inputs it sums doubles at every step. Arrows show element 7 adding elements 6, 5 and 3 of the rows above.">
