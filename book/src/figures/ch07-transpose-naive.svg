  <text x="340.0" y="175.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">out[x][y] = in[y][x]</text>
  <text x="40.0" y="340.0" class="note" text-anchor="start" xml:space="preserve">The read is coalesced: 32 neighbouring floats, 4 sectors. The write is not: 32 floats</text>
  <text x="40.0" y="358.0" class="note" text-anchor="start" xml:space="preserve">in 32 different rows, 32 sectors, and 7 of every 8 bytes written to memory are waste.</text>
