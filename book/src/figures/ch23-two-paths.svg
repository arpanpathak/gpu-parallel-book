<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 552" width="660" height="552" role="img" aria-label="A CPU core at the top left and DRAM below it, joined by a cached path. On the right, a GPU with registers in BAR0, a host interface and copy engines. A red control path runs from the CPU to the registers: an MMIO store of 4 bytes, the doorbell. 2 data paths run from DRAM to the GPU: the host interface reads 8-byte work entries by DMA, and the copy engines move 64 MiB of data by DMA.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="552" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Control path and data path</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">MMIO carries commands; DMA carries data.</text>
  <rect x="24" y="130" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M36,130.7 H30 V199.3 H36 A11.3,11.3 0 0 1 24.7,188 V142 A11.3,11.3 0 0 1 36,130.7 Z" fill="#2F6FDB"/>
  <rect x="40" y="149.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(46.0,155.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="82.0" y="152.0" class="name" text-anchor="start" xml:space="preserve">CPU core</text>
  <text x="82.0" y="170.0" class="sub" text-anchor="start" xml:space="preserve">runs the driver</text>
  <text x="82.0" y="188.0" class="sub" text-anchor="start" xml:space="preserve">and your program</text>
  <path d="M36,339 A78.0,9 0 0 1 192,339 V417 A78.0,9 0 0 1 36,417 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="114.0" cy="339" rx="78.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="114.0" y="372.0" class="name" text-anchor="middle" xml:space="preserve">DRAM</text>
  <text x="114.0" y="390.0" class="sub" text-anchor="middle" xml:space="preserve">data, pushbuffers,</text>
  <text x="114.0" y="408.0" class="sub" text-anchor="middle" xml:space="preserve">the work ring</text>
  <rect x="392" y="116" width="248" height="330" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="410" y="105" width="51.6" height="22" rx="11" fill="#1B2430"/>
  <text x="435.8" y="120.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">GPU</text>
  <rect x="412" y="140" width="208" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M424,140.7 H418 V203.3 H424 A11.3,11.3 0 0 1 412.7,192 V152 A11.3,11.3 0 0 1 424,140.7 Z" fill="#CF4526"/>
  <text x="432.0" y="168.0" class="name" text-anchor="start" xml:space="preserve">registers (BAR0)</text>
  <text x="432.0" y="186.0" class="sub" text-anchor="start" xml:space="preserve">doorbell, status, setup</text>
  <rect x="412" y="236" width="208" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M424,236.7 H418 V299.3 H424 A11.3,11.3 0 0 1 412.7,288 V248 A11.3,11.3 0 0 1 424,236.7 Z" fill="#1F8A70"/>
  <text x="432.0" y="264.0" class="name" text-anchor="start" xml:space="preserve">host interface</text>
  <text x="432.0" y="282.0" class="sub" text-anchor="start" xml:space="preserve">reads the work ring</text>
  <rect x="412" y="332" width="208" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M424,332.7 H418 V405.3 H424 A11.3,11.3 0 0 1 412.7,394 V344 A11.3,11.3 0 0 1 424,332.7 Z" fill="#5E9400"/>
  <text x="432.0" y="356.0" class="name" text-anchor="start" xml:space="preserve">copy engines</text>
  <text x="432.0" y="374.0" class="sub" text-anchor="start" xml:space="preserve">move data in bulk:</text>
  <text x="432.0" y="392.0" class="sub" text-anchor="start" xml:space="preserve">DMA</text>
  <path class="wire danger" d="M204,172 L412,172" marker-end="url(#head-danger)"/>
  <rect x="235.0" y="163.0" width="146.0" height="18" rx="9" fill="#FBFAF6" stroke="#CF4526" stroke-width="1"/>
  <text x="308.0" y="175.8" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">MMIO: a 4-byte store</text>
  <path class="wire" d="M192,362 L291,362 Q300,362 300,353 L300,277 Q300,268 309,268 L412,268" marker-end="url(#head)"/>
  <rect x="230.3" y="306.0" width="139.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="300.0" y="318.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">DMA: 8-byte entries</text>
  <path class="wire" d="M192,386 L412,386" marker-end="url(#head)"/>
  <rect x="258.7" y="377.0" width="86.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="302.0" y="389.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">DMA: 64 MiB</text>
  <path class="wire" d="M114,200 L114,330" marker-end="url(#head)"/>
  <rect x="87.2" y="256.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="114.0" y="268.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">cached</text>
  <text x="24.0" y="494.0" class="note" text-anchor="start" xml:space="preserve">Red: the control path, a few bytes stored by the CPU. Blue: the data path, read by the GPU.</text>
  <text x="24.0" y="512.0" class="note" text-anchor="start" xml:space="preserve">The CPU tells the GPU where work is with 1 small store; the GPU fetches the work and the</text>
  <text x="24.0" y="530.0" class="note" text-anchor="start" xml:space="preserve">data itself, by DMA, while the CPU goes on with other things.</text>
</svg>
