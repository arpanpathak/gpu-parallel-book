  <text x="36.0" y="346.0" class="note" text-anchor="start" xml:space="preserve">The largest float32 is 3.40e38, exp(88.72).</text>
  <text x="36.0" y="364.0" class="note" text-anchor="start" xml:space="preserve">exp(101) = 7.31e43 rounds to infinity.</text>
  <text x="358.0" y="346.0" class="note" text-anchor="start" xml:space="preserve">Every x − m is 0 or less, so every</text>
  <text x="358.0" y="364.0" class="note" text-anchor="start" xml:space="preserve">exp lies in (0, 1] and cannot overflow.</text>
