<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 464" width="660" height="464" role="img" aria-label="Twelve values in 3 blocks of 4: 3, 1, 4, 1; 5, 9, 2, 6; 5, 3, 5, 8. Step 1 scans each block: 3, 4, 8, 9; 5, 14, 16, 22; 5, 8, 13, 21, with totals 9, 22 and 21. Step 2 scans the totals: 9, 31, 52. Step 3 adds 0, 9 and 31 to the 3 blocks, giving 3, 4, 8, 9, 14, 23, 25, 31, 36, 39, 44, 52.">
