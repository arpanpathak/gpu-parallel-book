<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="Left: a cross of 5 cells, the center (r, c) and its neighbors (r-1, c) above, (r+1, c) below, (r, c-1) to the left and (r, c+1) to the right, with weight 1/4 on each neighbor and 0 on the center. Right: cell (1, 1) of the final plate: up 100, down 22.35, left 0, right 59.47, sum 181.82, times 1/4 gives 45.45, the value of the cell.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="640" height="440" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The 5-point stencil</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each interior value is the mean of its 4 neighbors: 4 reads and 4 operations.</text>
  <rect x="32" y="96" width="250" height="320" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="50" y="85" width="146.0" height="22" rx="11" fill="#1B2430"/>
  <text x="123.0" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">5-POINT STENCIL</text>
  <rect x="120.0" y="202.0" width="68.0" height="68.0" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.6"/>
  <text x="154.0" y="240.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">row, col</text>
  <rect x="120.0" y="126.0" width="68.0" height="68.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
  <text x="154.0" y="164.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">row−1, col</text>
  <text x="154.0" y="182.0" class="note" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">× 1/4</text>
  <rect x="120.0" y="278.0" width="68.0" height="68.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
  <text x="154.0" y="316.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">row+1, col</text>
  <text x="154.0" y="334.0" class="note" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">× 1/4</text>
  <rect x="44.0" y="202.0" width="68.0" height="68.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
  <text x="78.0" y="240.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">row, col−1</text>
  <text x="78.0" y="258.0" class="note" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">× 1/4</text>
  <rect x="196.0" y="202.0" width="68.0" height="68.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
  <text x="230.0" y="240.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">row, col+1</text>
  <text x="230.0" y="258.0" class="note" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">× 1/4</text>
  <text x="48.0" y="372.0" class="note" text-anchor="start" xml:space="preserve">weight 1/4 on each neighbor,</text>
  <text x="48.0" y="390.0" class="note" text-anchor="start" xml:space="preserve">0 on the center</text>
  <rect x="302" y="96" width="306" height="320" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="320" y="85" width="216.8" height="22" rx="11" fill="#1B2430"/>
  <text x="428.4" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">CELL (1, 1), FINAL PLATE</text>
  <text x="322.0" y="140.0" class="note" text-anchor="start" xml:space="preserve">up</text>
  <text x="386.0" y="140.0" class="mono" text-anchor="start" xml:space="preserve">u(0, 1)</text>
  <text x="586.0" y="140.0" class="mono" text-anchor="end" xml:space="preserve">100.00</text>
  <text x="322.0" y="174.0" class="note" text-anchor="start" xml:space="preserve">down</text>
  <text x="386.0" y="174.0" class="mono" text-anchor="start" xml:space="preserve">u(2, 1)</text>
  <text x="586.0" y="174.0" class="mono" text-anchor="end" xml:space="preserve">22.35</text>
  <text x="322.0" y="208.0" class="note" text-anchor="start" xml:space="preserve">left</text>
  <text x="386.0" y="208.0" class="mono" text-anchor="start" xml:space="preserve">u(1, 0)</text>
  <text x="586.0" y="208.0" class="mono" text-anchor="end" xml:space="preserve">0.00</text>
  <text x="322.0" y="242.0" class="note" text-anchor="start" xml:space="preserve">right</text>
  <text x="386.0" y="242.0" class="mono" text-anchor="start" xml:space="preserve">u(1, 2)</text>
  <text x="586.0" y="242.0" class="mono" text-anchor="end" xml:space="preserve">59.47</text>
  <line x1="322.0" y1="272.0" x2="590.0" y2="272.0" stroke="#1B2430" stroke-width="1.2"/>
  <text x="322.0" y="296.0" class="mono" text-anchor="start" xml:space="preserve">sum</text>
  <text x="586.0" y="296.0" class="mono" text-anchor="end" xml:space="preserve">181.82</text>
  <text x="322.0" y="324.0" class="mono" text-anchor="start" xml:space="preserve">× 1/4</text>
  <text x="586.0" y="324.0" class="mono" text-anchor="end" style="fill:#2E8B3D" xml:space="preserve">45.45</text>
  <text x="322.0" y="362.0" class="note" text-anchor="start" xml:space="preserve">The mean of the neighbors, 45.45,</text>
  <text x="322.0" y="380.0" class="note" text-anchor="start" xml:space="preserve">equals the value of the cell itself.</text>
</svg>
