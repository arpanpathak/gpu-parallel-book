<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 222" width="640" height="222" role="img" aria-label="The same 3 floats, 16,777,216, 1 and 1, added in 2 orders. Left to right, each + 1 gives 16,777,217, which is not a float and rounds back to 16,777,216. With the small values first, 1 + 1 = 2 and 16,777,216 + 2 = 16,777,218 exactly.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="m-hi" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#4F52C4"/></marker>
    <marker id="m-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#8A94A3"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#C2412D"/></marker>
    <marker id="m-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#1F2633"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#2E8B57"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7275D6"/></marker>
    <marker id="m-mint" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F9F80"/></marker>
    <marker id="m-peach" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#D98654"/></marker>
    <marker id="m-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CC6A91"/></marker>
  </defs>
  <rect width="640" height="222" rx="12" fill="#FFFFFF"/>
  <text x="20.0" y="22.0" font-size="12.5" fill="#1F2633" text-anchor="start" font-weight="700" xml:space="preserve">left to right</text>
  <text x="340.0" y="22.0" font-size="12.5" fill="#1F2633" text-anchor="start" font-weight="700" xml:space="preserve">small values first</text>
  <rect x="20.0" y="36.0" width="280.0" height="28.0" rx="5" fill="#FFFFFF" stroke="#C5CBD3" stroke-width="1.1"/>
  <text x="160.0" y="54.1" font-size="11.5" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">16,777,216 + 1 = 16,777,217</text>
  <text x="160.0" y="82.0" font-size="11" fill="#C2412D" text-anchor="middle" font-weight="400" xml:space="preserve">not a float: rounds to 16,777,216</text>
  <rect x="20.0" y="92.0" width="280.0" height="28.0" rx="5" fill="#FFFFFF" stroke="#C5CBD3" stroke-width="1.1"/>
  <text x="160.0" y="110.1" font-size="11.5" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">16,777,216 + 1 = 16,777,217</text>
  <text x="160.0" y="138.0" font-size="11" fill="#C2412D" text-anchor="middle" font-weight="400" xml:space="preserve">rounds again to 16,777,216</text>
  <rect x="20.0" y="150.0" width="280.0" height="28.0" rx="5" fill="#FBE4E0" stroke="#C2412D" stroke-width="1.1"/>
  <text x="160.0" y="168.3" font-size="12" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">result 16,777,216</text>
  <rect x="340.0" y="36.0" width="280.0" height="28.0" rx="5" fill="#FFFFFF" stroke="#C5CBD3" stroke-width="1.1"/>
  <text x="480.0" y="54.1" font-size="11.5" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">1 + 1 = 2</text>
  <text x="480.0" y="82.0" font-size="11" fill="#2E8B57" text-anchor="middle" font-weight="400" xml:space="preserve">exact</text>
  <rect x="340.0" y="92.0" width="280.0" height="28.0" rx="5" fill="#FFFFFF" stroke="#C5CBD3" stroke-width="1.1"/>
  <text x="480.0" y="110.1" font-size="11.5" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">16,777,216 + 2 = 16,777,218</text>
  <text x="480.0" y="138.0" font-size="11" fill="#2E8B57" text-anchor="middle" font-weight="400" xml:space="preserve">a float: exact</text>
  <rect x="340.0" y="150.0" width="280.0" height="28.0" rx="5" fill="#D5F0E6" stroke="#3F9F80" stroke-width="1.1"/>
  <text x="480.0" y="168.3" font-size="12" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">result 16,777,218</text>
  <text x="20.0" y="206.0" font-size="11.5" fill="#8A94A3" text-anchor="start" font-weight="400" xml:space="preserve">Above 2²⁴ = 16,777,216 the floats are 2 apart, so 16,777,217 does not exist.</text>
</svg>
