  <text x="40.0" y="290.0" class="note" text-anchor="start" xml:space="preserve">C[1][2] = 0 × 0 + 1 × 2 + 3 × 1 + 2 × 1 = 7: row 1 of A against column 2 of B.</text>
  <text x="40.0" y="316.0" class="note" text-anchor="start" xml:space="preserve">Each of the N² elements of C takes N multiplications and N additions, so the</text>
