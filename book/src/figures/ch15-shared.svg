  <text x="16.0" y="440.0" class="note" text-anchor="start" xml:space="preserve">Each resident block gets its own copy, created when the block starts and freed</text>
  <text x="16.0" y="458.0" class="note" text-anchor="start" xml:space="preserve">when it ends. A thread can read and write the copy of its own block only.</text>
