  <rect x="462" y="203" width="153.9" height="22" rx="11" fill="#1B2430"/>
  <text x="538.9" y="218.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">BLOCK 2 ON AN SM</text>
