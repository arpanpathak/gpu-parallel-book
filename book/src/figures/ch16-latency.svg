<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" role="img" aria-label="Horizontal bars on a logarithmic scale of clock cycles. A dependent multiply-add takes 4.24 cycles; with 4 independent chains each takes 1.31 cycles. A load from L1 takes 39 cycles, from L2 191 cycles, and from DRAM 598 to 1,137 cycles over 14 runs.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="470" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Latencies, measured inside a kernel</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">1 thread, timed with clock64(), on a GPU at 1,173 MHz.</text>
  <line x1="210.0" y1="120.0" x2="210.0" y2="380.0" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="210.0" y="398.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">1</text>
  <line x1="300.9" y1="120.0" x2="300.9" y2="380.0" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="300.9" y="398.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">10</text>
  <line x1="391.8" y1="120.0" x2="391.8" y2="380.0" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="391.8" y="398.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">100</text>
  <line x1="482.6" y1="120.0" x2="482.6" y2="380.0" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="482.6" y="398.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">1,000</text>
  <text x="196.0" y="147.0" class="sub" text-anchor="end" xml:space="preserve">1 multiply-add, dependent</text>
  <rect x="210" y="132" width="57.0" height="22" rx="5" fill="#B7791F"/>
  <text x="275.0" y="147.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">4.24 cycles</text>
  <text x="196.0" y="199.0" class="sub" text-anchor="end" xml:space="preserve">1 multiply-add, 4 chains</text>
  <rect x="210" y="184" width="10.7" height="22" rx="5" fill="#2E8B3D"/>
  <text x="228.7" y="199.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">1.31 cycles</text>
  <text x="196.0" y="251.0" class="sub" text-anchor="end" xml:space="preserve">1 load from L1</text>
  <rect x="210" y="236" width="144.6" height="22" rx="5" fill="#2F6FDB"/>
  <text x="362.6" y="251.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">39 cycles</text>
  <text x="196.0" y="303.0" class="sub" text-anchor="end" xml:space="preserve">1 load from L2</text>
  <rect x="210" y="288" width="207.3" height="22" rx="5" fill="#7A4FD0"/>
  <text x="425.3" y="303.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">191 cycles</text>
  <text x="196.0" y="355.0" class="sub" text-anchor="end" xml:space="preserve">1 load from DRAM</text>
  <rect x="210" y="340" width="252.3" height="22" rx="5" fill="#CF4526"/>
  <rect x="462.3" y="340.0" width="25.4" height="22.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="495.7" y="355.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">598 to 1,137 cycles</text>
  <text x="196.0" y="398.0" class="sub" text-anchor="end" xml:space="preserve">cycles</text>
  <text x="40.0" y="430.0" class="note" text-anchor="start" xml:space="preserve">Measured with clock64() by 1 thread, at 1,173 MHz: 1 cycle = 0.85 ns.</text>
  <text x="40.0" y="448.0" class="note" text-anchor="start" xml:space="preserve">A DRAM load costs about 140 dependent multiply-adds; the range comes from 14 runs.</text>
</svg>
