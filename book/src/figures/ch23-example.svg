<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 388" width="660" height="388" role="img" aria-label="The 2 by 4 matrix X with rows 1, 2, 3, 4 and 2, 4, 4, 5. Its softmax P has rows 0.0321, 0.0871, 0.2369, 0.6439 and 0.0279, 0.2060, 0.2060, 0.5601. Its layer normalization Y has rows -1.3416, -0.4472, 0.4472, 1.3416 and -1.6059, 0.2294, 0.2294, 1.1471.">
