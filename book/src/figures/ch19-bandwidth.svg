<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" role="img" aria-label="Horizontal bars of effective bandwidth on a 4096 by 4096 grid, Orin NX: copy kernel 76.4 GB/s, Jacobi step in C++ 68.3 GB/s, Jacobi step in Rust 57.8 GB/s. A dashed line marks the rated 102 GB/s. A second dashed line marks 67.9 GB/s, the rate predicted for 9 bytes per cell.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="640" height="410" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Effective bandwidth of a Jacobi step</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">4096 × 4096 cells on a Jetson Orin NX rated at 102 GB/s.</text>
  <text x="40.0" y="138.0" class="note" text-anchor="start" xml:space="preserve">copy kernel</text>
  <rect filter="url(#m3-shadow)" x="140" y="116" width="298.7" height="34" rx="8" fill="#F1F4F7" stroke="none" stroke-width="1.4"/>
  <text x="150.0" y="138.0" class="mono" text-anchor="start" style="fill:#7F8EA0" xml:space="preserve">76.4 GB/s</text>
  <text x="40.0" y="196.0" class="note" text-anchor="start" xml:space="preserve">Jacobi, C++</text>
  <rect x="140" y="174" width="267.0" height="34" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.4"/>
  <text x="150.0" y="196.0" class="mono" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">68.3 GB/s</text>
  <text x="40.0" y="254.0" class="note" text-anchor="start" xml:space="preserve">Jacobi, Rust</text>
  <rect x="140" y="232" width="225.9" height="34" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.4"/>
  <text x="150.0" y="254.0" class="mono" text-anchor="start" style="fill:#7A4FD0" xml:space="preserve">57.8 GB/s</text>
  <path d="M538.7,104 V300" stroke="#CF4526" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="538.7" y="318.0" class="note" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">rated 102 GB/s</text>
  <path d="M405.5,104 V300" stroke="#B7791F" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="405.5" y="336.0" class="note" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">9 bytes per cell: 67.9 GB/s</text>
  <text x="40.0" y="372.0" class="note" text-anchor="start" xml:space="preserve">Effective bandwidth = 8 bytes per cell ÷ time of a step; a step moves at least 134.2 MB.</text>
  <text x="40.0" y="390.0" class="note" text-anchor="start" xml:space="preserve">The C++ step runs where 9 bytes per cell at the copy&#x27;s rate would put it.</text>
</svg>
