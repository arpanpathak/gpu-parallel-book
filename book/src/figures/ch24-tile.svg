  <text x="153.0" y="168.0" class="note" text-anchor="middle" xml:space="preserve">x=0</text>
  <rect x="178.0" y="122.0" width="42.0" height="30.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.2"/>
