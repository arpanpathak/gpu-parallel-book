  <rect x="40" y="290" width="14" height="14" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="61.0" y="301.5" class="note" text-anchor="start" xml:space="preserve">halo: loaded by threads 0 and 1</text>
  <rect x="287.6" y="290" width="14" height="14" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="308.6" y="301.5" class="note" text-anchor="start" xml:space="preserve">own pixels: each thread loads slot threadIdx.x + 2</text>
  <text x="40.0" y="326.0" class="note" text-anchor="start" xml:space="preserve">8 threads load 12 values once; the 8 sums read 40 values, all from shared memory.</text>
