<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 266" width="640" height="266" role="img" aria-label="A grid-stride loop with the wrong stride, 2 in place of 4. Global thread 0 visits elements 0, 2, 4, 6, 8, 10 and global thread 2 visits 2, 4, 6, 8, 10. Thread 0 computes y[2] = 2 times 1 plus 4 = 6; thread 2 later reads the 6 and computes 2 times 1 plus 6 = 8. The result is 8 in place of 6.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="m-hi" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#4F52C4"/></marker>
    <marker id="m-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#8A94A3"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#C2412D"/></marker>
    <marker id="m-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#1F2633"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#2E8B57"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7275D6"/></marker>
    <marker id="m-mint" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F9F80"/></marker>
    <marker id="m-peach" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#D98654"/></marker>
    <marker id="m-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CC6A91"/></marker>
  </defs>
  <rect width="640" height="266" rx="12" fill="#FFFFFF"/>
  <text x="138.0" y="50.0" font-size="11.5" fill="#1F2633" text-anchor="end" font-weight="400" xml:space="preserve">global thread 0</text>
  <text x="138.0" y="64.0" font-size="10.5" fill="#8A94A3" text-anchor="end" font-weight="400" xml:space="preserve">(block 0, t0)</text>
  <text x="138.0" y="112.0" font-size="11.5" fill="#1F2633" text-anchor="end" font-weight="400" xml:space="preserve">global thread 2</text>
  <text x="138.0" y="126.0" font-size="10.5" fill="#8A94A3" text-anchor="end" font-weight="400" xml:space="preserve">(block 1, t0)</text>
  <rect x="150.0" y="40.0" width="56.0" height="26.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
  <text x="178.0" y="57.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">i = 0</text>
  <rect x="212.0" y="40.0" width="56.0" height="26.0" rx="5" fill="#C9CAF6" stroke="#4F52C4" stroke-width="2.2"/>
  <text x="240.0" y="57.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">i = 2</text>
  <rect x="274.0" y="40.0" width="56.0" height="26.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
  <text x="302.0" y="57.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">i = 4</text>
  <rect x="336.0" y="40.0" width="56.0" height="26.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
  <text x="364.0" y="57.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">i = 6</text>
  <rect x="398.0" y="40.0" width="56.0" height="26.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
  <text x="426.0" y="57.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">i = 8</text>
  <rect x="460.0" y="40.0" width="56.0" height="26.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
  <text x="488.0" y="57.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">i = 10</text>
  <rect x="243.0" y="102.0" width="56.0" height="26.0" rx="5" fill="#FBE4E0" stroke="#C2412D" stroke-width="1.1"/>
  <text x="271.0" y="119.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">i = 2</text>
  <rect x="305.0" y="102.0" width="56.0" height="26.0" rx="5" fill="#D5F0E6" stroke="#3F9F80" stroke-width="1.1"/>
  <text x="333.0" y="119.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">i = 4</text>
  <rect x="367.0" y="102.0" width="56.0" height="26.0" rx="5" fill="#D5F0E6" stroke="#3F9F80" stroke-width="1.1"/>
  <text x="395.0" y="119.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">i = 6</text>
  <rect x="429.0" y="102.0" width="56.0" height="26.0" rx="5" fill="#D5F0E6" stroke="#3F9F80" stroke-width="1.1"/>
  <text x="457.0" y="119.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">i = 8</text>
  <rect x="491.0" y="102.0" width="56.0" height="26.0" rx="5" fill="#D5F0E6" stroke="#3F9F80" stroke-width="1.1"/>
  <text x="519.0" y="119.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">i = 10</text>
  <line x1="150.0" y1="160.0" x2="522.0" y2="160.0" stroke="#8A94A3" stroke-width="1.1" marker-end="url(#m-grey)"/>
  <text x="522.0" y="176.0" font-size="11" fill="#8A94A3" text-anchor="end" font-weight="400" xml:space="preserve">time</text>
  <text x="240.0" y="30.0" font-size="11.5" fill="#4F52C4" text-anchor="middle" font-weight="600" xml:space="preserve">y[2] = 2 · 1 + 4 = 6</text>
  <text x="311.0" y="146.0" font-size="11.5" fill="#C2412D" text-anchor="start" font-weight="600" xml:space="preserve">y[2] = 2 · 1 + 6 = 8</text>
  <text x="150.0" y="206.0" font-size="12" fill="#1F2633" text-anchor="start" font-weight="400" xml:space="preserve">With threads = blockDim.x = 2, global threads 0 and 2 start 2 apart</text>
  <text x="150.0" y="224.0" font-size="12" fill="#1F2633" text-anchor="start" font-weight="400" xml:space="preserve">and both visit elements 2, 4, 6, 8 and 10. Each visit adds 2x again:</text>
  <text x="150.0" y="248.0" font-size="13" fill="#C2412D" text-anchor="start" font-weight="700" xml:space="preserve">y[2] = 8 in place of 6</text>
</svg>
