<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 506" width="660" height="506" role="img" aria-label="A chart of the running sum against the number of values added, for 67,108,864 values between 0 and 1. The exact sum rises in a straight line to 33,557,630. The float sum, added 1 by 1, follows it until 16,777,216 and then stays flat.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="506" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A float sum that stops growing</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">67,108,864 values in [0, 1), added 1 by 1 into a float.</text>
  <line x1="110.0" y1="400.0" x2="580.0" y2="400.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="100.0" y="404.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">0M</text>
  <line x1="110.0" y1="341.2" x2="580.0" y2="341.2" stroke="#D5DBE3" stroke-width="1"/>
  <text x="100.0" y="345.2" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">8M</text>
  <line x1="110.0" y1="282.4" x2="580.0" y2="282.4" stroke="#D5DBE3" stroke-width="1"/>
  <text x="100.0" y="286.4" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">16M</text>
  <line x1="110.0" y1="223.5" x2="580.0" y2="223.5" stroke="#D5DBE3" stroke-width="1"/>
  <text x="100.0" y="227.5" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">24M</text>
  <line x1="110.0" y1="164.7" x2="580.0" y2="164.7" stroke="#D5DBE3" stroke-width="1"/>
  <text x="100.0" y="168.7" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">32M</text>
  <text x="110.0" y="420.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0M</text>
  <text x="222.1" y="420.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">16M</text>
  <text x="334.1" y="420.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">32M</text>
  <text x="446.2" y="420.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">48M</text>
  <text x="558.3" y="420.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">64M</text>
  <line x1="110.0" y1="400.0" x2="580.0" y2="153.3" stroke="#2E8B3D" stroke-width="2.6"/>
  <line x1="110.0" y1="400.0" x2="345.0" y2="276.6" stroke="#CF4526" stroke-width="2.6" stroke-dasharray="7 4"/>
  <line x1="345.0" y1="276.6" x2="580.0" y2="276.6" stroke="#CF4526" stroke-width="2.6" stroke-dasharray="7 4"/>
  <rect x="449.8" y="127.25272058823529" width="126.2" height="18" rx="9" fill="#E7F5E9"/>
  <text x="512.9" y="139.9" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">exact: 33,557,630</text>
  <rect x="397.0" y="286.63811764705883" width="179.0" height="18" rx="9" fill="#FCEBE6"/>
  <text x="486.5" y="299.2" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">float, 1 by 1: 16,777,216</text>
  <text x="100.0" y="112.0" class="sub" text-anchor="end" xml:space="preserve">running sum</text>
  <text x="580.0" y="442.0" class="sub" text-anchor="end" xml:space="preserve">values added</text>
  <text x="40.0" y="466.0" class="note" text-anchor="start" xml:space="preserve">Above 2²⁴ a float can hold only even numbers, so adding a value below 1 rounds</text>
  <text x="40.0" y="484.0" class="note" text-anchor="start" xml:space="preserve">back to the same total. The tree on the GPU gave 33,557,632, off by 2.</text>
</svg>
