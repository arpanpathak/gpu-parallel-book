<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 478" width="660" height="478" role="img" aria-label="Two timelines with rows copy in, kernel and copy out. 1 stream, 1 chunk: copy in 4.3 ms, then the kernel 10.4 ms, then copy out 4.3 ms, one after another. 2 streams with 4 chunks: the copy of each chunk overlaps the kernel of the previous chunk and the copy out of the one before, so the rows overlap in a staircase. Measured on a Jetson Orin NX: 22.6 ms against 12.9 ms.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="478" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A pipeline on 2 streams</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Chunks let the copy engines and the SMs work at the same time.</text>
  <text x="150.0" y="118.0" class="sub" text-anchor="start" xml:space="preserve">1 stream, 1 chunk: the 3 stages run one after another</text>
  <text x="136.0" y="148.0" class="sub" text-anchor="end" xml:space="preserve">copy in</text>
  <text x="136.0" y="182.0" class="sub" text-anchor="end" xml:space="preserve">kernel</text>
  <text x="136.0" y="216.0" class="sub" text-anchor="end" xml:space="preserve">copy out</text>
  <rect x="150.0" y="130.0" width="95.3" height="26.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="197.7" y="147.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">4.3 ms</text>
  <rect x="247.3" y="164.0" width="233.4" height="26.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="364.0" y="181.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">10.4 ms</text>
  <rect x="482.7" y="198.0" width="95.3" height="26.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="530.3" y="215.0" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">4.3 ms</text>
  <text x="150.0" y="278.0" class="sub" text-anchor="start" xml:space="preserve">2 streams, 4 chunks: copies of 1 chunk overlap the kernel of another</text>
  <text x="136.0" y="308.0" class="sub" text-anchor="end" xml:space="preserve">copy in</text>
  <text x="136.0" y="342.0" class="sub" text-anchor="end" xml:space="preserve">kernel</text>
  <text x="136.0" y="376.0" class="sub" text-anchor="end" xml:space="preserve">copy out</text>
  <rect x="150.0" y="290.0" width="22.3" height="26.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <rect x="174.3" y="324.0" width="56.8" height="26.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <rect x="233.2" y="358.0" width="22.3" height="26.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <rect x="174.3" y="290.0" width="22.3" height="26.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <rect x="233.2" y="324.0" width="56.8" height="26.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <rect x="292.0" y="358.0" width="22.3" height="26.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <rect x="198.7" y="290.0" width="22.3" height="26.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <rect x="292.0" y="324.0" width="56.8" height="26.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <rect x="350.9" y="358.0" width="22.3" height="26.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <rect x="223.0" y="290.0" width="22.3" height="26.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <rect x="350.9" y="324.0" width="56.8" height="26.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <rect x="409.7" y="358.0" width="22.3" height="26.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <rect x="539.8" y="236" width="60.2" height="18" rx="9" fill="#FCEBE6"/>
  <text x="569.9" y="248.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">22.6 ms</text>
  <rect x="407.8" y="396" width="60.2" height="18" rx="9" fill="#E7F5E9"/>
  <text x="437.9" y="408.6" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">12.9 ms</text>
  <text x="40.0" y="438.0" class="note" text-anchor="start" xml:space="preserve">Measured on a Jetson Orin NX with 8 chunks. The kernel, 10.4 ms, is the longest</text>
  <text x="40.0" y="456.0" class="note" text-anchor="start" xml:space="preserve">stage, so no overlap can bring the total below about 10.4 ms.</text>
</svg>
