<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 530" width="660" height="530" role="img" aria-label="Eight values 3, 1, 4, 1, 5, 9, 2, 6 in shared memory. Stride 4: thread k adds s[k + 4] into s[k], giving 8, 10, 6, 7. Stride 2 gives 14, 17. Stride 1 gives 31. A barrier separates each level from the next.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="530" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A tree sum in shared memory</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each level halves the number of active threads; a barrier separates the levels.</text>
  <text x="116.0" y="142.0" class="sub" text-anchor="end" xml:space="preserve">s[0..7]</text>
  <rect x="130.0" y="120.0" width="46.0" height="34.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="153.0" y="141.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">3</text>
  <rect x="184.0" y="120.0" width="46.0" height="34.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="207.0" y="141.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1</text>
  <rect x="238.0" y="120.0" width="46.0" height="34.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="261.0" y="141.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">4</text>
  <rect x="292.0" y="120.0" width="46.0" height="34.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="315.0" y="141.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1</text>
  <rect x="346.0" y="120.0" width="46.0" height="34.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="369.0" y="141.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">5</text>
  <rect x="400.0" y="120.0" width="46.0" height="34.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="423.0" y="141.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">9</text>
  <rect x="454.0" y="120.0" width="46.0" height="34.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="477.0" y="141.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">2</text>
  <rect x="508.0" y="120.0" width="46.0" height="34.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="531.0" y="141.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">6</text>
  <line x1="124.0" y1="180.0" x2="560.0" y2="180.0" stroke="#CF4526" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="568.0" y="171" width="60.2" height="18" rx="9" fill="#FCEBE6"/>
  <text x="598.1" y="183.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">barrier</text>
  <line x1="153.0" y1="154.0" x2="153.0" y2="208.0" stroke="#3F5873" stroke-width="1.2"/>
  <line x1="369.0" y1="154.0" x2="161.0" y2="208.0" stroke="#3F5873" stroke-width="1.2"/>
  <line x1="207.0" y1="154.0" x2="207.0" y2="208.0" stroke="#3F5873" stroke-width="1.2"/>
  <line x1="423.0" y1="154.0" x2="215.0" y2="208.0" stroke="#3F5873" stroke-width="1.2"/>
  <line x1="261.0" y1="154.0" x2="261.0" y2="208.0" stroke="#3F5873" stroke-width="1.2"/>
  <line x1="477.0" y1="154.0" x2="269.0" y2="208.0" stroke="#3F5873" stroke-width="1.2"/>
  <line x1="315.0" y1="154.0" x2="315.0" y2="208.0" stroke="#3F5873" stroke-width="1.2"/>
  <line x1="531.0" y1="154.0" x2="323.0" y2="208.0" stroke="#3F5873" stroke-width="1.2"/>
  <text x="116.0" y="230.0" class="sub" text-anchor="end" xml:space="preserve">stride 4</text>
  <rect x="130.0" y="208.0" width="46.0" height="34.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="153.0" y="229.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">8</text>
  <rect x="184.0" y="208.0" width="46.0" height="34.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="207.0" y="229.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">10</text>
  <rect x="238.0" y="208.0" width="46.0" height="34.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="261.0" y="229.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">6</text>
  <rect x="292.0" y="208.0" width="46.0" height="34.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="315.0" y="229.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">7</text>
  <line x1="124.0" y1="268.0" x2="560.0" y2="268.0" stroke="#CF4526" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="568.0" y="259" width="60.2" height="18" rx="9" fill="#FCEBE6"/>
  <text x="598.1" y="271.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">barrier</text>
  <line x1="153.0" y1="242.0" x2="153.0" y2="296.0" stroke="#3F5873" stroke-width="1.2"/>
  <line x1="261.0" y1="242.0" x2="161.0" y2="296.0" stroke="#3F5873" stroke-width="1.2"/>
  <line x1="207.0" y1="242.0" x2="207.0" y2="296.0" stroke="#3F5873" stroke-width="1.2"/>
  <line x1="315.0" y1="242.0" x2="215.0" y2="296.0" stroke="#3F5873" stroke-width="1.2"/>
  <text x="116.0" y="318.0" class="sub" text-anchor="end" xml:space="preserve">stride 2</text>
  <rect x="130.0" y="296.0" width="46.0" height="34.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="153.0" y="317.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">14</text>
  <rect x="184.0" y="296.0" width="46.0" height="34.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="207.0" y="317.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">17</text>
  <line x1="124.0" y1="356.0" x2="560.0" y2="356.0" stroke="#CF4526" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="568.0" y="347" width="60.2" height="18" rx="9" fill="#FCEBE6"/>
  <text x="598.1" y="359.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">barrier</text>
  <line x1="153.0" y1="330.0" x2="153.0" y2="384.0" stroke="#3F5873" stroke-width="1.2"/>
  <line x1="207.0" y1="330.0" x2="161.0" y2="384.0" stroke="#3F5873" stroke-width="1.2"/>
  <text x="116.0" y="406.0" class="sub" text-anchor="end" xml:space="preserve">stride 1</text>
  <rect x="130.0" y="384.0" width="46.0" height="34.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="153.0" y="405.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">31</text>
  <text x="130.0" y="448.0" class="note" text-anchor="start" xml:space="preserve">Thread k adds s[k + stride] into s[k]. Without the barrier, it can read</text>
  <text x="130.0" y="466.0" class="note" text-anchor="start" xml:space="preserve">s[k + stride] before the thread that owns it has written its new value.</text>
</svg>
