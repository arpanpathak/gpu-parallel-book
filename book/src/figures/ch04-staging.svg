<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" width="660" height="450" role="img" aria-label="Two rows. A copy from pageable memory makes 2 copies: the CPU copies the pageable array into a pinned staging buffer, then the DMA engine copies the staging buffer to device memory. A copy from pinned memory makes 1: the DMA engine copies the pinned array straight to device memory.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="450" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Why pinned copies are faster</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Pageable data takes a detour through a pinned staging buffer.</text>
  <rect x="16" y="104" width="628" height="128" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="303.3" height="22" rx="11" fill="#1B2430"/>
  <text x="185.7" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">COPY FROM PAGEABLE MEMORY: 2 COPIES</text>
  <rect x="36" y="136" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M48,136.7 H42 V191.3 H48 A11.3,11.3 0 0 1 36.7,180 V148 A11.3,11.3 0 0 1 48,136.7 Z" fill="#B7791F"/>
  <text x="56.0" y="160.0" class="name" text-anchor="start" xml:space="preserve">pageable array</text>
  <text x="56.0" y="178.0" class="sub" text-anchor="start" xml:space="preserve">can be moved</text>
  <rect x="244" y="136" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M256,136.7 H250 V191.3 H256 A11.3,11.3 0 0 1 244.7,180 V148 A11.3,11.3 0 0 1 256,136.7 Z" fill="#7A4FD0"/>
  <text x="264.0" y="160.0" class="name" text-anchor="start" xml:space="preserve">staging buffer</text>
  <text x="264.0" y="178.0" class="sub" text-anchor="start" xml:space="preserve">pinned</text>
  <rect x="452" y="136" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M464,136.7 H458 V191.3 H464 A11.3,11.3 0 0 1 452.7,180 V148 A11.3,11.3 0 0 1 464,136.7 Z" fill="#1F8A70"/>
  <text x="472.0" y="169.0" class="name" text-anchor="start" xml:space="preserve">device memory</text>
  <path class="wire" d="M216,164 L244,164" marker-end="url(#head)"/>
  <path class="wire" d="M424,164 L452,164" marker-end="url(#head)"/>
  <text x="196.0" y="214.0" class="note" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">CPU copies</text>
  <text x="400.0" y="214.0" class="note" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">DMA engine</text>
  <rect x="16" y="268" width="628" height="128" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="257" width="271.8" height="22" rx="11" fill="#1B2430"/>
  <text x="169.9" y="272.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">COPY FROM PINNED MEMORY: 1 COPY</text>
  <rect x="36" y="300" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M48,300.7 H42 V355.3 H48 A11.3,11.3 0 0 1 36.7,344 V312 A11.3,11.3 0 0 1 48,300.7 Z" fill="#7A4FD0"/>
  <text x="56.0" y="324.0" class="name" text-anchor="start" xml:space="preserve">pinned array</text>
  <text x="56.0" y="342.0" class="sub" text-anchor="start" xml:space="preserve">stays in place</text>
  <rect x="452" y="300" width="180" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M464,300.7 H458 V355.3 H464 A11.3,11.3 0 0 1 452.7,344 V312 A11.3,11.3 0 0 1 464,300.7 Z" fill="#1F8A70"/>
  <text x="472.0" y="333.0" class="name" text-anchor="start" xml:space="preserve">device memory</text>
  <path class="wire" d="M216,328 L452,328" marker-end="url(#head)"/>
  <rect x="294.0" y="319.0" width="80.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="334.0" y="331.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">DMA engine</text>
  <text x="16.0" y="428.0" class="note" text-anchor="start" xml:space="preserve">The DMA engine copies by physical address, so it needs pages that cannot move.</text>
</svg>
