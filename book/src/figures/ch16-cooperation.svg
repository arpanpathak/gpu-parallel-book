  <path d="M138.0,162.0 L138.0,190.0" fill="none" stroke="#1F8A70" stroke-width="1.6" stroke-linecap="round" marker-end="url(#tip-mint)"/>
  <circle cx="192" cy="148" r="12" fill="#FFFFFF" stroke="#5B6BD6" stroke-width="1.4"/>
  <path d="M192.0,162.0 L192.0,190.0" fill="none" stroke="#1F8A70" stroke-width="1.6" stroke-linecap="round" marker-end="url(#tip-mint)"/>
  <circle cx="246" cy="148" r="12" fill="#FFFFFF" stroke="#5B6BD6" stroke-width="1.4"/>
  <path d="M246.0,162.0 L246.0,190.0" fill="none" stroke="#1F8A70" stroke-width="1.6" stroke-linecap="round" marker-end="url(#tip-mint)"/>
  <rect x="62.0" y="194.0" width="206.0" height="30.0" rx="8" fill="#C9EBDD" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="165.0" y="214.0" text-anchor="middle" font-size="11.5" font-weight="650" style="fill:#1F8A70" xml:space="preserve">shared memory of the block</text>
  <path d="M62,246 H268" stroke="#1B2430" stroke-width="2.2"/>
  <text x="165.0" y="262.0" text-anchor="middle" font-size="10.5" style="fill:#1B2430" xml:space="preserve">barrier: all 4 threads of the block</text>
  <rect x="370.0" y="98.0" width="250.0" height="176.0" rx="14" fill="#D7F0E6" stroke="#1F8A70" stroke-width="1.4"/>
  <text x="495.0" y="120.0" text-anchor="middle" font-size="13" font-weight="650" style="fill:#1B2430" xml:space="preserve">block 1</text>
  <circle cx="414" cy="148" r="12" fill="#FFFFFF" stroke="#1F8A70" stroke-width="1.4"/>
  <path d="M414.0,162.0 L414.0,190.0" fill="none" stroke="#1F8A70" stroke-width="1.6" stroke-linecap="round" marker-end="url(#tip-mint)"/>
  <circle cx="468" cy="148" r="12" fill="#FFFFFF" stroke="#1F8A70" stroke-width="1.4"/>
  <path d="M468.0,162.0 L468.0,190.0" fill="none" stroke="#1F8A70" stroke-width="1.6" stroke-linecap="round" marker-end="url(#tip-mint)"/>
  <circle cx="522" cy="148" r="12" fill="#FFFFFF" stroke="#1F8A70" stroke-width="1.4"/>
  <path d="M522.0,162.0 L522.0,190.0" fill="none" stroke="#1F8A70" stroke-width="1.6" stroke-linecap="round" marker-end="url(#tip-mint)"/>
  <circle cx="576" cy="148" r="12" fill="#FFFFFF" stroke="#1F8A70" stroke-width="1.4"/>
  <path d="M576.0,162.0 L576.0,190.0" fill="none" stroke="#1F8A70" stroke-width="1.6" stroke-linecap="round" marker-end="url(#tip-mint)"/>
  <rect x="392.0" y="194.0" width="206.0" height="30.0" rx="8" fill="#C9EBDD" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="495.0" y="214.0" text-anchor="middle" font-size="11.5" font-weight="650" style="fill:#1F8A70" xml:space="preserve">shared memory of the block</text>
  <path d="M392,246 H598" stroke="#1B2430" stroke-width="2.2"/>
  <text x="495.0" y="262.0" text-anchor="middle" font-size="10.5" style="fill:#1B2430" xml:space="preserve">barrier: all 4 threads of the block</text>
  <path d="M292,186 H368" stroke="#CF4526" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="330.0" y="178.0" text-anchor="middle" font-size="18" font-weight="650" style="fill:#CF4526" xml:space="preserve">×</text>
  <rect x="40.0" y="304.0" width="580.0" height="40.0" rx="10" fill="#ECEEF2" stroke="#C9CED6" stroke-width="1.3"/>
  <text x="330.0" y="329.0" text-anchor="middle" font-size="12" style="fill:#1B2430" xml:space="preserve">global memory: the only memory that threads of different blocks share</text>
  <path d="M165.0,276.0 L165.0,302.0" fill="none" stroke="#3F5873" stroke-width="1.6" stroke-linecap="round" marker-end="url(#tip-ink)"/>
  <path d="M495.0,276.0 L495.0,302.0" fill="none" stroke="#3F5873" stroke-width="1.6" stroke-linecap="round" marker-end="url(#tip-ink)"/>
</svg>
