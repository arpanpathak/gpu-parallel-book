<rect x="20" y="210" width="720" height="96" rx="8" fill="#eef3f7" stroke="#1d2733" stroke-width="1.1"/>
<text x="40" y="238" font-size="15.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve" font-weight="bold">i = block × 8 + thread</text>
<text x="40" y="264" font-size="13.0" fill="#1d2733" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">block 2, thread 3:   i = 2 × 8 + 3 = 19   → adds a[19] + b[19]</text>
<text x="40" y="290" font-size="13.0" fill="#d9622b" text-anchor="start" font-family="Menlo, monospace" xml:space="preserve">block 2, thread 4:   i = 2 × 8 + 4 = 20   → 20 ≥ N, so it does nothing</text>
