<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 456" width="680" height="456" role="img" aria-label="Speedup against the number of processors, both on logarithmic scales from 1 to 1,024. Five curves, for serial shares 0.001, 0.01, 0.05, 0.10 and 0.23, rise and then flatten at their limits of 1,000, 100, 20, 10 and 4.3. The thick f = 0.23 curve has points at 2, 4 and 8 processors, the last at a speedup of 3.06, under a dashed line at 4.3.">
