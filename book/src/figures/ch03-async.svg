<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 322" width="660" height="322" role="img" aria-label="Two timelines. Host: copy in, a short launch, other host work, a dashed wait in cudaDeviceSynchronize, copy out. Device: copy in, then the kernel runs, starting just after the launch and ending when the host&#x27;s wait ends, then copy out. The launch returns at once; the host waits only in cudaDeviceSynchronize, where errors inside the kernel are reported.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="322" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A launch is asynchronous</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The host carries on while the GPU runs the kernel.</text>
  <text x="136.0" y="136.0" class="name" text-anchor="end" xml:space="preserve">host</text>
  <text x="136.0" y="214.0" class="name" text-anchor="end" xml:space="preserve">device</text>
  <rect x="150.0" y="116.0" width="90.0" height="30.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="195.0" y="135.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">copy in</text>
  <rect x="246.0" y="116.0" width="50.0" height="30.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="271.0" y="135.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">launch</text>
  <rect x="302.0" y="116.0" width="130.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="367.0" y="135.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">other host work</text>
  <rect x="438.0" y="116.0" width="100.0" height="30.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="488.0" y="135.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">synchronize</text>
  <rect x="544.0" y="116.0" width="80.0" height="30.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="584.0" y="135.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">copy out</text>
  <rect x="150.0" y="194.0" width="90.0" height="30.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="195.0" y="213.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">copy in</text>
  <rect x="254.0" y="194.0" width="284.0" height="30.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="396.0" y="213.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">kernel runs on the GPU</text>
  <rect x="544.0" y="194.0" width="80.0" height="30.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="584.0" y="213.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">copy out</text>
  <path class="wire" d="M271,146 L271,194" marker-end="url(#head)"/>
  <text x="150.0" y="262.0" class="note" text-anchor="start" xml:space="preserve">The launch returns at once, before the kernel has run.</text>
  <text x="150.0" y="280.0" class="note" text-anchor="start" xml:space="preserve">cudaDeviceSynchronize waits until the kernel finishes, and</text>
  <text x="150.0" y="298.0" class="note" text-anchor="start" xml:space="preserve">reports any error that happened inside it.</text>
  <text x="450.0" y="106.0" class="note" text-anchor="start" style="fill:#CF4526" xml:space="preserve">host waits</text>
</svg>
