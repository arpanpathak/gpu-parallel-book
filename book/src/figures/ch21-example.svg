<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" role="img" aria-label="The 8 values 3, 1, 7, 0, 4, 1, 6, 3 with their inclusive scan 3, 4, 11, 11, 15, 16, 22, 25 and their exclusive scan 0, 3, 4, 11, 11, 15, 16, 22. Entry 4 is highlighted: 15 inclusive, the sum of x0 to x4, and 11 exclusive, the sum of x0 to x3.">
