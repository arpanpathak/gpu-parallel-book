<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 292" width="660" height="292" role="img" aria-label="Two rows of a timeline. Copy row: copy 0, copy 1, copy 2, copy 3. Compute row, shifted by 1 step: kernel 0 runs while copy 1 happens, kernel 1 while copy 2, and so on.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="292" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Double buffering</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Copies of the next chunk overlap the kernel on the current chunk.</text>
  <text x="136.0" y="136.0" class="name" text-anchor="end" xml:space="preserve">copy</text>
  <text x="136.0" y="196.0" class="name" text-anchor="end" xml:space="preserve">compute</text>
  <rect x="150.0" y="116.0" width="92.0" height="30.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="196.0" y="135.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">copy 0</text>
  <rect x="248.0" y="176.0" width="92.0" height="30.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="294.0" y="195.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">kernel 0</text>
  <rect x="248.0" y="116.0" width="92.0" height="30.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="294.0" y="135.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">copy 1</text>
  <rect x="346.0" y="176.0" width="92.0" height="30.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="392.0" y="195.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">kernel 1</text>
  <rect x="346.0" y="116.0" width="92.0" height="30.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="392.0" y="135.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">copy 2</text>
  <rect x="444.0" y="176.0" width="92.0" height="30.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="490.0" y="195.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">kernel 2</text>
  <rect x="444.0" y="116.0" width="92.0" height="30.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="490.0" y="135.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">copy 3</text>
  <rect x="542.0" y="176.0" width="92.0" height="30.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="588.0" y="195.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">kernel 3</text>
  <text x="150.0" y="252.0" class="note" text-anchor="start" xml:space="preserve">While kernel k runs, chunk k + 1 is already being copied, so after the</text>
  <text x="150.0" y="270.0" class="note" text-anchor="start" xml:space="preserve">first copy the copies cost no extra time. Chapter 6 builds this.</text>
</svg>
