<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 524" width="660" height="524" role="img" aria-label="2 timelines of 1 burst, 0 to 128 microseconds. Depth 1: the host submits and waits for 64 microseconds while the device runs 32 entries of 2 microseconds, then the host does 64 microseconds of its own work while the device is idle: 128 microseconds per burst. Depth 32: the host writes all 32 entries at once and does its own work while the device runs them: 64 microseconds per burst. 200 bursts predict 25.6 ms against 12.8 ms; measured 28.7 to 30.9 ms and 13.5 to 13.7 ms.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="524" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Why a deep ring lets the host run ahead</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">1 burst of the chapter&#x27;s work queue, drawn to scale.</text>
  <rect x="16" y="104" width="628" height="150" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="232.5" height="22" rx="11" fill="#1B2430"/>
  <text x="150.3" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">DEPTH 1: 1 ENTRY AT A TIME</text>
  <rect x="16" y="284" width="628" height="150" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="273" width="224.6" height="22" rx="11" fill="#1B2430"/>
  <text x="146.3" y="288.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">DEPTH 32: THE WHOLE BURST</text>
  <text x="28.0" y="153.0" class="sub" text-anchor="start" xml:space="preserve">host</text>
  <text x="28.0" y="193.0" class="sub" text-anchor="start" xml:space="preserve">device</text>
  <rect x="120.0" y="136" width="217.6" height="26" rx="5" fill="#FFFFFF" stroke="#7F8EA0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="228.8" y="153.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">submit, wait, submit, wait</text>
  <rect x="337.6" y="136" width="217.6" height="26" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="446.4" y="153.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">own work 64 µs</text>
  <rect x="120.0" y="176" width="217.6" height="26" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="228.8" y="193.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">32 entries × 2 µs</text>
  <rect x="337.6" y="176" width="217.6" height="26" rx="5" fill="#FFFFFF" stroke="#7F8EA0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="446.4" y="193.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">idle</text>
  <rect x="435.2" y="212" width="119.6" height="18" rx="9" fill="#FCEBE6"/>
  <text x="495.0" y="224.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">128 µs per burst</text>
  <text x="28.0" y="333.0" class="sub" text-anchor="start" xml:space="preserve">host</text>
  <text x="28.0" y="373.0" class="sub" text-anchor="start" xml:space="preserve">device</text>
  <rect x="120.0" y="316" width="6.8" height="26" rx="5" fill="#FFFFFF" stroke="#7F8EA0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="126.8" y="316" width="217.6" height="26" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="235.6" y="333.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">own work 64 µs</text>
  <rect x="120.0" y="356" width="217.6" height="26" rx="5" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="228.8" y="373.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">32 entries × 2 µs</text>
  <rect x="354.4" y="392" width="113.0" height="18" rx="9" fill="#E7F5E9"/>
  <text x="410.9" y="404.6" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">64 µs per burst</text>
  <text x="120.0" y="266.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <text x="337.6" y="266.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">64 µs</text>
  <text x="555.2" y="266.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">128 µs</text>
  <text x="16.0" y="466.0" class="note" text-anchor="start" xml:space="preserve">200 bursts: depth 1 predicts 200 × 128 µs = 25.6 ms (measured 28.7 to 30.9 ms), depth 32</text>
  <text x="16.0" y="484.0" class="note" text-anchor="start" xml:space="preserve">predicts 200 × 64 µs = 12.8 ms (measured 13.5 to 13.7 ms). A deep ring lets the host leave</text>
  <text x="16.0" y="502.0" class="note" text-anchor="start" xml:space="preserve">the work queued and go on; the GPU&#x27;s own command rings exist for the same reason.</text>
</svg>
