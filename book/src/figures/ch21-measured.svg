<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 458" width="660" height="458" role="img" aria-label="Bars of measured time for compacting 16,777,216 floats. 10 % kept: 3 passes 10.08 ms, warp votes 2.27 ms. 50 % kept: 9.35 ms and 2.49 ms. 90 % kept: 9.59 ms and 2.57 ms.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="458" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Measured compaction time</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Warp votes take about 1/4 of the time of 3 passes.</text>
  <text x="32.0" y="132.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">10 % kept</text>
  <rect x="150.0" y="112.0" width="322.6" height="26.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="478.6" y="130.0" class="mono" text-anchor="start" xml:space="preserve">10.08 ms  3 passes</text>
  <rect x="150.0" y="146.0" width="72.6" height="26.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="228.6" y="164.0" class="mono" text-anchor="start" xml:space="preserve">2.27 ms  warp votes</text>
  <text x="32.0" y="228.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">50 % kept</text>
  <rect x="150.0" y="208.0" width="299.2" height="26.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="455.2" y="226.0" class="mono" text-anchor="start" xml:space="preserve">9.35 ms  3 passes</text>
  <rect x="150.0" y="242.0" width="79.7" height="26.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="235.7" y="260.0" class="mono" text-anchor="start" xml:space="preserve">2.49 ms  warp votes</text>
  <text x="32.0" y="324.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">90 % kept</text>
  <rect x="150.0" y="304.0" width="306.9" height="26.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="462.9" y="322.0" class="mono" text-anchor="start" xml:space="preserve">9.59 ms  3 passes</text>
  <rect x="150.0" y="338.0" width="82.2" height="26.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="238.2" y="356.0" class="mono" text-anchor="start" xml:space="preserve">2.57 ms  warp votes</text>
  <text x="32.0" y="418.0" class="note" text-anchor="start" xml:space="preserve">16,777,216 floats, average of 20 runs. At 50 % kept the ratio is 9.35 / 2.49 = 3.8,</text>
  <text x="32.0" y="436.0" class="note" text-anchor="start" xml:space="preserve">the ratio of the bytes moved, 38 / 10 = 3.8: both versions run at the memory rate.</text>
</svg>
