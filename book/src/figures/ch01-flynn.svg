<text x="669.0" y="317.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">t</text>
<rect x="690" y="302" width="30" height="24" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="705.0" y="317.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">t</text>
<rect x="726" y="302" width="30" height="24" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="741.0" y="317.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">t</text>
<rect x="474" y="332" width="30" height="24" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4"/>
<text x="489.0" y="347.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">if</text>
<rect x="510" y="332" width="30" height="24" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4"/>
<text x="525.0" y="347.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">if</text>
<rect x="546" y="332" width="30" height="24" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4"/>
<text x="561.0" y="347.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">if</text>
<rect x="582" y="332" width="30" height="24" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4"/>
<text x="597.0" y="347.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">if</text>
<rect x="618" y="332" width="30" height="24" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4"/>
<text x="633.0" y="347.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">if</text>
<rect x="654" y="332" width="30" height="24" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4"/>
<text x="669.0" y="347.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">if</text>
<rect x="690" y="332" width="30" height="24" rx="4" fill="#f1f3f5" stroke="#1d2733" stroke-width="1.4"/>
