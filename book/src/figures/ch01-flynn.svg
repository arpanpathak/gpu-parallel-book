<text x="561.0" y="317.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">t</text>
<rect x="582" y="302" width="30" height="24" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="597.0" y="317.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">t</text>
<rect x="618" y="302" width="30" height="24" rx="4" fill="#e3f1ea" stroke="#1d2733" stroke-width="1.4"/>
<text x="633.0" y="317.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">t</text>
