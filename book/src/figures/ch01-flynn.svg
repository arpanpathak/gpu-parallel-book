<text x="741.0" y="347.24" font-size="9.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">if</text>
<text x="474" y="372" font-size="12.0" fill="#6b7a89" text-anchor="start" >one instruction is sent to the whole group</text>
<text x="474" y="390" font-size="12.0" fill="#6b7a89" text-anchor="start" >a branch runs the two sides in turn</text>
<text x="474" y="412" font-size="12.0" fill="8a6a1f" text-anchor="start"  font-weight="bold">together, then split</text>
<text x="20" y="448" font-size="12.0" fill="#6b7a89" text-anchor="start" >SIMT looks like SIMD while the threads agree, and like MIMD when they branch (Chapter 5).</text>
</svg>
