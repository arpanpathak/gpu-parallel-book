<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 592" width="660" height="592" role="img" aria-label="Horizontal bars of SGEMM speed for N = 4,096 as a share of each board&#x27;s FP32 peak. Orin NX, peak 2,400 GFLOP/s: by column 34, by row 186, tiles of 16 274, tiles of 32 222, 4 by 4 per thread 901, 4 by 4 with the best launch bounds 932, cuBLAS 1,495 GFLOP/s. Thor, peak 8,100: 116, 596, 950, 783, 3,222, 3,264 and 6,177 GFLOP/s.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="592" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Every stage, measured on 2 boards</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">GFLOP/s as a share of each board&#x27;s FP32 peak.</text>
  <rect x="176" y="94" width="14" height="14" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="197.0" y="105.5" class="note" text-anchor="start" xml:space="preserve">Jetson Orin NX, peak 2,400 GFLOP/s</text>
  <rect x="436" y="94" width="14" height="14" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="457.0" y="105.5" class="note" text-anchor="start" xml:space="preserve">Jetson AGX Thor, peak 8,100</text>
  <line x1="176.0" y1="132.0" x2="176.0" y2="510.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="176.0" y="528.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0%</text>
  <line x1="266.0" y1="132.0" x2="266.0" y2="510.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="266.0" y="528.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">25%</text>
  <line x1="356.0" y1="132.0" x2="356.0" y2="510.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="356.0" y="528.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">50%</text>
  <line x1="446.0" y1="132.0" x2="446.0" y2="510.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="446.0" y="528.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">75%</text>
  <line x1="536.0" y1="132.0" x2="536.0" y2="510.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="536.0" y="528.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">100%</text>
  <text x="162.0" y="164.0" class="sub" text-anchor="end" xml:space="preserve">by column</text>
  <rect x="176" y="140" width="5.1" height="16" rx="4" fill="#2F6FDB"/>
  <text x="189.1" y="152.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">34 GFLOP/s</text>
  <rect x="176" y="160" width="5.2" height="16" rx="4" fill="#7A4FD0"/>
  <text x="189.2" y="172.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">116 GFLOP/s</text>
  <text x="162.0" y="218.0" class="sub" text-anchor="end" xml:space="preserve">by row</text>
  <rect x="176" y="194" width="27.9" height="16" rx="4" fill="#2F6FDB"/>
  <text x="211.9" y="206.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">186 GFLOP/s</text>
  <rect x="176" y="214" width="26.5" height="16" rx="4" fill="#7A4FD0"/>
  <text x="210.5" y="226.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">596 GFLOP/s</text>
  <text x="162.0" y="272.0" class="sub" text-anchor="end" xml:space="preserve">tiles 16 × 16</text>
  <rect x="176" y="248" width="41.1" height="16" rx="4" fill="#2F6FDB"/>
  <text x="225.1" y="260.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">274 GFLOP/s</text>
  <rect x="176" y="268" width="42.2" height="16" rx="4" fill="#7A4FD0"/>
  <text x="226.2" y="280.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">950 GFLOP/s</text>
  <text x="162.0" y="326.0" class="sub" text-anchor="end" xml:space="preserve">tiles 32 × 32</text>
  <rect x="176" y="302" width="33.3" height="16" rx="4" fill="#2F6FDB"/>
  <text x="217.3" y="314.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">222 GFLOP/s</text>
  <rect x="176" y="322" width="34.8" height="16" rx="4" fill="#7A4FD0"/>
  <text x="218.8" y="334.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">783 GFLOP/s</text>
  <text x="162.0" y="380.0" class="sub" text-anchor="end" xml:space="preserve">4 × 4 per thread</text>
  <rect x="176" y="356" width="135.2" height="16" rx="4" fill="#2F6FDB"/>
  <text x="319.2" y="368.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">901 GFLOP/s</text>
  <rect x="176" y="376" width="143.2" height="16" rx="4" fill="#7A4FD0"/>
  <text x="327.2" y="388.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">3,222 GFLOP/s</text>
  <text x="162.0" y="434.0" class="sub" text-anchor="end" xml:space="preserve">4 × 4, best bounds</text>
  <rect x="176" y="410" width="139.8" height="16" rx="4" fill="#2F6FDB"/>
  <text x="323.8" y="422.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">932 GFLOP/s</text>
  <rect x="176" y="430" width="145.1" height="16" rx="4" fill="#7A4FD0"/>
  <text x="329.1" y="442.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">3,264 GFLOP/s</text>
  <text x="162.0" y="488.0" class="sub" text-anchor="end" xml:space="preserve">cuBLAS</text>
  <rect x="176" y="464" width="224.3" height="16" rx="4" fill="#2F6FDB"/>
  <text x="408.3" y="476.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">1,495 GFLOP/s</text>
  <rect x="176" y="484" width="274.5" height="16" rx="4" fill="#7A4FD0"/>
  <text x="458.5" y="496.5" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">6,176 GFLOP/s</text>
  <text x="162.0" y="528.0" class="sub" text-anchor="end" xml:space="preserve">of FP32 peak</text>
  <text x="40.0" y="552.0" class="note" text-anchor="start" xml:space="preserve">N = 4,096. Each bar is the measured speed as a share of its board&#x27;s FP32 peak. The</text>
  <text x="40.0" y="570.0" class="note" text-anchor="start" xml:space="preserve">best kernel of the chapter reached 39% and 40% of peak, cuBLAS 62% and 76%.</text>
</svg>
