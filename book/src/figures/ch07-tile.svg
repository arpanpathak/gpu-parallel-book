  <text x="16.0" y="372.0" class="note" text-anchor="start" xml:space="preserve">Global memory sees only rows, so both the read and the write are coalesced. The column</text>
  <text x="16.0" y="390.0" class="note" text-anchor="start" xml:space="preserve">access happens in shared memory, which has no sectors to waste; it has banks (figure 7.5).</text>
