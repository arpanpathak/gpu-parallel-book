<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" width="660" height="500" role="img" aria-label="Horizontal bars on a logarithmic time axis from 0.01 ms to 100 ms, measured on a Jetson Orin NX: compile to cubin 52 ms; load PTX with a cache miss 32 ms; 1 run of the generic kernel 2.61 ms; 1 run of the specialised kernel 1.84 ms; load PTX with a cache hit 0.77 ms; load cubin 0.05 ms. Below, a card: each run saves 0.77 ms, compiling costs 52 ms, so it pays back after 68 runs.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="500" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Where the milliseconds go</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Compiling costs as much as 20 to 30 runs of the kernel itself.</text>
  <line x1="230.0" y1="104.0" x2="230.0" y2="352.0" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="230.0" y="370.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0.01 ms</text>
  <line x1="325.0" y1="104.0" x2="325.0" y2="352.0" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="325.0" y="370.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0.1 ms</text>
  <line x1="420.0" y1="104.0" x2="420.0" y2="352.0" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="420.0" y="370.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">1 ms</text>
  <line x1="515.0" y1="104.0" x2="515.0" y2="352.0" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="515.0" y="370.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">10 ms</text>
  <line x1="610.0" y1="104.0" x2="610.0" y2="352.0" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="610.0" y="370.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">100 ms</text>
  <text x="24.0" y="129.0" class="note" text-anchor="start" xml:space="preserve">compile to cubin</text>
  <rect x="230" y="112" width="353.0" height="24" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="591.0" y="129.0" class="mono" text-anchor="start" style="fill:#7A4FD0" xml:space="preserve">52 ms</text>
  <text x="24.0" y="169.0" class="note" text-anchor="start" xml:space="preserve">load PTX, cache miss</text>
  <rect x="230" y="152" width="333.0" height="24" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="571.0" y="169.0" class="mono" text-anchor="start" style="fill:#CF4526" xml:space="preserve">32 ms</text>
  <text x="24.0" y="209.0" class="note" text-anchor="start" xml:space="preserve">generic kernel, 1 run</text>
  <rect x="230" y="192" width="229.6" height="24" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="467.6" y="209.0" class="mono" text-anchor="start" style="fill:#2F6FDB" xml:space="preserve">2.61 ms</text>
  <text x="24.0" y="249.0" class="note" text-anchor="start" xml:space="preserve">specialised kernel, 1 run</text>
  <rect x="230" y="232" width="215.2" height="24" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="453.2" y="249.0" class="mono" text-anchor="start" style="fill:#2E8B3D" xml:space="preserve">1.84 ms</text>
  <text x="24.0" y="289.0" class="note" text-anchor="start" xml:space="preserve">load PTX, cache hit</text>
  <rect x="230" y="272" width="179.2" height="24" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="417.2" y="289.0" class="mono" text-anchor="start" style="fill:#B7791F" xml:space="preserve">0.77 ms</text>
  <text x="24.0" y="329.0" class="note" text-anchor="start" xml:space="preserve">load cubin</text>
  <rect x="230" y="312" width="66.4" height="24" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="304.4" y="329.0" class="mono" text-anchor="start" style="fill:#1F8A70" xml:space="preserve">0.05 ms</text>
  <rect x="24" y="396" width="612" height="84" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M36,396.7 H30 V479.3 H36 A11.3,11.3 0 0 1 24.7,468 V408 A11.3,11.3 0 0 1 36,396.7 Z" fill="#2E8B3D"/>
  <text x="44.0" y="416.0" class="name" text-anchor="start" xml:space="preserve">when compiling pays back</text>
  <text x="44.0" y="434.0" class="sub" text-anchor="start" xml:space="preserve">each run saves 2.61 − 1.84 = 0.77 ms</text>
  <text x="44.0" y="452.0" class="sub" text-anchor="start" xml:space="preserve">compiling and loading cost 52 ms</text>
  <text x="44.0" y="470.0" class="sub" text-anchor="start" xml:space="preserve">52 ms ÷ 0.77 ms = 68 runs to break even</text>
</svg>
