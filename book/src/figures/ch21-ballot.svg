<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 444" width="660" height="444" role="img" aria-label="8 lanes with keep flags 0, 1, 1, 0, 1, 0, 0, 1. The ballot is the same 8 bits. For lane 4 the mask of lanes below is 1 for lanes 0 to 3; the votes and the mask give 0, 1, 1, 0, whose popcount 2 is the rank of lane 4 among the kept lanes.">
