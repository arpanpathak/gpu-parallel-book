<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 476" width="660" height="476" role="img" aria-label="8 lanes holding 3, 1, 7, 0, 4, 1, 6, 3. The ballot of x &gt;= 3 is 1, 0, 1, 0, 1, 0, 1, 1. The mask of the lanes below lane 4 is 1, 1, 1, 1, 0, 0, 0, 0; their combination 1, 0, 1, 0, 0, 0, 0, 0 has 2 bits, so lane 4 writes at position 2. The ballot has 5 bits: 5 values are kept.">
