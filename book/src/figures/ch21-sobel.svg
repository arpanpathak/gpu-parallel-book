  <text x="40.0" y="252.0" class="mono" text-anchor="start" xml:space="preserve">gx = (60 + 2 x 60 + 60) - (20 + 2 x 20 + 20) = 240 - 80 = 160</text>
  <text x="40.0" y="276.0" class="mono" text-anchor="start" xml:space="preserve">gy = (20 + 2 x 30 + 60) - (20 + 2 x 20 + 60) = 140 - 120 = 20</text>
  <text x="40.0" y="300.0" class="mono" text-anchor="start" xml:space="preserve">magnitude = sqrt(160 x 160 + 20 x 20) = sqrt(26,000) = 161.2</text>
  <text x="40.0" y="324.0" class="mono" text-anchor="start" xml:space="preserve">edge pixel = round(161.2) = 161, clamped to 255</text>
