<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" role="img" aria-label="3 rows, steps 1 to 3. Step 1 reads buffer a and writes buffer b; between steps, swap(&amp;mut a, &amp;mut b) exchanges the names; step 2 reads b and writes a; step 3 reads a and writes b. A note says that the swap exchanges the 2 handles and moves no grid data.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="640" height="410" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Ping-pong buffers</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each step reads 1 buffer and writes the other; the 2 names swap between steps.</text>
  <text x="40.0" y="140.0" class="name" text-anchor="start" xml:space="preserve">step 1</text>
  <rect x="150.0" y="110.0" width="140.0" height="50.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
  <text x="220.0" y="139.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">a: read</text>
  <rect x="420.0" y="110.0" width="140.0" height="50.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.6"/>
  <text x="490.0" y="139.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">b: written</text>
  <path class="wire" d="M290,135 L418,135" marker-end="url(#head)"/>
  <rect x="327.2" y="126.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="354.0" y="138.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">jacobi</text>
  <text x="355.0" y="180.0" class="note" text-anchor="middle" xml:space="preserve">swap(&amp;mut a, &amp;mut b)</text>
  <text x="40.0" y="222.0" class="name" text-anchor="start" xml:space="preserve">step 2</text>
  <rect x="150.0" y="192.0" width="140.0" height="50.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
  <text x="220.0" y="221.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">b: read</text>
  <rect x="420.0" y="192.0" width="140.0" height="50.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.6"/>
  <text x="490.0" y="221.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">a: written</text>
  <path class="wire" d="M290,217 L418,217" marker-end="url(#head)"/>
  <rect x="327.2" y="208.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="354.0" y="220.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">jacobi</text>
  <text x="355.0" y="262.0" class="note" text-anchor="middle" xml:space="preserve">swap(&amp;mut a, &amp;mut b)</text>
  <text x="40.0" y="304.0" class="name" text-anchor="start" xml:space="preserve">step 3</text>
  <rect x="150.0" y="274.0" width="140.0" height="50.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
  <text x="220.0" y="303.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">a: read</text>
  <rect x="420.0" y="274.0" width="140.0" height="50.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.6"/>
  <text x="490.0" y="303.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">b: written</text>
  <path class="wire" d="M290,299 L418,299" marker-end="url(#head)"/>
  <rect x="327.2" y="290.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="354.0" y="302.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">jacobi</text>
  <text x="40.0" y="372.0" class="note" text-anchor="start" xml:space="preserve">std::mem::swap exchanges the 2 DeviceBuffer handles, 40 bytes each: a device address, 2 sizes, 2 pointers.</text>
  <text x="40.0" y="390.0" class="note" text-anchor="start" xml:space="preserve">No grid data moves. After an even number of steps the newest grid is in a again.</text>
</svg>
