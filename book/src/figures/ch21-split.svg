<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 444" width="660" height="444" role="img" aria-label="Keys 5, 2, 7, 0, 3, 6, 1, 4. Flags for bit 0 equal to 0: 0, 1, 0, 1, 0, 1, 0, 1. Inclusive scan 0, 1, 1, 2, 2, 3, 3, 4, so 4 keys have a zero bit. Positions 4, 0, 5, 1, 6, 2, 7, 3. Output 2, 0, 6, 4, 5, 7, 3, 1: even keys first, odd keys after, each group in input order.">
