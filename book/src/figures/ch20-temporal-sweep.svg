  <line x1="90.0" y1="134.0" x2="560.0" y2="134.0" stroke="#D5DBE3" stroke-width="0.8"/>
  <text x="82.0" y="138.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">80</text>
