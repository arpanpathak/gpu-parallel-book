<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 458" width="660" height="458" role="img" aria-label="3 cards. 1: every index is less than 256; shared memory is not bounds-checked, and the launch contract fixes x and y below 16. 2: each slot has 1 writer per step, because y times 16 plus x differs for every thread. 3: no slot is read while it is written, which the 2 calls of sync_threads ensure.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="458" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">What the unsafe block promises</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">3 obligations that the compiler cannot check.</text>
  <rect x="24" y="112" width="612" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M36,112.7 H30 V185.3 H36 A11.3,11.3 0 0 1 24.7,174 V124 A11.3,11.3 0 0 1 36,112.7 Z" fill="#2F6FDB"/>
  <text x="44.0" y="145.0" class="name" text-anchor="start" xml:space="preserve">1. Every index is less than 256</text>
  <text x="44.0" y="163.0" class="sub" text-anchor="start" xml:space="preserve">no bounds check on shared memory: the launch contract fixes x, y &lt; 16</text>
  <rect x="24" y="202" width="612" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M36,202.7 H30 V275.3 H36 A11.3,11.3 0 0 1 24.7,264 V214 A11.3,11.3 0 0 1 36,202.7 Z" fill="#7A4FD0"/>
  <text x="44.0" y="235.0" class="name" text-anchor="start" xml:space="preserve">2. Each slot has 1 writer per step</text>
  <text x="44.0" y="253.0" class="sub" text-anchor="start" xml:space="preserve">slot y × 16 + x is different for every thread (figure 17.2)</text>
  <rect x="24" y="292" width="612" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M36,292.7 H30 V365.3 H36 A11.3,11.3 0 0 1 24.7,354 V304 A11.3,11.3 0 0 1 36,292.7 Z" fill="#CF4526"/>
  <text x="44.0" y="325.0" class="name" text-anchor="start" xml:space="preserve">3. No slot is read while it is written</text>
  <text x="44.0" y="343.0" class="sub" text-anchor="start" xml:space="preserve">thread::sync_threads() before the reads and after them</text>
  <text x="24.0" y="400.0" class="note" text-anchor="start" xml:space="preserve">The compiler cannot check any of the 3: a static mut is shared by every thread of a</text>
  <text x="24.0" y="418.0" class="note" text-anchor="start" xml:space="preserve">block, and the barriers are invisible to Rust&#x27;s type system. The SAFETY comments in</text>
  <text x="24.0" y="436.0" class="note" text-anchor="start" xml:space="preserve">the kernel record which of the 3 each unsafe block relies on.</text>
</svg>
