<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" width="640" height="424" role="img" aria-label="A processor card, which adds two numbers in 4 cycles, is wired to a main memory store, which takes 500 cycles per read. Below, the processor adds four rows of the vector one after another: each row is a long grey bar, waiting 500 cycles for a[i] and b[i], and a thin red bar, the 4-cycle add. The four rows take 2,016 cycles and the adder is busy for 16 of them. A sleepy bee sits beside the result.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="640" height="424" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">One processor adds 4 rows</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each row waits about 500 cycles for memory, then adds for 4.</text>
  <rect x="40" y="96" width="230" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,96.7 H46 V159.3 H52 A11.3,11.3 0 0 1 40.7,148 V108 A11.3,11.3 0 0 1 52,96.7 Z" fill="#2F6FDB"/>
  <rect x="56" y="112.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(62.0,118.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="98.0" y="115.0" class="name" text-anchor="start" xml:space="preserve">processor</text>
  <text x="98.0" y="133.0" class="sub" text-anchor="start" xml:space="preserve">adds two numbers</text>
  <text x="98.0" y="151.0" class="sub" text-anchor="start" xml:space="preserve">in 4 cycles</text>
  <path d="M430,101 A85.0,9 0 0 1 600,101 V155 A85.0,9 0 0 1 430,155 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="515.0" cy="101" rx="85.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="515.0" y="131.0" class="name" text-anchor="middle" xml:space="preserve">main memory</text>
  <text x="515.0" y="149.0" class="sub" text-anchor="middle" xml:space="preserve">500 cycles per read</text>
  <path class="wire" d="M270,128 L430,128" marker-end="url(#head)"/>
  <rect x="310.0" y="119.0" width="80.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="350.0" y="131.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">a[i], b[i]</text>
  <rect x="40.0" y="206.0" width="127.2" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="103.6" y="230.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">row 0: waiting</text>
  <rect x="167.2" y="206.0" width="9.0" height="40.0" rx="6" fill="#CF4526" stroke="#CF4526" stroke-width="1.3"/>
  <rect x="181.2" y="206.0" width="127.2" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="244.9" y="230.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">row 1: waiting</text>
  <rect x="308.5" y="206.0" width="9.0" height="40.0" rx="6" fill="#CF4526" stroke="#CF4526" stroke-width="1.3"/>
  <rect x="322.5" y="206.0" width="127.2" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="386.1" y="230.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">row 2: waiting</text>
  <rect x="449.8" y="206.0" width="9.0" height="40.0" rx="6" fill="#CF4526" stroke="#CF4526" stroke-width="1.3"/>
  <rect x="463.8" y="206.0" width="127.2" height="40.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="527.4" y="230.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">row 3: waiting</text>
  <rect x="591.0" y="206.0" width="9.0" height="40.0" rx="6" fill="#CF4526" stroke="#CF4526" stroke-width="1.3"/>
  <line x1="40.0" y1="262.0" x2="600.0" y2="262.0" stroke="#5D6B7A" stroke-width="1"/>
  <text x="40.0" y="280.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <text x="600.0" y="280.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">2,016 cycles</text>
  <rect x="40" y="306" width="14" height="14" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="61.0" y="317.5" class="note" text-anchor="start" xml:space="preserve">waiting for a[i] and b[i]: 500 cycles</text>
  <rect x="327.20000000000005" y="306" width="14" height="14" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="348.2" y="317.5" class="note" text-anchor="start" xml:space="preserve">add: 4 cycles</text>
  <rect x="40" y="340" width="470" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,340.7 H46 V397.3 H52 A11.3,11.3 0 0 1 40.7,386 V352 A11.3,11.3 0 0 1 52,340.7 Z" fill="#CF4526"/>
  <text x="60.0" y="365.0" class="name" text-anchor="start" xml:space="preserve">The adder works 16 of 2,016 cycles</text>
  <text x="60.0" y="383.0" class="sub" text-anchor="start" xml:space="preserve">under 1% of the time; add bars drawn wider than to scale</text>
  <g transform="translate(522,332) scale(0.3417)">
<ellipse cx="78" cy="56" rx="34" ry="24" fill="#d8ecfa" stroke="#9cc3e0" stroke-width="3" transform="rotate(-28 78 56)"/>
