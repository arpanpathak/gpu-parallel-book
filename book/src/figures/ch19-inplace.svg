<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436" width="640" height="436" role="img" aria-label="Left: the 5 by 5 grid after step 1, with 25 in the 3 cells under the hot edge. Right: cell (1, 2) at step 2 computed 2 ways. If cell (1, 1) still holds its old value 25, the result is (100 + 0 + 25 + 25) / 4 = 37.50. If cell (1, 1) has already been replaced by 31.25, the result is (100 + 0 + 31.25 + 25) / 4 = 39.06.">
