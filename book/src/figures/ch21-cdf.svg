<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 476" width="660" height="476" role="img" aria-label="A 16-pixel image with 8 grey levels has counts 0, 0, 4, 6, 4, 2, 0, 0. The cumulative counts are 0, 0, 4, 10, 14, 16, 16, 16. With the first occupied cdf 4 and 16 pixels, the new levels of the occupied levels 2, 3, 4, 5 are 0, 4, 6, 7. 2 small histograms show the counts before, on levels 2 to 5, and after, spread from 0 to 7.">
