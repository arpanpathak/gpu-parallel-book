  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A mesh or a switch, for 8 H100s</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The switch gives every pair the whole 450 GB/s each way.</text>
