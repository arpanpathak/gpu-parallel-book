<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 444" width="660" height="444" role="img" aria-label="Bars of sum bandwidth for 67,108,864 floats. Orin NX: tree 26 GB/s, coarsened 64, shuffles 64, shuffles with float4 90, against a rated 102. Thor: tree 88 GB/s, coarsened 203, shuffles 204, shuffles with float4 264, against a rated 273. Dashed lines mark the rated bandwidths.">
  <style>
