<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 412" width="660" height="412" role="img" aria-label="The online softmax over row 1, 2, 4, 4, 5. It starts from m = -inf and s = 0. After 2: m = 2, s = 1. After 4: m = 4, s = 1 times exp(-2) plus 1 = 1.1353. After the second 4: m stays 4 and s = 2.1353. After 5: m = 5, s = 2.1353 times exp(-1) plus 1 = 1.7855, the same sum as 3 passes give.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="660" height="412" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The online softmax</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">1 pass keeps a running maximum m and a sum s taken relative to m.</text>
  <rect x="16" y="96" width="628" height="300" rx="16" fill="#F0EEE6" stroke="none" stroke-width="1.2"/>
  <rect x="34" y="85" width="256.1" height="22" rx="11" fill="#1B2430"/>
  <text x="162.1" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">ONLINE MAXIMUM AND SUM, ROW 1</text>
  <text x="36.0" y="130.0" class="name" text-anchor="start" xml:space="preserve">x</text>
  <text x="110.0" y="130.0" class="name" text-anchor="start" xml:space="preserve">m</text>
  <text x="184.0" y="130.0" class="name" text-anchor="start" xml:space="preserve">s</text>
  <text x="290.0" y="130.0" class="name" text-anchor="start" xml:space="preserve">step</text>
  <text x="36.0" y="160.0" class="mono" text-anchor="start" xml:space="preserve">–</text>
  <rect x="84.0" y="142.0" width="60.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="114.0" y="160.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">−inf</text>
  <rect x="160.0" y="142.0" width="96.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="208.0" y="160.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">0</text>
  <text x="290.0" y="160.0" class="note" text-anchor="start" xml:space="preserve">the empty state</text>
  <text x="36.0" y="197.0" class="mono" text-anchor="start" xml:space="preserve">2</text>
  <rect x="84.0" y="178.0" width="60.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="114.0" y="196.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">2</text>
  <rect x="160.0" y="178.0" width="96.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="208.0" y="196.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1.0000</text>
  <text x="290.0" y="197.0" class="note" text-anchor="start" xml:space="preserve">first value: s = 1</text>
  <text x="36.0" y="233.0" class="mono" text-anchor="start" xml:space="preserve">4</text>
  <rect x="84.0" y="214.0" width="60.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="114.0" y="232.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">4</text>
  <rect x="160.0" y="214.0" width="96.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="208.0" y="232.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1.1353</text>
  <text x="290.0" y="233.0" class="note" text-anchor="start" xml:space="preserve">new maximum: s × exp(m − x) + 1</text>
  <text x="36.0" y="269.0" class="mono" text-anchor="start" xml:space="preserve">4</text>
  <rect x="84.0" y="250.0" width="60.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="114.0" y="268.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">4</text>
  <rect x="160.0" y="250.0" width="96.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="208.0" y="268.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">2.1353</text>
  <text x="290.0" y="269.0" class="note" text-anchor="start" xml:space="preserve">x ≤ m: s + exp(x − m)</text>
  <text x="36.0" y="305.0" class="mono" text-anchor="start" xml:space="preserve">5</text>
  <rect x="84.0" y="286.0" width="60.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="114.0" y="304.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">5</text>
  <rect x="160.0" y="286.0" width="96.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="208.0" y="304.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1.7855</text>
  <text x="290.0" y="305.0" class="note" text-anchor="start" xml:space="preserve">new maximum: s × exp(m − x) + 1</text>
  <text x="36.0" y="350.0" class="note" text-anchor="start" xml:space="preserve">Step 2: 1 × exp(2 − 4) + 1 = 1.1353.  Step 3: 1.1353 + exp(0) = 2.1353.</text>
  <text x="36.0" y="370.0" class="note" text-anchor="start" xml:space="preserve">Step 4: 2.1353 × exp(4 − 5) + 1 = 1.7855, the sum of pass 2 in Figure 23.5.</text>
</svg>
