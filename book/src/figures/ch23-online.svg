<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 442" width="660" height="442" role="img" aria-label="A trace over the logits 1, 2, 3, 4. Start: m = 1, s = 1. At x = 2: m = 2, s = 1 times exp(-1) plus 1 = 1.3679. At x = 3: m = 3, s = 1.5032. At x = 4: m = 4, s = 1.5530, the same sum as the 2-pass method gives.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="442" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The online softmax</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">1 pass keeps a running maximum m and a sum s rescaled to that maximum.</text>
  <rect x="16" y="96" width="628" height="330" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="85" width="201.1" height="22" rx="11" fill="#1B2430"/>
  <text x="134.5" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">ONLINE MAXIMUM AND SUM</text>
  <text x="40.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">step</text>
  <text x="130.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">m</text>
  <text x="200.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">s</text>
  <text x="300.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">how s is updated</text>
  <text x="40.0" y="166.0" class="mono" text-anchor="start" xml:space="preserve">start</text>
  <rect x="112.0" y="146.0" width="52.0" height="30.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="138.0" y="165.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">1</text>
  <rect x="180.0" y="146.0" width="92.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="226.0" y="165.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1.0000</text>
  <text x="300.0" y="166.0" class="mono" text-anchor="start" xml:space="preserve">m = 1, s = exp(0) = 1</text>
  <text x="40.0" y="208.0" class="mono" text-anchor="start" xml:space="preserve">x = 2</text>
  <rect x="112.0" y="188.0" width="52.0" height="30.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="138.0" y="207.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">2</text>
  <rect x="180.0" y="188.0" width="92.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="226.0" y="207.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1.3679</text>
  <text x="300.0" y="208.0" class="mono" text-anchor="start" xml:space="preserve">1.0000 × exp(1 − 2) + exp(2 − 2)</text>
  <text x="40.0" y="250.0" class="mono" text-anchor="start" xml:space="preserve">x = 3</text>
  <rect x="112.0" y="230.0" width="52.0" height="30.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="138.0" y="249.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">3</text>
  <rect x="180.0" y="230.0" width="92.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="226.0" y="249.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1.5032</text>
  <text x="300.0" y="250.0" class="mono" text-anchor="start" xml:space="preserve">1.3679 × exp(2 − 3) + exp(3 − 3)</text>
  <text x="40.0" y="292.0" class="mono" text-anchor="start" xml:space="preserve">x = 4</text>
  <rect x="112.0" y="272.0" width="52.0" height="30.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="138.0" y="291.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">4</text>
  <rect x="180.0" y="272.0" width="92.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="226.0" y="291.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1.5530</text>
  <text x="300.0" y="292.0" class="mono" text-anchor="start" xml:space="preserve">1.5032 × exp(3 − 4) + exp(4 − 4)</text>
  <text x="40.0" y="380.0" class="note" text-anchor="start" xml:space="preserve">The last s, 1.5530, equals the sum of exp(x − 4) from the 2 passes of Figure 20.1.</text>
  <text x="40.0" y="398.0" class="note" text-anchor="start" xml:space="preserve">When the maximum grows from m to m&#x27;, the old sum is multiplied by exp(m − m&#x27;).</text>
</svg>
