  <text x="150.0" y="372.0" class="name" text-anchor="end" xml:space="preserve">sobel</text>
  <rect x="162.0" y="354.0" width="300.0" height="14.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
