<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" role="img" aria-label="Horizontal bars of the measured time of each stage for 1 image: grayscale 0.201 ms; histogram 0.123 ms; table 0.007 ms; apply table 0.186 ms; blur rows 0.263 ms; blur columns 0.264 ms; sobel 0.350 ms. The 7 stages sum to 1.39 ms.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="640" height="410" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Time per stage</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">1 image of 1,920 x 1,080 pixels on the measured GPU.</text>
  <text x="150.0" y="121.0" class="name" text-anchor="end" xml:space="preserve">grayscale</text>
  <rect x="162.0" y="104.0" width="183.8" height="26.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="353.8" y="121.0" class="note" text-anchor="start" xml:space="preserve">0.201 ms, 41 GB/s</text>
  <text x="150.0" y="159.0" class="name" text-anchor="end" xml:space="preserve">histogram</text>
  <rect x="162.0" y="142.0" width="112.5" height="26.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="282.5" y="159.0" class="note" text-anchor="start" xml:space="preserve">0.123 ms, 17 GB/s</text>
  <text x="150.0" y="197.0" class="name" text-anchor="end" xml:space="preserve">table</text>
  <rect x="162.0" y="180.0" width="6.4" height="26.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="176.4" y="197.0" class="note" text-anchor="start" xml:space="preserve">0.007 ms</text>
  <text x="150.0" y="235.0" class="name" text-anchor="end" xml:space="preserve">apply table</text>
  <rect x="162.0" y="218.0" width="170.1" height="26.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="340.1" y="235.0" class="note" text-anchor="start" xml:space="preserve">0.186 ms, 22 GB/s</text>
  <text x="150.0" y="273.0" class="name" text-anchor="end" xml:space="preserve">blur rows</text>
  <rect x="162.0" y="256.0" width="240.5" height="26.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="410.5" y="273.0" class="note" text-anchor="start" xml:space="preserve">0.263 ms, 24 GB/s</text>
  <text x="150.0" y="311.0" class="name" text-anchor="end" xml:space="preserve">blur columns</text>
  <rect x="162.0" y="294.0" width="241.4" height="26.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="411.4" y="311.0" class="note" text-anchor="start" xml:space="preserve">0.264 ms, 24 GB/s</text>
  <text x="150.0" y="349.0" class="name" text-anchor="end" xml:space="preserve">sobel</text>
  <rect x="162.0" y="332.0" width="320.0" height="26.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="490.0" y="349.0" class="note" text-anchor="start" xml:space="preserve">0.350 ms, 12 GB/s</text>
  <text x="36.0" y="384.0" class="note" text-anchor="start" xml:space="preserve">Sum of the 7 stages: 1.39 ms per image of 1,920 x 1,080 pixels.</text>
</svg>
