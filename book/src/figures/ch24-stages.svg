  <rect x="162.0" y="314.0" width="240.0" height="14.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="408.0" y="325.0" class="note" text-anchor="start" xml:space="preserve">0.280 ms</text>
