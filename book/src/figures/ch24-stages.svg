  <text x="174.0" y="205.0" class="note" text-anchor="start" xml:space="preserve">0.007 ms</text>
  <rect x="162.0" y="210.0" width="6.0" height="14.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="174.0" y="221.0" class="note" text-anchor="start" xml:space="preserve">0.007 ms</text>
  <text x="150.0" y="252.0" class="name" text-anchor="end" xml:space="preserve">apply table</text>
  <rect x="162.0" y="234.0" width="158.6" height="14.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="326.6" y="245.0" class="note" text-anchor="start" xml:space="preserve">0.185 ms</text>
