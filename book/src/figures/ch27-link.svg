<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 438" width="660" height="438" role="img" aria-label="Left: 1 link of NVLink 4 between GPU A and GPU B, drawn as 2 wire pairs from A to B and 2 from B to A. 2 pairs of 100 Gbit/s carry 200 Gbit/s, 25 GB/s each way. Right: the 18 links of 1 H100, numbered 1 to 18: 18 times 25 GB/s is 450 GB/s each way, 900 GB/s both ways, against 64 GB/s each way for PCIe 5.0 with 16 lanes.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="438" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Links, and how they add up</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">1 link carries 25 GB/s each way; an H100 has 18.</text>
  <rect x="16" y="104" width="330" height="262" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="169.6" height="22" rx="11" fill="#1B2430"/>
  <text x="118.8" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1 LINK OF NVLINK 4</text>
  <rect x="362" y="104" width="282" height="262" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="380" y="93" width="169.6" height="22" rx="11" fill="#1B2430"/>
  <text x="464.8" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">18 LINKS OF 1 H100</text>
  <rect x="36.0" y="150.0" width="76.0" height="150.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="74.0" y="229.0" class="name" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">GPU A</text>
  <rect x="250.0" y="150.0" width="76.0" height="150.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="288.0" y="229.0" class="name" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">GPU B</text>
  <path class="wire" d="M112,178 L250,178" marker-end="url(#head)"/>
  <path class="wire" d="M112,196 L250,196" marker-end="url(#head)"/>
  <path class="wire" d="M250,254 L112,254" marker-end="url(#head)"/>
  <path class="wire" d="M250,272 L112,272" marker-end="url(#head)"/>
  <text x="181.0" y="166.0" class="sub" text-anchor="middle" xml:space="preserve">A to B: 2 pairs</text>
  <text x="181.0" y="242.0" class="sub" text-anchor="middle" xml:space="preserve">B to A: 2 pairs</text>
  <text x="36.0" y="326.0" class="note" text-anchor="start" xml:space="preserve">2 pairs × 100 Gbit/s = 200 Gbit/s</text>
  <text x="36.0" y="344.0" class="note" text-anchor="start" xml:space="preserve">200 Gbit/s ÷ 8 bits = 25 GB/s each way</text>
  <rect x="386.0" y="140.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="402.0" y="160.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1</text>
  <rect x="426.0" y="140.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="442.0" y="160.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">2</text>
  <rect x="466.0" y="140.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="482.0" y="160.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">3</text>
  <rect x="506.0" y="140.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="522.0" y="160.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">4</text>
  <rect x="546.0" y="140.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="562.0" y="160.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">5</text>
  <rect x="586.0" y="140.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="602.0" y="160.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">6</text>
  <rect x="386.0" y="180.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="402.0" y="200.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">7</text>
  <rect x="426.0" y="180.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="442.0" y="200.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">8</text>
  <rect x="466.0" y="180.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="482.0" y="200.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">9</text>
  <rect x="506.0" y="180.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="522.0" y="200.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">10</text>
  <rect x="546.0" y="180.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="562.0" y="200.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">11</text>
  <rect x="586.0" y="180.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="602.0" y="200.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">12</text>
  <rect x="386.0" y="220.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="402.0" y="240.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">13</text>
  <rect x="426.0" y="220.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="442.0" y="240.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">14</text>
  <rect x="466.0" y="220.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="482.0" y="240.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">15</text>
  <rect x="506.0" y="220.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="522.0" y="240.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">16</text>
  <rect x="546.0" y="220.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="562.0" y="240.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">17</text>
  <rect x="586.0" y="220.0" width="32.0" height="32.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="602.0" y="240.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">18</text>
  <text x="386.0" y="286.0" class="note" text-anchor="start" xml:space="preserve">18 × 25 GB/s = 450 GB/s each way</text>
  <text x="386.0" y="304.0" class="note" text-anchor="start" xml:space="preserve">both ways: 2 × 450 = 900 GB/s,</text>
  <text x="386.0" y="322.0" class="note" text-anchor="start" xml:space="preserve">the figure NVIDIA quotes</text>
  <text x="386.0" y="344.0" class="note" text-anchor="start" xml:space="preserve">PCIe 5.0 × 16: 64 GB/s each way</text>
  <text x="24.0" y="398.0" class="note" text-anchor="start" xml:space="preserve">A pair is 2 wires carrying 1 signal in 1 direction. A link has pairs both ways, so it sends</text>
  <text x="24.0" y="416.0" class="note" text-anchor="start" xml:space="preserve">and receives at once. A GPU&#x27;s bandwidth to other GPUs is its number of links times 1 link.</text>
</svg>
