<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 534" width="660" height="534" role="img" aria-label="A split of 5, 2, 7, 2, 0, 6, 3, 5 on bit 0 as 2 compactions. Flags for bit 0 equal to 0: 0, 1, 0, 1, 1, 1, 0, 0, exclusive scan 0, 0, 1, 1, 2, 3, 4, 4. Flags for bit 0 equal to 1: 1, 0, 1, 0, 0, 0, 1, 1, with 4 plus their exclusive scan 4, 5, 5, 6, 6, 6, 6, 7. Positions 4, 0, 5, 1, 2, 3, 6, 7; output 2, 2, 0, 6, 5, 7, 3, 5.">
