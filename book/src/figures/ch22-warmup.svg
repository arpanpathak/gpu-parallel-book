<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 506" width="660" height="506" role="img" aria-label="Bars of 40 run times of y = 2 x over 256 MiB on 1 GPU. Run 1 takes 19.83 ms and runs 2 to 8 between 9.67 and 14.43 ms; from run 9 the times sit near 8.35 ms, with outliers of 10.43, 10.33, 12.91 and 9.80 ms. A dashed line marks the mean of all 40 runs, 9.46 ms; a solid line the median of runs 21 to 40, 8.35 ms.">
