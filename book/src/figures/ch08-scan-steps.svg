<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 482" width="660" height="482" role="img" aria-label="Four rows of 8 values. Values 3, 1, 4, 1, 5, 9, 2, 6. After offset 1: 3, 4, 5, 5, 6, 14, 11, 8. After offset 2: 3, 4, 8, 9, 11, 19, 17, 22. After offset 4: 3, 4, 8, 9, 14, 23, 25, 31, the running sums. Arrows show lane 7 receiving from lanes 6, 5 and 3.">
