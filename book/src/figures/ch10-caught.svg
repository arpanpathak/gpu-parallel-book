<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 524" width="660" height="524" role="img" aria-label="A table of 6 mistakes against 3 ways of writing the program. Leak on early return: C API 128 MiB lost; modern C++ and Rust cannot happen. 2,048 threads per block: C API silent, out = 0; C++ throws with file and line; Rust returns an Err from prepare. Bytes for elements: C API 1 in 4 copied; C++ and Rust cannot happen. Copy of an owner: C API double free; C++ compile error; Rust moved, not copied. Block not a multiple of 32: C API not checked; C++ static_assert; Rust const assert. An operation that returns bool: C API has no generics; C++ concept error; Rust trait bound error.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="524" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">When each mistake is caught</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">6 mistakes of this chapter, written 3 ways.</text>
  <text x="266.0" y="112.0" class="name" text-anchor="middle" xml:space="preserve">C API</text>
  <text x="414.0" y="112.0" class="name" text-anchor="middle" xml:space="preserve">modern C++</text>
  <text x="562.0" y="112.0" class="name" text-anchor="middle" xml:space="preserve">Rust</text>
  <text x="24.0" y="150.0" class="sub" text-anchor="start" xml:space="preserve">leak on early return</text>
  <rect x="196.0" y="128.0" width="140.0" height="34.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="266.0" y="149.2" class="sub" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">128 MiB lost</text>
  <rect x="344.0" y="128.0" width="140.0" height="34.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="414.0" y="149.2" class="sub" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">cannot happen</text>
  <rect x="492.0" y="128.0" width="140.0" height="34.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="562.0" y="149.2" class="sub" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">cannot happen</text>
  <text x="24.0" y="196.0" class="sub" text-anchor="start" xml:space="preserve">2,048 threads per block</text>
  <rect x="196.0" y="174.0" width="140.0" height="34.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="266.0" y="195.2" class="sub" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">silent: out = 0</text>
  <rect x="344.0" y="174.0" width="140.0" height="34.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="414.0" y="195.2" class="sub" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">throws, file:line</text>
  <rect x="492.0" y="174.0" width="140.0" height="34.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="562.0" y="195.2" class="sub" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">Err from prepare</text>
  <text x="24.0" y="242.0" class="sub" text-anchor="start" xml:space="preserve">bytes for elements</text>
  <rect x="196.0" y="220.0" width="140.0" height="34.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="266.0" y="241.2" class="sub" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">1 in 4 copied</text>
  <rect x="344.0" y="220.0" width="140.0" height="34.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="414.0" y="241.2" class="sub" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">cannot happen</text>
  <rect x="492.0" y="220.0" width="140.0" height="34.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="562.0" y="241.2" class="sub" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">cannot happen</text>
  <text x="24.0" y="288.0" class="sub" text-anchor="start" xml:space="preserve">copy of an owner</text>
  <rect x="196.0" y="266.0" width="140.0" height="34.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="266.0" y="287.2" class="sub" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">double free</text>
  <rect x="344.0" y="266.0" width="140.0" height="34.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="414.0" y="287.2" class="sub" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">compile error</text>
  <rect x="492.0" y="266.0" width="140.0" height="34.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="562.0" y="287.2" class="sub" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">moved, not copied</text>
  <text x="24.0" y="334.0" class="sub" text-anchor="start" xml:space="preserve">block not × 32</text>
  <rect x="196.0" y="312.0" width="140.0" height="34.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="266.0" y="333.2" class="sub" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">not checked</text>
  <rect x="344.0" y="312.0" width="140.0" height="34.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="414.0" y="333.2" class="sub" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">static_assert</text>
  <rect x="492.0" y="312.0" width="140.0" height="34.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="562.0" y="333.2" class="sub" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">const assert!</text>
  <text x="24.0" y="380.0" class="sub" text-anchor="start" xml:space="preserve">op returns bool</text>
  <rect x="196.0" y="358.0" width="140.0" height="34.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="266.0" y="379.2" class="sub" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">no generics</text>
  <rect x="344.0" y="358.0" width="140.0" height="34.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="414.0" y="379.2" class="sub" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">concept: error</text>
  <rect x="492.0" y="358.0" width="140.0" height="34.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="562.0" y="379.2" class="sub" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">trait bound: error</text>
  <rect x="24" y="418" width="14" height="14" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="45.0" y="429.5" class="note" text-anchor="start" xml:space="preserve">never caught</text>
  <rect x="146.2" y="418" width="14" height="14" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="167.2" y="429.5" class="note" text-anchor="start" xml:space="preserve">at run time</text>
  <rect x="261.8" y="418" width="14" height="14" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="282.8" y="429.5" class="note" text-anchor="start" xml:space="preserve">at compile time</text>
  <rect x="403.8" y="418" width="14" height="14" rx="4" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="424.8" y="429.5" class="note" text-anchor="start" xml:space="preserve">cannot be written</text>
  <text x="24.0" y="466.0" class="note" text-anchor="start" xml:space="preserve">Each row is a mistake run in this chapter. The C API catches none of them. Modern C++</text>
  <text x="24.0" y="484.0" class="note" text-anchor="start" xml:space="preserve">and Rust move most of them to compile time, and make the leak and the byte count</text>
  <text x="24.0" y="502.0" class="note" text-anchor="start" xml:space="preserve">impossible to write.</text>
</svg>
