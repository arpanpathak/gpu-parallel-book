  <text x="32.0" y="336.0" class="note" text-anchor="start" xml:space="preserve">Thread i adds 1 to the bin of its key with an atomic addition; the chips above each bin</text>
  <text x="32.0" y="354.0" class="note" text-anchor="start" xml:space="preserve">are the requests it receives. Bins 2 and 5 receive 2 requests each, which the hardware</text>
  <text x="32.0" y="372.0" class="note" text-anchor="start" xml:space="preserve">applies 1 after the other: the second request waits for the first.</text>
