<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 396" width="660" height="396" role="img" aria-label="8 threads, 1 per key 5, 2, 7, 2, 0, 6, 3, 5, each sending an atomic addition to the bin of its key. Bin 2 receives the requests of threads 1 and 3, bin 5 those of threads 0 and 7, and each other occupied bin 1 request. The bins end with the counts 1, 0, 2, 1, 0, 2, 1, 1.">
