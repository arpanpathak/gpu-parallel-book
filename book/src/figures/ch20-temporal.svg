  <rect x="362" y="178" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#2F6FDB" stroke-width="1.4"/>
  <text x="380.0" y="212.0" class="note" text-anchor="start" xml:space="preserve">after step 3: 26 × 26</text>
