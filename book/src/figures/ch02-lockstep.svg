  <path d="M572.0,150 V175" fill="none" stroke="#3F5873" stroke-width="1.6" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="36" y="178" width="64" height="118" rx="10" fill="#FFFFFF" stroke="#D5DBE3" filter="url(#lift)"/>
  <text x="68.0" y="198.0" class="pill" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">lane 0</text>
  <text x="68.0" y="222.0" class="mono" text-anchor="middle" xml:space="preserve">a = 1</text>
  <text x="68.0" y="242.0" class="mono" text-anchor="middle" xml:space="preserve">b = 2</text>
  <rect x="42.0" y="256.0" width="52.0" height="28.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="68.0" y="274.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">c = 3</text>
  <rect x="108" y="178" width="64" height="118" rx="10" fill="#FFFFFF" stroke="#D5DBE3" filter="url(#lift)"/>
  <text x="140.0" y="198.0" class="pill" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">lane 1</text>
  <text x="140.0" y="222.0" class="mono" text-anchor="middle" xml:space="preserve">a = 4</text>
  <text x="140.0" y="242.0" class="mono" text-anchor="middle" xml:space="preserve">b = 2</text>
  <rect x="114.0" y="256.0" width="52.0" height="28.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="140.0" y="274.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">c = 6</text>
