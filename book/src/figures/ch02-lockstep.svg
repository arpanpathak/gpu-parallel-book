  <text x="212.0" y="242.0" class="mono" text-anchor="middle" xml:space="preserve">b = 5</text>
  <rect x="186.0" y="256.0" width="52.0" height="28.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="212.0" y="274.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">c = 5</text>
  <rect x="252" y="178" width="64" height="118" rx="10" fill="#FFFFFF" stroke="#D5DBE3" filter="url(#lift)"/>
  <text x="284.0" y="198.0" class="pill" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">lane 3</text>
  <text x="284.0" y="222.0" class="mono" text-anchor="middle" xml:space="preserve">a = 3</text>
  <text x="284.0" y="242.0" class="mono" text-anchor="middle" xml:space="preserve">b = 1</text>
  <rect x="258.0" y="256.0" width="52.0" height="28.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="284.0" y="274.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">c = 4</text>
  <rect x="324" y="178" width="64" height="118" rx="10" fill="#FFFFFF" stroke="#D5DBE3" filter="url(#lift)"/>
  <text x="356.0" y="198.0" class="pill" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">lane 4</text>
  <text x="356.0" y="222.0" class="mono" text-anchor="middle" xml:space="preserve">a = 2</text>
  <text x="356.0" y="242.0" class="mono" text-anchor="middle" xml:space="preserve">b = 8</text>
  <rect x="330.0" y="256.0" width="52.0" height="28.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="356.0" y="274.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">c = 10</text>
  <rect x="396" y="178" width="64" height="118" rx="10" fill="#FFFFFF" stroke="#D5DBE3" filter="url(#lift)"/>
  <text x="428.0" y="198.0" class="pill" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">lane 5</text>
  <text x="428.0" y="222.0" class="mono" text-anchor="middle" xml:space="preserve">a = 7</text>
  <text x="428.0" y="242.0" class="mono" text-anchor="middle" xml:space="preserve">b = 0</text>
  <rect x="402.0" y="256.0" width="52.0" height="28.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="428.0" y="274.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">c = 7</text>
  <rect x="468" y="178" width="64" height="118" rx="10" fill="#FFFFFF" stroke="#D5DBE3" filter="url(#lift)"/>
  <text x="500.0" y="198.0" class="pill" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">lane 6</text>
  <text x="500.0" y="222.0" class="mono" text-anchor="middle" xml:space="preserve">a = 5</text>
  <text x="500.0" y="242.0" class="mono" text-anchor="middle" xml:space="preserve">b = 3</text>
  <rect x="474.0" y="256.0" width="52.0" height="28.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="500.0" y="274.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">c = 8</text>
  <rect x="540" y="178" width="64" height="118" rx="10" fill="#FFFFFF" stroke="#D5DBE3" filter="url(#lift)"/>
  <text x="572.0" y="198.0" class="pill" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">lane 7</text>
  <text x="572.0" y="222.0" class="mono" text-anchor="middle" xml:space="preserve">a = 6</text>
  <text x="572.0" y="242.0" class="mono" text-anchor="middle" xml:space="preserve">b = 3</text>
  <rect x="546.0" y="256.0" width="52.0" height="28.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="572.0" y="274.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">c = 9</text>
  <text x="36.0" y="330.0" class="note" text-anchor="start" xml:space="preserve">One instruction, eight lanes, eight different answers in one step.</text>
  <text x="36.0" y="350.0" class="note" text-anchor="start" xml:space="preserve">Drawn with 8 lanes; a real warp has 32.</text>
</svg>
