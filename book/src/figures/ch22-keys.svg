<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 334" width="660" height="334" role="img" aria-label="The keys 5, 2, 7, 2, 0, 6, 3, 5 with their binary digits 101, 010, 111, 010, 000, 110, 011, 101, and the sorted keys 0, 2, 2, 3, 5, 5, 6, 7, labeled with the positions they came from: 4, 1, 3, 6, 0, 7, 5, 2.">
