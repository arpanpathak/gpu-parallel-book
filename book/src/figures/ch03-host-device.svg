<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 476" width="660" height="476" role="img" aria-label="Two zones. Host: a CPU card that runs main and launches the kernel, above host memory holding h_a, h_b and h_c. Device: a GPU card that runs the kernel&#x27;s threads, above global memory holding d_a, d_b and d_c. An arrow labelled launch runs from the CPU to the GPU. An arrow labelled copy in runs from host memory to global memory, and one labelled copy out runs back.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="476" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Host and device</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A CUDA program runs on 2 processors, each with its own memory.</text>
  <rect x="16" y="104" width="280" height="300" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="59.5" height="22" rx="11" fill="#1B2430"/>
  <text x="63.7" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">HOST</text>
  <rect x="364" y="104" width="280" height="300" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="382" y="93" width="75.2" height="22" rx="11" fill="#1B2430"/>
  <text x="419.6" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">DEVICE</text>
  <rect x="36" y="136" width="240" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M48,136.7 H42 V195.3 H48 A11.3,11.3 0 0 1 36.7,184 V148 A11.3,11.3 0 0 1 48,136.7 Z" fill="#2F6FDB"/>
  <rect x="52" y="150.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(58.0,156.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="94.0" y="162.0" class="name" text-anchor="start" xml:space="preserve">CPU</text>
  <text x="94.0" y="180.0" class="sub" text-anchor="start" xml:space="preserve">runs main() and launches</text>
  <path d="M56,271 A100.0,9 0 0 1 256,271 V345 A100.0,9 0 0 1 56,345 Z" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="156.0" cy="271" rx="100.0" ry="9" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.4"/>
  <text x="156.0" y="311.0" class="name" text-anchor="middle" xml:space="preserve">host memory</text>
  <text x="156.0" y="329.0" class="sub" text-anchor="middle" xml:space="preserve">h_a, h_b, h_c</text>
  <rect x="384" y="136" width="240" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M396,136.7 H390 V195.3 H396 A11.3,11.3 0 0 1 384.7,184 V148 A11.3,11.3 0 0 1 396,136.7 Z" fill="#1F8A70"/>
  <rect x="400" y="150.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(406.0,156.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="442.0" y="162.0" class="name" text-anchor="start" xml:space="preserve">GPU</text>
  <text x="442.0" y="180.0" class="sub" text-anchor="start" xml:space="preserve">runs the kernel&#x27;s threads</text>
  <path d="M404,271 A100.0,9 0 0 1 604,271 V345 A100.0,9 0 0 1 404,345 Z" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.4" filter="url(#lift)"/>
  <ellipse cx="504.0" cy="271" rx="100.0" ry="9" fill="#FFFFFF" stroke="#7A4FD0" stroke-width="1.4"/>
  <text x="504.0" y="311.0" class="name" text-anchor="middle" xml:space="preserve">global memory</text>
  <text x="504.0" y="329.0" class="sub" text-anchor="middle" xml:space="preserve">d_a, d_b, d_c</text>
  <path class="wire" d="M156,196 L156,262"/>
  <path class="wire" d="M504,196 L504,262"/>
  <path class="wire" d="M276,166 L384,166" marker-end="url(#head)"/>
  <rect x="303.2" y="157.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="330.0" y="169.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">launch</text>
  <path class="wire" d="M256,292 L404,292" marker-end="url(#head)"/>
  <rect x="299.9" y="283.0" width="60.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="330.0" y="295.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">copy in</text>
  <path class="wire" d="M404,330 L256,330" marker-end="url(#head)"/>
  <rect x="296.6" y="321.0" width="66.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="330.0" y="333.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">copy out</text>
  <text x="16.0" y="436.0" class="note" text-anchor="start" xml:space="preserve">Copies use cudaMemcpy. A host pointer must not be read on the device, nor a</text>
  <text x="16.0" y="454.0" class="note" text-anchor="start" xml:space="preserve">device pointer on the host.</text>
</svg>
