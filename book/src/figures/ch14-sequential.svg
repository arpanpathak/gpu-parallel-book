<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 216" width="640" height="216" role="img" aria-label="The sequential loop visits the 12 elements in order, 1 to 12 along a time axis. Visit 10 handles element 9: it reads x[9] = 8 and y[9] = 3 and writes y[9] = 19, with 2 reads, 1 write and 2 floating-point operations. In total 12 visits make 24 FLOP and move 144 bytes.">
