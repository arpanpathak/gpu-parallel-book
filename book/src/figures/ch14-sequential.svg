  <text x="341.0" y="45.3" font-size="12" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">7</text>
  <rect x="362.0" y="28.0" width="34.0" height="26.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
  <text x="379.0" y="45.3" font-size="12" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">8</text>
  <rect x="400.0" y="28.0" width="34.0" height="26.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
  <text x="417.0" y="45.3" font-size="12" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">9</text>
  <rect x="438.0" y="28.0" width="34.0" height="26.0" rx="5" fill="#C9CAF6" stroke="#4F52C4" stroke-width="2.2"/>
  <text x="455.0" y="45.3" font-size="12" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">10</text>
  <rect x="476.0" y="28.0" width="34.0" height="26.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
  <text x="493.0" y="45.3" font-size="12" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">11</text>
  <rect x="514.0" y="28.0" width="34.0" height="26.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
