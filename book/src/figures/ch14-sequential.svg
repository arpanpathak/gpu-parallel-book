  <text x="227.0" y="45.3" font-size="12" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">4</text>
  <rect x="248.0" y="28.0" width="34.0" height="26.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
  <text x="265.0" y="45.3" font-size="12" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">5</text>
