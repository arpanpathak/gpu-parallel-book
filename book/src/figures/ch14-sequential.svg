  <line x1="455.0" y1="56.0" x2="455.0" y2="104.0" stroke="#4F52C4" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="248.0" y="108.0" width="296.0" height="92.0" rx="8" fill="#F7F7FE" stroke="#4F52C4" stroke-width="1.2"/>
  <text x="262.0" y="130.0" font-size="12" fill="#1F2633" text-anchor="start" font-weight="600" xml:space="preserve">visit 10, i = 9 (line 2 of the loop):</text>
  <text x="262.0" y="152.0" font-size="12" fill="#1F2633" text-anchor="start" font-weight="400" xml:space="preserve">read x[9] = 8 and y[9] = 3</text>
  <text x="262.0" y="172.0" font-size="12" fill="#4F52C4" text-anchor="start" font-weight="600" xml:space="preserve">y[9] = 2 · 8 + 3 = 19, written back</text>
  <text x="262.0" y="191.0" font-size="11.5" fill="#8A94A3" text-anchor="start" font-weight="400" xml:space="preserve">2 reads, 1 write, 2 FLOP</text>
  <text x="46.0" y="130.0" font-size="11.5" fill="#8A94A3" text-anchor="start" font-weight="400" xml:space="preserve">12 visits, 1 after another</text>
  <text x="46.0" y="150.0" font-size="11.5" fill="#8A94A3" text-anchor="start" font-weight="400" xml:space="preserve">each visit: 2 reads, 1 write</text>
  <text x="46.0" y="170.0" font-size="11.5" fill="#8A94A3" text-anchor="start" font-weight="400" xml:space="preserve">total: 24 FLOP, 144 bytes</text>
</svg>
