<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 554" width="660" height="554" role="img" aria-label="Horizontal bars of sorting speed in millions of keys per second for 16,777,216 32-bit keys. std::sort on 1 CPU core 10.3. thrust::sort 676.7. thrust::sort with scratch reused 1,285.5. With cuda::std::greater 542.6 and with its own comparison 686.8, both merge sorts. cub::DeviceRadixSort 1,872.8. Keys from 0 to 255 sorted on bits 0 to 7 only: 5,356.5.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="554" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Sorting 16 Mi keys</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Millions of keys per second, 16,777,216 random 32-bit keys.</text>
  <line x1="236.0" y1="116.0" x2="236.0" y2="430.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="236.0" y="448.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <line x1="336.0" y1="116.0" x2="336.0" y2="430.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="336.0" y="448.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">2,000</text>
  <line x1="436.0" y1="116.0" x2="436.0" y2="430.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="436.0" y="448.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">4,000</text>
  <line x1="536.0" y1="116.0" x2="536.0" y2="430.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="536.0" y="448.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">6,000</text>
  <text x="222.0" y="142.0" class="sub" text-anchor="end" xml:space="preserve">std::sort, 1 CPU core</text>
  <rect x="236.0" y="128.0" width="3.0" height="22" rx="4" fill="#7F8EA0" stroke="#7F8EA0" stroke-width="1.1"/>
  <text x="247.0" y="143.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">10.3</text>
  <text x="222.0" y="186.0" class="sub" text-anchor="end" xml:space="preserve">thrust::sort</text>
  <rect x="236.0" y="172.0" width="33.8" height="22" rx="4" fill="#B7791F" stroke="#B7791F" stroke-width="1.1"/>
  <text x="277.8" y="187.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">676.7</text>
  <text x="222.0" y="230.0" class="sub" text-anchor="end" xml:space="preserve">thrust::sort, scratch reused</text>
  <rect x="236.0" y="216.0" width="64.3" height="22" rx="4" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.1"/>
  <text x="308.3" y="231.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">1,285.5</text>
  <text x="222.0" y="274.0" class="sub" text-anchor="end" xml:space="preserve">with cuda::std::greater</text>
  <rect x="236.0" y="260.0" width="27.1" height="22" rx="4" fill="#CF4526" stroke="#CF4526" stroke-width="1.1"/>
  <text x="271.1" y="275.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">542.6</text>
  <text x="222.0" y="318.0" class="sub" text-anchor="end" xml:space="preserve">with own comparison</text>
  <rect x="236.0" y="304.0" width="34.3" height="22" rx="4" fill="#CF4526" stroke="#CF4526" stroke-width="1.1"/>
  <text x="278.3" y="319.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">686.8</text>
  <text x="222.0" y="362.0" class="sub" text-anchor="end" xml:space="preserve">cub::DeviceRadixSort</text>
  <rect x="236.0" y="348.0" width="93.6" height="22" rx="4" fill="#2F6FDB" stroke="#2F6FDB" stroke-width="1.1"/>
  <text x="337.6" y="363.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">1,872.8</text>
  <text x="222.0" y="406.0" class="sub" text-anchor="end" xml:space="preserve">same, 8-bit keys, bits 0 to 7</text>
  <rect x="236.0" y="392.0" width="267.8" height="22" rx="4" fill="#2E8B3D" stroke="#2E8B3D" stroke-width="1.1"/>
  <text x="511.8" y="407.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">5,356.5</text>
  <text x="222.0" y="448.0" class="sub" text-anchor="end" xml:space="preserve">Mkeys/s</text>
  <rect x="40.0" y="472" width="14" height="14" rx="4" fill="#2F6FDB"/>
  <text x="61.0" y="483.5" class="note" text-anchor="start" xml:space="preserve">radix sort</text>
  <rect x="151.0" y="472" width="14" height="14" rx="4" fill="#CF4526"/>
  <text x="172.0" y="483.5" class="note" text-anchor="start" xml:space="preserve">merge sort</text>
  <rect x="262.0" y="472" width="14" height="14" rx="4" fill="#B7791F"/>
  <text x="283.0" y="483.5" class="note" text-anchor="start" xml:space="preserve">radix, allocating each call</text>
  <text x="40.0" y="514.0" class="note" text-anchor="start" xml:space="preserve">16,777,216 random 32-bit keys, 64 MiB; the last bar sorts keys from</text>
  <text x="40.0" y="532.0" class="note" text-anchor="start" xml:space="preserve">0 to 255 on their low 8 bits only, 1 pass instead of 4.</text>
</svg>
