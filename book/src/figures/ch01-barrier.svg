  <g transform="translate(541.0,72.0) scale(0.6667)"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2.2 0h5.6V7a2.8 2.8 0 0 0-5.6 0zM12 13.5a1.6 1.6 0 0 0-.8 3v2h1.6v-2a1.6 1.6 0 0 0-.8-3z" fill="#CF4526" fill-rule="evenodd"/></g>
  <line x1="130.0" y1="290.0" x2="598.0" y2="290.0" stroke="#5D6B7A" stroke-width="1"/>
  <line x1="130.0" y1="286.0" x2="130.0" y2="294.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="130.0" y="307.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <line x1="454.0" y1="286.0" x2="454.0" y2="294.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="454.0" y="307.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">900</text>
  <line x1="562.0" y1="286.0" x2="562.0" y2="294.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="562.0" y="307.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">1,200</text>
  <line x1="598.0" y1="286.0" x2="598.0" y2="294.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="598.0" y="307.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">1,300</text>
  <text x="130.0" y="326.0" class="note" text-anchor="start" xml:space="preserve">cycles; the barrier opens when processor 3 arrives, then takes 100</text>
  <rect x="40" y="344" width="560" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,344.7 H46 V401.3 H52 A11.3,11.3 0 0 1 40.7,390 V356 A11.3,11.3 0 0 1 52,344.7 Z" fill="#CF4526"/>
  <text x="60.0" y="369.0" class="name" text-anchor="start" xml:space="preserve">useful: 4,050 of 4 × 1,300 = 5,200 processor-cycles</text>
  <text x="60.0" y="387.0" class="sub" text-anchor="start" xml:space="preserve">efficiency 4,050 / 5,200 = 0.78</text>
</svg>
