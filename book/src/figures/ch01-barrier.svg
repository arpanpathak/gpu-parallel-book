  <text x="580.0" y="123.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">100</text>
  <text x="118.0" y="169.0" class="sub" text-anchor="end" xml:space="preserve">processor 1</text>
  <rect x="16" y="151" width="24" height="24" rx="6" fill="#E7F5E9"/>
  <g transform="translate(21.0,156.0) scale(0.5833)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <rect x="130.0" y="148.0" width="360.0" height="30.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="310.0" y="167.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">work 1,000 cycles</text>
  <rect x="490.0" y="148.0" width="72.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="526.0" y="167.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">wait</text>
  <rect x="562.0" y="148.0" width="36.0" height="30.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="580.0" y="167.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">100</text>
  <text x="118.0" y="213.0" class="sub" text-anchor="end" xml:space="preserve">processor 2</text>
  <rect x="16" y="195" width="24" height="24" rx="6" fill="#E7F5E9"/>
  <g transform="translate(21.0,200.0) scale(0.5833)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <rect x="130.0" y="192.0" width="342.0" height="30.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="301.0" y="211.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">work 950 cycles</text>
  <rect x="472.0" y="192.0" width="90.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="517.0" y="211.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">wait</text>
  <rect x="562.0" y="192.0" width="36.0" height="30.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="580.0" y="211.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">100</text>
  <text x="118.0" y="257.0" class="sub" text-anchor="end" xml:space="preserve">processor 3</text>
  <rect x="16" y="239" width="24" height="24" rx="6" fill="#E7F5E9"/>
  <g transform="translate(21.0,244.0) scale(0.5833)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#2E8B3D" fill-rule="evenodd"/></g>
  <rect x="130.0" y="236.0" width="432.0" height="30.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="346.0" y="255.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">work 1,200 cycles</text>
  <rect x="562.0" y="236.0" width="36.0" height="30.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="580.0" y="255.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">100</text>
  <line x1="562.0" y1="96.0" x2="562.0" y2="274.0" stroke="#CF4526" stroke-width="2.4"/>
  <rect x="368.8" y="72" width="159.2" height="18" rx="9" fill="#FCEBE6"/>
