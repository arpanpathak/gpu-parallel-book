<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 442" width="660" height="442" role="img" aria-label="A table. The mean of the squares of values near 1,000 is about 1,000,000.33 and the square of the mean 1,000,000.00; floats near 1,000,000 are spaced 0.0625 apart. The sum of 4,096 squares, about 4,096,001,365, is held to the nearest 256. The true variance, 0.33, is a small difference between 2 large uncertain numbers. Welford&#x27;s method accumulates squared deviations of about 0.33 instead.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="442" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Cancellation</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Subtracting 2 nearly equal large numbers leaves mostly rounding error.</text>
  <rect x="16" y="96" width="628" height="330" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="85" width="334.8" height="22" rx="11" fill="#1B2430"/>
  <text x="201.4" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">VARIANCE OF VALUES NEAR 1,000, IN FLOAT</text>
  <text x="40.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">quantity</text>
  <text x="330.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">value</text>
  <text x="500.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">float spacing</text>
  <text x="40.0" y="166.0" class="note" text-anchor="start" xml:space="preserve">mean of x²</text>
  <rect x="300.0" y="146.0" width="170.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="385.0" y="165.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1,000,000.33</text>
  <rect x="500.0" y="146.0" width="110.0" height="30.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <text x="555.0" y="165.0" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">0.0625</text>
  <text x="40.0" y="210.0" class="note" text-anchor="start" xml:space="preserve">(mean of x)²</text>
  <rect x="300.0" y="190.0" width="170.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="385.0" y="209.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1,000,000.00</text>
  <rect x="500.0" y="190.0" width="110.0" height="30.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <text x="555.0" y="209.0" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">0.0625</text>
  <text x="40.0" y="254.0" class="note" text-anchor="start" xml:space="preserve">sum of x², 4,096 values</text>
  <rect x="300.0" y="234.0" width="170.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="385.0" y="253.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">4,096,001,365</text>
  <rect x="500.0" y="234.0" width="110.0" height="30.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <text x="555.0" y="253.0" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">256</text>
  <text x="40.0" y="298.0" class="note" text-anchor="start" xml:space="preserve">true variance</text>
  <rect x="300.0" y="278.0" width="170.0" height="30.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="385.0" y="297.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.33</text>
  <text x="40.0" y="340.0" class="note" text-anchor="start" xml:space="preserve">Each float near 1,000,000 is exact only to 0.0625, and the sum of 4,096 squares</text>
  <text x="40.0" y="358.0" class="note" text-anchor="start" xml:space="preserve">only to 256, which is 0.0625 per element after dividing by 4,096. The variance,</text>
  <text x="40.0" y="376.0" class="note" text-anchor="start" xml:space="preserve">0.33, is the difference of 2 numbers that are each uncertain by several times 0.0625.</text>
  <text x="40.0" y="394.0" class="note" text-anchor="start" xml:space="preserve">Welford&#x27;s method never forms x²: it accumulates squared deviations of about 0.33.</text>
</svg>
