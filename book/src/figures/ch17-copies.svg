  <text x="16.0" y="436.0" class="note" text-anchor="start" xml:space="preserve">static mut TILE_A: SharedArray&lt;f32, 16&gt; declares 1 array per block, not 1 for the</text>
  <text x="16.0" y="454.0" class="note" text-anchor="start" xml:space="preserve">kernel. The 16 threads of a block share their copy; another block never sees it.</text>
  <text x="16.0" y="472.0" class="note" text-anchor="start" xml:space="preserve">Both blocks copy rows 0 to 3 of A, each into its own TILE_A. With T = 16 a tile holds</text>
  <text x="16.0" y="490.0" class="note" text-anchor="start" xml:space="preserve">256 floats, 1,024 bytes, so a block uses 2,048 bytes of shared memory.</text>
