<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 512" width="660" height="512" role="img" aria-label="2 zones, block (0, 0) and block (1, 0), each holding its own TILE_A and TILE_B as 4 by 4 grids. Both blocks load rows 0 to 3 of A, each into its own copy; block (0, 0) loads columns 0 to 3 of B and block (1, 0) columns 4 to 7. Each copy is seen by the 16 threads of its block only.">
