<text x="105.0" y="195.32" font-size="12.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">out-of-order core</text>
<rect x="30" y="220" width="384" height="30" rx="4" fill="#fbe3d6" stroke="#1d2733" stroke-width="1.4"/>
<text x="222.0" y="238.96" font-size="11.0" fill="#1d2733" text-anchor="middle" font-family="Menlo, monospace" xml:space="preserve">core 0 issues later work across a load</text>
<text x="30" y="284" font-size="12.0" fill="#6b7a89" text-anchor="start" >the core rarely stalls on a single access</text>
<rect x="460" y="44" width="424" height="264" rx="8" fill="#fdfefe" stroke="#c9d4de" stroke-width="1.4"/>
<line x1="461" y1="45" x2="883" y2="45" stroke="#2f7f86" stroke-width="3"/>
