<line x1="17" y1="45" x2="439" y2="45" stroke="#5b6b7c" stroke-width="3"/>
<text x="30" y="72" font-size="15.0" fill="#5b6b7c" text-anchor="start"  font-weight="bold">CPU: one fast core, the stall is avoided</text>
