<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" role="img" aria-label="4 boxes in a row: load tiles, global to shared; barrier, all loads complete; compute, T multiply-adds; barrier, all reads complete. An arrow runs from the last box back to the first, labelled next phase: t = t + 1, while t is less than the ceiling of K over T.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="250" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">One phase of the tiled kernel</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Copy, wait, compute, wait. The cycle repeats ⌈K/T⌉ times.</text>
  <text x="330.0" y="96.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;font-weight:700;fill:#1B2430">one phase</text>
  <rect x="33" y="112" width="128" height="58" rx="10" fill="#DDE7FB" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="97.0" y="137.0" text-anchor="middle" xml:space="preserve" style="font-size:13px;font-weight:700;fill:#1B2430">load tiles</text>
  <text x="97.0" y="156.0" text-anchor="middle" xml:space="preserve" style="font-size:11.5px;fill:#5D6B7A">global → shared</text>
  <path class="wire" d="M161,141 L189,141" marker-end="url(#head)"/>
  <rect x="189" y="112" width="128" height="58" rx="10" fill="#EEF0F3" stroke="#9AA5B1" stroke-width="1.3"/>
  <text x="253.0" y="137.0" text-anchor="middle" xml:space="preserve" style="font-size:13px;font-weight:700;fill:#1B2430">barrier</text>
  <text x="253.0" y="156.0" text-anchor="middle" xml:space="preserve" style="font-size:11.5px;fill:#5D6B7A">all loads complete</text>
  <path class="wire" d="M317,141 L345,141" marker-end="url(#head)"/>
  <rect x="345" y="112" width="128" height="58" rx="10" fill="#DDE3FB" stroke="#5B6BD6" stroke-width="1.3"/>
  <text x="409.0" y="137.0" text-anchor="middle" xml:space="preserve" style="font-size:13px;font-weight:700;fill:#1B2430">compute</text>
  <text x="409.0" y="156.0" text-anchor="middle" xml:space="preserve" style="font-size:11.5px;fill:#5D6B7A">T multiply-adds</text>
  <path class="wire" d="M473,141 L501,141" marker-end="url(#head)"/>
  <rect x="501" y="112" width="128" height="58" rx="10" fill="#EEF0F3" stroke="#9AA5B1" stroke-width="1.3"/>
  <text x="565.0" y="137.0" text-anchor="middle" xml:space="preserve" style="font-size:13px;font-weight:700;fill:#1B2430">barrier</text>
  <text x="565.0" y="156.0" text-anchor="middle" xml:space="preserve" style="font-size:11.5px;fill:#5D6B7A">all reads complete</text>
  <path class="wire" d="M565.0,170 L565.0,213 Q565.0,222 556.0,222 L106.0,222 Q97.0,222 97.0,213 L97.0,170" marker-end="url(#head)"/>
  <rect x="198.6" y="213.0" width="264.8" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="331.0" y="225.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">next phase: t = t + 1, while t &lt; ⌈K/T⌉</text>
</svg>
