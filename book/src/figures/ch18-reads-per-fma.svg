<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 446" width="660" height="446" role="img" aria-label="Horizontal bars of shared-memory reads per multiply-add, (TM + TN) divided by TM times TN, for thread tiles 1 by 1: 2; 2 by 1: 1.5; 2 by 2: 1; 4 by 4: 0.5; 8 by 8: 0.25. Beside each bar, the number of sums a thread keeps in registers: 1, 2, 4, 16 and 64. The 1 by 1 row is the tiled kernel of Chapter 17.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="660" height="446" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Reads per multiply-add</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A larger block of C per thread reads shared memory less often per multiply-add.</text>
  <text x="24.0" y="104.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">reads per multiply-add = (TM + TN) / (TM · TN)</text>
  <text x="350.0" y="132.0" class="tab" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">shared-memory reads per multiply-add</text>
  <text x="600.0" y="132.0" class="tab" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">SUMS</text>
  <text x="136.0" y="167.0" class="name" text-anchor="end" xml:space="preserve">1 × 1</text>
  <rect x="150" y="150" width="400.0" height="26" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.3"/>
  <text x="160.0" y="167.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">(1 + 1) / 1 = 2</text>
  <rect x="578.0" y="150.0" width="44.0" height="26.0" rx="8" fill="#B6DED1" stroke="none" stroke-width="1.2"/>
  <text x="600.0" y="167.2" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">1</text>
  <text x="136.0" y="213.0" class="name" text-anchor="end" xml:space="preserve">2 × 1</text>
  <rect x="150" y="196" width="300.0" height="26" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.3"/>
  <text x="160.0" y="213.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">(2 + 1) / 2 = 1.5</text>
  <rect x="578.0" y="196.0" width="44.0" height="26.0" rx="8" fill="#B6DED1" stroke="none" stroke-width="1.2"/>
  <text x="600.0" y="213.2" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">2</text>
  <text x="136.0" y="259.0" class="name" text-anchor="end" xml:space="preserve">2 × 2</text>
  <rect x="150" y="242" width="200.0" height="26" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.3"/>
  <text x="358.0" y="259.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">(2 + 2) / 4 = 1</text>
  <rect x="578.0" y="242.0" width="44.0" height="26.0" rx="8" fill="#B6DED1" stroke="none" stroke-width="1.2"/>
  <text x="600.0" y="259.2" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">4</text>
  <text x="136.0" y="305.0" class="name" text-anchor="end" xml:space="preserve">4 × 4</text>
  <rect x="150" y="288" width="100.0" height="26" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.3"/>
  <text x="258.0" y="305.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">(4 + 4) / 16 = 0.5</text>
  <rect x="578.0" y="288.0" width="44.0" height="26.0" rx="8" fill="#B6DED1" stroke="none" stroke-width="1.2"/>
  <text x="600.0" y="305.2" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">16</text>
  <text x="136.0" y="351.0" class="name" text-anchor="end" xml:space="preserve">8 × 8</text>
  <rect x="150" y="334" width="50.0" height="26" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.3"/>
  <text x="208.0" y="351.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">(8 + 8) / 64 = 0.25</text>
  <rect x="578.0" y="334.0" width="44.0" height="26.0" rx="8" fill="#B6DED1" stroke="none" stroke-width="1.2"/>
  <text x="600.0" y="351.2" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">64</text>
  <line x1="150" y1="142" x2="150" y2="380" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="150.0" y="396.0" class="note" text-anchor="middle" xml:space="preserve">0</text>
  <line x1="350" y1="142" x2="350" y2="380" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="350.0" y="396.0" class="note" text-anchor="middle" xml:space="preserve">1</text>
  <line x1="550" y1="142" x2="550" y2="380" stroke="#D5DBE3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="550.0" y="396.0" class="note" text-anchor="middle" xml:space="preserve">2</text>
  <text x="24.0" y="426.0" class="note" text-anchor="start" xml:space="preserve">SUMS: the accumulators of 1 thread, TM · TN registers. Chapter 17&#x27;s kernel is the 1 × 1 row.</text>
</svg>
