<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" width="640" height="304" role="img" aria-label="A timeline of 2 threads. Thread 5 reads bin 144, which holds 7, adds 1 and writes 8. Thread 9 reads the same bin before thread 5 has written it, also reads 7, adds 1 and writes 8. 2 pixels were counted and the bin grew by 1.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="640" height="304" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A histogram update without an atomic</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">2 threads count a level of 144 at the same time.</text>
  <text x="126.0" y="126.0" class="name" text-anchor="end" xml:space="preserve">thread 5</text>
  <rect x="140.0" y="108.0" width="106.4" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="193.2" y="126.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read 7</text>
  <rect x="259.6" y="108.0" width="78.8" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="299.0" y="126.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">+1</text>
  <rect x="351.6" y="108.0" width="106.4" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="404.8" y="126.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">write 8</text>
  <text x="126.0" y="172.0" class="name" text-anchor="end" xml:space="preserve">thread 9</text>
  <rect x="176.8" y="154.0" width="106.4" height="28.0" rx="6" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="230.0" y="172.0" class="pill" text-anchor="middle" style="fill:#5E9400" xml:space="preserve">read 7</text>
  <rect x="296.4" y="154.0" width="78.8" height="28.0" rx="6" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="335.8" y="172.0" class="pill" text-anchor="middle" style="fill:#5E9400" xml:space="preserve">+1</text>
  <rect x="471.2" y="154.0" width="106.4" height="28.0" rx="6" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="524.4" y="172.0" class="pill" text-anchor="middle" style="fill:#5E9400" xml:space="preserve">write 8</text>
  <line x1="140.0" y1="214.0" x2="600.0" y2="214.0" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="140.0" y="232.0" class="note" text-anchor="start" xml:space="preserve">time</text>
  <text x="40.0" y="262.0" class="mono" text-anchor="start" xml:space="preserve">bin 144 held 7; 2 pixels of level 144 were counted; the bin now holds 8, not 9</text>
  <text x="40.0" y="286.0" class="note" text-anchor="start" xml:space="preserve">Both threads read the bin before either wrote it. An atomic add makes read, add and write 1 step.</text>
</svg>
