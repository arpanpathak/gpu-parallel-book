  <text x="54.0" y="220.0" class="sub" text-anchor="start" xml:space="preserve">map (Chapter 14)</text>
  <path class="wire" d="M168.0,232 L168.0,253" marker-end="url(#head)"/>
  <rect x="147.8" y="233.5" width="40.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="168.0" y="246.3" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">gray</text>
  <rect x="34" y="256" width="268" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M46,256.7 H40 V307.3 H46 A11.3,11.3 0 0 1 34.7,296 V268 A11.3,11.3 0 0 1 46,256.7 Z" fill="#1F8A70"/>
  <text x="54.0" y="278.0" class="name" text-anchor="start" xml:space="preserve">histogram</text>
  <text x="54.0" y="296.0" class="sub" text-anchor="start" xml:space="preserve">histogram (Chapter 22)</text>
  <path class="wire" d="M168.0,308 L168.0,329" marker-end="url(#head)"/>
  <rect x="147.8" y="309.5" width="40.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="168.0" y="322.3" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">bins</text>
  <rect x="34" y="332" width="268" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M46,332.7 H40 V383.3 H46 A11.3,11.3 0 0 1 34.7,372 V344 A11.3,11.3 0 0 1 46,332.7 Z" fill="#1F8A70"/>
  <text x="54.0" y="354.0" class="name" text-anchor="start" xml:space="preserve">equalize table</text>
  <text x="54.0" y="372.0" class="sub" text-anchor="start" xml:space="preserve">scan of 256 counts (Chapter 21)</text>
  <path class="wire" d="M168.0,384 L168.0,405" marker-end="url(#head)"/>
  <rect x="144.5" y="385.5" width="47.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="168.0" y="398.3" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">table</text>
  <rect x="34" y="408" width="268" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M46,408.7 H40 V459.3 H46 A11.3,11.3 0 0 1 34.7,448 V420 A11.3,11.3 0 0 1 46,408.7 Z" fill="#2F6FDB"/>
  <text x="54.0" y="430.0" class="name" text-anchor="start" xml:space="preserve">apply table</text>
  <text x="54.0" y="448.0" class="sub" text-anchor="start" xml:space="preserve">map with a lookup (Chapter 14)</text>
  <rect x="342" y="104" width="268" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M354,104.7 H348 V155.3 H354 A11.3,11.3 0 0 1 342.7,144 V116 A11.3,11.3 0 0 1 354,104.7 Z" fill="#5E9400"/>
  <text x="362.0" y="126.0" class="name" text-anchor="start" xml:space="preserve">blur rows</text>
  <text x="362.0" y="144.0" class="sub" text-anchor="start" xml:space="preserve">stencil with a halo (Chapter 20)</text>
  <path class="wire" d="M476.0,156 L476.0,177" marker-end="url(#head)"/>
  <rect x="439.3" y="157.5" width="73.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="476.0" y="170.3" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">rows, 2 B</text>
  <rect x="342" y="180" width="268" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M354,180.7 H348 V231.3 H354 A11.3,11.3 0 0 1 342.7,220 V192 A11.3,11.3 0 0 1 354,180.7 Z" fill="#5E9400"/>
