  <rect x="445.9" y="233.5" width="60.2" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="476.0" y="246.3" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">blurred</text>
  <rect x="342" y="256" width="268" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M354,256.7 H348 V307.3 H354 A11.3,11.3 0 0 1 342.7,296 V268 A11.3,11.3 0 0 1 354,256.7 Z" fill="#5E9400"/>
  <text x="362.0" y="278.0" class="name" text-anchor="start" xml:space="preserve">sobel</text>
  <text x="362.0" y="296.0" class="sub" text-anchor="start" xml:space="preserve">stencil (Chapter 19)</text>
  <path class="wire" d="M476.0,308 L476.0,329" marker-end="url(#head)"/>
  <rect x="452.5" y="309.5" width="47.0" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="476.0" y="322.3" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">edges</text>
  <rect x="342" y="332" width="268" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M354,332.7 H348 V383.3 H354 A11.3,11.3 0 0 1 342.7,372 V344 A11.3,11.3 0 0 1 354,332.7 Z" fill="#B7791F"/>
  <text x="362.0" y="354.0" class="name" text-anchor="start" xml:space="preserve">edge image</text>
  <text x="362.0" y="372.0" class="sub" text-anchor="start" xml:space="preserve">1 byte per pixel, 2.1 MB</text>
  <path class="wire" d="M302,434.0 L313,434.0 Q322,434.0 322,425.0 L322,139.0 Q322,130.0 330.5,130.0 L339,130.0" marker-end="url(#head)"/>
  <text x="334.0" y="444.0" class="note" text-anchor="start" xml:space="preserve">the equalized image goes to blur rows</text>
  <rect x="334" y="464" width="14" height="14" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="355.0" y="475.5" class="note" text-anchor="start" xml:space="preserve">map</text>
  <rect x="396.8" y="464" width="14" height="14" rx="4" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="417.8" y="475.5" class="note" text-anchor="start" xml:space="preserve">global</text>
  <rect x="479.4" y="464" width="14" height="14" rx="4" fill="#EEF6DC" stroke="#5E9400" stroke-width="1.3"/>
  <text x="500.4" y="475.5" class="note" text-anchor="start" xml:space="preserve">neighborhood</text>
</svg>
