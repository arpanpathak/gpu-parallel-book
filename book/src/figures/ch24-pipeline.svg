  <rect x="34" y="180" width="268" height="52" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M46,180.7 H40 V231.3 H46 A11.3,11.3 0 0 1 34.7,220 V192 A11.3,11.3 0 0 1 46,180.7 Z" fill="#2F6FDB"/>
