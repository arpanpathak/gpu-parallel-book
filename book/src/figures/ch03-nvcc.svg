<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 560" width="660" height="560" role="img" aria-label="vector_add.cu, holding host code and kernels, goes into nvcc, which splits it in 2. The host code is compiled by g++. The kernels are compiled to PTX, a portable form, and then to SASS for sm_87, the machine code of this GPU. Both parts end up in 1 executable, vector_add.">
