<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 412" width="660" height="412" role="img" aria-label="Row 1 holds 2, 4, 4, 5. Pass 1 reads it and finds the maximum 5. Pass 2 reads it again and adds exp(x - 5): 0.0498, 0.3679, 0.3679 and 1, sum 1.7855. Pass 3 reads it a third time and writes 0.0279, 0.2060, 0.2060 and 0.5601. 12 reads and 4 writes of 4 bytes, 16 bytes per element.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker><marker id="head-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker><marker id="head-danger-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker><marker id="head-idle-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="660" height="412" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Softmax in 3 passes</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The maximum, then the sum, then the outputs; each pass reads the row.</text>
  <rect x="16" y="96" width="628" height="300" rx="16" fill="#F0EEE6" stroke="none" stroke-width="1.2"/>
  <rect x="34" y="85" width="177.5" height="22" rx="11" fill="#1B2430"/>
  <text x="122.7" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3 PASSES OVER ROW 1</text>
  <text x="36.0" y="151.0" class="name" text-anchor="start" xml:space="preserve">pass 1: maximum</text>
  <rect x="176.0" y="132.0" width="70.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="211.0" y="150.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">2</text>
  <rect x="252.0" y="132.0" width="70.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="287.0" y="150.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">4</text>
  <rect x="328.0" y="132.0" width="70.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="363.0" y="150.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">4</text>
  <rect x="404.0" y="132.0" width="70.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="439.0" y="150.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">5</text>
  <rect x="480.0" y="137" width="60.2" height="18" rx="9" fill="#EAF1FD"/>
  <text x="510.1" y="149.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">4 reads</text>
  <text x="548.0" y="151.0" class="mono" text-anchor="start" xml:space="preserve">m = 5</text>
  <text x="176.0" y="182.0" class="note" text-anchor="start" xml:space="preserve">max(2, 4, 4, 5)</text>
  <text x="36.0" y="225.0" class="name" text-anchor="start" xml:space="preserve">pass 2: sum</text>
  <rect x="176.0" y="206.0" width="70.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="211.0" y="224.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">0.0498</text>
  <rect x="252.0" y="206.0" width="70.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="287.0" y="224.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">0.3679</text>
  <rect x="328.0" y="206.0" width="70.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="363.0" y="224.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">0.3679</text>
  <rect x="404.0" y="206.0" width="70.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="439.0" y="224.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1.0000</text>
  <rect x="480.0" y="211" width="60.2" height="18" rx="9" fill="#EAF1FD"/>
  <text x="510.1" y="223.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">4 reads</text>
  <text x="548.0" y="225.0" class="mono" text-anchor="start" xml:space="preserve">s = 1.7855</text>
  <text x="176.0" y="256.0" class="note" text-anchor="start" xml:space="preserve">exp(x − 5), added up</text>
  <text x="36.0" y="299.0" class="name" text-anchor="start" xml:space="preserve">pass 3: outputs</text>
  <rect x="176.0" y="280.0" width="70.0" height="28.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.2"/>
  <text x="211.0" y="298.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.0279</text>
  <rect x="252.0" y="280.0" width="70.0" height="28.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.2"/>
  <text x="287.0" y="298.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.2060</text>
  <rect x="328.0" y="280.0" width="70.0" height="28.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.2"/>
  <text x="363.0" y="298.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.2060</text>
  <rect x="404.0" y="280.0" width="70.0" height="28.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.2"/>
  <text x="439.0" y="298.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.5601</text>
  <rect x="480.0" y="285" width="60.2" height="18" rx="9" fill="#EAF1FD"/>
  <text x="510.1" y="297.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">4 reads</text>
  <text x="548.0" y="299.0" class="mono" text-anchor="start" xml:space="preserve">4 writes</text>
  <text x="36.0" y="356.0" class="note" text-anchor="start" xml:space="preserve">Pass 2 needs m from pass 1, and pass 3 needs s from pass 2: each pass reads</text>
  <text x="36.0" y="374.0" class="note" text-anchor="start" xml:space="preserve">the row again. 12 reads and 4 writes of 4 bytes: 64 bytes, 16 bytes per element.</text>
</svg>
