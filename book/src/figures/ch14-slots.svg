<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 486" width="660" height="486" role="img" aria-label="4 rows of 8 SMs, each SM drawn with 6 slots for blocks of 256 threads. With 1 block per SM, 1 slot of 6 is filled; with 3, half; with 6, all; with 12, all slots are filled and a second wave of 6 blocks per SM waits.">
