  <text x="24.0" y="456.0" class="note" text-anchor="start" xml:space="preserve">Each multiply-add needs 2 operands. 1 thread per element fetches both from global memory;</text>
  <text x="24.0" y="474.0" class="note" text-anchor="start" xml:space="preserve">a tile fetches 2 of every 32 from global memory and the rest from shared memory; a 4 × 4</text>
