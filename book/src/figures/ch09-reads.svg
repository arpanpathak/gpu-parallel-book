<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 514" width="660" height="514" role="img" aria-label="Three cards, 1 per kernel, counting the floats 1 thread reads for 16 multiply-adds. 1 per thread: 32 from global memory. Tiles of 16 by 16: 2 from global memory and 32 from shared memory. 4 by 4 per thread: half a float from global memory and 8 from shared memory.">
