<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436" width="640" height="436" role="img" aria-label="A timeline of cycles 0 to 12 for warps 0 to 3. In cycle 0 warp 0 issues a load, then waits for its data in cycles 1 to 8. Meanwhile the scheduler issues an instruction from warp 1 in cycle 1, warp 2 in cycle 2, warp 3 in cycle 3, warp 1 again in cycle 4, and so on. In cycle 9 warp 0&#x27;s data has arrived and it issues an add. The bottom row shows one instruction issued in every cycle.">
