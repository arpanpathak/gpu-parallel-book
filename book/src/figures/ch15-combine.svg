<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 242" width="640" height="242" role="img" aria-label="2 ways to combine the block sums 32 and 31. Left: each block writes its partial sum, and a second kernel, which starts after every block of the first is done, adds them in a fixed order: 63. Right: each block adds its sum into result with an atomic addition, in the order the blocks finish, here block 1 then block 0: 0, 31, 63.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="m-hi" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#4F52C4"/></marker>
    <marker id="m-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#8A94A3"/></marker>
    <marker id="m-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#C2412D"/></marker>
    <marker id="m-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#1F2633"/></marker>
    <marker id="m-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#2E8B57"/></marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7275D6"/></marker>
    <marker id="m-mint" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F9F80"/></marker>
    <marker id="m-peach" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#D98654"/></marker>
    <marker id="m-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CC6A91"/></marker>
  </defs>
  <rect width="640" height="242" rx="12" fill="#FFFFFF"/>
  <text x="20.0" y="22.0" font-size="12.5" fill="#1F2633" text-anchor="start" font-weight="700" xml:space="preserve">a second launch</text>
  <text x="340.0" y="22.0" font-size="12.5" fill="#1F2633" text-anchor="start" font-weight="700" xml:space="preserve">atomic additions</text>
  <rect x="30.0" y="40.0" width="110.0" height="28.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
  <text x="85.0" y="58.1" font-size="11.5" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">block 0: 32</text>
  <rect x="160.0" y="40.0" width="110.0" height="28.0" rx="5" fill="#D5F0E6" stroke="#3F9F80" stroke-width="1.1"/>
  <text x="215.0" y="58.1" font-size="11.5" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">block 1: 31</text>
  <line x1="85.0" y1="69.0" x2="85.0" y2="98.0" stroke="#8A94A3" stroke-width="1.1" marker-end="url(#m-grey)"/>
  <line x1="215.0" y1="69.0" x2="215.0" y2="98.0" stroke="#8A94A3" stroke-width="1.1" marker-end="url(#m-grey)"/>
  <rect x="30.0" y="100.0" width="110.0" height="26.0" rx="5" fill="#FFFFFF" stroke="#C5CBD3" stroke-width="1.1"/>
  <text x="85.0" y="117.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">partial[0] = 32</text>
  <rect x="160.0" y="100.0" width="110.0" height="26.0" rx="5" fill="#FFFFFF" stroke="#C5CBD3" stroke-width="1.1"/>
  <text x="215.0" y="117.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">partial[1] = 31</text>
  <text x="150.0" y="146.0" font-size="10.5" fill="#8A94A3" text-anchor="middle" font-weight="400" xml:space="preserve">end of kernel 1: every block is done</text>
  <line x1="150.0" y1="152.0" x2="150.0" y2="176.0" stroke="#8A94A3" stroke-width="1.1" marker-end="url(#m-grey)"/>
  <rect x="60.0" y="178.0" width="180.0" height="28.0" rx="5" fill="#C9CAF6" stroke="#4F52C4" stroke-width="1.1"/>
  <text x="150.0" y="196.1" font-size="11.5" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">kernel 2: 32 + 31 = 63</text>
  <text x="150.0" y="226.0" font-size="11" fill="#2E8B57" text-anchor="middle" font-weight="600" xml:space="preserve">fixed order, same bits every run</text>
  <rect x="350.0" y="40.0" width="110.0" height="28.0" rx="5" fill="#D5F0E6" stroke="#3F9F80" stroke-width="1.1"/>
  <text x="405.0" y="58.1" font-size="11.5" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">block 1: 31</text>
  <rect x="480.0" y="40.0" width="110.0" height="28.0" rx="5" fill="#DEDFFA" stroke="#7275D6" stroke-width="1.1"/>
  <text x="535.0" y="58.1" font-size="11.5" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">block 0: 32</text>
  <text x="405.0" y="84.0" font-size="10.5" fill="#8A94A3" text-anchor="middle" font-weight="400" xml:space="preserve">finishes first</text>
  <text x="535.0" y="84.0" font-size="10.5" fill="#8A94A3" text-anchor="middle" font-weight="400" xml:space="preserve">finishes second</text>
  <line x1="405.0" y1="89.0" x2="405.0" y2="116.0" stroke="#3F9F80" stroke-width="1.3" marker-end="url(#m-mint)"/>
  <line x1="535.0" y1="89.0" x2="535.0" y2="116.0" stroke="#7275D6" stroke-width="1.3" marker-end="url(#m-blue)"/>
  <rect x="350.0" y="118.0" width="240.0" height="26.0" rx="5" fill="#FFFFFF" stroke="#C5CBD3" stroke-width="1.1"/>
  <text x="470.0" y="135.1" font-size="11.5" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">result: 0 → 31 → 63</text>
  <text x="470.0" y="168.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">1 kernel, no second launch;</text>
  <text x="470.0" y="186.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">the order of additions depends on timing</text>
  <text x="470.0" y="226.0" font-size="11" fill="#C2412D" text-anchor="middle" font-weight="600" xml:space="preserve">order can change between runs</text>
</svg>
