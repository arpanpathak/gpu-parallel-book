<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 498" width="660" height="498" role="img" aria-label="Top: 2 closures on the host. The first, move x y to a times x plus y, captures a = 2.5, 4 bytes. The second, x max y, captures nothing. Bottom: each has its own type, and the compiler builds 1 kernel map for each: the first receives its closure as 1 parameter holding a = 2.5, the second as an empty parameter.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="498" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Closures as kernel arguments</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each closure has its own type, and gets its own kernel.</text>
  <rect x="16" y="104" width="628" height="150" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="59.5" height="22" rx="11" fill="#1B2430"/>
  <text x="63.7" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">HOST</text>
  <rect x="16" y="274" width="628" height="160" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="263" width="75.2" height="22" rx="11" fill="#1B2430"/>
  <text x="71.6" y="278.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">DEVICE</text>
  <rect x="40" y="140" width="280" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,140.7 H46 V231.3 H52 A11.3,11.3 0 0 1 40.7,220 V152 A11.3,11.3 0 0 1 52,140.7 Z" fill="#2F6FDB"/>
  <text x="60.0" y="173.0" class="name" text-anchor="start" xml:space="preserve">move |x, y| a * x + y</text>
  <text x="60.0" y="191.0" class="sub" text-anchor="start" xml:space="preserve">captures a = 2.5</text>
  <text x="60.0" y="209.0" class="sub" text-anchor="start" xml:space="preserve">4 bytes</text>
  <rect x="340" y="140" width="280" height="92" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M352,140.7 H346 V231.3 H352 A11.3,11.3 0 0 1 340.7,220 V152 A11.3,11.3 0 0 1 352,140.7 Z" fill="#7A4FD0"/>
  <text x="360.0" y="173.0" class="name" text-anchor="start" xml:space="preserve">|x, y| x.max(y)</text>
  <text x="360.0" y="191.0" class="sub" text-anchor="start" xml:space="preserve">captures nothing</text>
  <text x="360.0" y="209.0" class="sub" text-anchor="start" xml:space="preserve">0 bytes</text>
  <path d="M180,232 V307" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <path d="M480,232 V307" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="40" y="310" width="280" height="100" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,310.7 H46 V409.3 H52 A11.3,11.3 0 0 1 40.7,398 V322 A11.3,11.3 0 0 1 52,310.7 Z" fill="#2F6FDB"/>
  <text x="60.0" y="347.0" class="name" text-anchor="start" xml:space="preserve">map::&lt;closure 1&gt;</text>
  <text x="60.0" y="365.0" class="sub" text-anchor="start" xml:space="preserve">f arrives as 1 parameter,</text>
  <text x="60.0" y="383.0" class="sub" text-anchor="start" xml:space="preserve">{ a: 2.5 }</text>
  <rect x="340" y="310" width="280" height="100" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M352,310.7 H346 V409.3 H352 A11.3,11.3 0 0 1 340.7,398 V322 A11.3,11.3 0 0 1 352,310.7 Z" fill="#7A4FD0"/>
  <text x="360.0" y="347.0" class="name" text-anchor="start" xml:space="preserve">map::&lt;closure 2&gt;</text>
  <text x="360.0" y="365.0" class="sub" text-anchor="start" xml:space="preserve">f arrives as 1 parameter,</text>
  <text x="360.0" y="383.0" class="sub" text-anchor="start" xml:space="preserve">{ }, empty</text>
  <text x="40.0" y="458.0" class="note" text-anchor="start" xml:space="preserve">The generic kernel map&lt;F&gt; is compiled once for every closure type it is</text>
  <text x="40.0" y="476.0" class="note" text-anchor="start" xml:space="preserve">launched with, and in each one the call f(x, y) runs that closure&#x27;s code.</text>
</svg>
