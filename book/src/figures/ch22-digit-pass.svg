<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 594" width="660" height="594" role="img" aria-label="A pass on the 2-bit digit of 5, 2, 7, 2, 0, 6, 3, 5. Digits 1, 2, 3, 2, 0, 2, 3, 1. Histogram 1, 2, 3, 2; exclusive scan 0, 1, 3, 6. Ranks among equal digits 0, 0, 0, 1, 0, 2, 1, 1. Positions 1, 3, 6, 4, 0, 5, 7, 2. Output 0, 5, 5, 2, 2, 6, 7, 3.">
