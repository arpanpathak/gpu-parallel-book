<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 648" width="660" height="648" role="img" aria-label="Paired bars of Rust and C++ times per 4,096 by 4,096 matrix on a Jetson Orin NX. Softmax rows of 4,096: 3 passes 2.025 and 1.434 ms, online 2.255 and 1.480 ms, fused 1.435 and 1.417 ms. Rows of 65,536: 3 passes 3.985 and 3.129 ms, online 3.015 and 2.373 ms. Layer norm: sum of squares 1.808 and 1.464 ms, Welford 2.112 and 1.920 ms, fused 1.424 and 1.445 ms. Dashed lines mark the modeled byte count at 102 GB/s.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker><marker id="head-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker><marker id="head-danger-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker><marker id="head-idle-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="660" height="648" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Measured times</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">1 matrix of 4,096 × 4,096 floats, 64 MiB, per kernel, Jetson Orin NX.</text>
  <text x="40.0" y="128.0" class="name" text-anchor="start" xml:space="preserve">softmax, rows of 4,096</text>
  <text x="40.0" y="152.0" class="note" text-anchor="start" xml:space="preserve">3 passes, 16 B</text>
  <rect x="170.0" y="138.0" width="121.5" height="18.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="430.0" y="152.0" class="mono" text-anchor="start" xml:space="preserve">Rust 2.025 ms</text>
  <rect x="170.0" y="158.0" width="86.0" height="18.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="430.0" y="172.0" class="mono" text-anchor="start" xml:space="preserve">C++  1.434 ms</text>
  <line x1="327.9" y1="136.0" x2="327.9" y2="178.0" stroke="#B7791F" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="40.0" y="202.0" class="note" text-anchor="start" xml:space="preserve">online, 12 B</text>
  <rect x="170.0" y="188.0" width="135.3" height="18.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="430.0" y="202.0" class="mono" text-anchor="start" xml:space="preserve">Rust 2.255 ms</text>
  <rect x="170.0" y="208.0" width="88.8" height="18.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="430.0" y="222.0" class="mono" text-anchor="start" xml:space="preserve">C++  1.480 ms</text>
  <line x1="288.4" y1="186.0" x2="288.4" y2="228.0" stroke="#B7791F" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="40.0" y="252.0" class="note" text-anchor="start" xml:space="preserve">fused, 8 B</text>
  <rect x="170.0" y="238.0" width="86.1" height="18.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="430.0" y="252.0" class="mono" text-anchor="start" xml:space="preserve">Rust 1.435 ms</text>
  <rect x="170.0" y="258.0" width="85.0" height="18.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="430.0" y="272.0" class="mono" text-anchor="start" xml:space="preserve">C++  1.417 ms</text>
  <line x1="249.0" y1="236.0" x2="249.0" y2="278.0" stroke="#B7791F" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="40.0" y="306.0" class="name" text-anchor="start" xml:space="preserve">softmax, rows of 65,536</text>
  <text x="40.0" y="330.0" class="note" text-anchor="start" xml:space="preserve">3 passes, 16 B</text>
  <rect x="170.0" y="316.0" width="239.1" height="18.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="430.0" y="330.0" class="mono" text-anchor="start" xml:space="preserve">Rust 3.985 ms</text>
  <rect x="170.0" y="336.0" width="187.7" height="18.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="430.0" y="350.0" class="mono" text-anchor="start" xml:space="preserve">C++  3.129 ms</text>
  <line x1="327.9" y1="314.0" x2="327.9" y2="356.0" stroke="#B7791F" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="40.0" y="380.0" class="note" text-anchor="start" xml:space="preserve">online, 12 B</text>
  <rect x="170.0" y="366.0" width="180.9" height="18.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="430.0" y="380.0" class="mono" text-anchor="start" xml:space="preserve">Rust 3.015 ms</text>
  <rect x="170.0" y="386.0" width="142.4" height="18.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="430.0" y="400.0" class="mono" text-anchor="start" xml:space="preserve">C++  2.373 ms</text>
  <line x1="288.4" y1="364.0" x2="288.4" y2="406.0" stroke="#B7791F" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="40.0" y="434.0" class="name" text-anchor="start" xml:space="preserve">layer norm, rows of 4,096</text>
  <text x="40.0" y="458.0" class="note" text-anchor="start" xml:space="preserve">sum of x², 12 B</text>
  <rect x="170.0" y="444.0" width="108.5" height="18.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="430.0" y="458.0" class="mono" text-anchor="start" xml:space="preserve">Rust 1.808 ms</text>
  <rect x="170.0" y="464.0" width="87.8" height="18.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="430.0" y="478.0" class="mono" text-anchor="start" xml:space="preserve">C++  1.464 ms</text>
  <line x1="288.4" y1="442.0" x2="288.4" y2="484.0" stroke="#B7791F" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="40.0" y="508.0" class="note" text-anchor="start" xml:space="preserve">Welford, 12 B</text>
  <rect x="170.0" y="494.0" width="126.7" height="18.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="430.0" y="508.0" class="mono" text-anchor="start" xml:space="preserve">Rust 2.112 ms</text>
  <rect x="170.0" y="514.0" width="115.2" height="18.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="430.0" y="528.0" class="mono" text-anchor="start" xml:space="preserve">C++  1.920 ms</text>
  <line x1="288.4" y1="492.0" x2="288.4" y2="534.0" stroke="#B7791F" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="40.0" y="558.0" class="note" text-anchor="start" xml:space="preserve">fused, 8 B</text>
  <rect x="170.0" y="544.0" width="85.4" height="18.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="430.0" y="558.0" class="mono" text-anchor="start" xml:space="preserve">Rust 1.424 ms</text>
  <rect x="170.0" y="564.0" width="86.7" height="18.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="430.0" y="578.0" class="mono" text-anchor="start" xml:space="preserve">C++  1.445 ms</text>
  <line x1="249.0" y1="542.0" x2="249.0" y2="584.0" stroke="#B7791F" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="40.0" y="608.0" class="note" text-anchor="start" xml:space="preserve">Dashed: bytes per element × 16,777,216 elements ÷ 102 GB/s, the time if every</text>
  <text x="40.0" y="626.0" class="note" text-anchor="start" xml:space="preserve">modeled byte went to memory at peak bandwidth.</text>
</svg>
