<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 426" width="660" height="426" role="img" aria-label="2 bars. f32 at n = 2,048: 135.1 of 2,400 GFLOP/s, 5.6% of its peak. f64: 35.2 of 75 GFLOP/s, 46.9% of its peak. The FP64 peak is the FP32 peak divided by the ratio 32 that the GPU reports.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="426" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">f32 and f64 against their peaks</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The same kernel is far from 1 peak and close to the other.</text>
  <rect x="16" y="104" width="628" height="300" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="224.6" height="22" rx="11" fill="#1B2430"/>
  <text x="146.3" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">MATRICES OF 2,048 × 2,048</text>
  <text x="40.0" y="162.0" class="name" text-anchor="start" xml:space="preserve">f32: 135.1 of 2,400 GFLOP/s</text>
  <rect x="40" y="176" width="560" height="26" rx="6" fill="#FFFFFF" stroke="#D5DBE3"/>
  <rect x="40" y="176" width="31.5" height="26" rx="6" fill="#2F6FDB"/>
  <text x="81.5" y="194.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">5.6%</text>
  <text x="40.0" y="272.0" class="name" text-anchor="start" xml:space="preserve">f64: 35.2 of 75 GFLOP/s</text>
  <rect x="40" y="286" width="560" height="26" rx="6" fill="#FFFFFF" stroke="#D5DBE3"/>
  <rect x="40" y="286" width="262.8" height="26" rx="6" fill="#7A4FD0"/>
  <text x="312.8" y="304.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">46.9%</text>
  <text x="40.0" y="384.0" class="note" text-anchor="start" xml:space="preserve">FP32 peak 2,400 GFLOP/s; the GPU reports 32 times fewer FP64 operations, 75 GFLOP/s.</text>
</svg>
