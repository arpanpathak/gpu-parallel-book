<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 508" width="660" height="508" role="img" aria-label="Five cards from fast to slow. Registers: 256 KB per SM, private to a thread, about 1 cycle. Shared memory and L1: up to 228 KB per SM, about 30 cycles. These two are on the SM. L2 cache: 50 MB shared by all SMs, about 200 cycles. Global memory: 80 GB beside the GPU chip, about 500 cycles. Host memory: the CPU&#x27;s memory, over a link, thousands of cycles. Bar lengths grow with the square root of the time.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="508" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Where a thread&#x27;s data can live</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The memory of an H100, from the fastest and smallest to the slowest.</text>
  <rect x="24" y="108" width="412" height="156" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="42" y="97" width="98.8" height="22" rx="11" fill="#1B2430"/>
  <text x="91.4" y="112.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">ON THE SM</text>
  <rect x="40" y="126" width="380" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,126.7 H46 V181.3 H52 A11.3,11.3 0 0 1 40.7,170 V138 A11.3,11.3 0 0 1 52,126.7 Z" fill="#2F6FDB"/>
  <rect x="56" y="138.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(62.0,144.0) scale(0.8333)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="98.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">registers</text>
  <text x="98.0" y="168.0" class="sub" text-anchor="start" xml:space="preserve">256 KB per SM, private to a thread</text>
  <rect x="448" y="142" width="6.0" height="14" rx="5" fill="#2F6FDB"/>
  <text x="448.0" y="174.0" class="sub" text-anchor="start" xml:space="preserve">about 1 cycle</text>
  <rect x="40" y="196" width="380" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,196.7 H46 V251.3 H52 A11.3,11.3 0 0 1 40.7,240 V208 A11.3,11.3 0 0 1 52,196.7 Z" fill="#1F8A70"/>
  <rect x="56" y="208.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(62.0,214.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="98.0" y="220.0" class="name" text-anchor="start" xml:space="preserve">shared memory and L1</text>
  <text x="98.0" y="238.0" class="sub" text-anchor="start" xml:space="preserve">up to 228 KB per SM</text>
  <rect x="448" y="212" width="21.9" height="14" rx="5" fill="#1F8A70"/>
  <text x="448.0" y="244.0" class="sub" text-anchor="start" xml:space="preserve">about 30 cycles</text>
  <rect x="40" y="288" width="380" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,288.7 H46 V343.3 H52 A11.3,11.3 0 0 1 40.7,332 V300 A11.3,11.3 0 0 1 52,288.7 Z" fill="#B7791F"/>
  <rect x="56" y="300.0" width="32" height="32" rx="8" fill="#FBF1DC"/>
  <g transform="translate(62.0,306.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#B7791F" fill-rule="evenodd"/></g>
  <text x="98.0" y="312.0" class="name" text-anchor="start" xml:space="preserve">L2 cache</text>
  <text x="98.0" y="330.0" class="sub" text-anchor="start" xml:space="preserve">50 MB, shared by all SMs</text>
  <rect x="448" y="304" width="56.6" height="14" rx="5" fill="#B7791F"/>
  <text x="448.0" y="336.0" class="sub" text-anchor="start" xml:space="preserve">about 200 cycles</text>
  <rect x="40" y="358" width="380" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,358.7 H46 V413.3 H52 A11.3,11.3 0 0 1 40.7,402 V370 A11.3,11.3 0 0 1 52,358.7 Z" fill="#7A4FD0"/>
  <rect x="56" y="370.0" width="32" height="32" rx="8" fill="#F0EAFB"/>
  <g transform="translate(62.0,376.0) scale(0.8333)"><path d="M12 2 2 7l10 5 10-5zm-7.8 8.6L2 11.7l10 5 10-5-2.2-1.1L12 14.5zm0 4.7L2 16.4l10 5 10-5-2.2-1.1L12 19.2z" fill="#7A4FD0" fill-rule="evenodd"/></g>
  <text x="98.0" y="382.0" class="name" text-anchor="start" xml:space="preserve">global memory</text>
  <text x="98.0" y="400.0" class="sub" text-anchor="start" xml:space="preserve">80 GB, beside the GPU chip</text>
  <rect x="448" y="374" width="89.4" height="14" rx="5" fill="#7A4FD0"/>
  <text x="448.0" y="406.0" class="sub" text-anchor="start" xml:space="preserve">about 500 cycles</text>
  <rect x="40" y="428" width="380" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,428.7 H46 V483.3 H52 A11.3,11.3 0 0 1 40.7,472 V440 A11.3,11.3 0 0 1 52,428.7 Z" fill="#7F8EA0"/>
  <rect x="56" y="440.0" width="32" height="32" rx="8" fill="#F1F4F7"/>
  <g transform="translate(62.0,446.0) scale(0.8333)"><path d="M5 4h14a1 1 0 0 1 1 1v10H4V5a1 1 0 0 1 1-1zm1 2v7h12V6zM2 16.5h20V18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#7F8EA0" fill-rule="evenodd"/></g>
  <text x="98.0" y="452.0" class="name" text-anchor="start" xml:space="preserve">host memory</text>
  <text x="98.0" y="470.0" class="sub" text-anchor="start" xml:space="preserve">the CPU&#x27;s memory, over a link</text>
  <rect x="448" y="444" width="178.9" height="14" rx="5" fill="#7F8EA0"/>
  <text x="448.0" y="476.0" class="sub" text-anchor="start" xml:space="preserve">thousands of cycles</text>
  <text x="448.0" y="112.0" class="note" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">time to fetch</text>
</svg>
