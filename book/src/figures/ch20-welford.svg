<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 442" width="660" height="442" role="img" aria-label="Left: Welford&#x27;s method on 2, 4, 4 and 5. The mean goes 2, 3, 3.3333, 3.75 and the sum of squared deviations q goes 0, 2, 2.6667, 4.75, so the variance is 4.75 / 4 = 1.1875. Right: the halves 2, 4 (mean 3, q 2) and 4, 5 (mean 4.5, q 0.5) merge to mean 3.75 and q = 2 + 0.5 + 1.5 squared times 2 times 2 / 4 = 4.75.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="442" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Welford&#x27;s method</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A running mean and sum of squared deviations, and how 2 of them merge.</text>
  <rect x="16" y="96" width="300" height="330" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="85" width="161.7" height="22" rx="11" fill="#1B2430"/>
  <text x="114.9" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1 VALUE AT A TIME</text>
  <rect x="332" y="96" width="312" height="330" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="350" y="85" width="153.9" height="22" rx="11" fill="#1B2430"/>
  <text x="426.9" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">MERGING 2 HALVES</text>
  <text x="40.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">x</text>
  <text x="86.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">n</text>
  <text x="140.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">mean</text>
  <text x="236.0" y="132.0" class="name" text-anchor="start" xml:space="preserve">q</text>
  <text x="44.0" y="166.0" class="mono" text-anchor="start" xml:space="preserve">2</text>
  <text x="90.0" y="166.0" class="mono" text-anchor="start" xml:space="preserve">1</text>
  <rect x="124.0" y="146.0" width="84.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="166.0" y="165.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">2.0000</text>
  <rect x="220.0" y="146.0" width="76.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="258.0" y="165.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">0.0000</text>
  <text x="44.0" y="208.0" class="mono" text-anchor="start" xml:space="preserve">4</text>
  <text x="90.0" y="208.0" class="mono" text-anchor="start" xml:space="preserve">2</text>
  <rect x="124.0" y="188.0" width="84.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="166.0" y="207.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">3.0000</text>
  <rect x="220.0" y="188.0" width="76.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="258.0" y="207.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">2.0000</text>
  <text x="44.0" y="250.0" class="mono" text-anchor="start" xml:space="preserve">4</text>
  <text x="90.0" y="250.0" class="mono" text-anchor="start" xml:space="preserve">3</text>
  <rect x="124.0" y="230.0" width="84.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="166.0" y="249.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">3.3333</text>
  <rect x="220.0" y="230.0" width="76.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="258.0" y="249.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">2.6667</text>
  <text x="44.0" y="292.0" class="mono" text-anchor="start" xml:space="preserve">5</text>
  <text x="90.0" y="292.0" class="mono" text-anchor="start" xml:space="preserve">4</text>
  <rect x="124.0" y="272.0" width="84.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="166.0" y="291.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">3.7500</text>
  <rect x="220.0" y="272.0" width="76.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="258.0" y="291.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">4.7500</text>
  <text x="40.0" y="336.0" class="note" text-anchor="start" xml:space="preserve">delta = x − mean (old)</text>
  <text x="40.0" y="354.0" class="note" text-anchor="start" xml:space="preserve">mean += delta ÷ n</text>
  <text x="40.0" y="372.0" class="note" text-anchor="start" xml:space="preserve">q += delta × (x − mean (new))</text>
  <text x="40.0" y="400.0" class="note" text-anchor="start" xml:space="preserve">variance = q ÷ n = 4.7500 ÷ 4 = 1.1875</text>
  <rect x="352" y="128" width="132" height="88" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M364,128.7 H358 V215.3 H364 A11.3,11.3 0 0 1 352.7,204 V140 A11.3,11.3 0 0 1 364,128.7 Z" fill="#2F6FDB"/>
  <text x="372.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">2, 4</text>
  <text x="372.0" y="168.0" class="sub" text-anchor="start" xml:space="preserve">n = 2</text>
  <text x="372.0" y="186.0" class="sub" text-anchor="start" xml:space="preserve">mean = 3</text>
  <text x="372.0" y="204.0" class="sub" text-anchor="start" xml:space="preserve">q = 2</text>
  <rect x="496" y="128" width="132" height="88" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M508,128.7 H502 V215.3 H508 A11.3,11.3 0 0 1 496.7,204 V140 A11.3,11.3 0 0 1 508,128.7 Z" fill="#7A4FD0"/>
  <text x="516.0" y="150.0" class="name" text-anchor="start" xml:space="preserve">4, 5</text>
  <text x="516.0" y="168.0" class="sub" text-anchor="start" xml:space="preserve">n = 2</text>
  <text x="516.0" y="186.0" class="sub" text-anchor="start" xml:space="preserve">mean = 4.5</text>
  <text x="516.0" y="204.0" class="sub" text-anchor="start" xml:space="preserve">q = 0.5</text>
  <line x1="418.0" y1="216.0" x2="418.0" y2="236.0" stroke="#3F5873" stroke-width="1.6"/>
  <line x1="562.0" y1="216.0" x2="562.0" y2="236.0" stroke="#3F5873" stroke-width="1.6"/>
  <line x1="418.0" y1="236.0" x2="562.0" y2="236.0" stroke="#3F5873" stroke-width="1.6"/>
  <circle cx="490" cy="236" r="3" fill="#3F5873"/>
  <path d="M490,236 V265" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="352" y="268" width="276" height="76" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M364,268.7 H358 V343.3 H364 A11.3,11.3 0 0 1 352.7,332 V280 A11.3,11.3 0 0 1 364,268.7 Z" fill="#2E8B3D"/>
  <text x="372.0" y="293.0" class="name" text-anchor="start" xml:space="preserve">2, 4, 4, 5</text>
  <text x="372.0" y="311.0" class="sub" text-anchor="start" xml:space="preserve">n = 4, mean = 3.75</text>
  <text x="372.0" y="329.0" class="sub" text-anchor="start" xml:space="preserve">q = 4.75</text>
  <text x="356.0" y="380.0" class="note" text-anchor="start" xml:space="preserve">delta = 4.5 − 3 = 1.5</text>
  <text x="356.0" y="398.0" class="note" text-anchor="start" xml:space="preserve">q = 2 + 0.5 + 1.5² × 2 × 2 ÷ 4 = 4.75</text>
</svg>
