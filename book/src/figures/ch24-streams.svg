<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 428" width="640" height="428" role="img" aria-label="Top: on 1 stream each image is copied in, processed and copied out before the next starts. On 3 streams the copy of 1 image overlaps the kernels of another. Bottom, measured images per second for a batch of 128 images: 1 stream 587.6; 2 streams 692.8; 3 streams 699.9; CPU, 8 cores 46.3.">
