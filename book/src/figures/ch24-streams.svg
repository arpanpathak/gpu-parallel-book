<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" width="640" height="404" role="img" aria-label="Top: on 1 stream each image is copied in, processed by the 7 kernels and copied out before the next one starts. On 2 streams the copies of 1 image run while the kernels of the other run. Bottom, measured images per second for a batch of 128 images in C++: 1 stream 695.3; 2 streams 835.3; 3 streams 859.5; CPU, 8 cores 37.7.">
