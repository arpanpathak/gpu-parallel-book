  <rect filter="url(#m3-shadow)" x="340.0" y="128.0" width="296.0" height="222.0" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1.3"/>
  <text x="360.0" y="158.0" text-anchor="start" font-size="13" font-weight="650" style="fill:#3B47B0" xml:space="preserve">block (0, 1), thread (1, 0)</text>
  <text x="360.0" y="186.0" text-anchor="start" font-size="12.5" style="fill:#1B2430" xml:space="preserve">The block covers rows 0–1 and</text>
  <text x="360.0" y="204.0" text-anchor="start" font-size="12.5" style="fill:#1B2430" xml:space="preserve">columns 2–3 of C.</text>
  <text x="360.0" y="232.0" text-anchor="start" font-size="12" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" style="fill:#1B2430" xml:space="preserve">row = blockIdx.y · blockDim.y</text>
  <text x="360.0" y="250.0" text-anchor="start" font-size="12" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" style="fill:#1B2430" xml:space="preserve">      + threadIdx.y = 0 · 2 + 1 = 1</text>
  <text x="360.0" y="272.0" text-anchor="start" font-size="12" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" style="fill:#1B2430" xml:space="preserve">col = blockIdx.x · blockDim.x</text>
  <text x="360.0" y="290.0" text-anchor="start" font-size="12" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" style="fill:#1B2430" xml:space="preserve">      + threadIdx.x = 1 · 2 + 0 = 2</text>
  <text x="360.0" y="322.0" text-anchor="start" font-size="12.5" font-weight="650" style="fill:#3B47B0" xml:space="preserve">so this thread computes c12 = 24</text>
