<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 504" width="660" height="504" role="img" aria-label="Left: a grid of 3 by 3 blocks of 16 by 16 threads laid over a 40 by 40 matrix C; the last 8 rows and columns of threads, 40 to 47, are shaded as outside C. Block (1, 2) is highlighted, and a dot marks thread (5, 3) inside it. Right: row = 1 times 16 plus 5 = 21, column = 2 times 16 plus 3 = 35, and C[21][35] is element 21 times 40 plus 35 = 875 of the slice.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="504" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">1 thread, 1 element of C</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Block and thread coordinates give the row and the column.</text>
  <rect x="16" y="104" width="360" height="380" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="240.4" height="22" rx="11" fill="#1B2430"/>
  <text x="154.2" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">GRID OF 3 × 3 BLOCKS OVER C</text>
  <rect x="52.0" y="150.0" width="96.0" height="96.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="100.0" y="202.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">(0, 0)</text>
  <rect x="154.0" y="150.0" width="96.0" height="96.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="202.0" y="202.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">(0, 1)</text>
  <rect x="256.0" y="150.0" width="96.0" height="96.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="304.0" y="202.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">(0, 2)</text>
  <rect x="52.0" y="252.0" width="96.0" height="96.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="100.0" y="304.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">(1, 0)</text>
  <rect x="154.0" y="252.0" width="96.0" height="96.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="202.0" y="304.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">(1, 1)</text>
  <rect x="256.0" y="252.0" width="96.0" height="96.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="304.0" y="304.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">(1, 2)</text>
  <rect x="52.0" y="354.0" width="96.0" height="96.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="100.0" y="406.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">(2, 0)</text>
  <rect x="154.0" y="354.0" width="96.0" height="96.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="202.0" y="406.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">(2, 1)</text>
  <rect x="256.0" y="354.0" width="96.0" height="96.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="304.0" y="406.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">(2, 2)</text>
  <rect x="302.0" y="150" width="50.0" height="300" fill="#CF4526" opacity="0.10"/>
  <rect x="52" y="400.0" width="300" height="50.0" fill="#CF4526" opacity="0.10"/>
  <circle cx="277.0" cy="285.0" r="5" fill="#2E8B3D"/>
  <text x="52.0" y="474.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">blockIdx (y, x); shaded: rows and</text>
  <text x="52.0" y="492.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">columns 40 to 47, outside C</text>
  <rect x="396" y="120" width="248" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M408,120.7 H402 V189.3 H408 A11.3,11.3 0 0 1 396.7,178 V132 A11.3,11.3 0 0 1 408,120.7 Z" fill="#2F6FDB"/>
  <text x="416.0" y="151.0" class="name" text-anchor="start" xml:space="preserve">block (y, x) = (1, 2)</text>
  <text x="416.0" y="169.0" class="sub" text-anchor="start" xml:space="preserve">blockDim = (16, 16)</text>
  <rect x="396" y="206" width="248" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M408,206.7 H402 V275.3 H408 A11.3,11.3 0 0 1 396.7,264 V218 A11.3,11.3 0 0 1 408,206.7 Z" fill="#7A4FD0"/>
  <text x="416.0" y="237.0" class="name" text-anchor="start" xml:space="preserve">thread (y, x) = (5, 3)</text>
  <text x="416.0" y="255.0" class="sub" text-anchor="start" xml:space="preserve">threadIdx inside the block</text>
  <rect x="396" y="292" width="248" height="84" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M408,292.7 H402 V375.3 H408 A11.3,11.3 0 0 1 396.7,364 V304 A11.3,11.3 0 0 1 408,292.7 Z" fill="#2E8B3D"/>
  <text x="416.0" y="330.0" class="name" text-anchor="start" xml:space="preserve">row = 1 × 16 + 5 = 21</text>
  <text x="416.0" y="348.0" class="sub" text-anchor="start" xml:space="preserve">col = 2 × 16 + 3 = 35</text>
  <rect x="396" y="392" width="248" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M408,392.7 H402 V461.3 H408 A11.3,11.3 0 0 1 396.7,450 V404 A11.3,11.3 0 0 1 408,392.7 Z" fill="#B7791F"/>
  <text x="416.0" y="423.0" class="name" text-anchor="start" xml:space="preserve">C[21][35] is element</text>
  <text x="416.0" y="441.0" class="sub" text-anchor="start" xml:space="preserve">21 × 40 + 35 = 875</text>
</svg>
