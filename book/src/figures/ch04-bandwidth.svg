<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 458" width="660" height="458" role="img" aria-label="Bars of copy speed for 64 MiB on a Jetson Orin NX: pageable host to device 5.7 GB/s, pinned host to device 19.8 GB/s, device to pageable host 7.8 GB/s, device to pinned host 16.3 GB/s. Pinned copies are about 3 times as fast.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="458" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Copy speed, measured on 1 machine</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A Jetson Orin NX: 64 MiB, average of 20 copies, by transfers.cu.</text>
  <text x="216.0" y="136.0" class="sub" text-anchor="end" xml:space="preserve">pageable host → device</text>
  <rect x="230" y="116" width="82.1" height="30" rx="6" fill="#B7791F"/>
  <text x="322.1" y="136.0" class="name" text-anchor="start" xml:space="preserve">5.7 GB/s</text>
  <text x="216.0" y="188.0" class="sub" text-anchor="end" xml:space="preserve">pinned host → device</text>
  <rect x="230" y="168" width="285.1" height="30" rx="6" fill="#7A4FD0"/>
  <text x="525.1" y="188.0" class="name" text-anchor="start" xml:space="preserve">19.8 GB/s</text>
  <text x="216.0" y="240.0" class="sub" text-anchor="end" xml:space="preserve">device → pageable host</text>
  <rect x="230" y="220" width="112.3" height="30" rx="6" fill="#B7791F"/>
  <text x="352.3" y="240.0" class="name" text-anchor="start" xml:space="preserve">7.8 GB/s</text>
  <text x="216.0" y="292.0" class="sub" text-anchor="end" xml:space="preserve">device → pinned host</text>
  <rect x="230" y="272" width="234.7" height="30" rx="6" fill="#7A4FD0"/>
  <text x="474.7" y="292.0" class="name" text-anchor="start" xml:space="preserve">16.3 GB/s</text>
  <line x1="230.0" y1="104.0" x2="230.0" y2="324.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="230.0" y="342.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <line x1="302.0" y1="104.0" x2="302.0" y2="324.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="302.0" y="342.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">5</text>
  <line x1="374.0" y1="104.0" x2="374.0" y2="324.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="374.0" y="342.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">10</text>
  <line x1="446.0" y1="104.0" x2="446.0" y2="324.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="446.0" y="342.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">15</text>
  <line x1="518.0" y1="104.0" x2="518.0" y2="324.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="518.0" y="342.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">20</text>
  <line x1="590.0" y1="104.0" x2="590.0" y2="324.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="590.0" y="342.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">25</text>
  <text x="230.0" y="364.0" class="sub" text-anchor="start" xml:space="preserve">GB/s</text>
  <rect x="40" y="380" width="470" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,380.7 H46 V435.3 H52 A11.3,11.3 0 0 1 40.7,424 V392 A11.3,11.3 0 0 1 52,380.7 Z" fill="#7A4FD0"/>
  <text x="60.0" y="404.0" class="name" text-anchor="start" xml:space="preserve">pinned copies are 2 to 3.5 times as fast</text>
  <text x="60.0" y="422.0" class="sub" text-anchor="start" xml:space="preserve">same machine, same 64 MiB</text>
  <g transform="translate(526,372) scale(0.3333)">
<ellipse cx="78" cy="56" rx="34" ry="24" fill="#d8ecfa" stroke="#9cc3e0" stroke-width="3" transform="rotate(-28 78 56)"/>
<ellipse cx="162" cy="56" rx="34" ry="24" fill="#d8ecfa" stroke="#9cc3e0" stroke-width="3" transform="rotate(28 162 56)"/>
<path d="M104,72 Q96,40 82,30" fill="none" stroke="#3a2a1e" stroke-width="4.5" stroke-linecap="round"/>
<path d="M136,72 Q144,40 158,30" fill="none" stroke="#3a2a1e" stroke-width="4.5" stroke-linecap="round"/>
<circle cx="82" cy="30" r="7" fill="#3a2a1e"/><circle cx="158" cy="30" r="7" fill="#3a2a1e"/>
<path d="M206,132 L226,138 L206,144 Z" fill="#3a2a1e"/>
<line x1="86" y1="160" x2="78" y2="178" stroke="#3a2a1e" stroke-width="6" stroke-linecap="round"/>
<line x1="110" y1="160" x2="106" y2="178" stroke="#3a2a1e" stroke-width="6" stroke-linecap="round"/>
<line x1="130" y1="160" x2="134" y2="178" stroke="#3a2a1e" stroke-width="6" stroke-linecap="round"/>
<line x1="154" y1="160" x2="162" y2="178" stroke="#3a2a1e" stroke-width="6" stroke-linecap="round"/>
<clipPath id="bee1"><ellipse cx="120" cy="124" rx="92" ry="46"/></clipPath>
<ellipse cx="120" cy="124" rx="92" ry="46" fill="#f2b84b"/>
<g clip-path="url(#bee1)" fill="#3a2a1e"><rect x="40" y="70" width="14" height="110"/><rect x="186" y="70" width="14" height="110"/><rect x="164" y="70" width="10" height="110"/></g>
<ellipse cx="120" cy="152" rx="58" ry="12" fill="#d9932a" opacity="0.45"/>
<ellipse cx="99" cy="118" rx="12" ry="15" fill="#ffffff"/><circle cx="99" cy="119.5" r="6.4" fill="#1b2430"/><circle cx="101.3" cy="116.2" r="2.1" fill="#ffffff"/>
<ellipse cx="141" cy="118" rx="12" ry="15" fill="#ffffff"/><circle cx="141" cy="119.5" r="6.4" fill="#1b2430"/><circle cx="143.3" cy="116.2" r="2.1" fill="#ffffff"/>
<ellipse cx="78" cy="138" rx="10" ry="6" fill="#f4a6b6" opacity="0.8"/><ellipse cx="162" cy="138" rx="10" ry="6" fill="#f4a6b6" opacity="0.8"/>
<path d="M106,140 Q120,160 134,140 Z" fill="#7a1f0a"/>
</g>
</svg>
