<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" width="640" height="364" role="img" aria-label="Bytes moved per pair. Map then reduce reads a[i] and b[i], writes p[i] and reads it back: 16 bytes. The fused kernel reads a[i] and b[i] and adds the product to a register: 8 bytes. For 16,777,216 pairs, 268 MB against 134 MB, 2.63 ms against 1.32 ms at 102 GB/s.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Roboto, Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="m-hi" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F51B5"/></marker>
    <marker id="m-grey" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#8E99A8"/></marker>
    <marker id="m-red" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#C2412D"/></marker>
    <marker id="m-ink" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#1F2633"/></marker>
    <marker id="m-green" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#2E8B57"/></marker>
    <marker id="m-blue" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F51B5"/></marker>
    <marker id="m-mint" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#00897B"/></marker>
    <marker id="m-peach" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#E65100"/></marker>
    <marker id="m-pink" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#C2185B"/></marker>
    <filter id="elev" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1F2633" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="640" height="364" rx="14" fill="#FBFAF6"/>
  <text x="28.0" y="38.0" font-size="18" fill="#1F2633" text-anchor="start" font-weight="700" xml:space="preserve">Bytes moved per pair</text>
  <text x="28.0" y="60.0" font-size="12.5" fill="#5D6B7A" text-anchor="start" font-weight="400" xml:space="preserve">16 when the products are stored, 8 when they stay in registers.</text>
  <g transform="translate(0,78)">
  <text x="20.0" y="22.0" font-size="12.5" fill="#1F2633" text-anchor="start" font-weight="700" xml:space="preserve">map, then reduce: 16 bytes per pair</text>
  <rect x="20.0" y="36.0" width="96.0" height="28.0" rx="8" fill="#E3E8FD" stroke="none" stroke-width="1.2" filter="url(#elev)"/>
  <rect x="20.0" y="61.0" width="96.0" height="3" rx="1.5" fill="#3F51B5"/>
  <text x="68.0" y="54.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">read a[i]</text>
  <text x="68.0" y="80.0" font-size="11" fill="#8E99A8" text-anchor="middle" font-weight="400" xml:space="preserve">4 B</text>
  <rect x="124.0" y="36.0" width="96.0" height="28.0" rx="8" fill="#E3E8FD" stroke="none" stroke-width="1.2" filter="url(#elev)"/>
  <rect x="124.0" y="61.0" width="96.0" height="3" rx="1.5" fill="#3F51B5"/>
  <text x="172.0" y="54.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">read b[i]</text>
  <text x="172.0" y="80.0" font-size="11" fill="#8E99A8" text-anchor="middle" font-weight="400" xml:space="preserve">4 B</text>
  <rect x="228.0" y="36.0" width="96.0" height="28.0" rx="8" fill="#FFE6D6" stroke="none" stroke-width="1.2" filter="url(#elev)"/>
  <rect x="228.0" y="61.0" width="96.0" height="3" rx="1.5" fill="#E65100"/>
  <text x="276.0" y="54.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">write p[i]</text>
  <text x="276.0" y="80.0" font-size="11" fill="#8E99A8" text-anchor="middle" font-weight="400" xml:space="preserve">4 B</text>
  <rect x="332.0" y="36.0" width="96.0" height="28.0" rx="8" fill="#E3E8FD" stroke="none" stroke-width="1.2" filter="url(#elev)"/>
  <rect x="332.0" y="61.0" width="96.0" height="3" rx="1.5" fill="#3F51B5"/>
  <text x="380.0" y="54.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">read p[i]</text>
  <text x="380.0" y="80.0" font-size="11" fill="#8E99A8" text-anchor="middle" font-weight="400" xml:space="preserve">4 B</text>
  <text x="450.0" y="56.0" font-size="11" fill="#8E99A8" text-anchor="start" font-weight="400" xml:space="preserve">2 kernels, p in between</text>
  <text x="20.0" y="116.0" font-size="12.5" fill="#1F2633" text-anchor="start" font-weight="700" xml:space="preserve">fused: 8 bytes per pair</text>
  <rect x="20.0" y="130.0" width="96.0" height="28.0" rx="8" fill="#E3E8FD" stroke="none" stroke-width="1.2" filter="url(#elev)"/>
  <rect x="20.0" y="155.0" width="96.0" height="3" rx="1.5" fill="#3F51B5"/>
  <text x="68.0" y="148.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">read a[i]</text>
  <text x="68.0" y="174.0" font-size="11" fill="#8E99A8" text-anchor="middle" font-weight="400" xml:space="preserve">4 B</text>
  <rect x="124.0" y="130.0" width="96.0" height="28.0" rx="8" fill="#E3E8FD" stroke="none" stroke-width="1.2" filter="url(#elev)"/>
  <rect x="124.0" y="155.0" width="96.0" height="3" rx="1.5" fill="#3F51B5"/>
  <text x="172.0" y="148.0" font-size="11" fill="#1F2633" text-anchor="middle" font-weight="400" xml:space="preserve">read b[i]</text>
  <text x="172.0" y="174.0" font-size="11" fill="#8E99A8" text-anchor="middle" font-weight="400" xml:space="preserve">4 B</text>
  <text x="240.0" y="150.0" font-size="11" fill="#2E8B57" text-anchor="start" font-weight="400" xml:space="preserve">product added to a register, never stored</text>
  <text x="140.0" y="214.0" font-size="11.5" fill="#1F2633" text-anchor="end" font-weight="400" xml:space="preserve">map, then reduce</text>
  <rect x="150.0" y="200.0" width="375.2" height="20.0" rx="4" fill="#FACBAF" stroke="none" stroke-width="1.1"/>
  <text x="531.2" y="214.0" font-size="11.5" fill="#1F2633" text-anchor="start" font-weight="600" xml:space="preserve">268 MB</text>
  <text x="140.0" y="244.0" font-size="11.5" fill="#1F2633" text-anchor="end" font-weight="400" xml:space="preserve">fused</text>
  <rect x="150.0" y="230.0" width="187.6" height="20.0" rx="4" fill="#B5E0D8" stroke="none" stroke-width="1.1"/>
  <text x="343.6" y="244.0" font-size="11.5" fill="#1F2633" text-anchor="start" font-weight="600" xml:space="preserve">134 MB</text>
  <text x="20.0" y="272.0" font-size="11.5" fill="#8E99A8" text-anchor="start" font-weight="400" xml:space="preserve">for n = 16,777,216 pairs: at 102 GB/s, 2.63 ms and 1.32 ms</text>
  </g>
</svg>
