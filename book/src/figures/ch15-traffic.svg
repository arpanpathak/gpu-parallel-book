<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" width="640" height="286" role="img" aria-label="Bytes moved per pair. Map then reduce reads a[i] and b[i], writes p[i] and reads it back: 16 bytes. The fused kernel reads a[i] and b[i] and adds the product to a register: 8 bytes. For 16,777,216 pairs, 268 MB against 134 MB, 2.63 ms against 1.32 ms at 102 GB/s.">
