  <rect x="420.0" y="296.0" width="36.0" height="36.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="438.0" y="318.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">3</text>
  <text x="220.0" y="236.0" class="mono" text-anchor="end" xml:space="preserve">tileA[4ty … 4ty + 3][k]</text>
  <text x="476.0" y="230.0" class="mono" text-anchor="start" xml:space="preserve">acc[i][j] += a[i] × b[j]</text>
  <text x="476.0" y="252.0" class="sub" text-anchor="start" xml:space="preserve">16 multiply-adds</text>
  <text x="476.0" y="270.0" class="sub" text-anchor="start" xml:space="preserve">from 8 reads</text>
  <text x="40.0" y="376.0" class="note" text-anchor="start" xml:space="preserve">For each k, a thread reads 4 values of A and 4 of B from shared memory and adds all</text>
  <text x="40.0" y="394.0" class="note" text-anchor="start" xml:space="preserve">16 products a[i] × b[j] into its 16 sums. Row 3 of the patch adds 6, 3, 0 and 3.</text>
</svg>
