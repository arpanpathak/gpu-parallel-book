  <text x="194.0" y="230.0" class="sub" text-anchor="end" xml:space="preserve">4 values of A</text>
  <text x="194.0" y="248.0" class="sub" text-anchor="end" xml:space="preserve">from 1 column</text>
  <text x="400.0" y="230.0" class="mono" text-anchor="start" xml:space="preserve">acc[i][j] += a[i] × b[j]</text>
  <text x="400.0" y="248.0" class="sub" text-anchor="start" xml:space="preserve">16 sums, in registers</text>
  <text x="40.0" y="344.0" class="note" text-anchor="start" xml:space="preserve">For each k, a thread reads 8 values from shared memory and makes 16 multiply-adds.</text>
  <text x="40.0" y="362.0" class="note" text-anchor="start" xml:space="preserve">With 1 element per thread it read 2 values for 1. Shared-memory reads fall 4 times.</text>
