<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 492" width="660" height="492" role="img" aria-label="Two cases. Lanes alternate: every warp has 16 lanes on the sin path and 16 on the sqrt path, and runs the 2 paths one after the other, 2 time units. Warps agree: warp 0 runs only the sin path and warp 1 only the sqrt path, 1 unit each. Measured: 54.8 ms against 28.4 ms on an Orin NX, 12.2 against 6.2 ms on a Thor.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="492" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Divergence</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A warp runs every path that any of its lanes takes.</text>
  <rect x="16" y="104" width="628" height="128" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="413.4" height="22" rx="11" fill="#1B2430"/>
  <text x="240.7" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">LANES ALTERNATE: ODD AND EVEN LANES IN EVERY WARP</text>
  <text x="196.0" y="160.0" class="name" text-anchor="end" xml:space="preserve">warp 0</text>
  <rect x="210.0" y="140.0" width="170.0" height="34.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="295.0" y="161.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">sin path, 16 lanes</text>
  <rect x="386.0" y="140.0" width="170.0" height="34.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="471.0" y="161.0" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">sqrt path, 16 lanes</text>
  <text x="210.0" y="200.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">time: 2 units per warp</text>
  <rect x="16" y="252" width="628" height="168" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="241" width="421.3" height="22" rx="11" fill="#1B2430"/>
  <text x="244.6" y="256.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">WARPS AGREE: WARP 0 TAKES 1 PATH, WARP 1 THE OTHER</text>
  <text x="196.0" y="308.0" class="name" text-anchor="end" xml:space="preserve">warp 0</text>
  <text x="196.0" y="356.0" class="name" text-anchor="end" xml:space="preserve">warp 1</text>
  <rect x="210.0" y="288.0" width="170.0" height="34.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="295.0" y="309.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">sin path, 32 lanes</text>
  <rect x="210.0" y="336.0" width="170.0" height="34.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="295.0" y="357.0" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">sqrt path, 32 lanes</text>
  <text x="210.0" y="398.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">time: 1 unit per warp</text>
  <text x="16.0" y="452.0" class="note" text-anchor="start" xml:space="preserve">Measured, 16,777,216 threads: Orin NX 54.8 ms against 28.4 ms; Thor 12.2 ms</text>
  <text x="16.0" y="470.0" class="note" text-anchor="start" xml:space="preserve">against 6.2 ms. The same work, about twice the time when lanes disagree.</text>
</svg>
