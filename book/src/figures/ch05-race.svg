<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 386" width="660" height="386" role="img" aria-label="A timeline of 4 steps. Step 1: thread A reads the counter, 5. Step 2: thread B reads it, also 5. Step 3: A writes 6. Step 4: B writes 6. Both threads added 1, but the counter grew from 5 to 6 only.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="386" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A lost update</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Read, add and write are 3 steps, and another thread can come between them.</text>
  <text x="154.0" y="148.0" class="name" text-anchor="end" xml:space="preserve">thread A</text>
  <text x="154.0" y="214.0" class="name" text-anchor="end" xml:space="preserve">thread B</text>
  <text x="154.0" y="286.0" class="name" text-anchor="end" xml:space="preserve">counter</text>
  <text x="222.0" y="116.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">step 1</text>
  <text x="334.0" y="116.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">step 2</text>
  <text x="446.0" y="116.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">step 3</text>
  <text x="558.0" y="116.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">step 4</text>
  <rect x="170.0" y="126.0" width="104.0" height="36.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="222.0" y="148.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read 5</text>
  <rect x="282.0" y="192.0" width="104.0" height="36.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="334.0" y="214.0" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">read 5</text>
  <rect x="394.0" y="126.0" width="104.0" height="36.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="446.0" y="148.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">write 6</text>
  <rect x="506.0" y="192.0" width="104.0" height="36.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="558.0" y="214.0" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">write 6</text>
  <rect x="170.0" y="264.0" width="104.0" height="36.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="222.0" y="286.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">5</text>
  <rect x="282.0" y="264.0" width="104.0" height="36.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="334.0" y="286.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">5</text>
  <rect x="394.0" y="264.0" width="104.0" height="36.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="446.0" y="286.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">6</text>
  <rect x="506.0" y="264.0" width="104.0" height="36.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="558.0" y="286.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">6</text>
  <text x="40.0" y="346.0" class="note" text-anchor="start" xml:space="preserve">2 threads each added 1, and the counter grew by 1: thread B read 5 before</text>
  <text x="40.0" y="364.0" class="note" text-anchor="start" xml:space="preserve">thread A wrote 6, so B&#x27;s write replaced A&#x27;s. 1 addition is lost.</text>
</svg>
