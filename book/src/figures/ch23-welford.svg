<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 412" width="660" height="412" role="img" aria-label="Welford&#x27;s update on 1, 2, 3, 4. The deviations from the old mean are 1, 1, 1.5 and 2. The mean goes 1, 1.5, 2, 2.5 and q goes 0, 0.5, 2, 5, so the variance is 5 / 4 = 1.25. On 10,001 to 10,004 in float32 the same steps give q = 5.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker><marker id="head-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker><marker id="head-danger-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker><marker id="head-idle-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="660" height="412" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Welford&#x27;s method</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A running mean and a running sum of squared deviations.</text>
  <rect x="16" y="96" width="628" height="300" rx="16" fill="#F0EEE6" stroke="none" stroke-width="1.2"/>
  <rect x="34" y="85" width="208.9" height="22" rx="11" fill="#1B2430"/>
  <text x="138.5" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">WELFORD&#x27;S UPDATE, ROW 0</text>
  <text x="36.0" y="130.0" class="name" text-anchor="start" xml:space="preserve">x</text>
  <text x="86.0" y="130.0" class="name" text-anchor="start" xml:space="preserve">n</text>
  <text x="130.0" y="130.0" class="name" text-anchor="start" xml:space="preserve">δ = x − μ(old)</text>
  <text x="290.0" y="130.0" class="name" text-anchor="start" xml:space="preserve">μ</text>
  <text x="400.0" y="130.0" class="name" text-anchor="start" xml:space="preserve">q</text>
  <text x="500.0" y="130.0" class="name" text-anchor="start" xml:space="preserve">q added</text>
  <text x="36.0" y="161.0" class="mono" text-anchor="start" xml:space="preserve">1</text>
  <text x="86.0" y="161.0" class="mono" text-anchor="start" xml:space="preserve">1</text>
  <rect x="150.0" y="142.0" width="80.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="190.0" y="160.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">1.0</text>
  <rect x="262.0" y="142.0" width="80.0" height="28.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.2"/>
  <text x="302.0" y="160.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1.0</text>
  <rect x="372.0" y="142.0" width="80.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="412.0" y="160.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">0.0</text>
  <text x="500.0" y="161.0" class="mono" text-anchor="start" xml:space="preserve">1.0 × 0.0 = 0.0</text>
  <text x="36.0" y="197.0" class="mono" text-anchor="start" xml:space="preserve">2</text>
  <text x="86.0" y="197.0" class="mono" text-anchor="start" xml:space="preserve">2</text>
  <rect x="150.0" y="178.0" width="80.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="190.0" y="196.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">1.0</text>
  <rect x="262.0" y="178.0" width="80.0" height="28.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.2"/>
  <text x="302.0" y="196.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1.5</text>
  <rect x="372.0" y="178.0" width="80.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="412.0" y="196.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">0.5</text>
  <text x="500.0" y="197.0" class="mono" text-anchor="start" xml:space="preserve">1.0 × 0.5 = 0.5</text>
  <text x="36.0" y="233.0" class="mono" text-anchor="start" xml:space="preserve">3</text>
  <text x="86.0" y="233.0" class="mono" text-anchor="start" xml:space="preserve">3</text>
  <rect x="150.0" y="214.0" width="80.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="190.0" y="232.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">1.5</text>
  <rect x="262.0" y="214.0" width="80.0" height="28.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.2"/>
  <text x="302.0" y="232.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">2.0</text>
  <rect x="372.0" y="214.0" width="80.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="412.0" y="232.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">2.0</text>
  <text x="500.0" y="233.0" class="mono" text-anchor="start" xml:space="preserve">1.5 × 1.0 = 1.5</text>
  <text x="36.0" y="269.0" class="mono" text-anchor="start" xml:space="preserve">4</text>
  <text x="86.0" y="269.0" class="mono" text-anchor="start" xml:space="preserve">4</text>
  <rect x="150.0" y="250.0" width="80.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="190.0" y="268.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">2.0</text>
  <rect x="262.0" y="250.0" width="80.0" height="28.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.2"/>
  <text x="302.0" y="268.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">2.5</text>
  <rect x="372.0" y="250.0" width="80.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="412.0" y="268.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">5.0</text>
  <text x="500.0" y="269.0" class="mono" text-anchor="start" xml:space="preserve">2.0 × 1.5 = 3.0</text>
  <text x="36.0" y="314.0" class="note" text-anchor="start" xml:space="preserve">μ(new) = μ(old) + δ ÷ n,   q(new) = q(old) + δ × (x − μ(new))</text>
  <text x="36.0" y="334.0" class="note" text-anchor="start" xml:space="preserve">variance = q ÷ n = 5 ÷ 4 = 1.25</text>
  <text x="36.0" y="354.0" class="note" text-anchor="start" xml:space="preserve">On 10,001 to 10,004 in float32 the same steps give q = 5 exactly.</text>
</svg>
