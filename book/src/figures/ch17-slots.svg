<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 506" width="660" height="506" role="img" aria-label="Left, a 4 by 4 tile with its slots numbered 0 to 15 row by row; slot 7 is highlighted, written by thread x = 3, y = 1, because 1 times 4 plus 3 is 7. Right, 3 cards for T = 16: 256 threads with x and y from 0 to 15; the largest slot is 15 times 16 plus 15, 255, less than 256; 256 distinct slots, 1 writer each.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="506" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Each slot has 1 writer</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Thread (x, y) writes slot y × T + x, and no other thread does.</text>
  <rect x="16" y="104" width="300" height="330" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="240.4" height="22" rx="11" fill="#1B2430"/>
  <text x="154.2" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">T = 4: 16 THREADS, 16 SLOTS</text>
  <rect x="344" y="104" width="300" height="330" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="362" y="93" width="75.2" height="22" rx="11" fill="#1B2430"/>
  <text x="399.6" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">T = 16</text>
  <rect x="56.0" y="150.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="80.5" y="178.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <rect x="108.0" y="150.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="132.5" y="178.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">1</text>
  <rect x="160.0" y="150.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="184.5" y="178.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">2</text>
  <rect x="212.0" y="150.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="236.5" y="178.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">3</text>
  <rect x="56.0" y="202.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="80.5" y="230.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">4</text>
  <rect x="108.0" y="202.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="132.5" y="230.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">5</text>
  <rect x="160.0" y="202.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="184.5" y="230.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">6</text>
  <rect x="212.0" y="202.0" width="49.0" height="49.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="236.5" y="230.5" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">7</text>
  <rect x="56.0" y="254.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="80.5" y="282.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">8</text>
  <rect x="108.0" y="254.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="132.5" y="282.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">9</text>
  <rect x="160.0" y="254.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="184.5" y="282.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">10</text>
  <rect x="212.0" y="254.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="236.5" y="282.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">11</text>
  <rect x="56.0" y="306.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="80.5" y="334.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">12</text>
  <rect x="108.0" y="306.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="132.5" y="334.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">13</text>
  <rect x="160.0" y="306.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="184.5" y="334.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">14</text>
  <rect x="212.0" y="306.0" width="49.0" height="49.0" rx="4" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="236.5" y="334.5" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">15</text>
  <text x="56.0" y="142.0" class="mono" text-anchor="start" xml:space="preserve">slot = y × 4 + x</text>
  <text x="40.0" y="382.0" class="note" text-anchor="start" xml:space="preserve">Thread (3, 1) writes slot 1 × 4 + 3 = 7.</text>
  <text x="40.0" y="400.0" class="note" text-anchor="start" xml:space="preserve">No other (x, y) gives 7.</text>
  <rect x="368" y="140" width="252" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M380,140.7 H374 V213.3 H380 A11.3,11.3 0 0 1 368.7,202 V152 A11.3,11.3 0 0 1 380,140.7 Z" fill="#2F6FDB"/>
  <text x="388.0" y="173.0" class="name" text-anchor="start" xml:space="preserve">256 threads</text>
  <text x="388.0" y="191.0" class="sub" text-anchor="start" xml:space="preserve">x and y from 0 to 15</text>
  <rect x="368" y="228" width="252" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M380,228.7 H374 V301.3 H380 A11.3,11.3 0 0 1 368.7,290 V240 A11.3,11.3 0 0 1 380,228.7 Z" fill="#2E8B3D"/>
  <text x="388.0" y="261.0" class="name" text-anchor="start" xml:space="preserve">largest slot 255</text>
  <text x="388.0" y="279.0" class="sub" text-anchor="start" xml:space="preserve">15 × 16 + 15 = 255 &lt; 256</text>
  <rect x="368" y="316" width="252" height="74" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M380,316.7 H374 V389.3 H380 A11.3,11.3 0 0 1 368.7,378 V328 A11.3,11.3 0 0 1 380,316.7 Z" fill="#7A4FD0"/>
  <text x="388.0" y="349.0" class="name" text-anchor="start" xml:space="preserve">256 distinct slots</text>
  <text x="388.0" y="367.0" class="sub" text-anchor="start" xml:space="preserve">1 writer for each slot</text>
  <text x="16.0" y="466.0" class="note" text-anchor="start" xml:space="preserve">The formula y × T + x gives a different number for every thread of a T × T block, and</text>
  <text x="16.0" y="484.0" class="note" text-anchor="start" xml:space="preserve">the largest is (T − 1) × T + (T − 1) = T² − 1. Each slot of the tile has exactly 1 writer.</text>
</svg>
