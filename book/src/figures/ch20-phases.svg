<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 426" width="640" height="426" role="img" aria-label="A timeline of the 4 threads of block (1, 1). Each thread loads its 4 slots, taking different times; dotted lines show the early threads waiting at the barrier; then all 4 compute their cell from the tile and write it to buffer v.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="640" height="426" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Load, wait, compute</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The barrier separates the loads of all threads from the reads of any thread.</text>
  <line x1="330.0" y1="104.0" x2="330.0" y2="300.0" stroke="#1B2430" stroke-width="2.4"/>
  <text x="330.0" y="318.0" class="name" text-anchor="middle" xml:space="preserve">barrier</text>
  <text x="32.0" y="136.0" class="note" text-anchor="start" xml:space="preserve">thread (0, 0)</text>
  <rect x="130.0" y="120" width="120.0" height="24" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="190.0" y="136.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">load 4 slots</text>
  <line x1="254.0" y1="132.0" x2="326.0" y2="132.0" stroke="#5D6B7A" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="338.0" y="120" width="222.0" height="24" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="449.0" y="136.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">compute 1 cell from the tile</text>
  <text x="32.0" y="180.0" class="note" text-anchor="start" xml:space="preserve">thread (0, 1)</text>
  <rect x="130.0" y="164" width="182.0" height="24" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="221.0" y="180.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">load 4 slots</text>
  <line x1="316.0" y1="176.0" x2="326.0" y2="176.0" stroke="#5D6B7A" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="338.0" y="164" width="222.0" height="24" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="449.0" y="180.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">compute 1 cell from the tile</text>
  <text x="32.0" y="224.0" class="note" text-anchor="start" xml:space="preserve">thread (1, 0)</text>
  <rect x="130.0" y="208" width="90.0" height="24" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="175.0" y="224.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">load 4 slots</text>
  <line x1="224.0" y1="220.0" x2="326.0" y2="220.0" stroke="#5D6B7A" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="338.0" y="208" width="222.0" height="24" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="449.0" y="224.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">compute 1 cell from the tile</text>
  <text x="32.0" y="268.0" class="note" text-anchor="start" xml:space="preserve">thread (1, 1)</text>
  <rect x="130.0" y="252" width="156.0" height="24" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="208.0" y="268.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">load 4 slots</text>
  <line x1="290.0" y1="264.0" x2="326.0" y2="264.0" stroke="#5D6B7A" stroke-width="1.2" stroke-dasharray="3 4"/>
  <rect x="338.0" y="252" width="222.0" height="24" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="449.0" y="268.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">compute 1 cell from the tile</text>
  <text x="130.0" y="350.0" class="note" text-anchor="start" xml:space="preserve">load: global → shared</text>
  <text x="338.0" y="350.0" class="note" text-anchor="start" xml:space="preserve">read: shared only</text>
  <text x="32.0" y="390.0" class="note" text-anchor="start" xml:space="preserve">Dotted: threads that finished loading wait until the last one arrives. Only then may any</text>
  <text x="32.0" y="406.0" class="note" text-anchor="start" xml:space="preserve">thread read the tile.</text>
</svg>
