<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 476" width="660" height="476" role="img" aria-label="8 lanes with digits 1, 2, 3, 2, 0, 2, 3, 1. For lane 5, whose digit is 2, match_any returns lanes 1, 3 and 5. The mask of lanes below 5 keeps lanes 1 and 3, so the rank of lane 5 among the lanes with digit 2 is 2, and the warp holds 3 keys with digit 2.">
