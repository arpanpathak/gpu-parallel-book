<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 412" width="660" height="412" role="img" aria-label="A table for the logits 1, 2, 3 and 4. Their exponentials are 2.718, 7.389, 20.086 and 54.598, which sum to 84.791. Subtracting the maximum 4 gives -3, -2, -1 and 0, whose exponentials 0.0498, 0.1353, 0.3679 and 1 sum to 1.5530. Both routes give the same probabilities 0.0321, 0.0871, 0.2369 and 0.6439, which sum to 1.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="412" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Softmax by hand</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each probability is exp(x) divided by the sum of the exponentials of its row.</text>
  <rect x="16" y="96" width="628" height="300" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="85" width="177.5" height="22" rx="11" fill="#1B2430"/>
  <text x="122.7" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">SOFTMAX OF 4 LOGITS</text>
  <text x="68.0" y="136.0" class="name" text-anchor="middle" xml:space="preserve">x</text>
  <rect x="40.0" y="150.0" width="56.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="68.0" y="169.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1</text>
  <rect x="40.0" y="188.0" width="56.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="68.0" y="207.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">2</text>
  <rect x="40.0" y="226.0" width="56.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="68.0" y="245.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">3</text>
  <rect x="40.0" y="264.0" width="56.0" height="30.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="68.0" y="283.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">4</text>
  <text x="164.0" y="136.0" class="name" text-anchor="middle" xml:space="preserve">exp(x)</text>
  <rect x="116.0" y="150.0" width="96.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="164.0" y="169.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">2.718</text>
  <rect x="116.0" y="188.0" width="96.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="164.0" y="207.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">7.389</text>
  <rect x="116.0" y="226.0" width="96.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="164.0" y="245.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">20.086</text>
  <rect x="116.0" y="264.0" width="96.0" height="30.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="164.0" y="283.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">54.598</text>
  <text x="264.0" y="136.0" class="name" text-anchor="middle" xml:space="preserve">x − 4</text>
  <rect x="232.0" y="150.0" width="64.0" height="30.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="264.0" y="169.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">-3</text>
  <rect x="232.0" y="188.0" width="64.0" height="30.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="264.0" y="207.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">-2</text>
  <rect x="232.0" y="226.0" width="64.0" height="30.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="264.0" y="245.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">-1</text>
  <rect x="232.0" y="264.0" width="64.0" height="30.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="264.0" y="283.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">0</text>
  <text x="364.0" y="136.0" class="name" text-anchor="middle" xml:space="preserve">exp(x − 4)</text>
  <rect x="316.0" y="150.0" width="96.0" height="30.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="364.0" y="169.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">0.0498</text>
  <rect x="316.0" y="188.0" width="96.0" height="30.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="364.0" y="207.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">0.1353</text>
  <rect x="316.0" y="226.0" width="96.0" height="30.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="364.0" y="245.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">0.3679</text>
  <rect x="316.0" y="264.0" width="96.0" height="30.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="364.0" y="283.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">1.0000</text>
  <text x="480.0" y="136.0" class="name" text-anchor="middle" xml:space="preserve">p</text>
  <rect x="432.0" y="150.0" width="96.0" height="30.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="480.0" y="169.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.0321</text>
  <rect x="432.0" y="188.0" width="96.0" height="30.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="480.0" y="207.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.0871</text>
  <rect x="432.0" y="226.0" width="96.0" height="30.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="480.0" y="245.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.2369</text>
  <rect x="432.0" y="264.0" width="96.0" height="30.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="480.0" y="283.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.6439</text>
  <text x="164.0" y="318.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">sum 84.791</text>
  <text x="364.0" y="318.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">sum 1.5530</text>
  <text x="480.0" y="318.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">sum 1.0000</text>
  <text x="40.0" y="350.0" class="note" text-anchor="start" xml:space="preserve">2.718 ÷ 84.791 = 0.0321 and 0.0498 ÷ 1.5530 = 0.0321: subtracting the maximum, 4, divides</text>
  <text x="40.0" y="368.0" class="note" text-anchor="start" xml:space="preserve">every exponential and the sum by the same factor exp(4), so each p is unchanged.</text>
</svg>
