  <text x="52.0" y="136.0" font-size="10.5" fill="#8E99A8" text-anchor="end" font-weight="400" xml:space="preserve">step</text>
  <text x="64.0" y="166.0" font-size="12" fill="#1F2633" text-anchor="start" font-weight="400" xml:space="preserve">Line 3 runs 16 times. Each addition needs the sum of the one before,</text>
  <text x="64.0" y="184.0" font-size="12" fill="#1F2633" text-anchor="start" font-weight="400" xml:space="preserve">so the 16 additions form a chain of 16 steps, whatever the hardware.</text>
  </g>
</svg>
