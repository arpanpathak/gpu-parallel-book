<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="A 5 by 5 grid. The top row holds 100 in each cell, the other 3 edges hold 0. The 9 inner cells are marked with question marks: they are the unknowns. A legend explains boundary and interior cells, and notes that each interior cell must equal the mean of its 4 neighbours, which gives 9 equations for 9 unknowns.">
