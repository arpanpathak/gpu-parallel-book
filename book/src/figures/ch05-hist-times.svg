  <text x="226.0" y="240.0" class="sub" text-anchor="end" xml:space="preserve">all 7, global bins</text>
  <rect x="240" y="220" width="327.1" height="30" rx="6" fill="#CF4526"/>
  <text x="577.1" y="240.0" class="name" text-anchor="start" xml:space="preserve">134.7 ms</text>
  <text x="226.0" y="292.0" class="sub" text-anchor="end" xml:space="preserve">all 7, shared bins</text>
  <rect x="240" y="272" width="11.7" height="30" rx="6" fill="#2E8B3D"/>
  <text x="261.7" y="292.0" class="name" text-anchor="start" xml:space="preserve">4.8 ms</text>
  <text x="240.0" y="364.0" class="sub" text-anchor="start" xml:space="preserve">ms</text>
  <rect x="40" y="380" width="470" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,380.7 H46 V435.3 H52 A11.3,11.3 0 0 1 40.7,424 V392 A11.3,11.3 0 0 1 52,380.7 Z" fill="#2E8B3D"/>
  <text x="60.0" y="404.0" class="name" text-anchor="start" xml:space="preserve">shared bins: 6 to 28 times as fast</text>
  <text x="60.0" y="422.0" class="sub" text-anchor="start" xml:space="preserve">the gain grows with contention</text>
