<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 444" width="640" height="444" role="img" aria-label="Top row, one at a time: twelve steps, L1 C1 S1 L2 C2 S2 and so on, 4 items times 3 stages. Below, pipelined: three rows for load, compute and store. Load runs L1 to L4 in steps 1 to 4, compute runs C1 to C4 in steps 2 to 5, store runs S1 to S4 in steps 3 to 6. In steps 3 and 4 all three stages are busy. Pipelined, the four items take 6 steps, a speedup of 2.">
