<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 538" width="660" height="538" role="img" aria-label="Five cards joined by arrows in a loop. Measure: the Rust pointer chase takes 62 cycles per L1 load, the C++ one 39. Hypothesis: the bounds check of next[j] sits on the chain. Change 1 thing: next.get_unchecked(j) with a SAFETY comment. Measure again: 39 cycles, the same as C++. Verify: every chain ends at the index the host expects.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="538" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The engineering loop, once round</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A real case from this chapter&#x27;s Rust program.</text>
  <rect x="40" y="130" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,130.7 H46 V201.3 H52 A11.3,11.3 0 0 1 40.7,190 V142 A11.3,11.3 0 0 1 52,130.7 Z" fill="#B7791F"/>
  <text x="60.0" y="153.0" class="name" text-anchor="start" xml:space="preserve">measure</text>
  <text x="60.0" y="171.0" class="sub" text-anchor="start" xml:space="preserve">Rust: 62 cycles per L1 load</text>
  <text x="60.0" y="189.0" class="sub" text-anchor="start" xml:space="preserve">C++: 39 cycles</text>
  <rect x="360" y="130" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M372,130.7 H366 V201.3 H372 A11.3,11.3 0 0 1 360.7,190 V142 A11.3,11.3 0 0 1 372,130.7 Z" fill="#7A4FD0"/>
  <text x="380.0" y="153.0" class="name" text-anchor="start" xml:space="preserve">hypothesis</text>
  <text x="380.0" y="171.0" class="sub" text-anchor="start" xml:space="preserve">the bounds check of next[j]</text>
  <text x="380.0" y="189.0" class="sub" text-anchor="start" xml:space="preserve">sits on the chain</text>
  <rect x="360" y="260" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M372,260.7 H366 V331.3 H372 A11.3,11.3 0 0 1 360.7,320 V272 A11.3,11.3 0 0 1 372,260.7 Z" fill="#2F6FDB"/>
  <text x="380.0" y="283.0" class="name" text-anchor="start" xml:space="preserve">change 1 thing</text>
  <text x="380.0" y="301.0" class="sub" text-anchor="start" xml:space="preserve">next.get_unchecked(j)</text>
  <text x="380.0" y="319.0" class="sub" text-anchor="start" xml:space="preserve">with a SAFETY comment</text>
  <rect x="40" y="260" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,260.7 H46 V331.3 H52 A11.3,11.3 0 0 1 40.7,320 V272 A11.3,11.3 0 0 1 52,260.7 Z" fill="#B7791F"/>
  <text x="60.0" y="283.0" class="name" text-anchor="start" xml:space="preserve">measure again</text>
  <text x="60.0" y="301.0" class="sub" text-anchor="start" xml:space="preserve">39 cycles per L1 load</text>
  <text x="60.0" y="319.0" class="sub" text-anchor="start" xml:space="preserve">same as C++</text>
  <rect x="200" y="390" width="260" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M212,390.7 H206 V461.3 H212 A11.3,11.3 0 0 1 200.7,450 V402 A11.3,11.3 0 0 1 212,390.7 Z" fill="#2E8B3D"/>
  <text x="220.0" y="413.0" class="name" text-anchor="start" xml:space="preserve">verify</text>
  <text x="220.0" y="431.0" class="sub" text-anchor="start" xml:space="preserve">every chain ends at the</text>
  <text x="220.0" y="449.0" class="sub" text-anchor="start" xml:space="preserve">index the host expects</text>
  <path class="wire" d="M300,166 L360,166" marker-end="url(#head)"/>
  <path class="wire" d="M490,202 L490,260" marker-end="url(#head)"/>
  <path class="wire" d="M360,296 L300,296" marker-end="url(#head)"/>
  <path class="wire" d="M170,332 L170,417 Q170,426 179,426 L200,426" marker-end="url(#head)"/>
  <text x="40.0" y="498.0" class="note" text-anchor="start" xml:space="preserve">1 change between 2 measurements. A 2nd change (a while loop in place of a for loop) was</text>
  <text x="40.0" y="516.0" class="note" text-anchor="start" xml:space="preserve">measured separately, so each difference has 1 cause.</text>
</svg>
