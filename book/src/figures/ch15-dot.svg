<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 534" width="660" height="534" role="img" aria-label="The vectors a = 1, 2, 3, 4 and b = 2, 0, 1, 3. The map multiplies them element by element into 2, 0, 3, 12. The reduction adds the products in pairs, 2 + 0 = 2 and 3 + 12 = 15, and then 2 + 15 = 17.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="534" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A dot product by hand</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">a · b = 1 × 2 + 2 × 0 + 3 × 1 + 4 × 3 = 17.</text>
  <rect x="16" y="104" width="628" height="150" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="232.5" height="22" rx="11" fill="#1B2430"/>
  <text x="150.3" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">MAP: 1 PRODUCT PER ELEMENT</text>
  <rect x="16" y="282" width="628" height="186" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="271" width="240.4" height="22" rx="11" fill="#1B2430"/>
  <text x="154.2" y="286.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">REDUCE: A TREE OF ADDITIONS</text>
  <rect x="330.0" y="128.0" width="44.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="352.0" y="146.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1</text>
  <rect x="382.0" y="128.0" width="44.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="404.0" y="146.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">2</text>
  <rect x="434.0" y="128.0" width="44.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="456.0" y="146.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">3</text>
  <rect x="486.0" y="128.0" width="44.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="508.0" y="146.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">4</text>
  <rect x="330.0" y="164.0" width="44.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="352.0" y="182.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">2</text>
  <rect x="382.0" y="164.0" width="44.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="404.0" y="182.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">0</text>
  <rect x="434.0" y="164.0" width="44.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="456.0" y="182.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1</text>
  <rect x="486.0" y="164.0" width="44.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="508.0" y="182.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">3</text>
  <rect x="330.0" y="212.0" width="44.0" height="28.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="352.0" y="230.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">2</text>
  <rect x="382.0" y="212.0" width="44.0" height="28.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="404.0" y="230.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">0</text>
  <rect x="434.0" y="212.0" width="44.0" height="28.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="456.0" y="230.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">3</text>
  <rect x="486.0" y="212.0" width="44.0" height="28.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="508.0" y="230.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">12</text>
  <text x="316.0" y="147.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">a</text>
  <text x="316.0" y="183.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">b</text>
  <text x="316.0" y="231.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">a[i] × b[i]</text>
  <text x="352.0" y="205.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">↓</text>
  <text x="404.0" y="205.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">↓</text>
  <text x="456.0" y="205.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">↓</text>
  <text x="508.0" y="205.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">↓</text>
  <rect x="356.0" y="318.0" width="96.0" height="28.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="404.0" y="336.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">2</text>
  <rect x="476.0" y="318.0" width="96.0" height="28.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="524.0" y="336.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">15</text>
  <path d="M352.0,242.0 V280.0 H404.0 V315.0" fill="none" stroke="#3F5873" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M404.0,242.0 V280.0 H404.0 V315.0" fill="none" stroke="#3F5873" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M456.0,242.0 V280.0 H524.0 V315.0" fill="none" stroke="#3F5873" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M508.0,242.0 V280.0 H524.0 V315.0" fill="none" stroke="#3F5873" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="416.0" y="404.0" width="96.0" height="28.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="464.0" y="422.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">17</text>
  <path d="M404.0,348.0 V376.0 H464.0 V401.0" fill="none" stroke="#3F5873" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M524.0,348.0 V376.0 H464.0 V401.0" fill="none" stroke="#3F5873" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#head)"/>
  <text x="316.0" y="337.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">step 1</text>
  <text x="316.0" y="423.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">step 2</text>
  <text x="40.0" y="148.0" class="note" text-anchor="start" xml:space="preserve">4 multiplications,</text>
  <text x="40.0" y="166.0" class="note" text-anchor="start" xml:space="preserve">all independent</text>
  <text x="40.0" y="372.0" class="note" text-anchor="start" xml:space="preserve">3 additions in 2 steps:</text>
  <text x="40.0" y="390.0" class="note" text-anchor="start" xml:space="preserve">2 + 0 = 2, 3 + 12 = 15,</text>
  <text x="40.0" y="408.0" class="note" text-anchor="start" xml:space="preserve">2 + 15 = 17</text>
  <text x="16.0" y="494.0" class="note" text-anchor="start" xml:space="preserve">The products need no communication between threads. The additions do: every</text>
  <text x="16.0" y="512.0" class="note" text-anchor="start" xml:space="preserve">product must reach 1 place, which is the reduction of Chapter 8.</text>
</svg>
