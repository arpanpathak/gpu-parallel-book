<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 392" width="660" height="392" role="img" aria-label="Three threads each call atomicAdd on counter c. Their requests go to an atomic unit in the L2 cache, which performs 1 operation at a time on an address: read, add and write as 1 step. The counter goes from 5 to 8 and no addition is lost.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="392" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">An atomic add</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The memory system performs read, add and write as 1 indivisible step.</text>
  <rect x="24" y="130" width="190" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M36,130.7 H30 V179.3 H36 A11.3,11.3 0 0 1 24.7,168 V142 A11.3,11.3 0 0 1 36,130.7 Z" fill="#2F6FDB"/>
  <rect x="40" y="139.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(46.0,145.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="82.0" y="151.0" class="name" text-anchor="start" xml:space="preserve">thread A</text>
  <text x="82.0" y="169.0" class="sub" text-anchor="start" xml:space="preserve">atomicAdd(c, 1)</text>
  <rect x="24" y="196" width="190" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M36,196.7 H30 V245.3 H36 A11.3,11.3 0 0 1 24.7,234 V208 A11.3,11.3 0 0 1 36,196.7 Z" fill="#7A4FD0"/>
  <rect x="40" y="205.0" width="32" height="32" rx="8" fill="#F0EAFB"/>
  <g transform="translate(46.0,211.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#7A4FD0" fill-rule="evenodd"/></g>
  <text x="82.0" y="217.0" class="name" text-anchor="start" xml:space="preserve">thread B</text>
  <text x="82.0" y="235.0" class="sub" text-anchor="start" xml:space="preserve">atomicAdd(c, 1)</text>
  <rect x="24" y="262" width="190" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M36,262.7 H30 V311.3 H36 A11.3,11.3 0 0 1 24.7,300 V274 A11.3,11.3 0 0 1 36,262.7 Z" fill="#2F6FDB"/>
  <rect x="40" y="271.0" width="32" height="32" rx="8" fill="#EAF1FD"/>
  <g transform="translate(46.0,277.0) scale(0.8333)"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3.3 4.3-1.4 1.4L7.2 12l-2.3 2.3 1.4 1.4L10 12zM11 14v2h7v-2z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="82.0" y="283.0" class="name" text-anchor="start" xml:space="preserve">thread C</text>
  <text x="82.0" y="301.0" class="sub" text-anchor="start" xml:space="preserve">atomicAdd(c, 1)</text>
  <rect x="256" y="186" width="236" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M268,186.7 H262 V255.3 H268 A11.3,11.3 0 0 1 256.7,244 V198 A11.3,11.3 0 0 1 268,186.7 Z" fill="#1F8A70"/>
  <rect x="272" y="205.0" width="32" height="32" rx="8" fill="#E4F4EF"/>
  <g transform="translate(278.0,211.0) scale(0.8333)"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2.2 0h5.6V7a2.8 2.8 0 0 0-5.6 0zM12 13.5a1.6 1.6 0 0 0-.8 3v2h1.6v-2a1.6 1.6 0 0 0-.8-3z" fill="#1F8A70" fill-rule="evenodd"/></g>
  <text x="314.0" y="217.0" class="name" text-anchor="start" xml:space="preserve">atomic unit in L2</text>
  <text x="314.0" y="235.0" class="sub" text-anchor="start" xml:space="preserve">1 operation at a time</text>
  <rect x="520" y="196" width="116" height="50" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M532,196.7 H526 V245.3 H532 A11.3,11.3 0 0 1 520.7,234 V208 A11.3,11.3 0 0 1 532,196.7 Z" fill="#B7791F"/>
  <text x="540.0" y="217.0" class="name" text-anchor="start" xml:space="preserve">counter c</text>
  <text x="540.0" y="235.0" class="sub" text-anchor="start" xml:space="preserve">5 → 8</text>
  <path class="wire" d="M214,155 L225,155 Q234,155 234,164 L234,201 Q234,210 243,210 L256,210" marker-end="url(#head)"/>
  <path class="wire" d="M214,221 L256,221" marker-end="url(#head)"/>
  <path class="wire" d="M214,287 L225,287 Q234,287 234,278 L234,241 Q234,232 243,232 L256,232" marker-end="url(#head)"/>
  <path class="wire" d="M492,221 L520,221" marker-end="url(#head)"/>
  <text x="36.0" y="352.0" class="note" text-anchor="start" xml:space="preserve">Each request reads, adds and writes the counter before the next begins, so</text>
  <text x="36.0" y="370.0" class="note" text-anchor="start" xml:space="preserve">none is lost. Requests to the same address wait for each other.</text>
</svg>
