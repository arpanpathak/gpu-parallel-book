<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" role="img" aria-label="Left: a 4 by 4 grid of threads from 4 blocks of 2 by 2 laid over a 3 by 3 matrix C, outlined in black. The 9 cells inside C are colored by block; the 7 cells in row 3 and column 3 are dashed: threads with no entry. Right: tileA in phase 1 when K = 3. Its left column holds A[0][2] and A[1][2]; its right column would hold column 3 of A, which does not exist, so both slots hold 0.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="340" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Matrices of any size</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Blocks stick out past the edge of C, and a tile past the last column of A holds 0.</text>
  <text x="156.0" y="98.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;font-weight:700;fill:#1B2430">C is 3 × 3, T = 2</text>
  <rect x="70.0" y="112.0" width="40.0" height="40.0" rx="5" fill="#DDE3FB" stroke="#5B6BD6" stroke-width="1.3"/>
  <rect x="114.0" y="112.0" width="40.0" height="40.0" rx="5" fill="#DDE3FB" stroke="#5B6BD6" stroke-width="1.3"/>
  <rect x="158.0" y="112.0" width="40.0" height="40.0" rx="5" fill="#D7F0E6" stroke="#1F8A70" stroke-width="1.3"/>
  <rect x="202.0" y="112.0" width="40.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="70.0" y="156.0" width="40.0" height="40.0" rx="5" fill="#DDE3FB" stroke="#5B6BD6" stroke-width="1.3"/>
  <rect x="114.0" y="156.0" width="40.0" height="40.0" rx="5" fill="#DDE3FB" stroke="#5B6BD6" stroke-width="1.3"/>
  <rect x="158.0" y="156.0" width="40.0" height="40.0" rx="5" fill="#D7F0E6" stroke="#1F8A70" stroke-width="1.3"/>
  <rect x="202.0" y="156.0" width="40.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="70.0" y="200.0" width="40.0" height="40.0" rx="5" fill="#FBE3D2" stroke="#C8693A" stroke-width="1.3"/>
  <rect x="114.0" y="200.0" width="40.0" height="40.0" rx="5" fill="#FBE3D2" stroke="#C8693A" stroke-width="1.3"/>
  <rect x="158.0" y="200.0" width="40.0" height="40.0" rx="5" fill="#F9DCE6" stroke="#C2457A" stroke-width="1.3"/>
  <rect x="202.0" y="200.0" width="40.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="70.0" y="244.0" width="40.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="114.0" y="244.0" width="40.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="158.0" y="244.0" width="40.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="202.0" y="244.0" width="40.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="66.0" y="108.0" width="136.0" height="136.0" rx="7" fill="none" stroke="#1B2430" stroke-width="2.2"/>
  <text x="156.0" y="316.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">dashed: threads with no entry, 7 of 16</text>
  <text x="502.0" y="98.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;font-weight:700;fill:#1B2430">tileA, phase 1</text>
  <rect x="410.0" y="112.0" width="88.0" height="40.0" rx="5" fill="#DDE3FB" stroke="#5B6BD6" stroke-width="1.3"/>
  <text x="454.0" y="136.7" text-anchor="middle" style="font-size:13px;fill:#5B6BD6">A[0][2]</text>
  <rect x="506.0" y="112.0" width="88.0" height="40.0" rx="5" fill="#EEF0F3" stroke="#9AA5B1" stroke-width="1.3"/>
  <text x="550.0" y="136.7" text-anchor="middle" style="font-size:13px;fill:#9AA5B1">0</text>
  <rect x="410.0" y="160.0" width="88.0" height="40.0" rx="5" fill="#FBE3D2" stroke="#C8693A" stroke-width="1.3"/>
  <text x="454.0" y="184.7" text-anchor="middle" style="font-size:13px;fill:#C8693A">A[1][2]</text>
  <rect x="506.0" y="160.0" width="88.0" height="40.0" rx="5" fill="#EEF0F3" stroke="#9AA5B1" stroke-width="1.3"/>
  <text x="550.0" y="184.7" text-anchor="middle" style="font-size:13px;fill:#9AA5B1">0</text>
  <text x="502.0" y="228.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">K = 3: column 3 of A does not exist,</text>
  <text x="502.0" y="246.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">so its slots hold 0</text>
</svg>
