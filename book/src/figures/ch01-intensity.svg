<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 562" width="640" height="562" role="img" aria-label="Two rows of squares. Vector addition: 12 bytes moved, drawn as 12 small squares, against 1 FLOP, an intensity of 1/12, about 0.08. A 2 by 2 matrix multiply: 48 bytes moved against 16 FLOPs, an intensity of 1/3. A card below gives the general case: for N by N matrices the intensity is N/6, about 680 at N = 4,096.">
