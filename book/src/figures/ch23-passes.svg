<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 412" width="660" height="412" role="img" aria-label="3 rows of bars. The 3-pass kernel reads each element 3 times, for the maximum, the sum and the output, and writes it once: 16 bytes. The online kernel reads it twice and writes once: 12 bytes. The fused kernel reads once and writes once: 8 bytes, because its values stay in registers.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker><marker id="head-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker><marker id="head-danger-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker><marker id="head-idle-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="660" height="412" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Bytes per element</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Every pass over the row reads each element from memory again.</text>
  <rect x="16" y="96" width="628" height="300" rx="16" fill="#F0EEE6" stroke="none" stroke-width="1.2"/>
  <rect x="34" y="85" width="287.6" height="22" rx="11" fill="#1B2430"/>
  <text x="177.8" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">GLOBAL MEMORY TRAFFIC PER ELEMENT</text>
  <text x="40.0" y="160.0" class="name" text-anchor="start" xml:space="preserve">3 passes</text>
  <rect x="140.0" y="140.0" width="92.0" height="30.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.3"/>
  <text x="186.0" y="159.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read 4 B</text>
  <text x="186.0" y="188.0" class="note" text-anchor="middle" xml:space="preserve">max</text>
  <rect x="240.0" y="140.0" width="92.0" height="30.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.3"/>
  <text x="286.0" y="159.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read 4 B</text>
  <text x="286.0" y="188.0" class="note" text-anchor="middle" xml:space="preserve">sum</text>
  <rect x="340.0" y="140.0" width="92.0" height="30.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.3"/>
  <text x="386.0" y="159.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read 4 B</text>
  <text x="386.0" y="188.0" class="note" text-anchor="middle" xml:space="preserve">p</text>
  <rect x="440.0" y="140.0" width="92.0" height="30.0" rx="8" fill="#F4CDC3" stroke="none" stroke-width="1.3"/>
  <text x="486.0" y="159.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">write 4 B</text>
  <text x="486.0" y="188.0" class="note" text-anchor="middle" xml:space="preserve">p</text>
  <rect x="559.6" y="146" width="40.4" height="18" rx="9" fill="#FBF1DC"/>
  <text x="579.8" y="158.6" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">16 B</text>
  <text x="40.0" y="240.0" class="name" text-anchor="start" xml:space="preserve">online</text>
  <rect x="140.0" y="220.0" width="92.0" height="30.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.3"/>
  <text x="186.0" y="239.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read 4 B</text>
  <text x="186.0" y="268.0" class="note" text-anchor="middle" xml:space="preserve">max + sum</text>
  <rect x="240.0" y="220.0" width="92.0" height="30.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.3"/>
  <text x="286.0" y="239.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read 4 B</text>
  <text x="286.0" y="268.0" class="note" text-anchor="middle" xml:space="preserve">p</text>
  <rect x="340.0" y="220.0" width="92.0" height="30.0" rx="8" fill="#F4CDC3" stroke="none" stroke-width="1.3"/>
  <text x="386.0" y="239.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">write 4 B</text>
  <text x="386.0" y="268.0" class="note" text-anchor="middle" xml:space="preserve">p</text>
  <rect x="559.6" y="226" width="40.4" height="18" rx="9" fill="#FBF1DC"/>
  <text x="579.8" y="238.6" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">12 B</text>
  <text x="40.0" y="320.0" class="name" text-anchor="start" xml:space="preserve">fused</text>
  <rect x="140.0" y="300.0" width="92.0" height="30.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.3"/>
  <text x="186.0" y="319.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read 4 B</text>
  <text x="186.0" y="348.0" class="note" text-anchor="middle" xml:space="preserve">registers</text>
  <rect x="240.0" y="300.0" width="92.0" height="30.0" rx="8" fill="#F4CDC3" stroke="none" stroke-width="1.3"/>
  <text x="286.0" y="319.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">write 4 B</text>
  <text x="286.0" y="348.0" class="note" text-anchor="middle" xml:space="preserve">p</text>
  <rect x="566.2" y="306" width="33.8" height="18" rx="9" fill="#FBF1DC"/>
  <text x="583.1" y="318.6" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">8 B</text>
  <text x="40.0" y="372.0" class="note" text-anchor="start" xml:space="preserve">Layer norm: sum of squares and Welford read twice (12 B); fused reads once (8 B).</text>
</svg>
