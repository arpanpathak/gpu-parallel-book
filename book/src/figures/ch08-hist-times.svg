<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 444" width="660" height="444" role="img" aria-label="Bars of histogram bandwidth for 64 MiB of bytes. Random bytes: 1 byte per load 14 GB/s on the Orin NX and 50 on the Thor; 16 bytes per load 83 and 191. Bytes all 7: 17 and 54 GB/s, then 93 and 211.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="444" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A histogram of 64 MiB, measured on 2 boards</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">GB/s of bytes read, with 1 byte or 16 bytes per load.</text>
  <line x1="190.0" y1="104.0" x2="190.0" y2="372.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="190.0" y="390.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <line x1="256.7" y1="104.0" x2="256.7" y2="372.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="256.7" y="390.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">50</text>
  <line x1="323.3" y1="104.0" x2="323.3" y2="372.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="323.3" y="390.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">100</text>
  <line x1="390.0" y1="104.0" x2="390.0" y2="372.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="390.0" y="390.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">150</text>
  <line x1="456.7" y1="104.0" x2="456.7" y2="372.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="456.7" y="390.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">200</text>
  <line x1="523.3" y1="104.0" x2="523.3" y2="372.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="523.3" y="390.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">250</text>
  <line x1="590.0" y1="104.0" x2="590.0" y2="372.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="590.0" y="390.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">300</text>
  <text x="176.0" y="142.0" class="sub" text-anchor="end" xml:space="preserve">random, 1 byte</text>
  <rect x="190" y="116" width="18.3" height="20" rx="5" fill="#2F6FDB"/>
  <rect x="212.3" y="118" width="40" height="17" rx="3" fill="#FBFAF6"/>
  <text x="216.3" y="131.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">13.7</text>
  <rect x="190" y="140" width="66.3" height="20" rx="5" fill="#7A4FD0"/>
  <rect x="260.3" y="142" width="40" height="17" rx="3" fill="#FBFAF6"/>
  <text x="264.3" y="155.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">49.7</text>
  <text x="176.0" y="206.0" class="sub" text-anchor="end" xml:space="preserve">random, 16 bytes</text>
  <rect x="190" y="180" width="110.5" height="20" rx="5" fill="#2F6FDB"/>
  <rect x="304.5" y="182" width="40" height="17" rx="3" fill="#FBFAF6"/>
  <text x="308.5" y="195.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">82.9</text>
  <rect x="190" y="204" width="254.5" height="20" rx="5" fill="#7A4FD0"/>
  <rect x="448.5" y="206" width="48" height="17" rx="3" fill="#FBFAF6"/>
  <text x="452.5" y="219.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">190.9</text>
  <text x="176.0" y="270.0" class="sub" text-anchor="end" xml:space="preserve">all 7, 1 byte</text>
  <rect x="190" y="244" width="22.4" height="20" rx="5" fill="#2F6FDB"/>
  <rect x="216.4" y="246" width="40" height="17" rx="3" fill="#FBFAF6"/>
  <text x="220.4" y="259.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">16.8</text>
  <rect x="190" y="268" width="72.1" height="20" rx="5" fill="#7A4FD0"/>
  <rect x="266.1" y="270" width="40" height="17" rx="3" fill="#FBFAF6"/>
  <text x="270.1" y="283.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">54.1</text>
  <text x="176.0" y="334.0" class="sub" text-anchor="end" xml:space="preserve">all 7, 16 bytes</text>
  <rect x="190" y="308" width="124.5" height="20" rx="5" fill="#2F6FDB"/>
  <rect x="318.5" y="310" width="40" height="17" rx="3" fill="#FBFAF6"/>
  <text x="322.5" y="323.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">93.4</text>
  <rect x="190" y="332" width="280.8" height="20" rx="5" fill="#7A4FD0"/>
  <rect x="474.8" y="334" width="48" height="17" rx="3" fill="#FBFAF6"/>
  <text x="478.8" y="347.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">210.6</text>
  <text x="176.0" y="390.0" class="sub" text-anchor="end" xml:space="preserve">GB/s</text>
  <rect x="190" y="408" width="14" height="14" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="211.0" y="419.5" class="note" text-anchor="start" xml:space="preserve">Jetson Orin NX</text>
  <rect x="325.4" y="408" width="14" height="14" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="346.4" y="419.5" class="note" text-anchor="start" xml:space="preserve">Jetson AGX Thor</text>
</svg>
