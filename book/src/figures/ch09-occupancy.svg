<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 416" width="660" height="416" role="img" aria-label="Three bars of 65,536 registers each, filled with blocks of 256 threads. At 80 registers per thread a block needs 20,480 registers and 3 blocks fit, 768 threads. At 64, 16,384 per block and 4 fit, 1,024 threads. At 40, 10,240 per block and 6 fit, 1,536 threads, with values spilled to memory.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="416" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Registers decide how many blocks fit</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Blocks of 256 threads on 1 SM of the Orin NX.</text>
  <text x="196.0" y="124.0" class="sub" text-anchor="start" xml:space="preserve">65,536 registers in 1 SM</text>
  <text x="182.0" y="159.0" class="name" text-anchor="end" xml:space="preserve">80 registers</text>
  <text x="182.0" y="177.0" class="sub" text-anchor="end" xml:space="preserve">× 256 = 20,480</text>
  <rect x="196.0" y="144.0" width="90.8" height="36.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="241.4" y="166.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">block</text>
  <rect x="289.8" y="144.0" width="90.8" height="36.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="335.1" y="166.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">block</text>
  <rect x="383.5" y="144.0" width="90.8" height="36.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="428.9" y="166.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">block</text>
  <rect x="196" y="144" width="300" height="36" rx="6" fill="none" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="510.0" y="159.0" class="name" text-anchor="start" xml:space="preserve">3 blocks</text>
  <text x="510.0" y="177.0" class="sub" text-anchor="start" xml:space="preserve">768 threads</text>
  <text x="182.0" y="223.0" class="name" text-anchor="end" xml:space="preserve">64 registers</text>
  <text x="182.0" y="241.0" class="sub" text-anchor="end" xml:space="preserve">× 256 = 16,384</text>
  <rect x="196.0" y="208.0" width="72.0" height="36.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="232.0" y="230.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">block</text>
  <rect x="271.0" y="208.0" width="72.0" height="36.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="307.0" y="230.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">block</text>
  <rect x="346.0" y="208.0" width="72.0" height="36.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="382.0" y="230.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">block</text>
  <rect x="421.0" y="208.0" width="72.0" height="36.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="457.0" y="230.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">block</text>
  <rect x="196" y="208" width="300" height="36" rx="6" fill="none" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="510.0" y="223.0" class="name" text-anchor="start" xml:space="preserve">4 blocks</text>
  <text x="510.0" y="241.0" class="sub" text-anchor="start" xml:space="preserve">1,024 threads</text>
  <text x="182.0" y="287.0" class="name" text-anchor="end" xml:space="preserve">40 registers</text>
  <text x="182.0" y="305.0" class="sub" text-anchor="end" xml:space="preserve">× 256 = 10,240</text>
  <rect x="196.0" y="272.0" width="43.9" height="36.0" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <rect x="242.9" y="272.0" width="43.9" height="36.0" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <rect x="289.8" y="272.0" width="43.9" height="36.0" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <rect x="336.6" y="272.0" width="43.9" height="36.0" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <rect x="383.5" y="272.0" width="43.9" height="36.0" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <rect x="430.4" y="272.0" width="43.9" height="36.0" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <rect x="196" y="272" width="300" height="36" rx="6" fill="none" stroke="#D5DBE3" stroke-width="1.2"/>
  <text x="510.0" y="287.0" class="name" text-anchor="start" xml:space="preserve">6 blocks</text>
  <text x="510.0" y="305.0" class="sub" text-anchor="start" xml:space="preserve">1,536 threads, spills</text>
  <text x="40.0" y="358.0" class="note" text-anchor="start" xml:space="preserve">1 block of 256 threads at 80 registers each needs 80 × 256 = 20,480 registers, and</text>
  <text x="40.0" y="376.0" class="note" text-anchor="start" xml:space="preserve">65,536 ÷ 20,480 = 3.2, so 3 blocks fit. At 40 registers 6 blocks fit, the limit of</text>
  <text x="40.0" y="394.0" class="note" text-anchor="start" xml:space="preserve">1,536 threads, but on the Orin NX the compiler spilled 16 bytes per thread to stay at 40.</text>
</svg>
