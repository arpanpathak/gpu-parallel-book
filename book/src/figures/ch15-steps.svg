  <text x="152.0" y="394.0" font-size="10.5" fill="#8E99A8" text-anchor="end" font-weight="400" xml:space="preserve">thread 0 adds</text>
  <text x="170.0" y="426.0" font-size="11.5" fill="#8E99A8" text-anchor="start" font-weight="400" xml:space="preserve">Each new value is the sum of 2 cells: its own cell and the cell stride places to the right.</text>
  <text x="170.0" y="443.0" font-size="11.5" fill="#8E99A8" text-anchor="start" font-weight="400" xml:space="preserve">Gray cells are no longer read. After step with stride = 1, cell 0 holds 32.</text>
