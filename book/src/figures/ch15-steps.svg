<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 458" width="660" height="458" role="img" aria-label="The tree in the shared memory of block 0. The 8 cells start as 2, 6, 3, 4, 5, 1, 8, 3. In step with stride = 4, threads 0 to 3 each add 2 cells, its own cell and cell threadIndex + 4, into its own cell, giving 2 + 5 = 7, 6 + 1 = 7, 3 + 8 = 11 and 4 + 3 = 7. In step with stride = 2, threads 0 and 1 give 7 + 11 = 18 and 7 + 7 = 14. In step with stride = 1, thread 0 gives 18 + 14 = 32. Two arrows lead into every new value, and a barrier separates the steps.">
