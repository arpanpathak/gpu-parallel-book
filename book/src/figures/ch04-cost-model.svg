  <text x="600.0" y="398.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">64 MiB</text>
  <line x1="100.0" y1="380.0" x2="600.0" y2="380.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="92.0" y="384.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">10 µs</text>
