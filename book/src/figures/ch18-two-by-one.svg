<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 426" width="660" height="426" role="img" aria-label="A, B and C of the 4 by 4 example. a00 = 1 and a10 = 5 of A, b00 = 1 of B, and c00 and c10 of C are highlighted. In registers at offset = 0: a_reg = 1, 5 and b_reg = 1, 3 reads from shared memory. The thread adds 1 times 1 = 1 to c00 and 5 times 1 = 5 to c10: 3 reads for 2 multiply-adds, because b00 is read once and used twice. 2 threads of Chapter 17 needed 4 reads for the same 2 multiply-adds: 1.5 reads per multiply-add instead of 2.">
