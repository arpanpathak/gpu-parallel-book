  <line x1="146.2" y1="178.0" x2="146.2" y2="202.0" stroke="#2F6FDB" stroke-width="1.8"/>
  <line x1="155.0" y1="178.0" x2="155.0" y2="202.0" stroke="#2F6FDB" stroke-width="1.8"/>
  <line x1="163.8" y1="178.0" x2="163.8" y2="202.0" stroke="#2F6FDB" stroke-width="1.8"/>
  <line x1="172.5" y1="178.0" x2="172.5" y2="202.0" stroke="#2F6FDB" stroke-width="1.8"/>
