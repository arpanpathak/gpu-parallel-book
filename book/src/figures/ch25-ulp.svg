  <text x="85.0" y="222.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">1</text>
  <rect x="85.0" y="150" width="73.4" height="18" rx="9" fill="#FBF1DC"/>
  <text x="121.7" y="162.6" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">gap 0.125</text>
  <line x1="120.0" y1="178.0" x2="120.0" y2="202.0" stroke="#2F6FDB" stroke-width="1.8"/>
  <line x1="128.8" y1="178.0" x2="128.8" y2="202.0" stroke="#2F6FDB" stroke-width="1.8"/>
