  <text x="120.0" y="222.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">2</text>
  <rect x="120.0" y="128" width="66.8" height="18" rx="9" fill="#EAF1FD"/>
  <text x="153.4" y="140.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">gap 0.25</text>
