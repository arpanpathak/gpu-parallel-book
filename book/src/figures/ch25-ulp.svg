  <line x1="435.0" y1="178.0" x2="435.0" y2="202.0" stroke="#2E8B3D" stroke-width="1.8"/>
  <line x1="470.0" y1="178.0" x2="470.0" y2="202.0" stroke="#2E8B3D" stroke-width="1.8"/>
  <line x1="505.0" y1="178.0" x2="505.0" y2="202.0" stroke="#2E8B3D" stroke-width="1.8"/>
  <line x1="540.0" y1="178.0" x2="540.0" y2="202.0" stroke="#2E8B3D" stroke-width="1.8"/>
  <line x1="575.0" y1="178.0" x2="575.0" y2="202.0" stroke="#2E8B3D" stroke-width="1.8"/>
  <text x="330.0" y="222.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">8</text>
  <rect x="330.0" y="128" width="47.0" height="18" rx="9" fill="#E7F5E9"/>
  <text x="353.5" y="140.6" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">gap 1</text>
  <text x="610.0" y="222.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">16</text>
  <text x="50.0" y="222.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">0</text>
  <text x="40.0" y="256.0" class="note" text-anchor="start" xml:space="preserve">Each stretch from 2ᵉ to 2ᵉ⁺¹ holds the same 8 values, so each gap is twice the last.</text>
  <text x="40.0" y="274.0" class="note" text-anchor="start" xml:space="preserve">A real float holds 2²³ = 8,388,608 values in each stretch.</text>
  <rect x="16" y="324" width="310" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M28,324.7 H22 V393.3 H28 A11.3,11.3 0 0 1 16.7,382 V336 A11.3,11.3 0 0 1 28,324.7 Z" fill="#B7791F"/>
  <text x="36.0" y="355.0" class="name" text-anchor="start" xml:space="preserve">near 1</text>
  <text x="36.0" y="373.0" class="sub" text-anchor="start" xml:space="preserve">1 ULP = 2⁻²³ ≈ 0.000000119</text>
  <rect x="334" y="324" width="310" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M346,324.7 H340 V393.3 H346 A11.3,11.3 0 0 1 334.7,382 V336 A11.3,11.3 0 0 1 346,324.7 Z" fill="#2E8B3D"/>
  <text x="354.0" y="355.0" class="name" text-anchor="start" xml:space="preserve">near e¹⁰ = 22,026.47</text>
  <text x="354.0" y="373.0" class="sub" text-anchor="start" xml:space="preserve">1 ULP = 2⁻⁹ ≈ 0.00195</text>
  <rect x="16" y="408" width="310" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M28,408.7 H22 V477.3 H28 A11.3,11.3 0 0 1 16.7,466 V420 A11.3,11.3 0 0 1 28,408.7 Z" fill="#2F6FDB"/>
  <text x="36.0" y="430.0" class="name" text-anchor="start" xml:space="preserve">expf, measured</text>
  <text x="36.0" y="448.0" class="sub" text-anchor="start" xml:space="preserve">at most 2 ULPs from the</text>
  <text x="36.0" y="466.0" class="sub" text-anchor="start" xml:space="preserve">nearest float to exp(x)</text>
  <rect x="334" y="408" width="310" height="70" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M346,408.7 H340 V477.3 H346 A11.3,11.3 0 0 1 334.7,466 V420 A11.3,11.3 0 0 1 346,408.7 Z" fill="#CF4526"/>
  <text x="354.0" y="430.0" class="name" text-anchor="start" xml:space="preserve">__expf, measured</text>
  <text x="354.0" y="448.0" class="sub" text-anchor="start" xml:space="preserve">at most 8 ULPs, over</text>
  <text x="354.0" y="466.0" class="sub" text-anchor="start" xml:space="preserve">x in [−10, 10)</text>
  <text x="16.0" y="508.0" class="note" text-anchor="start" xml:space="preserve">An error in ULPs means the same at every size: 2 ULPs is about 2 parts in 8 million.</text>
</svg>
