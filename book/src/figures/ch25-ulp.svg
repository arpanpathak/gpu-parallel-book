  <line x1="260.0" y1="178.0" x2="260.0" y2="202.0" stroke="#7A4FD0" stroke-width="1.8"/>
  <line x1="277.5" y1="178.0" x2="277.5" y2="202.0" stroke="#7A4FD0" stroke-width="1.8"/>
  <line x1="295.0" y1="178.0" x2="295.0" y2="202.0" stroke="#7A4FD0" stroke-width="1.8"/>
  <line x1="312.5" y1="178.0" x2="312.5" y2="202.0" stroke="#7A4FD0" stroke-width="1.8"/>
  <text x="190.0" y="222.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">4</text>
  <rect x="190.0" y="150" width="60.2" height="18" rx="9" fill="#F0EAFB"/>
  <text x="220.1" y="162.6" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">gap 0.5</text>
  <line x1="330.0" y1="178.0" x2="330.0" y2="202.0" stroke="#2E8B3D" stroke-width="1.8"/>
  <line x1="365.0" y1="178.0" x2="365.0" y2="202.0" stroke="#2E8B3D" stroke-width="1.8"/>
