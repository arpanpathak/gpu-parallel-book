  <text x="456.0" y="384.0" class="name" text-anchor="start" xml:space="preserve">partial[block]</text>
  <text x="456.0" y="402.0" class="sub" text-anchor="start" xml:space="preserve">1 value per block</text>
  <path class="wire" d="M532,306 L532,360" marker-end="url(#head)"/>
  <text x="16.0" y="532.0" class="note" text-anchor="start" xml:space="preserve">Lane 0 of each warp stores its warp&#x27;s total; after the 1 barrier, warp 0 adds</text>
  <text x="16.0" y="550.0" class="note" text-anchor="start" xml:space="preserve">the 8 totals. The tree of chapter 5 needed 8 barriers for the same 256 values.</text>
</svg>
