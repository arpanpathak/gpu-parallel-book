  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A block sum with 1 barrier</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Shuffles inside each warp; shared memory only between warps.</text>
