<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" role="img" aria-label="Row 0 holds 1, 2, 3, 4. Their exponentials are 2.718, 7.389, 20.086 and 54.598, which sum to 84.791. Dividing each by the sum gives 0.0321, 0.0871, 0.2369 and 0.6439, which add up to 1.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker><marker id="head-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker><marker id="head-danger-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker><marker id="head-idle-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="660" height="380" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Softmax by hand</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each output is exp(x) divided by the sum of the exponentials of the row.</text>
  <rect x="16" y="96" width="628" height="268" rx="16" fill="#F0EEE6" stroke="none" stroke-width="1.2"/>
  <rect x="34" y="85" width="153.9" height="22" rx="11" fill="#1B2430"/>
  <text x="110.9" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">SOFTMAX OF ROW 0</text>
  <text x="80.0" y="130.0" class="name" text-anchor="middle" xml:space="preserve">x</text>
  <text x="210.0" y="130.0" class="name" text-anchor="middle" xml:space="preserve">exp(x)</text>
  <text x="380.0" y="130.0" class="name" text-anchor="middle" xml:space="preserve">p = exp(x) ÷ sum</text>
  <rect x="50.0" y="142.0" width="60.0" height="28.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.2"/>
  <text x="80.0" y="160.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1</text>
  <rect x="160.0" y="142.0" width="100.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="210.0" y="160.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">2.718</text>
  <rect x="320.0" y="142.0" width="120.0" height="28.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.2"/>
  <text x="380.0" y="160.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.0321</text>
  <rect x="50.0" y="178.0" width="60.0" height="28.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.2"/>
  <text x="80.0" y="196.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">2</text>
  <rect x="160.0" y="178.0" width="100.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="210.0" y="196.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">7.389</text>
  <rect x="320.0" y="178.0" width="120.0" height="28.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.2"/>
  <text x="380.0" y="196.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.0871</text>
  <rect x="50.0" y="214.0" width="60.0" height="28.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.2"/>
  <text x="80.0" y="232.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">3</text>
  <rect x="160.0" y="214.0" width="100.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="210.0" y="232.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">20.086</text>
  <rect x="320.0" y="214.0" width="120.0" height="28.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.2"/>
  <text x="380.0" y="232.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.2369</text>
  <rect x="50.0" y="250.0" width="60.0" height="28.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="2.2"/>
  <text x="80.0" y="268.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">4</text>
  <rect x="160.0" y="250.0" width="100.0" height="28.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="2.2"/>
  <text x="210.0" y="268.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">54.598</text>
  <rect x="320.0" y="250.0" width="120.0" height="28.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="2.2"/>
  <text x="380.0" y="268.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.6439</text>
  <text x="210.0" y="306.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">sum 84.791</text>
  <text x="380.0" y="306.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">sum 1.0000</text>
  <text x="470.0" y="156.0" class="note" text-anchor="start" xml:space="preserve">column 3:</text>
  <text x="470.0" y="176.0" class="mono" text-anchor="start" xml:space="preserve">54.598 ÷ 84.791</text>
  <text x="470.0" y="196.0" class="mono" text-anchor="start" xml:space="preserve">= 0.6439</text>
  <text x="36.0" y="342.0" class="note" text-anchor="start" xml:space="preserve">The largest value, 4, takes 64% of the total: exp(x) magnifies differences.</text>
</svg>
