<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 398" width="660" height="398" role="img" aria-label="Row 1, 2, 4, 4, 5, with a bar over the first k values for k = 0 to 4. After k values, m is the maximum of those k values and s is the sum of exp(x - m) over them: m = 2, s = 1; m = 4, s = 1.1353; m = 4, s = 2.1353; m = 5, s = 1.7855.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="660" height="398" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The loop invariant</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">After k values, s is the sum of exp(x − m) over exactly those k values.</text>
  <rect x="16" y="96" width="628" height="286" rx="16" fill="#F0EEE6" stroke="none" stroke-width="1.2"/>
  <rect x="34" y="85" width="185.3" height="22" rx="11" fill="#1B2430"/>
  <text x="126.7" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">THE INVARIANT, ROW 1</text>
  <rect x="176.0" y="120.0" width="56.0" height="28.0" rx="8" fill="#C1E1D8" stroke="none" stroke-width="1.2"/>
  <text x="204.0" y="138.0" class="mono" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">2</text>
  <rect x="240.0" y="120.0" width="56.0" height="28.0" rx="8" fill="#C1E1D8" stroke="none" stroke-width="1.2"/>
  <text x="268.0" y="138.0" class="mono" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">4</text>
  <rect x="304.0" y="120.0" width="56.0" height="28.0" rx="8" fill="#C1E1D8" stroke="none" stroke-width="1.2"/>
  <text x="332.0" y="138.0" class="mono" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">4</text>
  <rect x="368.0" y="120.0" width="56.0" height="28.0" rx="8" fill="#C1E1D8" stroke="none" stroke-width="1.2"/>
  <text x="396.0" y="138.0" class="mono" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">5</text>
  <text x="36.0" y="139.0" class="note" text-anchor="start" xml:space="preserve">row 1</text>
  <text x="36.0" y="188.0" class="note" text-anchor="start" xml:space="preserve">after 0 values</text>
  <line x1="176.0" y1="172.0" x2="176.0" y2="194.0" stroke="#1F8A70" stroke-width="2"/>
  <text x="440.0" y="188.0" class="mono" text-anchor="start" xml:space="preserve">m = −inf, s = 0</text>
  <text x="36.0" y="222.0" class="note" text-anchor="start" xml:space="preserve">after 1 values</text>
  <rect x="176.0" y="206.0" width="56.0" height="22.0" rx="6" fill="#C1E1D8" stroke="none" stroke-width="1.3"/>
  <text x="440.0" y="222.0" class="mono" text-anchor="start" xml:space="preserve">m = 2, s = 1.0000</text>
  <text x="36.0" y="256.0" class="note" text-anchor="start" xml:space="preserve">after 2 values</text>
  <rect x="176.0" y="240.0" width="120.0" height="22.0" rx="6" fill="#C1E1D8" stroke="none" stroke-width="1.3"/>
  <text x="440.0" y="256.0" class="mono" text-anchor="start" xml:space="preserve">m = 4, s = 1.1353</text>
  <text x="36.0" y="290.0" class="note" text-anchor="start" xml:space="preserve">after 3 values</text>
  <rect x="176.0" y="274.0" width="184.0" height="22.0" rx="6" fill="#C1E1D8" stroke="none" stroke-width="1.3"/>
  <text x="440.0" y="290.0" class="mono" text-anchor="start" xml:space="preserve">m = 4, s = 2.1353</text>
  <text x="36.0" y="324.0" class="note" text-anchor="start" xml:space="preserve">after 4 values</text>
  <rect x="176.0" y="308.0" width="248.0" height="22.0" rx="6" fill="#C1E1D8" stroke="none" stroke-width="1.3"/>
  <text x="440.0" y="324.0" class="mono" text-anchor="start" xml:space="preserve">m = 5, s = 1.7855</text>
  <text x="36.0" y="360.0" class="note" text-anchor="start" xml:space="preserve">s = e^(2−5) + e^(4−5) + e^(4−5) + e^(5−5) = 1.7855</text>
</svg>
