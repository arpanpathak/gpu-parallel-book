<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384" width="680" height="384" role="img" aria-label="A timeline of threads 1 and 2 when the scan updates 1 buffer in place. Thread 1 adds a[0] to a[1], making it 4, before the late thread 2 reads a[1]. Thread 2 computes 7 + 4 = 11 instead of 8, and after the next step y2 is 14 instead of 11.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="680" height="384" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">In place: a read after the write</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Thread 2 reads a value of the current step, not of the last one.</text>
  <text x="170.0" y="100.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">step d = 1, 1 buffer a</text>
  <text x="156.0" y="131.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">thread 1</text>
  <rect x="170.0" y="112.0" width="220.0" height="28.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="280.0" y="130.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">a[1] = a[1] + a[0] = 4</text>
  <text x="156.0" y="195.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">thread 2</text>
  <rect x="170.0" y="176.0" width="120.0" height="28.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="230.0" y="194.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">late</text>
  <rect x="420.0" y="176.0" width="230.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="535.0" y="194.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">a[2] = a[2] + a[1]</text>
  <circle cx="390" cy="126" r="4" fill="#CF4526"/>
  <line x1="390.0" y1="126.0" x2="390.0" y2="216.0" stroke="#CF4526" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="386.0" y="230.0" text-anchor="end" font-size="10.5" style="fill:#CF4526" xml:space="preserve">a[1] = 4 written</text>
  <circle cx="420" cy="190" r="4" fill="#CF4526"/>
  <text x="424.0" y="230.0" text-anchor="start" font-size="10.5" style="fill:#CF4526" xml:space="preserve">a[1] read</text>
  <text x="410.0" y="264.0" class="note" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">thread 2 reads a[1] after thread 1 has already added a[0] to it:</text>
  <text x="410.0" y="284.0" class="note" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">a[2] = 7 + 4 = 11 in place of 8, so x0 = 3 is counted twice; after step d = 2,</text>
  <text x="410.0" y="304.0" class="note" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">a[2] = 11 + 3 = 14, and y2 = 14 in place of 11</text>
  <text x="32.0" y="340.0" class="note" text-anchor="start" xml:space="preserve">With 2 buffers, step d = 1 writes only b and reads only a, so thread 2 reads a[1] = 1</text>
  <text x="32.0" y="358.0" class="note" text-anchor="start" xml:space="preserve">whether thread 1 has finished or not.</text>
</svg>
