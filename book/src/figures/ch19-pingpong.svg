<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 456" width="700" height="456" role="img" aria-label="3 rows, one per pass. Before pass 0, buffer current holds u0 and buffer next holds u0. The kernel reads current and writes the interior of next, which then holds u1; the names are exchanged, so current holds u1 and next holds u0. Before pass 1, current holds u1; after the launch and the exchange, current holds u2 and next holds u1. A note states the invariant: at the start of pass k, current holds u(k) and next holds the boundary values.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker><marker id="head-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker><marker id="head-danger-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker><marker id="head-idle-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="700" height="456" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Ping-pong buffers and their invariant</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each pass reads current, writes next, then exchanges the 2 names.</text>
  <text x="195.0" y="106.0" class="name" text-anchor="middle" xml:space="preserve">start of pass k</text>
  <text x="545.0" y="106.0" class="name" text-anchor="middle" xml:space="preserve">after the launch, then exchange</text>
  <text x="32.0" y="154.0" class="note" text-anchor="start" xml:space="preserve">pass 0</text>
  <rect x="78.0" y="124.0" width="116.0" height="52.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.5"/>
  <text x="136.0" y="154.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">current: u(0)</text>
  <rect filter="url(#m3-shadow)" x="204.0" y="124.0" width="116.0" height="52.0" rx="8" fill="#F1F4F7" stroke="none" stroke-width="1.5"/>
  <text x="262.0" y="154.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">next: u(0)</text>
  <rect x="430.0" y="124.0" width="116.0" height="52.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.5"/>
  <text x="488.0" y="154.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">current: u(1)</text>
  <rect filter="url(#m3-shadow)" x="556.0" y="124.0" width="116.0" height="52.0" rx="8" fill="#F1F4F7" stroke="none" stroke-width="1.5"/>
  <text x="614.0" y="154.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">next: u(0)</text>
  <path d="M 330,150 L 420.0,150.0" stroke="#3F5873" stroke-width="1.8" fill="none" stroke-linecap="butt" marker-end="url(#head)"/>
  <rect x="332.0" y="122" width="93.2" height="18" rx="9" fill="#EAF1FD"/>
  <text x="378.6" y="134.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read current</text>
  <rect x="332.0" y="160" width="80.0" height="18" rx="9" fill="#E7F5E9"/>
  <text x="372.0" y="172.6" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">write next</text>
  <text x="32.0" y="246.0" class="note" text-anchor="start" xml:space="preserve">pass 1</text>
  <rect x="78.0" y="216.0" width="116.0" height="52.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.5"/>
  <text x="136.0" y="246.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">current: u(1)</text>
  <rect filter="url(#m3-shadow)" x="204.0" y="216.0" width="116.0" height="52.0" rx="8" fill="#F1F4F7" stroke="none" stroke-width="1.5"/>
  <text x="262.0" y="246.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">next: u(0)</text>
  <rect x="430.0" y="216.0" width="116.0" height="52.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.5"/>
  <text x="488.0" y="246.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">current: u(2)</text>
  <rect filter="url(#m3-shadow)" x="556.0" y="216.0" width="116.0" height="52.0" rx="8" fill="#F1F4F7" stroke="none" stroke-width="1.5"/>
  <text x="614.0" y="246.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">next: u(1)</text>
  <path d="M 330,242 L 420.0,242.0" stroke="#3F5873" stroke-width="1.8" fill="none" stroke-linecap="butt" marker-end="url(#head)"/>
  <rect x="332.0" y="214" width="93.2" height="18" rx="9" fill="#EAF1FD"/>
  <text x="378.6" y="226.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read current</text>
  <rect x="332.0" y="252" width="80.0" height="18" rx="9" fill="#E7F5E9"/>
  <text x="372.0" y="264.6" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">write next</text>
  <text x="32.0" y="338.0" class="note" text-anchor="start" xml:space="preserve">pass 2</text>
  <rect x="78.0" y="308.0" width="116.0" height="52.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.5"/>
  <text x="136.0" y="338.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">current: u(2)</text>
  <rect filter="url(#m3-shadow)" x="204.0" y="308.0" width="116.0" height="52.0" rx="8" fill="#F1F4F7" stroke="none" stroke-width="1.5"/>
  <text x="262.0" y="338.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">next: u(1)</text>
  <rect x="430.0" y="308.0" width="116.0" height="52.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.5"/>
  <text x="488.0" y="338.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">current: u(3)</text>
  <rect filter="url(#m3-shadow)" x="556.0" y="308.0" width="116.0" height="52.0" rx="8" fill="#F1F4F7" stroke="none" stroke-width="1.5"/>
  <text x="614.0" y="338.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">next: u(2)</text>
  <path d="M 330,334 L 420.0,334.0" stroke="#3F5873" stroke-width="1.8" fill="none" stroke-linecap="butt" marker-end="url(#head)"/>
  <rect x="332.0" y="306" width="93.2" height="18" rx="9" fill="#EAF1FD"/>
  <text x="378.6" y="318.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read current</text>
  <rect x="332.0" y="344" width="80.0" height="18" rx="9" fill="#E7F5E9"/>
  <text x="372.0" y="356.6" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">write next</text>
  <text x="32.0" y="418.0" class="note" text-anchor="start" xml:space="preserve">Invariant: at the start of pass k, buffer current holds the Jacobi grid u(k) in every cell,</text>
  <text x="32.0" y="436.0" class="note" text-anchor="start" xml:space="preserve">and every boundary cell of buffer next holds its given value. Pass 0: both buffers hold u(0).</text>
</svg>
