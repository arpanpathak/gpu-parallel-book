<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" width="660" height="460" role="img" aria-label="Matrix A on the left with the value a01 = 2 highlighted, and C on the right with the 4 entries c00, c01, c02 and c03 of row 0 shaded. 4 separate curved arrows run from a01 to the 4 entries: each of the 4 threads that compute row 0 of C fetches a01 from global memory on its own. A note below: in all, 16 threads times 8 fetches = 128 fetches from global memory, although A and B hold only 32 distinct values.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
