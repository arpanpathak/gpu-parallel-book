  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The same value, fetched 4 times</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">In the direct kernel every thread fetches its operands itself.</text>
