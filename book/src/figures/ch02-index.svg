  <text x="68.0" y="329.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">256</text>
  <rect x="104.0" y="234.0" width="56.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="132.0" y="253.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">1</text>
  <path d="M132,264 V307" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="104.0" y="310.0" width="56.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="132.0" y="329.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">257</text>
  <rect x="168.0" y="234.0" width="56.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="196.0" y="253.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">2</text>
  <path d="M196,264 V307" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="168.0" y="310.0" width="56.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="196.0" y="329.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">258</text>
  <text x="260.0" y="254.0" class="name" text-anchor="middle" xml:space="preserve">…</text>
  <text x="260.0" y="330.0" class="name" text-anchor="middle" xml:space="preserve">…</text>
  <rect x="296.0" y="234.0" width="56.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="324.0" y="253.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">43</text>
  <path d="M324,264 V307" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="296.0" y="310.0" width="56.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="324.0" y="329.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">299</text>
  <rect x="360.0" y="234.0" width="56.0" height="30.0" rx="6" fill="#7A4FD0" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="388.0" y="253.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">44</text>
  <path d="M388,264 V307" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="360.0" y="310.0" width="56.0" height="30.0" rx="6" fill="#7A4FD0" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="388.0" y="329.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">300</text>
  <rect x="424.0" y="234.0" width="56.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="452.0" y="253.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">45</text>
  <path d="M452,264 V307" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="424.0" y="310.0" width="56.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="452.0" y="329.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">301</text>
  <text x="516.0" y="254.0" class="name" text-anchor="middle" xml:space="preserve">…</text>
  <text x="516.0" y="330.0" class="name" text-anchor="middle" xml:space="preserve">…</text>
  <rect x="552.0" y="234.0" width="56.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="580.0" y="253.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">255</text>
  <path d="M580,264 V307" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="552.0" y="310.0" width="56.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="580.0" y="329.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">511</text>
  <text x="40.0" y="366.0" class="name" text-anchor="start" xml:space="preserve">index of the thread</text>
  <text x="200.0" y="366.0" class="note" text-anchor="start" xml:space="preserve">each index is 256 more than the position</text>
  <rect x="40" y="392" width="580" height="60" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,392.7 H46 V451.3 H52 A11.3,11.3 0 0 1 40.7,440 V404 A11.3,11.3 0 0 1 52,392.7 Z" fill="#7A4FD0"/>
  <text x="60.0" y="418.0" class="name" text-anchor="start" xml:space="preserve">index = block number × block size + position</text>
  <text x="60.0" y="436.0" class="sub" text-anchor="start" xml:space="preserve">thread 300: 1 × 256 + 44 = 300</text>
</svg>
