  <rect x="40.0" y="234.0" width="56.0" height="30.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="68.0" y="253.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">0</text>
  <path d="M68,264 V307" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
