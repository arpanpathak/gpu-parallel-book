<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 476" width="660" height="476" role="img" aria-label="Block 0 holds threads with indexes 0 to 255, and block 1 holds indexes 256 to 511. Inside block 1, each thread has a position from 0 to 255, drawn in a row: 0, 1, 2, then 43, 44, 45, then 255. An arrow runs from each position down to the thread&#x27;s index, 256 more: 256, 257, 258, 299, 300, 301 and 511. Position 44 and index 300 are highlighted. A card reads: index = block number × block size + position; thread 300 is 1 × 256 + 44.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="476" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Where a thread&#x27;s index comes from</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Block 1 starts after the 256 threads of block 0.</text>
  <rect x="40" y="96" width="270" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,96.7 H46 V151.3 H52 A11.3,11.3 0 0 1 40.7,140 V108 A11.3,11.3 0 0 1 52,96.7 Z" fill="#1F8A70"/>
  <text x="60.0" y="120.0" class="name" text-anchor="start" xml:space="preserve">block 0</text>
  <text x="60.0" y="138.0" class="sub" text-anchor="start" xml:space="preserve">positions 0–255, indexes 0–255</text>
  <rect x="350" y="96" width="270" height="56" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M362,96.7 H356 V151.3 H362 A11.3,11.3 0 0 1 350.7,140 V108 A11.3,11.3 0 0 1 362,96.7 Z" fill="#7A4FD0"/>
  <text x="370.0" y="120.0" class="name" text-anchor="start" xml:space="preserve">block 1</text>
  <text x="370.0" y="138.0" class="sub" text-anchor="start" xml:space="preserve">positions 0–255, indexes 256–511</text>
  <path d="M485,152 V219" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
