<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 514" width="660" height="514" role="img" aria-label="Horizontal bars of bandwidth each way, with the time to move 1 GB. PCIe 4.0 with 16 lanes 32 GB/s, 31 ms. PCIe 5.0 64 GB/s, 16 ms. NVLink 2 on V100 150 GB/s, 6.7 ms. NVLink 3 on A100 300 GB/s, 3.3 ms. NVLink 4 on H100 450 GB/s, 2.2 ms. NVLink-C2C on GH200 450 GB/s, 2.2 ms. NVLink 5 on B200 900 GB/s, 1.1 ms. A copy inside an H100&#x27;s own memory 1,675 GB/s, 0.6 ms.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="514" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Link rates, each way</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The time to move a 1 GB gradient over each link.</text>
  <rect x="196" y="102" width="14" height="14" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="217.0" y="113.5" class="note" text-anchor="start" xml:space="preserve">PCIe</text>
  <rect x="265.4" y="102" width="14" height="14" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="286.4" y="113.5" class="note" text-anchor="start" xml:space="preserve">NVLink, GPU to GPU</text>
  <rect x="427.2" y="102" width="14" height="14" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="448.2" y="113.5" class="note" text-anchor="start" xml:space="preserve">CPU to GPU</text>
  <rect x="536.2" y="102" width="14" height="14" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="557.2" y="113.5" class="note" text-anchor="start" xml:space="preserve">local memory</text>
  <text x="182.0" y="153.0" class="sub" text-anchor="end" xml:space="preserve">PCIe 4.0 × 16</text>
  <rect x="196" y="140" width="4.8" height="20" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="208.8" y="154.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">32 GB/s</text>
  <text x="644.0" y="154.0" class="mono" text-anchor="end" style="fill:#7F8EA0" xml:space="preserve">1 GB in 31 ms</text>
  <text x="182.0" y="193.0" class="sub" text-anchor="end" xml:space="preserve">PCIe 5.0 × 16</text>
  <rect x="196" y="180" width="9.6" height="20" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="213.6" y="194.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">64 GB/s</text>
  <text x="644.0" y="194.0" class="mono" text-anchor="end" style="fill:#7F8EA0" xml:space="preserve">1 GB in 16 ms</text>
  <text x="182.0" y="233.0" class="sub" text-anchor="end" xml:space="preserve">NVLink 2, V100</text>
  <rect x="196" y="220" width="22.4" height="20" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="226.4" y="234.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">150 GB/s</text>
  <text x="644.0" y="234.0" class="mono" text-anchor="end" style="fill:#2F6FDB" xml:space="preserve">1 GB in 6.7 ms</text>
  <text x="182.0" y="273.0" class="sub" text-anchor="end" xml:space="preserve">NVLink 3, A100</text>
  <rect x="196" y="260" width="44.8" height="20" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="248.8" y="274.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">300 GB/s</text>
  <text x="644.0" y="274.0" class="mono" text-anchor="end" style="fill:#2F6FDB" xml:space="preserve">1 GB in 3.3 ms</text>
  <text x="182.0" y="313.0" class="sub" text-anchor="end" xml:space="preserve">NVLink 4, H100</text>
  <rect x="196" y="300" width="67.2" height="20" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="271.2" y="314.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">450 GB/s</text>
  <text x="644.0" y="314.0" class="mono" text-anchor="end" style="fill:#2F6FDB" xml:space="preserve">1 GB in 2.2 ms</text>
  <text x="182.0" y="353.0" class="sub" text-anchor="end" xml:space="preserve">NVLink-C2C, GH200</text>
  <rect x="196" y="340" width="67.2" height="20" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="271.2" y="354.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">450 GB/s</text>
  <text x="644.0" y="354.0" class="mono" text-anchor="end" style="fill:#7A4FD0" xml:space="preserve">1 GB in 2.2 ms</text>
  <text x="182.0" y="393.0" class="sub" text-anchor="end" xml:space="preserve">NVLink 5, B200</text>
  <rect x="196" y="380" width="134.3" height="20" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="338.3" y="394.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">900 GB/s</text>
  <text x="644.0" y="394.0" class="mono" text-anchor="end" style="fill:#2F6FDB" xml:space="preserve">1 GB in 1.1 ms</text>
  <text x="182.0" y="433.0" class="sub" text-anchor="end" xml:space="preserve">H100 memory, a copy</text>
  <rect x="196" y="420" width="250.0" height="20" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="454.0" y="434.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">1,675 GB/s</text>
  <text x="644.0" y="434.0" class="mono" text-anchor="end" style="fill:#B7791F" xml:space="preserve">1 GB in 0.6 ms</text>
  <text x="24.0" y="474.0" class="note" text-anchor="start" xml:space="preserve">Each way, from NVIDIA&#x27;s figures. A copy inside an H100 reads and writes every byte, so its</text>
  <text x="24.0" y="492.0" class="note" text-anchor="start" xml:space="preserve">3,350 GB/s of memory copy at 3,350 ÷ 2 = 1,675 GB/s. 1 GB ÷ 450 GB/s = 2.2 ms.</text>
</svg>
