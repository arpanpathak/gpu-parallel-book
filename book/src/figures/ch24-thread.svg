  <rect x="140.0" y="250.0" width="36.0" height="30.0" rx="3" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="158.0" y="269.3" text-anchor="middle" class="mono" font-size="12" style="fill:#1B2430">144</text>
  <text x="158.0" y="296.0" class="note" text-anchor="middle" xml:space="preserve">2</text>
  <rect x="180.0" y="250.0" width="36.0" height="30.0" rx="3" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="2.2"/>
  <text x="198.0" y="269.3" text-anchor="middle" class="mono" font-size="12" font-weight="700" style="fill:#1B2430">144</text>
  <text x="198.0" y="296.0" class="note" text-anchor="middle" xml:space="preserve">3</text>
  <path class="wire" d="M438,192 L438.0,198.0 Q438,204 429,204 L207,204 Q198,204 198,213 L198,247" marker-end="url(#head)"/>
  <text x="250.0" y="254.0" class="mono" text-anchor="start" xml:space="preserve">thread 3: p = 3 x 3 = 9, bytes 9, 10, 11</text>
  <text x="250.0" y="274.0" class="mono" text-anchor="start" xml:space="preserve">77 x 120 + 150 x 150 + 29 x 180 = 36,960</text>
  <text x="250.0" y="294.0" class="mono" text-anchor="start" xml:space="preserve">(36,960 + 128) &gt;&gt; 8 = 144 = gray[3]</text>
  <text x="250.0" y="316.0" class="note" text-anchor="start" xml:space="preserve">3 reads from global memory, 1 write; no other thread is involved</text>
</svg>
