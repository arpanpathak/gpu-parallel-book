  <rect x="140.0" y="120.0" width="36.0" height="30.0" rx="3" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="158.0" y="139.3" text-anchor="middle" class="mono" font-size="12" style="fill:#1B2430">180</text>
  <text x="158.0" y="166.0" class="note" text-anchor="middle" xml:space="preserve">2</text>
  <rect x="180.0" y="120.0" width="36.0" height="30.0" rx="3" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.2"/>
  <text x="198.0" y="139.3" text-anchor="middle" class="mono" font-size="12" style="fill:#1B2430">120</text>
  <text x="198.0" y="166.0" class="note" text-anchor="middle" xml:space="preserve">3</text>
  <rect x="220.0" y="120.0" width="36.0" height="30.0" rx="3" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.2"/>
  <text x="238.0" y="139.3" text-anchor="middle" class="mono" font-size="12" style="fill:#1B2430">150</text>
  <text x="238.0" y="166.0" class="note" text-anchor="middle" xml:space="preserve">4</text>
  <rect x="260.0" y="120.0" width="36.0" height="30.0" rx="3" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.2"/>
  <text x="278.0" y="139.3" text-anchor="middle" class="mono" font-size="12" style="fill:#1B2430">180</text>
  <text x="278.0" y="166.0" class="note" text-anchor="middle" xml:space="preserve">5</text>
  <rect x="300.0" y="120.0" width="36.0" height="30.0" rx="3" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="318.0" y="139.3" text-anchor="middle" class="mono" font-size="12" style="fill:#1B2430">120</text>
  <text x="318.0" y="166.0" class="note" text-anchor="middle" xml:space="preserve">6</text>
  <rect x="340.0" y="120.0" width="36.0" height="30.0" rx="3" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="358.0" y="139.3" text-anchor="middle" class="mono" font-size="12" style="fill:#1B2430">150</text>
  <text x="358.0" y="166.0" class="note" text-anchor="middle" xml:space="preserve">7</text>
  <rect x="380.0" y="120.0" width="36.0" height="30.0" rx="3" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="398.0" y="139.3" text-anchor="middle" class="mono" font-size="12" style="fill:#1B2430">180</text>
  <text x="398.0" y="166.0" class="note" text-anchor="middle" xml:space="preserve">8</text>
  <rect x="420.0" y="120.0" width="36.0" height="30.0" rx="3" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="2.2"/>
  <text x="438.0" y="139.3" text-anchor="middle" class="mono" font-size="12" font-weight="700" style="fill:#1B2430">120</text>
  <text x="438.0" y="166.0" class="note" text-anchor="middle" xml:space="preserve">9</text>
  <rect x="460.0" y="120.0" width="36.0" height="30.0" rx="3" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="2.2"/>
  <text x="478.0" y="139.3" text-anchor="middle" class="mono" font-size="12" font-weight="700" style="fill:#1B2430">150</text>
  <text x="478.0" y="166.0" class="note" text-anchor="middle" xml:space="preserve">10</text>
  <rect x="500.0" y="120.0" width="36.0" height="30.0" rx="3" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="2.2"/>
  <text x="518.0" y="139.3" text-anchor="middle" class="mono" font-size="12" font-weight="700" style="fill:#1B2430">180</text>
  <text x="518.0" y="166.0" class="note" text-anchor="middle" xml:space="preserve">11</text>
  <text x="118.0" y="184.0" class="note" text-anchor="middle" xml:space="preserve">pixel 0</text>
  <text x="238.0" y="184.0" class="note" text-anchor="middle" xml:space="preserve">pixel 1</text>
  <text x="358.0" y="184.0" class="note" text-anchor="middle" xml:space="preserve">pixel 2</text>
  <text x="478.0" y="184.0" class="note" text-anchor="middle" xml:space="preserve">pixel 3</text>
  <text x="60.0" y="228.0" class="name" text-anchor="start" xml:space="preserve">gray</text>
  <rect x="60.0" y="250.0" width="36.0" height="30.0" rx="3" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="78.0" y="269.3" text-anchor="middle" class="mono" font-size="12" style="fill:#1B2430">144</text>
  <text x="78.0" y="296.0" class="note" text-anchor="middle" xml:space="preserve">0</text>
  <rect x="100.0" y="250.0" width="36.0" height="30.0" rx="3" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.2"/>
  <text x="118.0" y="269.3" text-anchor="middle" class="mono" font-size="12" style="fill:#1B2430">144</text>
