<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="680" height="424" role="img" aria-label="Two panels. Left, Amdahl, the same job: a 30 microsecond serial bar and a parallel bar of 100, 25 and 12.5 microseconds on 1, 4 and 8 processors; the serial bar never shrinks. Right, Gustafson, the same time: 4 processors run 1 serial second and four 9-second bars side by side, 10 seconds in all; the same work on one processor is 1 + 4 × 9 = 37 seconds, so the speedup is 3.7.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="680" height="424" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Two questions about the same kind of program</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Amdahl keeps the job fixed. Gustafson keeps the time fixed.</text>
  <rect x="16" y="104" width="316" height="300" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="185.3" height="22" rx="11" fill="#1B2430"/>
  <text x="126.7" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">AMDAHL: THE SAME JOB</text>
  <text x="32.0" y="136.0" class="name" text-anchor="start" xml:space="preserve">1 processor: 130 µs</text>
  <rect x="32.0" y="146.0" width="57.0" height="30.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="60.5" y="165.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">30 µs</text>
  <rect x="89.0" y="146.0" width="190.0" height="30.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="184.0" y="165.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">100 µs</text>
  <text x="287.0" y="166.0" class="note" text-anchor="start" xml:space="preserve"></text>
  <text x="32.0" y="210.0" class="name" text-anchor="start" xml:space="preserve">4 processors: 55 µs</text>
  <rect x="32.0" y="220.0" width="57.0" height="30.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="60.5" y="239.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">30 µs</text>
  <rect x="89.0" y="220.0" width="47.5" height="30.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="112.8" y="239.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">25 µs</text>
  <text x="144.5" y="240.0" class="note" text-anchor="start" xml:space="preserve">on each of 4</text>
  <text x="32.0" y="284.0" class="name" text-anchor="start" xml:space="preserve">8 processors: 42.5 µs</text>
  <rect x="32.0" y="294.0" width="57.0" height="30.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="60.5" y="313.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">30 µs</text>
  <rect x="89.0" y="294.0" width="23.8" height="30.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="120.8" y="314.0" class="note" text-anchor="start" xml:space="preserve">12.5 µs on each of 8</text>
  <text x="32.0" y="372.0" class="note" text-anchor="start" xml:space="preserve">the 30 µs never shrinks, so no run</text>
  <text x="32.0" y="390.0" class="note" text-anchor="start" xml:space="preserve">can be shorter than 30 µs</text>
  <rect x="348" y="104" width="316" height="300" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="366" y="93" width="216.8" height="22" rx="11" fill="#1B2430"/>
  <text x="474.4" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">GUSTAFSON: THE SAME TIME</text>
  <text x="364.0" y="136.0" class="name" text-anchor="start" xml:space="preserve">4 processors, a 10 s run</text>
  <rect x="364.0" y="146.0" width="30.0" height="92.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="379.0" y="196.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">1 s</text>
  <rect x="398.0" y="146.0" width="130.0" height="20.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="463.0" y="160.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">9 s</text>
  <rect x="398.0" y="170.0" width="130.0" height="20.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="463.0" y="184.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">9 s</text>
  <rect x="398.0" y="194.0" width="130.0" height="20.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="463.0" y="208.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">9 s</text>
  <rect x="398.0" y="218.0" width="130.0" height="20.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="463.0" y="232.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">9 s</text>
  <text x="364.0" y="278.0" class="name" text-anchor="start" xml:space="preserve">the same work on 1 processor</text>
  <rect x="364.0" y="288.0" width="30.0" height="30.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="379.0" y="307.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">1 s</text>
  <rect x="398.0" y="288.0" width="58.0" height="30.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="427.0" y="307.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">9 s</text>
  <rect x="460.0" y="288.0" width="58.0" height="30.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="489.0" y="307.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">9 s</text>
  <rect x="522.0" y="288.0" width="58.0" height="30.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="551.0" y="307.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">9 s</text>
  <rect x="584.0" y="288.0" width="58.0" height="30.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="613.0" y="307.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">9 s</text>
  <text x="364.0" y="350.0" class="note" text-anchor="start" xml:space="preserve">1 + 4 × 9 = 37 s on 1 processor</text>
  <text x="364.0" y="370.0" class="note" text-anchor="start" xml:space="preserve">4 processors: 37 / 10 = 3.7 times faster</text>
  <text x="364.0" y="390.0" class="note" text-anchor="start" xml:space="preserve">(bars not to scale)</text>
</svg>
