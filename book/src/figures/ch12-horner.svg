<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" role="img" aria-label="Horner&#x27;s rule for p of x = 1 + x over 2 + x squared over 3 at x = 0.5, in 3 rows. Start: p = c[2] = 1/3 = 0.3333. k = 1: p = 0.3333 times 0.5 plus 0.5 = 0.6667. k = 0: p = 0.6667 times 0.5 plus 1 = 1.3333, which matches 1 + 0.25 + 0.0833 computed term by term.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="420" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Horner&#x27;s rule by hand</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Degree 2: 2 multiply-adds, from the highest coefficient down.</text>
  <rect x="16" y="100" width="628" height="300" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="89" width="138.1" height="22" rx="11" fill="#1B2430"/>
  <text x="103.1" y="104.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">WORKED BY HAND</text>
  <text x="36.0" y="140.0" class="note" text-anchor="start" xml:space="preserve">p(x) = 1 + x / 2 + x² / 3, so c[0] = 1, c[1] = 1/2, c[2] = 1/3; take x = 0.5.</text>
  <rect x="36.0" y="173" width="47.0" height="18" rx="9" fill="#F1F4F7"/>
  <text x="59.5" y="185.6" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">start</text>
  <rect x="110.0" y="160.0" width="170.0" height="40.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="195.0" y="184.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">p = c[2]</text>
  <rect x="296.0" y="160.0" width="190.0" height="40.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="391.0" y="184.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1/3</text>
  <rect x="502.0" y="160.0" width="120.0" height="40.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="562.0" y="184.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">p = 0.3333</text>
  <rect x="36.0" y="229" width="47.0" height="18" rx="9" fill="#F1F4F7"/>
  <text x="59.5" y="241.6" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">k = 1</text>
  <rect x="110.0" y="216.0" width="170.0" height="40.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="195.0" y="240.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">p = p × x + c[1]</text>
  <rect x="296.0" y="216.0" width="190.0" height="40.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="391.0" y="240.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">0.3333 × 0.5 + 0.5</text>
  <rect x="502.0" y="216.0" width="120.0" height="40.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="562.0" y="240.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">p = 0.6667</text>
  <rect x="36.0" y="285" width="47.0" height="18" rx="9" fill="#F1F4F7"/>
  <text x="59.5" y="297.6" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">k = 0</text>
  <rect x="110.0" y="272.0" width="170.0" height="40.0" rx="5" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="195.0" y="296.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">p = p × x + c[0]</text>
  <rect x="296.0" y="272.0" width="190.0" height="40.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="391.0" y="296.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">0.6667 × 0.5 + 1</text>
  <rect x="502.0" y="272.0" width="120.0" height="40.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="562.0" y="296.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">p = 1.3333</text>
  <text x="36.0" y="340.0" class="note" text-anchor="start" xml:space="preserve">Check, term by term: 1 + 0.5 / 2 + 0.25 / 3 = 1 + 0.25 + 0.0833 = 1.3333.</text>
  <text x="36.0" y="364.0" class="note" text-anchor="start" xml:space="preserve">A polynomial of degree d takes d multiply-adds, 1 per coefficient after the first,</text>
  <text x="36.0" y="382.0" class="note" text-anchor="start" xml:space="preserve">and no powers of x. Each step needs the result of the step before.</text>
</svg>
