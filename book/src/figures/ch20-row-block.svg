<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 512" width="660" height="512" role="img" aria-label="A row of 4,096 columns drawn as 16 groups of 256. Thread 5 reads column 5 of every group, 16 values in all. The 256 partial results become 8 warp results by shuffles, the 8 are written to shared memory by lane 0 of each warp, and every thread then reads the 8 slots to obtain the row result.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="512" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">1 block per row</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each thread reduces 16 values, each warp 32 threads, and the block 8 warps.</text>
  <rect x="16" y="96" width="628" height="400" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="85" width="334.8" height="22" rx="11" fill="#1B2430"/>
  <text x="201.4" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1 BLOCK OF 256 THREADS PER ROW OF 4,096</text>
  <rect x="40.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="56.0" y="149.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">0</text>
  <rect x="76.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="92.0" y="149.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">1</text>
  <rect x="112.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="128.0" y="149.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">2</text>
  <rect x="148.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="164.0" y="149.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">3</text>
  <rect x="184.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="200.0" y="149.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">4</text>
  <rect x="220.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="236.0" y="149.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">5</text>
  <rect x="256.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="272.0" y="149.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">6</text>
  <rect x="292.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="308.0" y="149.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">7</text>
  <rect x="328.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="344.0" y="149.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">8</text>
  <rect x="364.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="380.0" y="149.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">9</text>
  <rect x="400.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="416.0" y="149.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">10</text>
  <rect x="436.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="452.0" y="149.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">11</text>
  <rect x="472.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="488.0" y="149.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">12</text>
  <rect x="508.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="524.0" y="149.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">13</text>
  <rect x="544.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="560.0" y="149.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">14</text>
  <rect x="580.0" y="132.0" width="32.0" height="26.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="596.0" y="149.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">15</text>
  <text x="40.0" y="178.0" class="note" text-anchor="start" xml:space="preserve">The row as 16 groups of 256 columns; group k holds columns 256 k to 256 k + 255.</text>
  <circle cx="56.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="92.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="128.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="164.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="200.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="236.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="272.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="308.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="344.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="380.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="416.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="452.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="488.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="524.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="560.0" cy="200" r="4" fill="#B7791F"/>
  <circle cx="596.0" cy="200" r="4" fill="#B7791F"/>
  <text x="40.0" y="228.0" class="note" text-anchor="start" xml:space="preserve">Thread 5 reads column 5 of every group: 5, 261, 517, ..., 3,845, 16 values.</text>
  <rect x="40" y="252" width="270" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,252.7 H46 V315.3 H52 A11.3,11.3 0 0 1 40.7,304 V264 A11.3,11.3 0 0 1 52,252.7 Z" fill="#B7791F"/>
  <text x="60.0" y="280.0" class="name" text-anchor="start" xml:space="preserve">256 partial results</text>
  <text x="60.0" y="298.0" class="sub" text-anchor="start" xml:space="preserve">1 per thread, in registers</text>
  <rect x="350" y="252" width="270" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M362,252.7 H356 V315.3 H362 A11.3,11.3 0 0 1 350.7,304 V264 A11.3,11.3 0 0 1 362,252.7 Z" fill="#1F8A70"/>
  <text x="370.0" y="280.0" class="name" text-anchor="start" xml:space="preserve">8 warp results</text>
  <text x="370.0" y="298.0" class="sub" text-anchor="start" xml:space="preserve">5 shuffle steps in each warp</text>
  <path class="wire" d="M310,284 L350,284" marker-end="url(#head)"/>
  <rect x="350" y="344" width="270" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M362,344.7 H356 V407.3 H362 A11.3,11.3 0 0 1 350.7,396 V356 A11.3,11.3 0 0 1 362,344.7 Z" fill="#7A4FD0"/>
  <text x="370.0" y="372.0" class="name" text-anchor="start" xml:space="preserve">8 slots in shared memory</text>
  <text x="370.0" y="390.0" class="sub" text-anchor="start" xml:space="preserve">lane 0 of each warp writes</text>
  <path d="M485,316 V341" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="40" y="344" width="270" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,344.7 H46 V407.3 H52 A11.3,11.3 0 0 1 40.7,396 V356 A11.3,11.3 0 0 1 52,344.7 Z" fill="#2E8B3D"/>
  <text x="60.0" y="372.0" class="name" text-anchor="start" xml:space="preserve">1 row result</text>
  <text x="60.0" y="390.0" class="sub" text-anchor="start" xml:space="preserve">every thread reads the 8 slots</text>
  <path class="wire" d="M350,376 L310,376" marker-end="url(#head)"/>
  <text x="40.0" y="440.0" class="note" text-anchor="start" xml:space="preserve">2 barriers per reduction: after the slots are written, and after they are read,</text>
  <text x="40.0" y="458.0" class="note" text-anchor="start" xml:space="preserve">so the next reduction of the same block cannot overwrite a slot still in use.</text>
</svg>
