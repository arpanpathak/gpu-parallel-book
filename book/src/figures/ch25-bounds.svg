  <text x="380.5" y="270.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">threads 1,000 to 1,023: block 3, threads 232 to 255</text>
  <text x="202.0" y="352.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">a + 4,000 bytes</text>
  <text x="613.0" y="352.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">a + 4,096 bytes</text>
  <text x="40.0" y="374.0" class="note" text-anchor="start" xml:space="preserve">24 floats of padding, 96 bytes, that belong to no array</text>
  <text x="40.0" y="420.0" class="note" text-anchor="start" xml:space="preserve">cudaMalloc gave each 4,000-byte array a 4,096-byte slot. 1,024 threads − 1,000 elements =</text>
  <text x="40.0" y="438.0" class="note" text-anchor="start" xml:space="preserve">24 extra threads; 24 × 4 bytes = 96 bytes, exactly the padding. The stray accesses touched</text>
  <text x="40.0" y="456.0" class="note" text-anchor="start" xml:space="preserve">no other array, so the program saw nothing wrong; memcheck reports every one of them.</text>
</svg>
