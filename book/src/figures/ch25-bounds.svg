  <text x="233.3" y="200.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">+4,096 bytes</text>
  <rect x="426.7" y="140.0" width="186.8" height="40.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="520.1" y="164.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">c[0] … c[999]</text>
  <rect x="615.5" y="140.0" width="2.5" height="40.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="426.7" y="200.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">+8,192 bytes</text>
