  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Why the missing guard went unnoticed</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">24 stray threads × 4 bytes fit exactly in the padding.</text>
