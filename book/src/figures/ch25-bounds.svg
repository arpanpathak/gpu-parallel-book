  <rect x="34" y="229" width="90.9" height="22" rx="11" fill="#1B2430"/>
  <text x="79.5" y="244.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">ENLARGED</text>
  <rect x="40.0" y="296.0" width="51.0" height="34.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="65.5" y="317.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">a[997]</text>
