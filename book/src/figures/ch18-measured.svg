<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 344" width="660" height="344" role="img" aria-label="A bar as long as the GPU&#x27;s memory bandwidth, 102 GB/s. The copy ran at 38.8 GB/s, so 38.8 GB/s were read and 38.8 GB/s written: 77.6 GB/s, 76% of the bandwidth. The rest of the bar is unused.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="344" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">1 copy inside 1 GPU, measured</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The rate that no link to a peer exceeds.</text>
  <rect x="176" y="102" width="14" height="14" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="197.0" y="113.5" class="note" text-anchor="start" xml:space="preserve">read</text>
  <rect x="245.4" y="102" width="14" height="14" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="266.4" y="113.5" class="note" text-anchor="start" xml:space="preserve">written</text>
  <rect x="334.6" y="102" width="14" height="14" rx="4" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="355.6" y="113.5" class="note" text-anchor="start" xml:space="preserve">unused</text>
  <text x="160.0" y="158.0" class="name" text-anchor="end" xml:space="preserve">measured GPU</text>
  <text x="160.0" y="176.0" class="sub" text-anchor="end" xml:space="preserve">102 GB/s memory</text>
  <clipPath id="clip-176-140"><rect x="176" y="140" width="440" height="44" rx="6"/></clipPath>
  <g clip-path="url(#clip-176-140)" filter="url(#lift)">
  <rect x="176.0" y="140" width="167.4" height="44" fill="#2F6FDB"/>
  <text x="259.7" y="166.2" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">38.8 GB/s</text>
  <rect x="343.4" y="140" width="167.4" height="44" fill="#7A4FD0"/>
  <text x="427.1" y="166.2" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">38.8 GB/s</text>
  <rect x="510.7" y="140" width="105.3" height="44" fill="#E4E8EE"/>
  </g>
  <rect x="176" y="140" width="440" height="44" rx="6" fill="none" stroke="#D5DBE3" stroke-width="1.2"/>
  <line x1="176.0" y1="190.0" x2="176.0" y2="196.0" stroke="#5D6B7A" stroke-width="1"/>
  <text x="176.0" y="212.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0 GB/s</text>
  <line x1="283.8" y1="190.0" x2="283.8" y2="196.0" stroke="#5D6B7A" stroke-width="1"/>
  <text x="283.8" y="212.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">25 GB/s</text>
  <line x1="391.7" y1="190.0" x2="391.7" y2="196.0" stroke="#5D6B7A" stroke-width="1"/>
  <text x="391.7" y="212.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">50 GB/s</text>
  <line x1="499.5" y1="190.0" x2="499.5" y2="196.0" stroke="#5D6B7A" stroke-width="1"/>
  <text x="499.5" y="212.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">75 GB/s</text>
  <line x1="607.4" y1="190.0" x2="607.4" y2="196.0" stroke="#5D6B7A" stroke-width="1"/>
  <text x="607.4" y="212.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">100 GB/s</text>
  <text x="176.0" y="244.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">copied: 134.2 MB ÷ 3.462 ms = 38.8 GB/s</text>
  <text x="176.0" y="264.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">moved:  2 × 38.8 = 77.6 GB/s, 76% of 102 GB/s</text>
  <text x="24.0" y="304.0" class="note" text-anchor="start" xml:space="preserve">cudaMemcpyPeerAsync of 128 MiB inside 1 GPU. The bar is the GPU&#x27;s memory bandwidth; a copy</text>
  <text x="24.0" y="322.0" class="note" text-anchor="start" xml:space="preserve">spends it twice, once to read each byte and once to write it.</text>
</svg>
