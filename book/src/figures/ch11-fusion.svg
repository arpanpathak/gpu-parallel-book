<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" role="img" aria-label="2 rows of bars drawn to scale. Top, transform then reduce: read 256 MiB, write 256 MiB of squares, read the squares again, 768 MiB in all, measured 10.51 ms. Bottom, transform_reduce: read 256 MiB once, each square kept in a register, measured 3.15 ms. A note says 3 times the bytes, 3.3 times the time.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="470" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Fusion</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The sum of squares of 256 MiB of floats.</text>
  <rect x="16" y="104" width="628" height="150" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="201.1" height="22" rx="11" fill="#1B2430"/>
  <text x="134.5" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">TRANSFORM, THEN REDUCE</text>
  <rect x="16" y="282" width="628" height="116" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="271" width="153.9" height="22" rx="11" fill="#1B2430"/>
  <text x="110.9" y="286.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">TRANSFORM_REDUCE</text>
  <rect x="216.0" y="140.0" width="122.7" height="34.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="277.3" y="161.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read x</text>
  <rect x="342.7" y="140.0" width="122.7" height="34.0" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <text x="404.0" y="161.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">write x²</text>
  <rect x="469.3" y="140.0" width="122.7" height="34.0" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="530.7" y="161.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">read x² again</text>
  <text x="200.0" y="162.0" class="name" text-anchor="end" xml:space="preserve">768 MiB</text>
  <text x="40.0" y="212.0" class="sub" text-anchor="start" xml:space="preserve">2 calls, 2 launches, a 256 MiB array of squares</text>
  <rect x="470.0" y="200" width="126.2" height="18" rx="9" fill="#FCEBE6"/>
  <text x="533.1" y="212.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">measured 10.51 ms</text>
  <rect x="216.0" y="318.0" width="122.7" height="34.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="277.3" y="339.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">read x</text>
  <text x="200.0" y="340.0" class="name" text-anchor="end" xml:space="preserve">256 MiB</text>
  <text x="354.7" y="340.0" class="sub" text-anchor="start" xml:space="preserve">x² stays in a register</text>
  <rect x="470.0" y="368" width="119.6" height="18" rx="9" fill="#E7F5E9"/>
  <text x="529.8" y="380.6" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">measured 3.15 ms</text>
  <text x="40.0" y="430.0" class="note" text-anchor="start" xml:space="preserve">Bytes moved for 67,108,864 floats: 3 × 256 MiB against 1 × 256 MiB. The fused</text>
  <text x="40.0" y="448.0" class="note" text-anchor="start" xml:space="preserve">call ran 3.3 times as fast; the memory, not the arithmetic, sets the time.</text>
</svg>
