  <text x="40.0" y="334.0" class="note" text-anchor="start" xml:space="preserve">weight (i, j) = a(i) x b(j); the 25 sum to 16 x 16 = 256</text>
  <text x="330.0" y="96.0" class="name" text-anchor="start" xml:space="preserve">pixel (3, 3), 2 passes</text>
