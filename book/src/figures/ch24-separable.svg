  <text x="330.0" y="314.0" class="note" text-anchor="start" xml:space="preserve">work per pixel: 5 + 5 = 10 multiply-adds</text>
  <text x="330.0" y="334.0" class="note" text-anchor="start" xml:space="preserve">instead of 5 x 5 = 25</text>
