<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 506" width="660" height="506" role="img" aria-label="Two zones. Left, 1 collector: ranks 1, 2 and 3 each send 100 MB up to rank 0, so rank 0&#x27;s link carries 300 MB in and then 300 MB back out, 24 ms at 25 GB/s. Right, a ring of 4 ranks: each link carries 150 MB in each direction, all links at once, 6 ms.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="506" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">1 collector or a ring</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The same all-reduce of 100 MB: the busiest link decides the time.</text>
  <rect x="16" y="104" width="300" height="330" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="114.5" height="22" rx="11" fill="#1B2430"/>
  <text x="91.3" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1 COLLECTOR</text>
  <rect x="344" y="104" width="300" height="330" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="362" y="93" width="75.2" height="22" rx="11" fill="#1B2430"/>
  <text x="399.6" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">A RING</text>
  <rect x="108" y="140" width="104" height="46" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M120,140.7 H114 V185.3 H120 A11.3,11.3 0 0 1 108.7,174 V152 A11.3,11.3 0 0 1 120,140.7 Z" fill="#B7791F"/>
  <text x="128.0" y="168.0" class="name" text-anchor="start" xml:space="preserve">rank 0</text>
  <rect x="30" y="340" width="84" height="46" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M42,340.7 H36 V385.3 H42 A11.3,11.3 0 0 1 30.7,374 V352 A11.3,11.3 0 0 1 42,340.7 Z" fill="#2F6FDB"/>
  <text x="50.0" y="368.0" class="name" text-anchor="start" xml:space="preserve">rank 1</text>
  <path class="wire" d="M72,340 L72,270"/>
  <rect x="45.2" y="296.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="72.0" y="308.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">100 MB</text>
  <rect x="116" y="340" width="84" height="46" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M128,340.7 H122 V385.3 H128 A11.3,11.3 0 0 1 116.7,374 V352 A11.3,11.3 0 0 1 128,340.7 Z" fill="#2F6FDB"/>
  <text x="136.0" y="368.0" class="name" text-anchor="start" xml:space="preserve">rank 2</text>
  <path class="wire" d="M158,340 L158,270"/>
  <rect x="131.2" y="296.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="158.0" y="308.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">100 MB</text>
  <rect x="202" y="340" width="84" height="46" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M214,340.7 H208 V385.3 H214 A11.3,11.3 0 0 1 202.7,374 V352 A11.3,11.3 0 0 1 214,340.7 Z" fill="#2F6FDB"/>
  <text x="222.0" y="368.0" class="name" text-anchor="start" xml:space="preserve">rank 3</text>
  <path class="wire" d="M244,340 L244,270"/>
  <rect x="217.2" y="296.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="244.0" y="308.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">100 MB</text>
  <path d="M72,270 H244" fill="none" stroke="#3F5873" stroke-width="1.8"/>
  <circle cx="160" cy="270" r="3" fill="#3F5873"/>
  <path class="wire" d="M160,270 L160,189" marker-end="url(#head)"/>
  <rect x="133.2" y="220.5" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="160.0" y="233.3" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">300 MB</text>
  <text x="36.0" y="408.0" class="note" text-anchor="start" xml:space="preserve">Rank 0&#x27;s link carries 300 MB in,</text>
  <text x="36.0" y="424.0" class="note" text-anchor="start" xml:space="preserve">then 300 MB back out: 24 ms.</text>
  <rect x="374" y="160" width="88" height="46" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M386,160.7 H380 V205.3 H386 A11.3,11.3 0 0 1 374.7,194 V172 A11.3,11.3 0 0 1 386,160.7 Z" fill="#2F6FDB"/>
  <text x="394.0" y="188.0" class="name" text-anchor="start" xml:space="preserve">rank 0</text>
  <rect x="530" y="160" width="88" height="46" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M542,160.7 H536 V205.3 H542 A11.3,11.3 0 0 1 530.7,194 V172 A11.3,11.3 0 0 1 542,160.7 Z" fill="#2F6FDB"/>
  <text x="550.0" y="188.0" class="name" text-anchor="start" xml:space="preserve">rank 1</text>
  <rect x="530" y="300" width="88" height="46" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M542,300.7 H536 V345.3 H542 A11.3,11.3 0 0 1 530.7,334 V312 A11.3,11.3 0 0 1 542,300.7 Z" fill="#2F6FDB"/>
  <text x="550.0" y="328.0" class="name" text-anchor="start" xml:space="preserve">rank 2</text>
  <rect x="374" y="300" width="88" height="46" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M386,300.7 H380 V345.3 H386 A11.3,11.3 0 0 1 374.7,334 V312 A11.3,11.3 0 0 1 386,300.7 Z" fill="#2F6FDB"/>
  <text x="394.0" y="328.0" class="name" text-anchor="start" xml:space="preserve">rank 3</text>
  <path class="wire" d="M462,183 L530,183" marker-end="url(#head)"/>
  <path class="wire" d="M574,206 L574,300" marker-end="url(#head)"/>
  <rect x="547.2" y="244.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="574.0" y="256.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">150 MB</text>
  <path class="wire" d="M530,323 L462,323" marker-end="url(#head)"/>
  <path class="wire" d="M418,300 L418,206" marker-end="url(#head)"/>
  <rect x="391.2" y="244.0" width="53.6" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="418.0" y="256.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">150 MB</text>
  <text x="496.0" y="176.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">150 MB</text>
  <text x="496.0" y="344.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">150 MB</text>
  <text x="364.0" y="408.0" class="note" text-anchor="start" xml:space="preserve">Every link carries 150 MB each</text>
  <text x="364.0" y="424.0" class="note" text-anchor="start" xml:space="preserve">way, all at once: 6 ms.</text>
  <text x="16.0" y="466.0" class="note" text-anchor="start" xml:space="preserve">All-reduce of m = 100 MB over 4 GPUs, each with 1 link of 25 GB/s in each direction.</text>
  <text x="16.0" y="484.0" class="note" text-anchor="start" xml:space="preserve">The collector&#x27;s link moves (k − 1) m each way; a ring link moves 2 (k − 1) m / k.</text>
</svg>
