<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 452" width="660" height="452" role="img" aria-label="3 cards joined by arrows. Global memory holds A, B and C, is seen by all threads and answers in hundreds of cycles. Shared memory holds tileA of 64 by 16 and tileB of 16 by 64 floats for 1 block during 1 phase. Registers hold a_reg of 4 values, b_reg of 4 values and acc of 4 by 4 = 16 sums for 1 thread. Below, the counts for 4 by 4 per thread with blocks of 64 by 64 and BK = 16: per phase a block copies 64 times 16 plus 16 times 64 = 2,048 floats, 8 per thread; per offset a thread reads 8 floats from shared memory and does 16 multiply-adds, 0.5 reads per multiply-add.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker><marker id="head-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker><marker id="head-danger-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker><marker id="head-idle-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="660" height="452" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">3 levels of memory</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each value moves once per level and is reused at the level below it.</text>
  <rect filter="url(#m3-shadow)" x="16" y="112" width="196" height="116" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1.3"/>
  <path d="M28,112.7 H22 V227.3 H28 A11.3,11.3 0 0 1 16.7,216 V124 A11.3,11.3 0 0 1 28,112.7 Z" fill="#7F8EA0"/>
  <text x="36.0" y="148.0" class="name" text-anchor="start" xml:space="preserve">global memory</text>
  <text x="36.0" y="166.0" class="sub" text-anchor="start" xml:space="preserve">A, B and C</text>
  <text x="36.0" y="184.0" class="sub" text-anchor="start" xml:space="preserve">all threads</text>
  <text x="36.0" y="202.0" class="sub" text-anchor="start" xml:space="preserve">hundreds of cycles</text>
  <rect filter="url(#m3-shadow)" x="232" y="112" width="196" height="116" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1.3"/>
  <path d="M244,112.7 H238 V227.3 H244 A11.3,11.3 0 0 1 232.7,216 V124 A11.3,11.3 0 0 1 244,112.7 Z" fill="#1F8A70"/>
  <text x="252.0" y="148.0" class="name" text-anchor="start" xml:space="preserve">shared memory</text>
  <text x="252.0" y="166.0" class="sub" text-anchor="start" xml:space="preserve">tileA 64 × 16</text>
  <text x="252.0" y="184.0" class="sub" text-anchor="start" xml:space="preserve">tileB 16 × 64</text>
  <text x="252.0" y="202.0" class="sub" text-anchor="start" xml:space="preserve">1 block, 1 phase</text>
  <rect filter="url(#m3-shadow)" x="448" y="112" width="196" height="116" rx="12" fill="#FFFFFF" stroke="none" stroke-width="1.3"/>
  <path d="M460,112.7 H454 V227.3 H460 A11.3,11.3 0 0 1 448.7,216 V124 A11.3,11.3 0 0 1 460,112.7 Z" fill="#B7791F"/>
  <text x="468.0" y="148.0" class="name" text-anchor="start" xml:space="preserve">registers</text>
  <text x="468.0" y="166.0" class="sub" text-anchor="start" xml:space="preserve">a_reg: 4, b_reg: 4</text>
  <text x="468.0" y="184.0" class="sub" text-anchor="start" xml:space="preserve">acc: 4 × 4 = 16</text>
  <text x="468.0" y="202.0" class="sub" text-anchor="start" xml:space="preserve">1 thread</text>
  <path d="M 212,170 L 225.4,170.0" fill="none" stroke="#7F8EA0" stroke-width="1.8" stroke-linecap="butt" marker-end="url(#head-small)"/>
  <path d="M 428,170 L 441.4,170.0" fill="none" stroke="#7F8EA0" stroke-width="1.8" stroke-linecap="butt" marker-end="url(#head-small)"/>
  <rect x="16" y="262" width="628" height="168" rx="16" fill="#F0EEE6" stroke="none" stroke-width="1.2"/>
  <rect x="34" y="251" width="460.6" height="22" rx="11" fill="#1B2430"/>
  <text x="264.3" y="266.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">COUNTS FOR 4 × 4 PER THREAD, BLOCKS OF 64 × 64, BK = 16</text>
  <text x="36.0" y="298.0" class="name" text-anchor="start" xml:space="preserve">global → shared</text>
  <text x="200.0" y="298.0" class="note" text-anchor="start" xml:space="preserve">per phase, 1 block copies 64 · 16 + 16 · 64 = 2,048 floats</text>
  <text x="200.0" y="324.0" class="note" text-anchor="start" xml:space="preserve">each of the 256 threads copies 8 of them</text>
  <text x="36.0" y="350.0" class="name" text-anchor="start" xml:space="preserve">shared → registers</text>
  <text x="200.0" y="350.0" class="note" text-anchor="start" xml:space="preserve">per offset, 1 thread reads 4 + 4 = 8 floats</text>
  <text x="36.0" y="376.0" class="name" text-anchor="start" xml:space="preserve">registers</text>
  <text x="200.0" y="376.0" class="note" text-anchor="start" xml:space="preserve">per offset, 1 thread does 4 · 4 = 16 multiply-adds</text>
  <text x="200.0" y="402.0" class="note" text-anchor="start" xml:space="preserve">0.5 shared-memory reads per multiply-add</text>
</svg>
