  <rect x="286.0" y="146.0" width="48.0" height="30.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.3"/>
  <text x="310.0" y="165.0" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">1</text>
  <text x="310.0" y="189.0" text-anchor="middle" font-size="10.5" style="fill:#5D6B7A" xml:space="preserve">d1 t0</text>
  <rect x="344.0" y="146.0" width="48.0" height="30.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.3"/>
  <text x="368.0" y="165.0" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">1</text>
  <text x="368.0" y="189.0" text-anchor="middle" font-size="10.5" style="fill:#5D6B7A" xml:space="preserve">d1 t1</text>
  <rect x="402.0" y="146.0" width="48.0" height="30.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.3"/>
  <text x="426.0" y="165.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">2</text>
  <text x="426.0" y="189.0" text-anchor="middle" font-size="10.5" style="fill:#5D6B7A" xml:space="preserve">d2 t0</text>
  <rect x="460.0" y="146.0" width="48.0" height="30.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.3"/>
  <text x="484.0" y="165.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1</text>
  <text x="484.0" y="189.0" text-anchor="middle" font-size="10.5" style="fill:#5D6B7A" xml:space="preserve">d2 t1</text>
  <rect x="518.0" y="146.0" width="48.0" height="30.0" rx="8" fill="#C1E1D8" stroke="none" stroke-width="1.3"/>
  <text x="542.0" y="165.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">1</text>
  <text x="542.0" y="189.0" text-anchor="middle" font-size="10.5" style="fill:#5D6B7A" xml:space="preserve">d3 t0</text>
  <rect x="576.0" y="146.0" width="48.0" height="30.0" rx="8" fill="#C1E1D8" stroke="none" stroke-width="1.3"/>
  <text x="600.0" y="165.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">1</text>
  <text x="600.0" y="189.0" text-anchor="middle" font-size="10.5" style="fill:#5D6B7A" xml:space="preserve">d3 t1</text>
  <text x="156.0" y="241.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">exclusive</text>
  <rect x="170.0" y="222.0" width="48.0" height="30.0" rx="8" fill="#2F6FDB" stroke="none" stroke-width="1.3"/>
  <text x="194.0" y="241.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">0</text>
  <rect x="228.0" y="222.0" width="48.0" height="30.0" rx="8" fill="#2F6FDB" stroke="none" stroke-width="1.3"/>
  <text x="252.0" y="241.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">0</text>
  <rect x="286.0" y="222.0" width="48.0" height="30.0" rx="8" fill="#7A4FD0" stroke="none" stroke-width="1.3"/>
  <text x="310.0" y="241.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1</text>
  <rect x="344.0" y="222.0" width="48.0" height="30.0" rx="8" fill="#7A4FD0" stroke="none" stroke-width="1.3"/>
  <text x="368.0" y="241.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">2</text>
  <rect x="402.0" y="222.0" width="48.0" height="30.0" rx="8" fill="#B7791F" stroke="none" stroke-width="1.3"/>
  <text x="426.0" y="241.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">3</text>
  <rect x="460.0" y="222.0" width="48.0" height="30.0" rx="8" fill="#B7791F" stroke="none" stroke-width="1.3"/>
  <text x="484.0" y="241.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">5</text>
  <rect x="518.0" y="222.0" width="48.0" height="30.0" rx="8" fill="#1F8A70" stroke="none" stroke-width="1.3"/>
  <text x="542.0" y="241.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">6</text>
  <rect x="576.0" y="222.0" width="48.0" height="30.0" rx="8" fill="#1F8A70" stroke="none" stroke-width="1.3"/>
  <text x="600.0" y="241.0" class="pill" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">7</text>
  <path d="M194.0,190.0 V219.0" fill="none" stroke="#3F5873" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M252.0,190.0 V219.0" fill="none" stroke="#3F5873" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M310.0,190.0 V219.0" fill="none" stroke="#3F5873" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M368.0,190.0 V219.0" fill="none" stroke="#3F5873" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M426.0,190.0 V219.0" fill="none" stroke="#3F5873" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M484.0,190.0 V219.0" fill="none" stroke="#3F5873" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M542.0,190.0 V219.0" fill="none" stroke="#3F5873" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M600.0,190.0 V219.0" fill="none" stroke="#3F5873" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="32.0" y="290.0" class="note" text-anchor="start" xml:space="preserve">The counts are stored digit by digit: digit 0 of tile 0, digit 0 of tile 1, digit 1 of</text>
  <text x="32.0" y="308.0" class="note" text-anchor="start" xml:space="preserve">tile 0, and so on. 1 exclusive scan of this table gives the start of every digit in every</text>
  <text x="32.0" y="326.0" class="note" text-anchor="start" xml:space="preserve">tile: in tile 1, digit 1 starts at 2, after the keys 0 (tile 1) and 5 (tile 0).</text>
</svg>
