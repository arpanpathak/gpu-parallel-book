<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 456" width="660" height="456" role="img" aria-label="Left: 4 GPUs at the corners of a square, joined by 4 sides and 2 diagonals, 6 links, 3 per GPU. Right: an 8 by 8 table of GPU pairs. The diagonal is crossed out, the upper half is shaded: 28 cells, 1 link for each pair, 7 links at each GPU.">
