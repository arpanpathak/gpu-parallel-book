<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 490" width="660" height="490" role="img" aria-label="A row of 16 host floats, all 1.0. A bracket over the first 4 marks 16 bytes: cudaMemcpy with a count of 16 copies only those. On the device, the first 4 floats of in are 1.0 and the other 12 are 0.0; after the kernel doubles them, out holds 4 values of 2.0 and 12 of 0.0. 4 of 16 are correct, because 16 bytes are 4 floats. In the program, 524,288 of 2,097,152.">
