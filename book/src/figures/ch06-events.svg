<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 308" width="660" height="308" role="img" aria-label="A stream holding copy in, kernel and copy out. An event marker named start sits just before the kernel and one named stop just after it. The elapsed time between the 2 events, 10.4 ms, is the kernel&#x27;s time on the GPU.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="308" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Events</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">2 markers in a stream time the work between them on the GPU&#x27;s own clock.</text>
  <text x="40.0" y="160.0" class="name" text-anchor="start" xml:space="preserve">stream</text>
  <rect x="120.0" y="140.0" width="90.0" height="32.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="165.0" y="160.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">copy in</text>
  <rect x="250.0" y="140.0" width="220.0" height="32.0" rx="6" fill="#E4F4EF" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="360.0" y="160.0" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">kernel</text>
  <rect x="510.0" y="140.0" width="100.0" height="32.0" rx="6" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="560.0" y="160.0" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">copy out</text>
  <line x1="230.0" y1="120.0" x2="230.0" y2="196.0" stroke="#CF4526" stroke-width="2.4"/>
  <line x1="490.0" y1="120.0" x2="490.0" y2="196.0" stroke="#CF4526" stroke-width="2.4"/>
  <rect x="230.0" y="98" width="86.6" height="18" rx="9" fill="#FCEBE6"/>
  <text x="273.3" y="110.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">event start</text>
  <rect x="490.0" y="98" width="80.0" height="18" rx="9" fill="#FCEBE6"/>
  <text x="530.0" y="110.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">event stop</text>
  <path class="wire" d="M230,210 L490,210" marker-end="url(#head)"/>
  <rect x="257.3" y="201.0" width="205.4" height="18" rx="9" fill="#FBFAF6" stroke="#3F5873" stroke-width="1"/>
  <text x="360.0" y="213.8" class="pill" text-anchor="middle" style="fill:#3F5873" xml:space="preserve">cudaEventElapsedTime: 10.4 ms</text>
  <text x="40.0" y="268.0" class="note" text-anchor="start" xml:space="preserve">An event is a marker queued in a stream. The GPU records its own clock when it</text>
  <text x="40.0" y="286.0" class="note" text-anchor="start" xml:space="preserve">reaches the marker, so the elapsed time covers only the work between the 2 markers.</text>
</svg>
