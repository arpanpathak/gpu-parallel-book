<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 488" width="660" height="488" role="img" aria-label="Grouped bars of useful bandwidth against stride. Orin NX: 68, 61, 35, 21, 14 and 18 GB/s for strides 1, 2, 4, 8, 16 and 32. Thor: 229, 173, 105, 58, 30 and 51 GB/s.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="488" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Useful bandwidth against stride</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Measured by memory.cu, 16,777,216 reads per run.</text>
  <line x1="110.0" y1="380.0" x2="630.0" y2="380.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="100.0" y="384.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <line x1="110.0" y1="327.9" x2="630.0" y2="327.9" stroke="#D5DBE3" stroke-width="1"/>
  <text x="100.0" y="331.9" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">50</text>
  <line x1="110.0" y1="275.8" x2="630.0" y2="275.8" stroke="#D5DBE3" stroke-width="1"/>
  <text x="100.0" y="279.8" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">100</text>
  <line x1="110.0" y1="223.8" x2="630.0" y2="223.8" stroke="#D5DBE3" stroke-width="1"/>
  <text x="100.0" y="227.8" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">150</text>
  <line x1="110.0" y1="171.7" x2="630.0" y2="171.7" stroke="#D5DBE3" stroke-width="1"/>
  <text x="100.0" y="175.7" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">200</text>
  <rect x="140" y="309.2" width="22" height="70.8" rx="4" fill="#2F6FDB"/>
  <rect x="166" y="141.9" width="22" height="238.1" rx="4" fill="#7A4FD0"/>
  <text x="164.0" y="400.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">stride 1</text>
  <rect x="224" y="316.5" width="22" height="63.5" rx="4" fill="#2F6FDB"/>
  <rect x="250" y="199.9" width="22" height="180.1" rx="4" fill="#7A4FD0"/>
  <text x="248.0" y="400.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">stride 2</text>
  <rect x="308" y="343.4" width="22" height="36.6" rx="4" fill="#2F6FDB"/>
  <rect x="334" y="271.0" width="22" height="109.0" rx="4" fill="#7A4FD0"/>
  <text x="332.0" y="400.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">stride 4</text>
  <rect x="392" y="358.2" width="22" height="21.8" rx="4" fill="#2F6FDB"/>
  <rect x="418" y="319.6" width="22" height="60.4" rx="4" fill="#7A4FD0"/>
  <text x="416.0" y="400.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">stride 8</text>
  <rect x="476" y="365.0" width="22" height="15.0" rx="4" fill="#2F6FDB"/>
  <rect x="502" y="348.8" width="22" height="31.3" rx="4" fill="#7A4FD0"/>
  <text x="500.0" y="400.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">stride 16</text>
  <rect x="560" y="361.7" width="22" height="18.3" rx="4" fill="#2F6FDB"/>
  <rect x="586" y="327.0" width="22" height="53.0" rx="4" fill="#7A4FD0"/>
  <text x="584.0" y="400.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">stride 32</text>
  <text x="100.0" y="112.0" class="sub" text-anchor="end" xml:space="preserve">GB/s useful</text>
  <rect x="110" y="416" width="14" height="14" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="131.0" y="427.5" class="note" text-anchor="start" xml:space="preserve">Jetson Orin NX</text>
  <rect x="245.4" y="416" width="14" height="14" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="266.4" y="427.5" class="note" text-anchor="start" xml:space="preserve">Jetson AGX Thor</text>
  <text x="40.0" y="466.0" class="note" text-anchor="start" xml:space="preserve">Useful bandwidth falls with the sectors wasted, from stride 1 to stride 16.</text>
</svg>
