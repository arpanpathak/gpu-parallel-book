<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" width="640" height="490" role="img" aria-label="Two panels. Top, 1 read in flight: two reads of 500 cycles run one after the other, and a value arrives every 500 cycles. Bottom, 250 reads in flight: the reads are drawn as staggered bars that start 2 cycles apart, each still 500 cycles long, and after the first 500 cycles a value arrives every 2 cycles.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="640" height="490" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">One read in flight, or 250</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each read takes 500 cycles in both panels. Only the number in flight changes.</text>
  <rect x="24" y="104" width="592" height="128" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="42" y="93" width="153.9" height="22" rx="11" fill="#1B2430"/>
  <text x="118.9" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1 READ IN FLIGHT</text>
  <rect x="48.0" y="140.0" width="246.0" height="26.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="171.0" y="157.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">read 0: 500 cycles</text>
  <rect x="298.0" y="140.0" width="246.0" height="26.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="421.0" y="157.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">read 1: 500 cycles</text>
  <rect x="228.0" y="176" width="60.2" height="18" rx="9" fill="#E4F4EF"/>
  <text x="258.1" y="188.6" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">value 1</text>
  <rect x="474.0" y="176" width="60.2" height="18" rx="9" fill="#E4F4EF"/>
  <text x="504.1" y="188.6" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">value 2</text>
  <text x="48.0" y="218.0" class="note" text-anchor="start" xml:space="preserve">one value every 500 cycles</text>
  <rect x="24" y="268" width="592" height="196" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="42" y="257" width="177.5" height="22" rx="11" fill="#1B2430"/>
  <text x="130.7" y="272.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">250 READS IN FLIGHT</text>
  <rect x="48.0" y="296.0" width="246.0" height="12.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="64.0" y="310.0" width="246.0" height="12.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="80.0" y="324.0" width="246.0" height="12.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="96.0" y="338.0" width="246.0" height="12.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="112.0" y="352.0" width="246.0" height="12.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="128.0" y="366.0" width="246.0" height="12.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="144.0" y="380.0" width="246.0" height="12.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="160.0" y="394.0" width="246.0" height="12.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="430.0" y="330.0" class="note" text-anchor="start" xml:space="preserve">8 of the 250 reads</text>
  <text x="430.0" y="348.0" class="note" text-anchor="start" xml:space="preserve">are drawn</text>
  <text x="48.0" y="430.0" class="note" text-anchor="start" xml:space="preserve">a new read starts every 2 cycles, so after the first 500 cycles</text>
  <text x="48.0" y="448.0" class="note" text-anchor="start" xml:space="preserve">one value arrives every 2 cycles: 250 times as many</text>
  <g transform="translate(526,372) scale(0.3167)">
<ellipse cx="78" cy="56" rx="34" ry="24" fill="#d8ecfa" stroke="#9cc3e0" stroke-width="3" transform="rotate(-28 78 56)"/>
<ellipse cx="162" cy="56" rx="34" ry="24" fill="#d8ecfa" stroke="#9cc3e0" stroke-width="3" transform="rotate(28 162 56)"/>
