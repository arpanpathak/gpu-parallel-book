<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 576" width="640" height="576" role="img" aria-label="2 panels on the same time axis, 0 to 1,500 cycles. Top, 1 read in flight: 3 reads of 500 cycles run one after another, and a value arrives at cycles 500, 1,000 and 1,500: 3 values. Bottom, a new read starts every 2 cycles: 500 reads, each a thin slice 500 cycles long, form a slanted band from read 0 (cycles 0 to 500) to read 499 (cycles 998 to 1,498). A dashed line at cycle 750 crosses 250 slices: 250 reads in flight. From cycle 500 on a value arrives every 2 cycles, 501 values by cycle 1,500.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="640" height="576" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">One read in flight, or 250</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each read takes 500 cycles in both panels. Only the number in flight changes.</text>
  <rect x="24" y="100" width="592" height="150" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="42" y="89" width="437.0" height="22" rx="11" fill="#1B2430"/>
  <text x="260.5" y="104.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1 READ IN FLIGHT: EACH READ WAITS FOR THE ONE BEFORE</text>
  <rect x="61.0" y="128.0" width="168.0" height="26.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="145.0" y="145.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">read 0: 500 cycles</text>
  <circle cx="230.0" cy="172" r="5" fill="#1F8A70"/>
  <rect x="231.0" y="128.0" width="168.0" height="26.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="315.0" y="145.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">read 1: 500 cycles</text>
  <circle cx="400.0" cy="172" r="5" fill="#1F8A70"/>
  <rect x="401.0" y="128.0" width="168.0" height="26.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="485.0" y="145.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">read 2: 500 cycles</text>
  <circle cx="570.0" cy="172" r="5" fill="#1F8A70"/>
  <line x1="60.0" y1="190.0" x2="570.0" y2="190.0" stroke="#5D6B7A" stroke-width="1"/>
  <line x1="60.0" y1="186.0" x2="60.0" y2="194.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="60.0" y="208.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <line x1="145.0" y1="186.0" x2="145.0" y2="194.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="145.0" y="208.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">250</text>
  <line x1="230.0" y1="186.0" x2="230.0" y2="194.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="230.0" y="208.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">500</text>
  <line x1="315.0" y1="186.0" x2="315.0" y2="194.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="315.0" y="208.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">750</text>
  <line x1="400.0" y1="186.0" x2="400.0" y2="194.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="400.0" y="208.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">1,000</text>
  <line x1="485.0" y1="186.0" x2="485.0" y2="194.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="485.0" y="208.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">1,250</text>
  <line x1="570.0" y1="186.0" x2="570.0" y2="194.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="570.0" y="208.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">1,500</text>
  <rect x="397.6" y="216" width="172.4" height="18" rx="9" fill="#E4F4EF"/>
  <text x="483.8" y="228.6" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">by cycle 1,500: 3 values</text>
  <text x="60.0" y="230.0" class="note" text-anchor="start" xml:space="preserve">a dot is a value arriving</text>
  <rect x="24" y="272" width="592" height="282" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="42" y="261" width="389.8" height="22" rx="11" fill="#1B2430"/>
  <text x="236.9" y="276.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">250 READS IN FLIGHT: A NEW READ EVERY 2 CYCLES</text>
  <polygon points="60.0,300.0 230.0,300.0 570.0,420.0 400.0,420.0" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.4"/>
  <line x1="60.0" y1="300.0" x2="230.0" y2="300.0" stroke="#2E8B3D" stroke-width="2.6"/>
  <line x1="399.3" y1="419.8" x2="569.3" y2="419.8" stroke="#2E8B3D" stroke-width="2.6"/>
  <text x="60.0" y="292.0" class="note" text-anchor="start" xml:space="preserve">read 0: cycles 0 to 500</text>
  <text x="400.0" y="438.0" class="note" text-anchor="middle" xml:space="preserve">read 499: cycles 998 to 1,498</text>
  <text x="400.0" y="314.0" class="note" text-anchor="start" xml:space="preserve">each horizontal slice of the band</text>
  <text x="400.0" y="332.0" class="note" text-anchor="start" xml:space="preserve">is 1 read of 500 cycles</text>
  <line x1="315.0" y1="292.0" x2="315.0" y2="428.0" stroke="#CF4526" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="321.0" y="351.0" width="172.4" height="18" rx="9" fill="#FCEBE6"/>
  <text x="407.2" y="363.6" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">cycle 750: 250 in flight</text>
  <rect x="230.0" y="451" width="340.0" height="14" fill="#1F8A70" opacity="0.85"/>
  <line x1="60.0" y1="480.0" x2="570.0" y2="480.0" stroke="#5D6B7A" stroke-width="1"/>
  <line x1="60.0" y1="476.0" x2="60.0" y2="484.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="60.0" y="498.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <line x1="145.0" y1="476.0" x2="145.0" y2="484.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="145.0" y="498.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">250</text>
  <line x1="230.0" y1="476.0" x2="230.0" y2="484.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="230.0" y="498.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">500</text>
  <line x1="315.0" y1="476.0" x2="315.0" y2="484.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="315.0" y="498.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">750</text>
  <line x1="400.0" y1="476.0" x2="400.0" y2="484.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="400.0" y="498.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">1,000</text>
  <line x1="485.0" y1="476.0" x2="485.0" y2="484.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="485.0" y="498.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">1,250</text>
  <line x1="570.0" y1="476.0" x2="570.0" y2="484.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="570.0" y="498.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">1,500</text>
  <rect x="384.4" y="506" width="185.6" height="18" rx="9" fill="#E4F4EF"/>
  <text x="477.2" y="518.6" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">by cycle 1,500: 501 values</text>
  <text x="60.0" y="519.0" class="note" text-anchor="start" xml:space="preserve">the solid band: a value every 2 cycles</text>
</svg>
