  <text x="477.0" y="274.0" text-anchor="middle" font-size="11" style="fill:#5D6B7A" xml:space="preserve">runs blocks</text>
  <path d="M477,288 V340" stroke="#9AA6B4" stroke-width="1.4"/>
  <rect x="532.0" y="232.0" width="86.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#9AA6B4" stroke-width="1.3"/>
  <text x="575.0" y="256.0" text-anchor="middle" font-size="12.5" font-weight="650" style="fill:#1B2430" xml:space="preserve">SM p − 1</text>
  <text x="575.0" y="274.0" text-anchor="middle" font-size="11" style="fill:#5D6B7A" xml:space="preserve">runs blocks</text>
  <path d="M575,288 V340" stroke="#9AA6B4" stroke-width="1.4"/>
  <rect x="336.0" y="340.0" width="282.0" height="56.0" rx="10" fill="#ECEEF2" stroke="#C9CED6" stroke-width="1.3"/>
