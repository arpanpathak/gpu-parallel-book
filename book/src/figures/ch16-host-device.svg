  <text x="332.0" y="139.0" text-anchor="middle" font-size="10.5" style="fill:#5D6B7A" xml:space="preserve">threads compute C</text>
  <text x="332.0" y="172.0" text-anchor="middle" font-size="11" style="fill:#8794A3" xml:space="preserve">device</text>
  <path d="M266.0,125.0 L273.0,125.0" fill="none" stroke="#3F5873" stroke-width="1.6" stroke-linecap="round" marker-end="url(#tip-ink)"/>
  <rect x="399.0" y="96.0" width="114.0" height="58.0" rx="10" fill="#DDE3FB" stroke="#5B6BD6" stroke-width="1.3"/>
  <text x="456.0" y="120.0" text-anchor="middle" font-size="13" font-weight="650" style="fill:#1B2430" xml:space="preserve">Copy out</text>
