  <rect x="523.0" y="96.0" width="114.0" height="58.0" rx="10" fill="#D7F0E6" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="580.0" y="120.0" text-anchor="middle" font-size="13" font-weight="650" style="fill:#1B2430" xml:space="preserve">Verify</text>
  <text x="580.0" y="139.0" text-anchor="middle" font-size="10.5" style="fill:#5D6B7A" xml:space="preserve">compare on host</text>
  <text x="580.0" y="172.0" text-anchor="middle" font-size="11" style="fill:#8794A3" xml:space="preserve">host</text>
  <path d="M514.0,125.0 L521.0,125.0" fill="none" stroke="#3F5873" stroke-width="1.6" stroke-linecap="round" marker-end="url(#tip-ink)"/>
  <rect x="26.0" y="196.0" width="200.0" height="220.0" rx="14" fill="#FAFAF7" stroke="#C9CED6" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="126.0" y="216.0" text-anchor="middle" font-size="13" font-weight="650" style="fill:#1B2430" xml:space="preserve">Host</text>
  <rect x="56.0" y="232.0" width="140.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#9AA6B4" stroke-width="1.3"/>
  <text x="126.0" y="256.0" text-anchor="middle" font-size="13" font-weight="650" style="fill:#1B2430" xml:space="preserve">CPU</text>
  <text x="126.0" y="274.0" text-anchor="middle" font-size="11" style="fill:#5D6B7A" xml:space="preserve">runs main()</text>
  <path d="M126,288 V340" stroke="#9AA6B4" stroke-width="1.4"/>
  <rect x="46.0" y="340.0" width="160.0" height="56.0" rx="10" fill="#ECEEF2" stroke="#C9CED6" stroke-width="1.3"/>
  <text x="126.0" y="364.0" text-anchor="middle" font-size="13" font-weight="650" style="fill:#1B2430" xml:space="preserve">Host memory</text>
  <text x="126.0" y="382.0" text-anchor="middle" font-size="11" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" style="fill:#5D6B7A" xml:space="preserve">a_host, b_host</text>
  <rect x="318.0" y="196.0" width="316.0" height="220.0" rx="14" fill="#FAFAF7" stroke="#C9CED6" stroke-width="1.3" stroke-dasharray="5 4"/>
