  <text x="477.0" y="382.0" text-anchor="middle" font-size="11" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" style="fill:#5D6B7A" xml:space="preserve">a_gpu, b_gpu, c_gpu</text>
  <path d="M210.0,358.0 L332.0,358.0" fill="none" stroke="#3F5873" stroke-width="1.6" stroke-linecap="round" marker-end="url(#tip-ink)"/>
  <path d="M332.0,380.0 L210.0,380.0" fill="none" stroke="#3F5873" stroke-width="1.6" stroke-linecap="round" marker-end="url(#tip-ink)"/>
  <text x="271.0" y="350.0" text-anchor="middle" font-size="11" font-weight="650" style="fill:#1B2430" xml:space="preserve">link</text>
  <text x="271.0" y="398.0" text-anchor="middle" font-size="11" style="fill:#5D6B7A" xml:space="preserve">copies only</text>
</svg>
