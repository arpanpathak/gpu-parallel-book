<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 376" width="660" height="376" role="img" aria-label="Left: 1 element of SAXPY reads x[i] and y[i] and writes y[i], 4 bytes each, 12 bytes for 2 floating-point operations, 0.17 FLOP per byte. Right: for 16,777,216 elements the memory traffic, 201.3 MB at 102 GB/s, takes 1.97 ms, while the arithmetic, 33.6 MFLOP at 2.4 TFLOP/s, takes 0.014 ms.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="376" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">SAXPY is memory-bound</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">12 bytes move for every 2 operations.</text>
  <rect x="16" y="104" width="300" height="250" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="98.8" height="22" rx="11" fill="#1B2430"/>
  <text x="83.4" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">1 ELEMENT</text>
  <rect x="332" y="104" width="312" height="250" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="350" y="93" width="208.9" height="22" rx="11" fill="#1B2430"/>
  <text x="454.5" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">N = 16,777,216 ELEMENTS</text>
  <rect x="40.0" y="140.0" width="120.0" height="32.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="100.0" y="160.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">read x[i]</text>
  <text x="176.0" y="161.0" class="mono" text-anchor="start" xml:space="preserve">4 bytes</text>
  <rect x="40.0" y="184.0" width="120.0" height="32.0" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="100.0" y="204.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">read y[i]</text>
  <text x="176.0" y="205.0" class="mono" text-anchor="start" xml:space="preserve">4 bytes</text>
  <rect x="40.0" y="228.0" width="120.0" height="32.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="100.0" y="248.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">write y[i]</text>
  <text x="176.0" y="249.0" class="mono" text-anchor="start" xml:space="preserve">4 bytes</text>
  <text x="40.0" y="290.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">12 bytes, 2 FLOPs</text>
  <text x="40.0" y="312.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">2 / 12 = 0.17 FLOP/B</text>
  <text x="40.0" y="336.0" class="note" text-anchor="start" xml:space="preserve">1 multiply, 1 add</text>
  <text x="356.0" y="146.0" class="sub" text-anchor="start" xml:space="preserve">memory: 201.3 MB at 102 GB/s</text>
  <rect x="356" y="156" width="250" height="22" rx="5" fill="#CF4526"/>
  <text x="356.0" y="196.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">1.97 ms</text>
  <text x="356.0" y="236.0" class="sub" text-anchor="start" xml:space="preserve">arithmetic: 33.6 MFLOP at 2.4 TFLOP/s</text>
  <rect x="356" y="246" width="2.0" height="22" rx="5" fill="#2E8B3D"/>
  <text x="356.0" y="286.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">0.014 ms</text>
  <text x="356.0" y="326.0" class="note" text-anchor="start" xml:space="preserve">Memory takes 140 times as long.</text>
</svg>
