<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" height="370" role="img" aria-label="A timeline of threads 0 and 2 without the barrier at the end of a step. Thread 2 finishes step 1 with b[2] = 8 and starts step 2, where it reads b[0]. Thread 0 is late and writes b[0] = 3 only afterward. Thread 2 reads the 0 left in the slot, and y2 becomes 8 instead of 11.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="680" height="370" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Without the barrier: a read before the write</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Thread 2 runs ahead into the next step.</text>
  <text x="170.0" y="100.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">step d = 1</text>
  <text x="420.0" y="100.0" class="mono" text-anchor="start" style="fill:#5D6B7A" xml:space="preserve">step d = 2</text>
  <text x="156.0" y="131.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">thread 2</text>
  <rect x="170.0" y="112.0" width="200.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="270.0" y="130.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">b[2] = a[2] + a[1] = 8</text>
  <rect x="410.0" y="112.0" width="230.0" height="28.0" rx="6" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="525.0" y="130.0" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">a[2] = b[2] + b[0]</text>
  <text x="156.0" y="195.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">thread 0</text>
  <rect x="170.0" y="176.0" width="60.0" height="28.0" rx="6" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.3"/>
  <text x="200.0" y="194.0" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">late</text>
  <rect x="470.0" y="176.0" width="170.0" height="28.0" rx="6" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="555.0" y="194.0" class="pill" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">b[0] = a[0] = 3</text>
  <line x1="410.0" y1="92.0" x2="410.0" y2="216.0" stroke="#5D6B7A" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="404.0" y="230.0" text-anchor="end" font-size="10.5" style="fill:#5D6B7A" xml:space="preserve">barrier removed</text>
  <circle cx="430" cy="140" r="4" fill="#CF4526"/>
  <line x1="430.0" y1="140.0" x2="430.0" y2="216.0" stroke="#CF4526" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="438.0" y="230.0" text-anchor="start" font-size="10.5" style="fill:#CF4526" xml:space="preserve">read of b[0]</text>
  <circle cx="470" cy="190" r="4" fill="#CF4526"/>
  <text x="400.0" y="266.0" class="note" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">thread 2 reads b[0] before thread 0 has written it, and finds the 0</text>
  <text x="400.0" y="286.0" class="note" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">left in the slot: a[2] = 8 + 0 = 8, and y2 = 8 in place of 11</text>
  <text x="32.0" y="324.0" class="note" text-anchor="start" xml:space="preserve">With the barrier, no thread starts step d = 2 until every thread has written its</text>
  <text x="32.0" y="342.0" class="note" text-anchor="start" xml:space="preserve">slot of b in step d = 1, and thread 2 reads b[0] = 3: a[2] = 8 + 3 = 11.</text>
</svg>
