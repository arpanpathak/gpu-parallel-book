<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" role="img" aria-label="Row 0 of A, 1 2 3 4, and column 0 of B, 1 0 2 1, drawn as 2 rows of cells: the first 2 cells of each in blue (phase 0), the last 2 in amber (phase 1). Below, 3 bars show how much of the dot product sum covers: at the start of t = 0 no terms, sum = 0; at the start of t = 1 the terms s in [0, 2), sum = 1 times 1 plus 2 times 0 = 1; at the end, t = 2, the terms s in [0, 4), sum = 1 + 3 times 2 + 4 times 1 = 11 = c00.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="340" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The loop invariant</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Thread (0, 0) with T = 2: before phase t, sum holds the terms s ∈ [0, tT).</text>
  <text x="136.0" y="124.0" text-anchor="end" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">row 0 of A</text>
  <text x="136.0" y="176.0" text-anchor="end" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">column 0 of B</text>
  <rect x="150.0" y="100.0" width="44.0" height="44.0" rx="5" fill="#DDE7FB" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="172.0" y="126.7" text-anchor="middle" style="font-size:13px;fill:#2F6FDB">1</text>
  <rect x="150.0" y="152.0" width="44.0" height="44.0" rx="5" fill="#DDE7FB" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="172.0" y="178.7" text-anchor="middle" style="font-size:13px;fill:#2F6FDB">1</text>
  <rect x="198.0" y="100.0" width="44.0" height="44.0" rx="5" fill="#DDE7FB" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="220.0" y="126.7" text-anchor="middle" style="font-size:13px;fill:#2F6FDB">2</text>
  <rect x="198.0" y="152.0" width="44.0" height="44.0" rx="5" fill="#DDE7FB" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="220.0" y="178.7" text-anchor="middle" style="font-size:13px;fill:#2F6FDB">0</text>
  <rect x="246.0" y="100.0" width="44.0" height="44.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="268.0" y="126.7" text-anchor="middle" style="font-size:13px;fill:#B7791F">3</text>
  <rect x="246.0" y="152.0" width="44.0" height="44.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="268.0" y="178.7" text-anchor="middle" style="font-size:13px;fill:#B7791F">2</text>
  <rect x="294.0" y="100.0" width="44.0" height="44.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="316.0" y="126.7" text-anchor="middle" style="font-size:13px;fill:#B7791F">4</text>
  <rect x="294.0" y="152.0" width="44.0" height="44.0" rx="5" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="316.0" y="178.7" text-anchor="middle" style="font-size:13px;fill:#B7791F">1</text>
  <text x="136.0" y="239.0" text-anchor="end" xml:space="preserve" style="font-size:12px;font-weight:700;fill:#1B2430">start of t = 0</text>
  <rect x="150.0" y="226.0" width="4.0" height="18.0" rx="6" fill="#DDE3FB" stroke="#5B6BD6" stroke-width="1.2"/>
  <text x="356.0" y="239.0" text-anchor="start" xml:space="preserve" style="font-size:12px;fill:#1B2430">s ∈ [0, 0): sum = 0</text>
  <text x="136.0" y="275.0" text-anchor="end" xml:space="preserve" style="font-size:12px;font-weight:700;fill:#1B2430">start of t = 1</text>
  <rect x="150.0" y="262.0" width="92.0" height="18.0" rx="6" fill="#DDE3FB" stroke="#5B6BD6" stroke-width="1.2"/>
  <text x="356.0" y="275.0" text-anchor="start" xml:space="preserve" style="font-size:12px;fill:#1B2430">s ∈ [0, 2): sum = 1·1 + 2·0 = 1</text>
  <text x="136.0" y="311.0" text-anchor="end" xml:space="preserve" style="font-size:12px;font-weight:700;fill:#1B2430">end, t = 2</text>
  <rect x="150.0" y="298.0" width="188.0" height="18.0" rx="6" fill="#DDE3FB" stroke="#5B6BD6" stroke-width="1.2"/>
  <text x="356.0" y="311.0" text-anchor="start" xml:space="preserve" style="font-size:12px;fill:#1B2430">s ∈ [0, 4): sum = 1 + 3·2 + 4·1 = 11 = c00</text>
</svg>
