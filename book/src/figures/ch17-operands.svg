<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 272" width="660" height="272" role="img" aria-label="The shared tiles of block (0, 0) in phase 0: tileA holds 1 2 and 5 6, tileB holds 1 0 and 0 1. Row 0 of tileA and column 1 of tileB are coloured by the threads that wrote them: 1 by thread (0,0), 2 by thread (0,1), 0 by thread (0,1) and 1 by thread (1,1). Thread (0, 1) computes 1 times 0 plus 2 times 1 = 2. It copied 2 of its 4 operands; its neighbours copied the other 2.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="272" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The operands of 1 thread</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Thread (0, 1) in phase 0 uses 4 values and copied only 2 of them.</text>
  <rect x="40" y="96" width="260" height="150" rx="12" fill="#D9F1E7" stroke="#A9DCC6" stroke-width="1.2"/>
  <text x="170.0" y="236.0" text-anchor="middle" xml:space="preserve" style="font-size:11.5px;font-weight:700;fill:#1F7A5C">shared memory, phase 0</text>
  <text x="106.0" y="116.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;font-weight:700;fill:#1F7A5C">tileA</text>
  <text x="228.0" y="116.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;font-weight:700;fill:#1F7A5C">tileB</text>
  <rect x="64.0" y="128.0" width="40.0" height="40.0" rx="5" fill="#DDE3FB" stroke="#5B6BD6" stroke-width="1.3"/>
  <text x="84.0" y="152.7" text-anchor="middle" style="font-size:13px;fill:#5B6BD6">1</text>
  <rect x="186.0" y="128.0" width="40.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="206.0" y="152.7" text-anchor="middle" style="font-size:13px;fill:#1B2430">1</text>
  <rect x="109.0" y="128.0" width="40.0" height="40.0" rx="5" fill="#D7F0E6" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="129.0" y="152.7" text-anchor="middle" style="font-size:13px;fill:#1F8A70">2</text>
  <rect x="231.0" y="128.0" width="40.0" height="40.0" rx="5" fill="#D7F0E6" stroke="#1F8A70" stroke-width="1.3"/>
  <text x="251.0" y="152.7" text-anchor="middle" style="font-size:13px;fill:#1F8A70">0</text>
  <rect x="64.0" y="173.0" width="40.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="84.0" y="197.7" text-anchor="middle" style="font-size:13px;fill:#1B2430">5</text>
  <rect x="186.0" y="173.0" width="40.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="206.0" y="197.7" text-anchor="middle" style="font-size:13px;fill:#1B2430">0</text>
  <rect x="109.0" y="173.0" width="40.0" height="40.0" rx="5" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3"/>
  <text x="129.0" y="197.7" text-anchor="middle" style="font-size:13px;fill:#1B2430">6</text>
  <rect x="231.0" y="173.0" width="40.0" height="40.0" rx="5" fill="#F9DCE6" stroke="#C2457A" stroke-width="1.3"/>
  <text x="251.0" y="197.7" text-anchor="middle" style="font-size:13px;fill:#C2457A">1</text>
  <text x="322.0" y="140.0" text-anchor="start" xml:space="preserve" style="font-size:12px;fill:#1B2430">thread (0, 1): row 0 of tileA · column 1 of tileB</text>
  <text x="322.0" y="172.0" text-anchor="start" xml:space="preserve" style="font-size:17px;font-weight:700;fill:#2F6FDB">1·0 + 2·1 = 2</text>
  <text x="322.0" y="204.0" text-anchor="start" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">loaded by threads (0,0), (0,1), (0,1), (1,1),</text>
  <text x="322.0" y="222.0" text-anchor="start" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">in the order the operands appear</text>
</svg>
