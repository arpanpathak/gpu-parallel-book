<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" role="img" aria-label="Row 0 holds 1, 2, 3, 4. The mean is 2.5. The deviations are -1.5, -0.5, 0.5, 1.5, their squares 2.25, 0.25, 0.25, 2.25, and the variance 1.25. Multiplying each deviation by 1 / sqrt(1.25 + 0.00001) = 0.8944 gives -1.3416, -0.4472, 0.4472 and 1.3416.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="660" height="400" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Layer normalization by hand</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Subtract the mean, divide by the standard deviation.</text>
  <rect x="16" y="96" width="628" height="288" rx="16" fill="#F0EEE6" stroke="none" stroke-width="1.2"/>
  <rect x="34" y="85" width="248.2" height="22" rx="11" fill="#1B2430"/>
  <text x="158.1" y="100.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">LAYER NORMALIZATION OF ROW 0</text>
  <text x="76.0" y="130.0" class="name" text-anchor="middle" xml:space="preserve">x</text>
  <text x="186.0" y="130.0" class="name" text-anchor="middle" xml:space="preserve">x − μ</text>
  <text x="306.0" y="130.0" class="name" text-anchor="middle" xml:space="preserve">(x − μ)²</text>
  <text x="476.0" y="130.0" class="name" text-anchor="middle" xml:space="preserve">y</text>
  <rect x="46.0" y="142.0" width="60.0" height="28.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.2"/>
  <text x="76.0" y="160.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1</text>
  <rect x="146.0" y="142.0" width="80.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="186.0" y="160.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">-1.5</text>
  <rect x="266.0" y="142.0" width="80.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="306.0" y="160.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">2.25</text>
  <rect x="426.0" y="142.0" width="100.0" height="28.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.2"/>
  <text x="476.0" y="160.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">-1.3416</text>
  <rect x="46.0" y="178.0" width="60.0" height="28.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.2"/>
  <text x="76.0" y="196.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">2</text>
  <rect x="146.0" y="178.0" width="80.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="186.0" y="196.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">-0.5</text>
  <rect x="266.0" y="178.0" width="80.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="306.0" y="196.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">0.25</text>
  <rect x="426.0" y="178.0" width="100.0" height="28.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.2"/>
  <text x="476.0" y="196.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">-0.4472</text>
  <rect x="46.0" y="214.0" width="60.0" height="28.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.2"/>
  <text x="76.0" y="232.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">3</text>
  <rect x="146.0" y="214.0" width="80.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="186.0" y="232.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">+0.5</text>
  <rect x="266.0" y="214.0" width="80.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="306.0" y="232.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">0.25</text>
  <rect x="426.0" y="214.0" width="100.0" height="28.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.2"/>
  <text x="476.0" y="232.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">+0.4472</text>
  <rect x="46.0" y="250.0" width="60.0" height="28.0" rx="8" fill="#C8DAF7" stroke="none" stroke-width="1.2"/>
  <text x="76.0" y="268.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">4</text>
  <rect x="146.0" y="250.0" width="80.0" height="28.0" rx="8" fill="#DBCEF3" stroke="none" stroke-width="1.2"/>
  <text x="186.0" y="268.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">+1.5</text>
  <rect x="266.0" y="250.0" width="80.0" height="28.0" rx="8" fill="#EFDBBA" stroke="none" stroke-width="1.2"/>
  <text x="306.0" y="268.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">2.25</text>
  <rect x="426.0" y="250.0" width="100.0" height="28.0" rx="8" fill="#C6E2CA" stroke="none" stroke-width="1.2"/>
  <text x="476.0" y="268.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">+1.3416</text>
  <text x="76.0" y="306.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">μ = 2.5</text>
  <text x="306.0" y="306.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">σ² = 1.25</text>
  <text x="476.0" y="306.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">× 0.8944</text>
  <text x="36.0" y="340.0" class="note" text-anchor="start" xml:space="preserve">μ = 10 ÷ 4 = 2.5;  σ² = 5 ÷ 4 = 1.25;  1 ÷ √(1.25 + 0.00001) = 0.8944.</text>
  <text x="36.0" y="360.0" class="note" text-anchor="start" xml:space="preserve">y = (x − μ) × 0.8944, with γ = 1 and β = 0.</text>
</svg>
