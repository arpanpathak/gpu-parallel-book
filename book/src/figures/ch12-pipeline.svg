  <path d="M320,174 H341" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <path d="M476,174 H497" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="32" y="304" width="160" height="84" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M44,304.7 H38 V387.3 H44 A11.3,11.3 0 0 1 32.7,376 V316 A11.3,11.3 0 0 1 44,304.7 Z" fill="#2F6FDB"/>
  <text x="52.0" y="333.0" class="name" text-anchor="start" xml:space="preserve">source string</text>
  <text x="52.0" y="351.0" class="sub" text-anchor="start" xml:space="preserve">made by the program</text>
  <text x="52.0" y="369.0" class="sub" text-anchor="start" xml:space="preserve">1,315 bytes</text>
  <rect x="250" y="304" width="170" height="84" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M262,304.7 H256 V387.3 H262 A11.3,11.3 0 0 1 250.7,376 V316 A11.3,11.3 0 0 1 262,304.7 Z" fill="#7A4FD0"/>
  <text x="270.0" y="333.0" class="name" text-anchor="start" xml:space="preserve">PTX</text>
  <text x="270.0" y="351.0" class="sub" text-anchor="start" xml:space="preserve">2,237 bytes</text>
  <text x="270.0" y="369.0" class="sub" text-anchor="start" xml:space="preserve">compile 44 to 88 ms</text>
  <rect x="250" y="400" width="170" height="72" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M262,400.7 H256 V471.3 H262 A11.3,11.3 0 0 1 250.7,460 V412 A11.3,11.3 0 0 1 262,400.7 Z" fill="#2E8B3D"/>
  <text x="270.0" y="423.0" class="name" text-anchor="start" xml:space="preserve">cubin, sm_87</text>
  <text x="270.0" y="441.0" class="sub" text-anchor="start" xml:space="preserve">3,624 bytes</text>
  <text x="270.0" y="459.0" class="sub" text-anchor="start" xml:space="preserve">compile 49 to 74 ms</text>
  <rect x="478" y="304" width="150" height="84" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
