  <text x="498.0" y="333.0" class="name" text-anchor="start" xml:space="preserve">load PTX</text>
  <text x="498.0" y="351.0" class="sub" text-anchor="start" xml:space="preserve">driver compiles</text>
  <text x="498.0" y="369.0" class="sub" text-anchor="start" xml:space="preserve">0.7 to 45 ms</text>
