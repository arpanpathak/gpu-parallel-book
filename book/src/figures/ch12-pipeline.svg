  <text x="498.0" y="423.0" class="name" text-anchor="start" xml:space="preserve">load cubin</text>
  <text x="498.0" y="441.0" class="sub" text-anchor="start" xml:space="preserve">ready to run</text>
  <text x="498.0" y="459.0" class="sub" text-anchor="start" xml:space="preserve">0.05 ms</text>
  <path d="M192,346 H247" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <path class="wire" d="M112,388 L112,427 Q112,436 121,436 L250,436" marker-end="url(#head)"/>
