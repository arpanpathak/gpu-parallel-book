  <text x="208.0" y="179.0" class="sub" text-anchor="start" xml:space="preserve">virtual GPU</text>
  <text x="208.0" y="197.0" class="sub" text-anchor="start" xml:space="preserve">compute_87</text>
  <rect x="344" y="132" width="132" height="84" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M356,132.7 H350 V215.3 H356 A11.3,11.3 0 0 1 344.7,204 V144 A11.3,11.3 0 0 1 356,132.7 Z" fill="#2E8B3D"/>
  <text x="364.0" y="161.0" class="name" text-anchor="start" xml:space="preserve">cubin</text>
  <text x="364.0" y="179.0" class="sub" text-anchor="start" xml:space="preserve">machine code</text>
  <text x="364.0" y="197.0" class="sub" text-anchor="start" xml:space="preserve">sm_87 only</text>
  <rect x="500" y="132" width="128" height="84" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M512,132.7 H506 V215.3 H512 A11.3,11.3 0 0 1 500.7,204 V144 A11.3,11.3 0 0 1 512,132.7 Z" fill="#B7791F"/>
  <text x="520.0" y="161.0" class="name" text-anchor="start" xml:space="preserve">fatbin</text>
  <text x="520.0" y="179.0" class="sub" text-anchor="start" xml:space="preserve">cubins + PTX</text>
  <text x="520.0" y="197.0" class="sub" text-anchor="start" xml:space="preserve">in the binary</text>
