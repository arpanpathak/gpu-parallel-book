  <text x="36.0" y="362.0" class="note" text-anchor="start" xml:space="preserve">The largest float is 3.4e38 = exp(88.7).</text>
  <text x="36.0" y="380.0" class="note" text-anchor="start" xml:space="preserve">exp(100) = 2.7e43 rounds to infinity.</text>
  <text x="358.0" y="362.0" class="note" text-anchor="start" xml:space="preserve">Every x − m is 0 or less, so every</text>
  <text x="358.0" y="380.0" class="note" text-anchor="start" xml:space="preserve">exp lies in (0, 1] and cannot overflow.</text>
</svg>
