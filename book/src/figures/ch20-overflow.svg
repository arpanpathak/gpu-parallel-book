<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 442" width="660" height="442" role="img" aria-label="Left: the logits 100, 101, 102 and 103 have exponentials from 2.7e43 to 5.4e44, all above the largest float, 3.4e38, so each becomes infinity and the division gives NaN. Right: after subtracting the maximum 103 the arguments are -3 to 0, the exponentials 0.0498 to 1 sum to 1.5530, and the probabilities are 0.0321, 0.0871, 0.2369 and 0.6439.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
