<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 356" width="670" height="356" role="img" aria-label="The sequential scan of the 8 values. Each x[i] flows down into y[i], and a red arrow carries y[i - 1] into y[i]. The outputs 3, 4, 11, 11, 15, 16, 22, 25 are produced 1 after the other in 7 steps.">
