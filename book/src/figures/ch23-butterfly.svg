<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" width="660" height="440" role="img" aria-label="8 lanes hold 2, 4, 4, 5 and 4 times minus infinity. With mask 4 each lane takes the maximum of itself and the lane 4 away: 2, 4, 4, 5, 2, 4, 4, 5. With mask 2: 4, 5, 4, 5, 4, 5, 4, 5. With mask 1 every lane holds 5.">
