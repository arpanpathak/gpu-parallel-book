<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 496" width="640" height="496" role="img" aria-label="A table with 8 gray levels, 0 to 7, for an image of 16 pixels. Counts: 0, 0, 3, 5, 4, 2, 2, 0. Cumulative counts: 0, 0, 3, 8, 12, 14, 16, 16. New levels: 0, 0, 0, 3, 5, 6, 7, 7. Below, the histogram before occupies levels 2 to 6; after, the same pixels occupy levels 0, 3, 5, 6 and 7. The formula is new level = round((cumulative minus 3) times 7 divided by 13).">
