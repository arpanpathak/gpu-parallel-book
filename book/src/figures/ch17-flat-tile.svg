<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 292" width="660" height="292" role="img" aria-label="Left: a 2 by 2 tile with slots (0,0), (0,1), (1,0) and (1,1), 1 color per thread. Right: the same 4 slots in a flat array at indices 0 to 3, in row-major order; slot (1,0) at index 2 is outlined. The rule: index = threadIdx.y times T plus threadIdx.x, so (1, 0) is at 1 times 2 plus 0 = 2. With T = 16 the array holds 256 values.">
  <defs><filter id="m3-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.18"/><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/></filter></defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#3F5873"/></marker><marker id="head-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#3F5873"/></marker>
    <marker id="head-danger" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#CF4526"/></marker><marker id="head-danger-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#CF4526"/></marker>
    <marker id="head-idle" viewBox="0 0 12 9" refX="6" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" orient="auto"><path d="M0,0 L12,4.5 L0,9 L3.5,4.5 Z" fill="#7F8EA0"/></marker><marker id="head-idle-small" viewBox="0 0 7.2 5.4" refX="3.6" refY="2.7" markerUnits="userSpaceOnUse" markerWidth="7.2" markerHeight="5.4" orient="auto"><path d="M0,0 L7.2,2.7 L0,5.4 L2.1,2.7 Z" fill="#7F8EA0"/></marker>
  </defs>
  <rect width="660" height="292" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">A tile as a flat array</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Slot (threadIdx.y, threadIdx.x) is element threadIdx.y · T + threadIdx.x.</text>
  <text x="163.0" y="98.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;font-weight:700;fill:#1B2430">tileA as a 2 × 2 grid</text>
  <rect x="110.0" y="110.0" width="50.0" height="50.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.3"/>
  <text x="135.0" y="139.7" text-anchor="middle" style="font-size:13px;fill:#5B6BD6">(0,0)</text>
  <rect x="166.0" y="110.0" width="50.0" height="50.0" rx="8" fill="#B6DED1" stroke="none" stroke-width="1.3"/>
  <text x="191.0" y="139.7" text-anchor="middle" style="font-size:13px;fill:#1F8A70">(0,1)</text>
  <rect x="110.0" y="166.0" width="50.0" height="50.0" rx="8" fill="#F2CDB7" stroke="none" stroke-width="1.3"/>
  <text x="135.0" y="195.7" text-anchor="middle" style="font-size:13px;fill:#C8693A">(1,0)</text>
  <rect x="166.0" y="166.0" width="50.0" height="50.0" rx="8" fill="#EFC1D3" stroke="none" stroke-width="1.3"/>
  <text x="191.0" y="195.7" text-anchor="middle" style="font-size:13px;fill:#C2457A">(1,1)</text>
  <text x="434.0" y="98.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;font-weight:700;fill:#1B2430">TILE_A as a flat array</text>
  <rect x="320.0" y="116.0" width="50.0" height="50.0" rx="8" fill="#C6CDF4" stroke="none" stroke-width="1.3"/>
  <text x="345.0" y="145.7" text-anchor="middle" style="font-size:13px;fill:#5B6BD6">(0,0)</text>
  <text x="345.0" y="186.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">0</text>
  <rect x="376.0" y="116.0" width="50.0" height="50.0" rx="8" fill="#B6DED1" stroke="none" stroke-width="1.3"/>
  <text x="401.0" y="145.7" text-anchor="middle" style="font-size:13px;fill:#1F8A70">(0,1)</text>
  <text x="401.0" y="186.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">1</text>
  <rect x="432.0" y="116.0" width="50.0" height="50.0" rx="8" fill="#F2CDB7" stroke="none" stroke-width="1.3"/>
  <text x="457.0" y="145.7" text-anchor="middle" style="font-size:13px;fill:#C8693A">(1,0)</text>
  <text x="457.0" y="186.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">2</text>
  <rect x="488.0" y="116.0" width="50.0" height="50.0" rx="8" fill="#EFC1D3" stroke="none" stroke-width="1.3"/>
  <text x="513.0" y="145.7" text-anchor="middle" style="font-size:13px;fill:#C2457A">(1,1)</text>
  <text x="513.0" y="186.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">3</text>
  <rect x="429.0" y="113.0" width="56.0" height="56.0" rx="7" fill="none" stroke="#2F6FDB" stroke-width="2.2"/>
  <text x="330.0" y="248.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;font-weight:700;fill:#2F6FDB">index = threadIdx.y · T + threadIdx.x = 1 · 2 + 0 = 2</text>
  <text x="330.0" y="270.0" text-anchor="middle" xml:space="preserve" style="font-size:12px;fill:#5D6B7A">with T = 16 the array holds 256 values</text>
</svg>
