<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 570" width="660" height="570" role="img" aria-label="8 cells hold the products 2, 0, 3, 12, 5, 1, 4, 6. With half = 4, threads 0 to 3 add cells 4 to 7 into cells 0 to 3, giving 7, 1, 7, 18. With half = 2, threads 0 and 1 give 14 and 19. With half = 1, thread 0 gives 33. A dashed barrier line separates the steps.">
