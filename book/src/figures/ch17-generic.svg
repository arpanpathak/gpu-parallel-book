<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 442" width="660" height="442" role="img" aria-label="1 card, tiled with a const generic T, fans out into 3 kernels. tiled::&lt;8&gt;: 64 threads, 512 bytes of shared memory, 262,144 blocks, 8 FLOP per float. tiled::&lt;16&gt;: 256 threads, 2,048 bytes, 65,536 blocks, 16 FLOP per float. tiled::&lt;32&gt;: 1,024 threads, 8,192 bytes, 16,384 blocks, 32 FLOP per float.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="442" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">1 source, 3 kernels</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">A const generic tile size, specialised by the host program.</text>
  <rect x="186" y="112" width="288" height="64" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M198,112.7 H192 V175.3 H198 A11.3,11.3 0 0 1 186.7,164 V124 A11.3,11.3 0 0 1 198,112.7 Z" fill="#7F8EA0"/>
  <text x="206.0" y="140.0" class="name" text-anchor="start" xml:space="preserve">tiled&lt;const T: usize&gt;</text>
  <text x="206.0" y="158.0" class="sub" text-anchor="start" xml:space="preserve">1 source</text>
  <path d="M330,176 V196 M118,196 H542" fill="none" stroke="#3F5873" stroke-width="1.8"/>
  <circle cx="330" cy="196" r="3" fill="#3F5873"/>
  <path d="M118,196 V217" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <path d="M330,196 V217" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <path d="M542,196 V217" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="22.0" y="224.0" width="192.0" height="34.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="118.0" y="245.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">tiled::&lt;8&gt;</text>
  <text x="118.0" y="284.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">8 × 8 = 64 threads</text>
  <text x="118.0" y="304.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">2 × 64 × 4 = 512 B</text>
  <text x="118.0" y="324.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">262,144 blocks</text>
  <text x="118.0" y="344.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">8 FLOP per float</text>
  <rect x="234.0" y="224.0" width="192.0" height="34.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="330.0" y="245.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">tiled::&lt;16&gt;</text>
  <text x="330.0" y="284.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">16 × 16 = 256 threads</text>
  <text x="330.0" y="304.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">2 × 256 × 4 = 2,048 B</text>
  <text x="330.0" y="324.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">65,536 blocks</text>
  <text x="330.0" y="344.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">16 FLOP per float</text>
  <rect x="446.0" y="224.0" width="192.0" height="34.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="542.0" y="245.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">tiled::&lt;32&gt;</text>
  <text x="542.0" y="284.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">32 × 32 = 1,024 threads</text>
  <text x="542.0" y="304.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">2 × 1,024 × 4 = 8,192 B</text>
  <text x="542.0" y="324.0" class="mono" text-anchor="middle" style="fill:#1B2430" xml:space="preserve">16,384 blocks</text>
  <text x="542.0" y="344.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">32 FLOP per float</text>
  <text x="16.0" y="384.0" class="note" text-anchor="start" xml:space="preserve">The compiler builds 1 kernel for each value of T that the host program names. The block</text>
  <text x="16.0" y="402.0" class="note" text-anchor="start" xml:space="preserve">shape, the shared memory and the reuse all grow with T; for N = 4,096 the number of</text>
  <text x="16.0" y="420.0" class="note" text-anchor="start" xml:space="preserve">blocks is (4,096 ÷ T)².</text>
</svg>
