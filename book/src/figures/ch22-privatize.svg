  <text x="32.0" y="360.0" class="note" text-anchor="start" xml:space="preserve">Each block counts its keys into its own 8 bins in shared memory, where only its own</text>
  <text x="32.0" y="378.0" class="note" text-anchor="start" xml:space="preserve">threads contend, and then adds each bin to the global bins once. For 16,777,216 keys in</text>
  <text x="32.0" y="396.0" class="note" text-anchor="start" xml:space="preserve">1,024 blocks with 16 bins: 16,384 atomic additions on global memory, not 16,777,216.</text>
