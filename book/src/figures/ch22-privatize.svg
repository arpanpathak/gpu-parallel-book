<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" role="img" aria-label="2 blocks of 4 keys. Block 0, keys 5, 2, 7, 2, counts into private bins 0, 0, 2, 0, 0, 1, 0, 1; block 1, keys 0, 6, 3, 5, into 1, 0, 0, 1, 0, 1, 1, 0. Both add their bins to the global bins, which end at 1, 0, 2, 1, 0, 2, 1, 1.">
