<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 476" width="660" height="476" role="img" aria-label="A 4 by 4 matrix like the one nvidia-smi topo -m prints, for an example server. The diagonal reads X. GPU0 and GPU1, and GPU2 and GPU3, read NV4: 4 NVLinks. GPU0 and GPU2, and GPU1 and GPU3, read PIX: 1 PCIe switch. GPU0 and GPU3, and GPU1 and GPU2, read SYS: across the CPU sockets. A legend explains each code.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="476" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Reading a topology matrix</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">Each cell names the path between a row GPU and a column GPU.</text>
  <text x="129.0" y="140.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">GPU0</text>
  <text x="86.0" y="183.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">GPU0</text>
  <rect x="100.0" y="150.0" width="56.0" height="56.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="128.0" y="182.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">X</text>
  <rect x="162.0" y="150.0" width="56.0" height="56.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="190.0" y="182.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">NV4</text>
  <rect x="224.0" y="150.0" width="56.0" height="56.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="252.0" y="182.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">PIX</text>
  <rect x="286.0" y="150.0" width="56.0" height="56.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <text x="314.0" y="182.0" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">SYS</text>
  <text x="191.0" y="140.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">GPU1</text>
  <text x="86.0" y="245.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">GPU1</text>
  <rect x="100.0" y="212.0" width="56.0" height="56.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="128.0" y="244.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">NV4</text>
  <rect x="162.0" y="212.0" width="56.0" height="56.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="190.0" y="244.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">X</text>
  <rect x="224.0" y="212.0" width="56.0" height="56.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <text x="252.0" y="244.0" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">SYS</text>
  <rect x="286.0" y="212.0" width="56.0" height="56.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="314.0" y="244.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">PIX</text>
  <text x="253.0" y="140.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">GPU2</text>
  <text x="86.0" y="307.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">GPU2</text>
  <rect x="100.0" y="274.0" width="56.0" height="56.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="128.0" y="306.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">PIX</text>
  <rect x="162.0" y="274.0" width="56.0" height="56.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <text x="190.0" y="306.0" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">SYS</text>
  <rect x="224.0" y="274.0" width="56.0" height="56.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="252.0" y="306.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">X</text>
  <rect x="286.0" y="274.0" width="56.0" height="56.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="314.0" y="306.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">NV4</text>
  <text x="315.0" y="140.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">GPU3</text>
  <text x="86.0" y="369.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">GPU3</text>
  <rect x="100.0" y="336.0" width="56.0" height="56.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <text x="128.0" y="368.0" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">SYS</text>
  <rect x="162.0" y="336.0" width="56.0" height="56.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="190.0" y="368.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">PIX</text>
  <rect x="224.0" y="336.0" width="56.0" height="56.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="252.0" y="368.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">NV4</text>
  <rect x="286.0" y="336.0" width="56.0" height="56.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="314.0" y="368.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">X</text>
  <rect x="380.0" y="156.0" width="56.0" height="36.0" rx="5" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="408.0" y="178.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">NV4</text>
  <text x="448.0" y="171.0" class="sub" text-anchor="start" xml:space="preserve">4 NVLinks join the pair</text>
  <text x="448.0" y="188.0" class="note" text-anchor="start" xml:space="preserve">the fastest path</text>
  <rect x="380.0" y="214.0" width="56.0" height="36.0" rx="5" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="408.0" y="236.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">PIX</text>
  <text x="448.0" y="229.0" class="sub" text-anchor="start" xml:space="preserve">1 PCIe switch between them</text>
  <text x="448.0" y="246.0" class="note" text-anchor="start" xml:space="preserve">usually peer to peer</text>
  <rect x="380.0" y="272.0" width="56.0" height="36.0" rx="5" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.2"/>
  <text x="408.0" y="294.0" class="mono" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">SYS</text>
  <text x="448.0" y="287.0" class="sub" text-anchor="start" xml:space="preserve">PCIe, then across CPU sockets</text>
  <text x="448.0" y="304.0" class="note" text-anchor="start" xml:space="preserve">the slowest path</text>
  <rect x="380.0" y="330.0" width="56.0" height="36.0" rx="5" fill="#F1F4F7" stroke="#7F8EA0" stroke-width="1.2"/>
  <text x="408.0" y="352.0" class="mono" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">X</text>
  <text x="448.0" y="345.0" class="sub" text-anchor="start" xml:space="preserve">the GPU itself</text>
  <text x="448.0" y="362.0" class="note" text-anchor="start" xml:space="preserve"></text>
  <text x="24.0" y="418.0" class="note" text-anchor="start" xml:space="preserve">An example of the matrix&#x27;s form, for a 2-socket server whose GPUs 0, 1 and 2, 3 are joined</text>
  <text x="24.0" y="436.0" class="note" text-anchor="start" xml:space="preserve">by NVLink. Read a row across: from GPU0, GPU1 is 1 NVLink hop, GPU2 is under the same</text>
  <text x="24.0" y="454.0" class="note" text-anchor="start" xml:space="preserve">PCIe switch, and GPU3 is on the other CPU socket.</text>
</svg>
