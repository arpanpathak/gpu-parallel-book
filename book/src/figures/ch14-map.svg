<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" width="660" height="430" role="img" aria-label="4 columns, i = 0 to 3. Each column takes x[i] and y[i], 0 and 0, 0.5 and 1, 1 and 2, 1.5 and 3, through the same function 2.5 x + y, and gives 0, 2.25, 4.5 and 6.75. Thread i computes column i.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="430" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The map pattern</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">1 function, applied to every element on its own.</text>
  <text x="40.0" y="122.0" class="name" text-anchor="start" xml:space="preserve">x</text>
  <text x="40.0" y="172.0" class="name" text-anchor="start" xml:space="preserve">y</text>
  <text x="40.0" y="318.0" class="name" text-anchor="start" xml:space="preserve">y</text>
  <text x="40.0" y="336.0" class="sub" text-anchor="start" xml:space="preserve">after</text>
  <text x="125.0" y="100.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">i = 0</text>
  <rect x="80.0" y="106.0" width="90.0" height="26.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="125.0" y="123.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">0.0</text>
  <rect x="80.0" y="156.0" width="90.0" height="26.0" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="125.0" y="173.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">0.0</text>
  <line x1="125.0" y1="132.0" x2="125.0" y2="156.0" stroke="#D5DBE3" stroke-width="1"/>
  <path d="M125,182 V219" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="61.0" y="222.0" width="128.0" height="30.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="125.0" y="241.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">2.5 × 0.0 + 0.0</text>
  <path d="M125,252 V295" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="80.0" y="298.0" width="90.0" height="30.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="125.0" y="317.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">0.0</text>
  <text x="125.0" y="352.0" class="mono" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">thread 0</text>
  <text x="265.0" y="100.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">i = 1</text>
  <rect x="220.0" y="106.0" width="90.0" height="26.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="265.0" y="123.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">0.5</text>
  <rect x="220.0" y="156.0" width="90.0" height="26.0" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="265.0" y="173.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">1.0</text>
  <line x1="265.0" y1="132.0" x2="265.0" y2="156.0" stroke="#D5DBE3" stroke-width="1"/>
  <path d="M265,182 V219" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="201.0" y="222.0" width="128.0" height="30.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="265.0" y="241.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">2.5 × 0.5 + 1.0</text>
  <path d="M265,252 V295" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="220.0" y="298.0" width="90.0" height="30.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="265.0" y="317.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">2.25</text>
  <text x="265.0" y="352.0" class="mono" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">thread 1</text>
  <text x="405.0" y="100.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">i = 2</text>
  <rect x="360.0" y="106.0" width="90.0" height="26.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="405.0" y="123.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1.0</text>
  <rect x="360.0" y="156.0" width="90.0" height="26.0" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="405.0" y="173.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">2.0</text>
  <line x1="405.0" y1="132.0" x2="405.0" y2="156.0" stroke="#D5DBE3" stroke-width="1"/>
  <path d="M405,182 V219" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="341.0" y="222.0" width="128.0" height="30.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="405.0" y="241.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">2.5 × 1.0 + 2.0</text>
  <path d="M405,252 V295" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="360.0" y="298.0" width="90.0" height="30.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="405.0" y="317.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">4.5</text>
  <text x="405.0" y="352.0" class="mono" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">thread 2</text>
  <text x="545.0" y="100.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">i = 3</text>
  <rect x="500.0" y="106.0" width="90.0" height="26.0" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.2"/>
  <text x="545.0" y="123.0" class="mono" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">1.5</text>
  <rect x="500.0" y="156.0" width="90.0" height="26.0" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.2"/>
  <text x="545.0" y="173.0" class="mono" text-anchor="middle" style="fill:#B7791F" xml:space="preserve">3.0</text>
  <line x1="545.0" y1="132.0" x2="545.0" y2="156.0" stroke="#D5DBE3" stroke-width="1"/>
  <path d="M545,182 V219" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="481.0" y="222.0" width="128.0" height="30.0" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.2"/>
  <text x="545.0" y="241.0" class="mono" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">2.5 × 1.5 + 3.0</text>
  <path d="M545,252 V295" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <rect x="500.0" y="298.0" width="90.0" height="30.0" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.2"/>
  <text x="545.0" y="317.0" class="mono" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">6.75</text>
  <text x="545.0" y="352.0" class="mono" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">thread 3</text>
  <text x="40.0" y="390.0" class="note" text-anchor="start" xml:space="preserve">f(x, y) = a x + y with a = 2.5. Element i of the result needs x[i] and y[i] and</text>
  <text x="40.0" y="408.0" class="note" text-anchor="start" xml:space="preserve">nothing else, so the 4 evaluations can run in any order, or all at once.</text>
</svg>
