<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 591" width="660" height="591" role="img" aria-label="Horizontal bars of GFLOP/s for n = 512, 1,000, 1,024, 2,048 and 4,096. f32 checked: 184.4, 139.9, 134.8, 135.1, 129.4. f32 unchecked: 182.1, 138.9, 138.3, 136.1, 129.4. f64: 35.2, 34.0, 35.3, 35.2, and no f64 run at 4,096. An extra green bar at n = 1,024 shows the fixed-width kernel at 192.2 GFLOP/s.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="591" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">Measured speed</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">1 thread per element of C, on a GPU with 8 SMs and 102 GB/s.</text>
  <rect x="150" y="94" width="14" height="14" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.3"/>
  <text x="171.0" y="105.5" class="note" text-anchor="start" xml:space="preserve">f32</text>
  <rect x="212.8" y="94" width="14" height="14" rx="4" fill="#FBF1DC" stroke="#B7791F" stroke-width="1.3"/>
  <text x="233.8" y="105.5" class="note" text-anchor="start" xml:space="preserve">f32 unchecked</text>
  <rect x="400" y="94" width="14" height="14" rx="4" fill="#F0EAFB" stroke="#7A4FD0" stroke-width="1.3"/>
  <text x="421.0" y="105.5" class="note" text-anchor="start" xml:space="preserve">f64</text>
  <rect x="462.8" y="94" width="14" height="14" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="483.8" y="105.5" class="note" text-anchor="start" xml:space="preserve">f32 fixed width</text>
  <line x1="150.0" y1="128.0" x2="150.0" y2="481.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="150.0" y="499.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <line x1="250.0" y1="128.0" x2="250.0" y2="481.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="250.0" y="499.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">50</text>
  <line x1="350.0" y1="128.0" x2="350.0" y2="481.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="350.0" y="499.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">100</text>
  <line x1="450.0" y1="128.0" x2="450.0" y2="481.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="450.0" y="499.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">150</text>
  <line x1="550.0" y1="128.0" x2="550.0" y2="481.0" stroke="#D5DBE3" stroke-width="1"/>
  <text x="550.0" y="499.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">200</text>
  <text x="136.0" y="168.5" class="sub" text-anchor="end" xml:space="preserve">n = 512</text>
  <rect x="150" y="136" width="368.8" height="15" rx="4" fill="#2F6FDB"/>
  <text x="526.8" y="148.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">184.4</text>
  <rect x="150" y="155" width="364.2" height="15" rx="4" fill="#B7791F"/>
  <text x="522.2" y="167.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">182.1</text>
  <rect x="150" y="174" width="70.4" height="15" rx="4" fill="#7A4FD0"/>
  <text x="228.4" y="186.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">35.2</text>
  <text x="136.0" y="237.5" class="sub" text-anchor="end" xml:space="preserve">n = 1,000</text>
  <rect x="150" y="205" width="279.8" height="15" rx="4" fill="#2F6FDB"/>
  <text x="437.8" y="217.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">139.9</text>
  <rect x="150" y="224" width="277.8" height="15" rx="4" fill="#B7791F"/>
  <text x="435.8" y="236.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">138.9</text>
  <rect x="150" y="243" width="68.0" height="15" rx="4" fill="#7A4FD0"/>
  <text x="226.0" y="255.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">34.0</text>
  <text x="136.0" y="316.0" class="sub" text-anchor="end" xml:space="preserve">n = 1,024</text>
  <rect x="150" y="274" width="269.6" height="15" rx="4" fill="#2F6FDB"/>
  <text x="427.6" y="286.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">134.8</text>
  <rect x="150" y="293" width="276.6" height="15" rx="4" fill="#B7791F"/>
  <text x="434.6" y="305.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">138.3</text>
  <rect x="150" y="312" width="70.6" height="15" rx="4" fill="#7A4FD0"/>
  <text x="228.6" y="324.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">35.3</text>
  <rect x="150" y="331" width="384.4" height="15" rx="4" fill="#2E8B3D"/>
  <text x="542.4" y="343.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">192.2</text>
  <text x="136.0" y="394.5" class="sub" text-anchor="end" xml:space="preserve">n = 2,048</text>
  <rect x="150" y="362" width="270.2" height="15" rx="4" fill="#2F6FDB"/>
  <text x="428.2" y="374.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">135.1</text>
  <rect x="150" y="381" width="272.2" height="15" rx="4" fill="#B7791F"/>
  <text x="430.2" y="393.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">136.1</text>
  <rect x="150" y="400" width="70.4" height="15" rx="4" fill="#7A4FD0"/>
  <text x="228.4" y="412.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">35.2</text>
  <text x="136.0" y="454.0" class="sub" text-anchor="end" xml:space="preserve">n = 4,096</text>
  <rect x="150" y="431" width="258.8" height="15" rx="4" fill="#2F6FDB"/>
  <text x="416.8" y="443.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">129.4</text>
  <rect x="150" y="450" width="258.8" height="15" rx="4" fill="#B7791F"/>
  <text x="416.8" y="462.0" class="mono" text-anchor="start" style="fill:#1B2430" xml:space="preserve">129.4</text>
  <text x="136.0" y="499.0" class="sub" text-anchor="end" xml:space="preserve">GFLOP/s</text>
  <text x="40.0" y="533.0" class="note" text-anchor="start" xml:space="preserve">Checked and unchecked f32 differ by no more than 3%, within the spread of</text>
  <text x="40.0" y="551.0" class="note" text-anchor="start" xml:space="preserve">repeated runs. f64 runs at a nearly constant 35 GFLOP/s. With the width 1,024 fixed</text>
  <text x="40.0" y="569.0" class="note" text-anchor="start" xml:space="preserve">at compile time, the kernel ran at 192.2 GFLOP/s against 134.8 at run time.</text>
</svg>
