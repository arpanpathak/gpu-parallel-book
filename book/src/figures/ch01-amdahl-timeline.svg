<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="640" height="432" role="img" aria-label="Top, one processor: a 20 microsecond read, a 100 microsecond compute phase and a 10 microsecond write, 130 microseconds in all. Bottom, eight processors: the same read and write, and between them eight short compute bars of 12.5 microseconds that run side by side, 42.5 microseconds in all.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="640" height="432" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">The same program on 1 processor and on 8</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">The compute phase divides by 8. The read and the write do not divide.</text>
  <rect x="40" y="88" width="28" height="28" rx="7" fill="#EAF1FD"/>
  <g transform="translate(45.0,93.0) scale(0.7500)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="76.0" y="108.0" class="name" text-anchor="start" xml:space="preserve">1 processor</text>
  <rect x="40.0" y="120.0" width="76.0" height="34.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="78.0" y="141.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">read 20 µs</text>
  <rect x="116.0" y="120.0" width="380.0" height="34.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="306.0" y="141.0" class="pill" text-anchor="middle" style="fill:#2E8B3D" xml:space="preserve">compute 100 µs</text>
  <rect x="496.0" y="120.0" width="38.0" height="34.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="515.0" y="170.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">write 10 µs</text>
  <rect x="544.0" y="128" width="53.6" height="18" rx="9" fill="#F1F4F7"/>
  <text x="570.8" y="140.6" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">130 µs</text>
  <rect x="40" y="182" width="28" height="28" rx="7" fill="#EAF1FD"/>
  <g transform="translate(45.0,187.0) scale(0.7500)"><path d="M8 2h2v3h4V2h2v3h2a1 1 0 0 1 1 1v2h3v2h-3v4h3v2h-3v2a1 1 0 0 1-1 1h-2v3h-2v-3h-4v3H8v-3H6a1 1 0 0 1-1-1v-2H2v-2h3v-4H2V8h3V6a1 1 0 0 1 1-1h2zM7 7v10h10V7zm2.5 2.5h5v5h-5z" fill="#2F6FDB" fill-rule="evenodd"/></g>
  <text x="76.0" y="202.0" class="name" text-anchor="start" xml:space="preserve">8 processors</text>
  <rect x="40.0" y="263.0" width="74.0" height="34.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="77.0" y="284.0" class="pill" text-anchor="middle" style="fill:#CF4526" xml:space="preserve">read 20 µs</text>
  <rect x="116.0" y="214.0" width="45.5" height="14.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="116.0" y="231.0" width="45.5" height="14.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="116.0" y="248.0" width="45.5" height="14.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="116.0" y="265.0" width="45.5" height="14.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="116.0" y="282.0" width="45.5" height="14.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="116.0" y="299.0" width="45.5" height="14.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="116.0" y="316.0" width="45.5" height="14.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="116.0" y="333.0" width="45.5" height="14.0" rx="6" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <rect x="163.5" y="263.0" width="38.0" height="34.0" rx="6" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <rect x="211.5" y="271" width="60.2" height="18" rx="9" fill="#F1F4F7"/>
  <text x="241.6" y="283.6" class="pill" text-anchor="middle" style="fill:#7F8EA0" xml:space="preserve">42.5 µs</text>
  <text x="291.5" y="238.0" class="note" text-anchor="start" xml:space="preserve">compute: 8 × 12.5 µs, side by side</text>
  <text x="291.5" y="256.0" class="note" text-anchor="start" xml:space="preserve">read and write: 30 µs, unchanged</text>
  <text x="291.5" y="274.0" class="note" text-anchor="start" xml:space="preserve">speedup 130 / 42.5 = 3.06</text>
  <line x1="40.0" y1="360.0" x2="534.0" y2="360.0" stroke="#5D6B7A" stroke-width="1"/>
  <rect x="40" y="394" width="14" height="14" rx="4" fill="#FCEBE6" stroke="#CF4526" stroke-width="1.3"/>
  <text x="61.0" y="405.5" class="note" text-anchor="start" xml:space="preserve">serial: one processor at a time</text>
  <rect x="287.6" y="394" width="14" height="14" rx="4" fill="#E7F5E9" stroke="#2E8B3D" stroke-width="1.3"/>
  <text x="308.6" y="405.5" class="note" text-anchor="start" xml:space="preserve">parallel: divides by p</text>
  <line x1="40.0" y1="356.0" x2="40.0" y2="364.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="40.0" y="380.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">0</text>
  <line x1="116.0" y1="356.0" x2="116.0" y2="364.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="116.0" y="380.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">20</text>
  <line x1="163.5" y1="356.0" x2="163.5" y2="364.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="163.5" y="380.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">32.5</text>
  <line x1="201.5" y1="356.0" x2="201.5" y2="364.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="201.5" y="380.0" class="mono" text-anchor="middle" style="fill:#5D6B7A" xml:space="preserve">42.5</text>
  <line x1="534.0" y1="356.0" x2="534.0" y2="364.0" stroke="#5D6B7A" stroke-width="1.2"/>
  <text x="534.0" y="380.0" class="mono" text-anchor="end" style="fill:#5D6B7A" xml:space="preserve">130 µs</text>
  <line x1="201.5" y1="214.0" x2="201.5" y2="352.0" stroke="#5D6B7A" stroke-width="1" stroke-dasharray="3 4"/>
</svg>
