<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 598" width="660" height="598" role="img" aria-label="3 levels in a column. At the top, called from the host, Thrust: thrust::reduce, thrust::sort; it allocates its own scratch memory and launches its own kernels. In the middle, also from the host, CUB device-wide calls: cub::DeviceReduce, cub::DeviceScan, cub::DeviceRadixSort; the caller passes in the scratch memory. At the bottom, inside the caller&#x27;s own kernel, CUB block and warp building blocks: cub::BlockReduce, cub::BlockScan, cub::WarpReduce. Beside the column, 3 separate libraries that work through a handle or plan: cuBLAS, cuFFT and cuRAND.">
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1B2430; }
    .title { font-size: 18px; font-weight: 650; }
    .lede { font-size: 12.5px; fill: #5D6B7A; }
    .name { font-size: 14px; font-weight: 650; }
    .sub { font-size: 12px; fill: #5D6B7A; }
    .note { font-size: 12px; fill: #5D6B7A; }
    .tab { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; fill: #5D6B7A; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .dim { fill: #8794A3; }
    .strong { font-weight: 700; }
    .trap { fill: #CF4526; font-weight: 700; }
    .pill { font-size: 11px; font-weight: 600; }
    .wire { fill: none; stroke: #3F5873; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wire.danger { stroke: #CF4526; stroke-dasharray: 6 5; }
    .wire.idle { stroke: #7F8EA0; stroke-dasharray: 2 5; }
  </style>
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2430" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="thor-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6CCD5"/><stop offset="1" stop-color="#979EA9"/>
    </linearGradient>
    <linearGradient id="switch-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4656"/><stop offset="1" stop-color="#232B37"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#3F5873"/>
    </marker>
    <marker id="head-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#CF4526"/>
    </marker>
    <marker id="head-idle" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0.5,1 L9,5 L0.5,9 Z" fill="#7F8EA0"/>
    </marker>
  </defs>
  <rect width="660" height="598" rx="14" fill="#FBFAF6"/>
  <text x="32.0" y="42.0" class="title" text-anchor="start" xml:space="preserve">5 libraries, 3 levels</text>
  <text x="32.0" y="63.0" class="lede" text-anchor="start" xml:space="preserve">From a whole-array call on the host down to a step inside a kernel.</text>
  <rect x="16" y="104" width="400" height="404" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="34" y="93" width="138.1" height="22" rx="11" fill="#1B2430"/>
  <text x="103.1" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">THRUST AND CUB</text>
  <rect x="432" y="104" width="212" height="404" rx="16" fill="#F3F1EA" stroke="#E4E0D4" stroke-width="1.2"/>
  <rect x="450" y="93" width="153.9" height="22" rx="11" fill="#1B2430"/>
  <text x="526.9" y="108.2" class="tab" text-anchor="middle" style="fill:#FFFFFF" xml:space="preserve">HANDLE LIBRARIES</text>
  <rect x="40" y="136" width="300" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,136.7 H46 V215.3 H52 A11.3,11.3 0 0 1 40.7,204 V148 A11.3,11.3 0 0 1 52,136.7 Z" fill="#2F6FDB"/>
  <text x="60.0" y="163.0" class="name" text-anchor="start" xml:space="preserve">Thrust</text>
  <text x="60.0" y="181.0" class="sub" text-anchor="start" xml:space="preserve">thrust::reduce, thrust::sort</text>
  <text x="60.0" y="199.0" class="sub" text-anchor="start" xml:space="preserve">allocates scratch, may wait</text>
  <rect x="352.0" y="167" width="40.4" height="18" rx="9" fill="#EAF1FD"/>
  <text x="372.2" y="179.6" class="pill" text-anchor="middle" style="fill:#2F6FDB" xml:space="preserve">host</text>
  <path d="M190,216 V257" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <text x="200.0" y="242.0" class="note" text-anchor="start" xml:space="preserve">built on</text>
  <rect x="40" y="260" width="300" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,260.7 H46 V339.3 H52 A11.3,11.3 0 0 1 40.7,328 V272 A11.3,11.3 0 0 1 52,260.7 Z" fill="#1F8A70"/>
  <text x="60.0" y="287.0" class="name" text-anchor="start" xml:space="preserve">CUB, device-wide</text>
  <text x="60.0" y="305.0" class="sub" text-anchor="start" xml:space="preserve">cub::DeviceReduce, DeviceScan</text>
  <text x="60.0" y="323.0" class="sub" text-anchor="start" xml:space="preserve">caller passes scratch memory</text>
  <rect x="352.0" y="291" width="40.4" height="18" rx="9" fill="#E4F4EF"/>
  <text x="372.2" y="303.6" class="pill" text-anchor="middle" style="fill:#1F8A70" xml:space="preserve">host</text>
  <path d="M190,340 V381" fill="none" stroke="#3F5873" stroke-width="1.8" stroke-linecap="round" marker-end="url(#head)"/>
  <text x="200.0" y="366.0" class="note" text-anchor="start" xml:space="preserve">built on</text>
  <rect x="40" y="384" width="300" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M52,384.7 H46 V463.3 H52 A11.3,11.3 0 0 1 40.7,452 V396 A11.3,11.3 0 0 1 52,384.7 Z" fill="#7A4FD0"/>
  <text x="60.0" y="411.0" class="name" text-anchor="start" xml:space="preserve">CUB, block and warp</text>
  <text x="60.0" y="429.0" class="sub" text-anchor="start" xml:space="preserve">cub::BlockReduce, BlockScan</text>
  <text x="60.0" y="447.0" class="sub" text-anchor="start" xml:space="preserve">inside your own kernel</text>
  <rect x="352.0" y="415" width="53.6" height="18" rx="9" fill="#F0EAFB"/>
  <text x="378.8" y="427.6" class="pill" text-anchor="middle" style="fill:#7A4FD0" xml:space="preserve">kernel</text>
  <rect x="452" y="136" width="172" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M464,136.7 H458 V215.3 H464 A11.3,11.3 0 0 1 452.7,204 V148 A11.3,11.3 0 0 1 464,136.7 Z" fill="#B7791F"/>
  <text x="472.0" y="163.0" class="name" text-anchor="start" xml:space="preserve">cuBLAS</text>
  <text x="472.0" y="181.0" class="sub" text-anchor="start" xml:space="preserve">handle, then</text>
  <text x="472.0" y="199.0" class="sub" text-anchor="start" xml:space="preserve">cublasSgemm</text>
  <rect x="452" y="260" width="172" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M464,260.7 H458 V339.3 H464 A11.3,11.3 0 0 1 452.7,328 V272 A11.3,11.3 0 0 1 464,260.7 Z" fill="#B7791F"/>
  <text x="472.0" y="287.0" class="name" text-anchor="start" xml:space="preserve">cuFFT</text>
  <text x="472.0" y="305.0" class="sub" text-anchor="start" xml:space="preserve">plan, then</text>
  <text x="472.0" y="323.0" class="sub" text-anchor="start" xml:space="preserve">cufftExecR2C</text>
  <rect x="452" y="384" width="172" height="80" rx="12" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.3" filter="url(#lift)"/>
  <path d="M464,384.7 H458 V463.3 H464 A11.3,11.3 0 0 1 452.7,452 V396 A11.3,11.3 0 0 1 464,384.7 Z" fill="#B7791F"/>
  <text x="472.0" y="411.0" class="name" text-anchor="start" xml:space="preserve">cuRAND</text>
  <text x="472.0" y="429.0" class="sub" text-anchor="start" xml:space="preserve">generator, then</text>
  <text x="472.0" y="447.0" class="sub" text-anchor="start" xml:space="preserve">curandGenerate</text>
  <text x="40.0" y="540.0" class="note" text-anchor="start" xml:space="preserve">Thrust calls CUB&#x27;s device-wide algorithms, which launch kernels built from CUB&#x27;s</text>
  <text x="40.0" y="558.0" class="note" text-anchor="start" xml:space="preserve">block and warp pieces. Lower levels give the caller more control: over scratch</text>
  <text x="40.0" y="576.0" class="note" text-anchor="start" xml:space="preserve">memory, over waiting, and over what happens around each step.</text>
</svg>
