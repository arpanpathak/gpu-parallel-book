<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 436" width="660" height="436" role="img" aria-label="The 8 values as 2 tiles of 4. Tile 0, 3, 1, 7, 0, scans to 3, 4, 11, 11 with total 11; tile 1, 4, 1, 6, 3, scans to 4, 5, 11, 14 with total 14. The totals scan to 11 and 25, and adding 11 to tile 1 gives 15, 16, 22, 25: the whole scan is 3, 4, 11, 11, 15, 16, 22, 25.">
