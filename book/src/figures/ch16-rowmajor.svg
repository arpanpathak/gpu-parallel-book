  <text x="320.0" y="165.0" class="name" text-anchor="start" xml:space="preserve">C[1][2] is element 1 × 4 + 2 = 6</text>
  <text x="320.0" y="183.0" class="sub" text-anchor="start" xml:space="preserve">row × width + column</text>
  <text x="300.0" y="230.0" class="note" text-anchor="start" xml:space="preserve">The rows lie one after another. Row r starts at</text>
  <text x="300.0" y="248.0" class="note" text-anchor="start" xml:space="preserve">r × 4, so column c of row r is at r × 4 + c.</text>
