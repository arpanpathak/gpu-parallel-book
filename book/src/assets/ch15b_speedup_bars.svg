<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">
  <rect x="0" y="0" width="900" height="400" rx="12" fill="#011627" stroke="#1d3b53" stroke-width="2"/>

  <text x="450" y="36" text-anchor="middle" fill="#82aaff" font-size="16" font-weight="bold">CPU vs GPU SPEEDUP ON JETSON ORIN</text>
  <text x="450" y="58" text-anchor="middle" fill="#637777" font-size="11">GPU time is kernel-only, measured with CUDA events; CPU baseline is Rayon on 8 cores</text>

  <!-- baseline -->
  <line x1="80" y1="310" x2="820" y2="310" stroke="#1d3b53" stroke-width="2"/>
  <text x="80" y="300" fill="#637777" font-size="10">0x</text>
  <text x="820" y="300" text-anchor="end" fill="#637777" font-size="10">CPU Rayon = 1.0x baseline</text>

  <!-- SAXPY -->
  <rect x="120" y="252" width="90" height="58" rx="6" fill="#7fdbca" opacity="0.9"/>
  <text x="165" y="242" text-anchor="middle" fill="#7fdbca" font-size="13" font-weight="bold">SAXPY</text>
  <text x="165" y="286" text-anchor="middle" fill="#011627" font-size="12" font-weight="bold">1.8x</text>
  <text x="165" y="332" text-anchor="middle" fill="#637777" font-size="10">memory-bound</text>

  <!-- Dot product -->
  <rect x="300" y="265" width="90" height="45" rx="6" fill="#7fdbca" opacity="0.55"/>
  <text x="345" y="255" text-anchor="middle" fill="#7fdbca" font-size="13" font-weight="bold">Dot</text>
  <text x="345" y="292" text-anchor="middle" fill="#011627" font-size="12" font-weight="bold">1.4x</text>
  <text x="345" y="332" text-anchor="middle" fill="#637777" font-size="10">memory-bound</text>

  <!-- Matmul -->
  <rect x="480" y="86" width="90" height="224" rx="6" fill="#addb67" opacity="0.9"/>
  <text x="525" y="76" text-anchor="middle" fill="#addb67" font-size="13" font-weight="bold">Matmul</text>
  <text x="525" y="200" text-anchor="middle" fill="#011627" font-size="18" font-weight="bold">7.0x</text>
  <text x="525" y="332" text-anchor="middle" fill="#637777" font-size="10">compute-bound + shared memory</text>

  <!-- Jacobi -->
  <rect x="660" y="259" width="90" height="51" rx="6" fill="#c792ea" opacity="0.85"/>
  <text x="705" y="249" text-anchor="middle" fill="#c792ea" font-size="13" font-weight="bold">Jacobi</text>
  <text x="705" y="290" text-anchor="middle" fill="#011627" font-size="12" font-weight="bold">1.6x</text>
  <text x="705" y="332" text-anchor="middle" fill="#637777" font-size="10">stencil / memory-bound</text>
</svg>
