<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">
  <rect x="0" y="0" width="860" height="240" rx="12" fill="#011627" stroke="#1d3b53" stroke-width="2"/>

  <!-- time axis -->
  <line x1="60" y1="40" x2="800" y2="40" stroke="#637777" stroke-width="1.5"/>
  <text x="800" y="32" text-anchor="end" fill="#637777" font-size="11">time</text>

  <!-- copy lane -->
  <text x="60" y="75" fill="#7fdbca" font-size="12" font-weight="bold">copy</text>
  <rect x="110" y="60" width="150" height="28" rx="6" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="185" y="78" text-anchor="middle" fill="#7fdbca" font-size="11">copy chunk k+1</text>
  <rect x="330" y="60" width="150" height="28" rx="6" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="405" y="78" text-anchor="middle" fill="#7fdbca" font-size="11">copy chunk k+2</text>
  <rect x="560" y="60" width="150" height="28" rx="6" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="635" y="78" text-anchor="middle" fill="#7fdbca" font-size="11">copy chunk k+3</text>

  <!-- compute lane -->
  <text x="60" y="135" fill="#addb67" font-size="12" font-weight="bold">kernel</text>
  <rect x="190" y="120" width="180" height="28" rx="6" fill="#0b2942" stroke="#addb67" stroke-width="1.5"/>
  <text x="280" y="138" text-anchor="middle" fill="#addb67" font-size="11">kernel on chunk k</text>
  <rect x="410" y="120" width="180" height="28" rx="6" fill="#0b2942" stroke="#addb67" stroke-width="1.5"/>
  <text x="500" y="138" text-anchor="middle" fill="#addb67" font-size="11">kernel on chunk k+1</text>
  <rect x="640" y="120" width="120" height="28" rx="6" fill="#0b2942" stroke="#addb67" stroke-width="1.5"/>
  <text x="700" y="138" text-anchor="middle" fill="#addb67" font-size="11">kernel k+2</text>

  <!-- overlap shading -->
  <rect x="190" y="170" width="290" height="34" rx="6" fill="#82aaff" fill-opacity="0.12" stroke="#82aaff" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="335" y="192" text-anchor="middle" fill="#82aaff" font-size="11">copy k+1 overlaps kernel k - the bus and the SMs work simultaneously</text>
  <rect x="410" y="206" width="290" height="26" rx="6" fill="#82aaff" fill-opacity="0.08" stroke="#82aaff" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="555" y="223" text-anchor="middle" fill="#82aaff" font-size="10">copy k+2 overlaps kernel k+1</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#82aaff"/>
    </marker>
  </defs>
</svg>
