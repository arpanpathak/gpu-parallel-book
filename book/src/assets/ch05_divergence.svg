<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">
  <!-- Night Owl background panel -->
  <rect x="0" y="0" width="860" height="460" rx="12" fill="#011627" stroke="#1d3b53" stroke-width="2"/>
  <text x="430" y="26" text-anchor="middle" fill="#82aaff" font-size="15" font-weight="bold" letter-spacing="1">WARP DIVERGENCE - ONE INSTRUCTION, TWO PATHS, SERIALLY</text>

  <!-- Source snippet (one statement per line) -->
  <rect x="30" y="44" width="800" height="84" rx="8" fill="#0b2942" stroke="#1d3b53" stroke-width="1.5"/>
  <text x="50" y="66" fill="#82aaff" font-size="12" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">if (val[i] &gt; 0)</text>
  <text x="50" y="84" fill="#d6deeb" font-size="12" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">    y[i] = 2.0f * x[i];   // path A - taken by lanes 0-4</text>
  <text x="50" y="102" fill="#d6deeb" font-size="12" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">else</text>
  <text x="50" y="120" fill="#f78c6c" font-size="12" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">    y[i] = 0.5f * x[i];   // path B - taken by lanes 5-7</text>

  <!-- Lane legend -->
  <text x="430" y="146" text-anchor="middle" fill="#637777" font-size="10">a warp of 8 lanes drawn here; each lane represents 4 real lanes of a 32-thread warp</text>

  <!-- Lane strip: blue = path A, orange = path B -->
  <rect x="30" y="158" width="80" height="40" rx="5" fill="#0b2942" stroke="#82aaff" stroke-width="2"/>
  <text x="70" y="182" text-anchor="middle" fill="#82aaff" font-size="11" font-weight="bold">lane 0</text>
  <rect x="120" y="158" width="80" height="40" rx="5" fill="#0b2942" stroke="#82aaff" stroke-width="2"/>
  <text x="160" y="182" text-anchor="middle" fill="#82aaff" font-size="11" font-weight="bold">lane 1</text>
  <rect x="210" y="158" width="80" height="40" rx="5" fill="#0b2942" stroke="#82aaff" stroke-width="2"/>
  <text x="250" y="182" text-anchor="middle" fill="#82aaff" font-size="11" font-weight="bold">lane 2</text>
  <rect x="300" y="158" width="80" height="40" rx="5" fill="#0b2942" stroke="#82aaff" stroke-width="2"/>
  <text x="340" y="182" text-anchor="middle" fill="#82aaff" font-size="11" font-weight="bold">lane 3</text>
  <rect x="390" y="158" width="80" height="40" rx="5" fill="#0b2942" stroke="#82aaff" stroke-width="2"/>
  <text x="430" y="182" text-anchor="middle" fill="#82aaff" font-size="11" font-weight="bold">lane 4</text>
  <rect x="480" y="158" width="80" height="40" rx="5" fill="#0b2942" stroke="#f78c6c" stroke-width="2"/>
  <text x="520" y="182" text-anchor="middle" fill="#f78c6c" font-size="11" font-weight="bold">lane 5</text>
  <rect x="570" y="158" width="80" height="40" rx="5" fill="#0b2942" stroke="#f78c6c" stroke-width="2"/>
  <text x="610" y="182" text-anchor="middle" fill="#f78c6c" font-size="11" font-weight="bold">lane 6</text>
  <rect x="660" y="158" width="80" height="40" rx="5" fill="#0b2942" stroke="#f78c6c" stroke-width="2"/>
  <text x="700" y="182" text-anchor="middle" fill="#f78c6c" font-size="11" font-weight="bold">lane 7</text>
  <text x="765" y="182" text-anchor="middle" fill="#637777" font-size="12">...</text>

  <!-- Pass 1 -->
  <rect x="30" y="212" width="800" height="72" rx="8" fill="#01111f" stroke="#82aaff" stroke-width="1.5"/>
  <text x="50" y="232" fill="#82aaff" font-size="12" font-weight="bold">PASS 1 - then-path (A): lanes 0-4 execute, lanes 5-7 masked off</text>
  <rect x="50" y="244" width="36" height="18" rx="3" fill="#82aaff" opacity="0.9"/>
  <rect x="94" y="244" width="36" height="18" rx="3" fill="#82aaff" opacity="0.9"/>
  <rect x="138" y="244" width="36" height="18" rx="3" fill="#82aaff" opacity="0.9"/>
  <rect x="182" y="244" width="36" height="18" rx="3" fill="#82aaff" opacity="0.9"/>
  <rect x="226" y="244" width="36" height="18" rx="3" fill="#82aaff" opacity="0.9"/>
  <rect x="270" y="244" width="36" height="18" rx="3" fill="#f78c6c" opacity="0.18"/>
  <rect x="314" y="244" width="36" height="18" rx="3" fill="#f78c6c" opacity="0.18"/>
  <rect x="358" y="244" width="36" height="18" rx="3" fill="#f78c6c" opacity="0.18"/>
  <text x="430" y="270" text-anchor="middle" fill="#637777" font-size="11">lanes 0-4 active (blue), lanes 5-7 masked (dimmed)</text>

  <!-- Pass 2 -->
  <rect x="30" y="294" width="800" height="72" rx="8" fill="#01111f" stroke="#f78c6c" stroke-width="1.5"/>
  <text x="50" y="314" fill="#f78c6c" font-size="12" font-weight="bold">PASS 2 - else-path (B): lanes 5-7 execute, lanes 0-4 masked off</text>
  <rect x="50" y="326" width="36" height="18" rx="3" fill="#82aaff" opacity="0.18"/>
  <rect x="94" y="326" width="36" height="18" rx="3" fill="#82aaff" opacity="0.18"/>
  <rect x="138" y="326" width="36" height="18" rx="3" fill="#82aaff" opacity="0.18"/>
  <rect x="182" y="326" width="36" height="18" rx="3" fill="#82aaff" opacity="0.18"/>
  <rect x="226" y="326" width="36" height="18" rx="3" fill="#82aaff" opacity="0.18"/>
  <rect x="270" y="326" width="36" height="18" rx="3" fill="#f78c6c" opacity="0.9"/>
  <rect x="314" y="326" width="36" height="18" rx="3" fill="#f78c6c" opacity="0.9"/>
  <rect x="358" y="326" width="36" height="18" rx="3" fill="#f78c6c" opacity="0.9"/>
  <text x="430" y="352" text-anchor="middle" fill="#637777" font-size="11">lanes 5-7 active (orange), lanes 0-4 masked (dimmed)</text>

  <!-- Reconvergence -->
  <line x1="430" y1="366" x2="430" y2="384" stroke="#7fdbca" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="150" y="384" width="560" height="32" rx="8" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="430" y="405" text-anchor="middle" fill="#7fdbca" font-size="12" font-weight="bold">RECONVERGE - the warp resumes lockstep; both paths used 2 instruction slots</text>

  <!-- Bottom callout -->
  <rect x="30" y="424" width="800" height="26" rx="6" fill="#01111f" stroke="#1d3b53" stroke-width="1"/>
  <text x="430" y="442" text-anchor="middle" fill="#d6deeb" font-size="11">Divergent branch = 2 passes for one if; uniform branch = 1 pass; a 50/50 split doubles the cost (Section 2.3)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7fdbca"/>
    </marker>
  </defs>
</svg>
