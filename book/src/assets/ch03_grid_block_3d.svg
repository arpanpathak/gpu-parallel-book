<text x='660' y='100' text-anchor='middle' fill='#82aaff' font-size='14' font-weight='bold'>THE BLOCK</text>
<text x='660' y='118' text-anchor='middle' fill='#637777' font-size='11'>each cube = one thread: 4 x 4 x 2 = 32 = one warp</text>
<line x1='486' y1='394' x2='660' y2='394' stroke='#addb67' stroke-width='2' marker-end='url(#arr3d)'/><text x='578.0' y='414' fill='#addb67' font-size='11' text-anchor='middle' font-weight='bold'>blockDim.x = 4</text>
<line x1='486' y1='394' x2='486' y2='180' stroke='#c792ea' stroke-width='2' marker-end='url(#arr3d)'/><text x='482' y='276.0' text-anchor='end' fill='#c792ea' font-size='11' font-weight='bold'>blockDim.y = 4</text>
<line x1='486' y1='394' x2='526' y2='370' stroke='#ecc48d' stroke-width='2' marker-end='url(#arr3d)'/><text x='574' y='362' fill='#ecc48d' font-size='11' text-anchor='middle' font-weight='bold'>blockDim.z = 2</text>
<line x1='595.0' y1='327.0' x2='700' y2='250' stroke='#addb67' stroke-width='1.5' stroke-dasharray='5 3'/>
<rect x='600' y='236' width='210' height='26' rx='6' fill='#0b2942' stroke='#addb67' stroke-width='1.5'/>
<text x='705' y='254' text-anchor='middle' fill='#addb67' font-size='12' font-weight='bold'>threadIdx = (2, 1, 0)</text>
<rect x='60' y='470' width='740' height='120' rx='8' fill='#0b2942' stroke='#1d3b53' stroke-width='1.5'/>
<text x='430' y='492' text-anchor='middle' fill='#addb67' font-size='13' font-weight='bold'>global position = blockIdx * blockDim + threadIdx  (component-wise, per axis)</text>
<text x='430' y='512' text-anchor='middle' fill='#d6deeb' font-size='12'>gx = blockIdx.x*blockDim.x + threadIdx.x     gy = blockIdx.y*blockDim.y + threadIdx.y</text><text x='430' y='532' text-anchor='middle' fill='#d6deeb' font-size='12'>gz = blockIdx.z*blockDim.z + threadIdx.z</text>
<text x='430' y='556' text-anchor='middle' fill='#d6deeb' font-size='11'>example: blockIdx = (1,1,0), blockDim = (4,4,2), threadIdx = (2,1,0)</text>
<text x='430' y='576' text-anchor='middle' fill='#ecc48d' font-size='12' font-weight='bold'>gx = 1*4 + 2 = 6      gy = 1*4 + 1 = 5      gz = 0*2 + 0 = 0</text>
<text x='430' y='580' text-anchor='middle' fill='#637777' font-size='10'>threads linearise x-fastest, then y, then z (Section 3.5)   |   total threads = (3*4) x (2*4) x (2*2) = 384</text>
<defs><marker id='arr3d' markerWidth='9' markerHeight='9' refX='7' refY='3.5' orient='auto'><path d='M0,0 L8,3.5 L0,7 Z' fill='#82aaff'/></marker></defs>
</svg>