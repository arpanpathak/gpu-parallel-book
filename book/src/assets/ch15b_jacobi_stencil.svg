<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">
  <rect x="0" y="0" width="860" height="360" rx="12" fill="#011627" stroke="#1d3b53" stroke-width="2"/>

  <text x="430" y="32" text-anchor="middle" fill="#82aaff" font-size="15" font-weight="bold">FIVE-POINT JACOBI STENCIL</text>
  <text x="430" y="52" text-anchor="middle" fill="#637777" font-size="11">u_new[i,j] = (u[i-1,j] + u[i+1,j] + u[i,j-1] + u[i,j+1]) / 4</text>

  <!-- grid background -->
  <rect x="250" y="90" width="360" height="180" fill="#0b2942" stroke="#1d3b53" stroke-width="2" rx="6"/>

  <!-- neighbour cells -->
  <g fill="#01111f" stroke="#7fdbca" stroke-width="1.5">
    <rect x="380" y="90" width="50" height="50" rx="4"/>
    <rect x="380" y="160" width="50" height="50" rx="4"/>
    <rect x="310" y="160" width="50" height="50" rx="4"/>
    <rect x="450" y="160" width="50" height="50" rx="4"/>
  </g>

  <!-- center cell -->
  <rect x="380" y="160" width="50" height="50" rx="4" fill="#addb67" stroke="#addb67" stroke-width="2.5"/>
  <text x="405" y="190" text-anchor="middle" fill="#011627" font-size="13" font-weight="bold">u</text>

  <text x="405" y="122" text-anchor="middle" fill="#7fdbca" font-size="10">up</text>
  <text x="405" y="232" text-anchor="middle" fill="#7fdbca" font-size="10">down</text>
  <text x="330" y="188" text-anchor="middle" fill="#7fdbca" font-size="10">left</text>
  <text x="480" y="188" text-anchor="middle" fill="#7fdbca" font-size="10">right</text>

  <!-- arrows to center -->
  <defs>
    <marker id="stencilArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#82aaff"/>
    </marker>
  </defs>
  <line x1="405" y1="145" x2="405" y2="158" stroke="#82aaff" stroke-width="1.5" marker-end="url(#stencilArrow)"/>
  <line x1="405" y1="215" x2="405" y2="202" stroke="#82aaff" stroke-width="1.5" marker-end="url(#stencilArrow)"/>
  <line x1="335" y1="185" x2="378" y2="185" stroke="#82aaff" stroke-width="1.5" marker-end="url(#stencilArrow)"/>
  <line x1="475" y1="185" x2="432" y2="185" stroke="#82aaff" stroke-width="1.5" marker-end="url(#stencilArrow)"/>

  <!-- boundary note -->
  <rect x="90" y="280" width="680" height="44" rx="8" fill="#0b2942" stroke="#addb67" stroke-width="1.5"/>
  <text x="430" y="300" text-anchor="middle" fill="#addb67" font-size="12" font-weight="bold">boundary cells are fixed: top = 100, other edges = 0</text>
  <text x="430" y="316" text-anchor="middle" fill="#637777" font-size="10">each iteration spreads boundary information one cell further inward</text>
</svg>
