<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">
  <rect x="0" y="0" width="700" height="430" rx="12" fill="#011627" stroke="#1d3b53" stroke-width="2"/>

  <text x="350" y="36" text-anchor="middle" fill="#82aaff" font-size="15" font-weight="bold">FIVE-POINT JACOBI STENCIL</text>
  <text x="350" y="58" text-anchor="middle" fill="#637777" font-size="11">u_new[i,j] = (u[i-1,j] + u[i+1,j] + u[i,j-1] + u[i,j+1]) / 4</text>

  <defs>
    <marker id="stencilArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#82aaff"/>
    </marker>
  </defs>

  <!-- neighbor cells -->
  <g fill="#0b2942" stroke="#7fdbca" stroke-width="1.5">
    <rect x="300" y="90" width="80" height="80" rx="6"/>
    <rect x="300" y="280" width="80" height="80" rx="6"/>
    <rect x="190" y="190" width="80" height="80" rx="6"/>
    <rect x="410" y="190" width="80" height="80" rx="6"/>
  </g>

  <!-- center cell -->
  <rect x="300" y="190" width="80" height="80" rx="6" fill="#addb67" stroke="#addb67" stroke-width="2.5"/>
  <text x="340" y="238" text-anchor="middle" fill="#011627" font-size="16" font-weight="bold">u</text>

  <!-- direction labels -->
  <text x="340" y="136" text-anchor="middle" fill="#7fdbca" font-size="11">up</text>
  <text x="340" y="326" text-anchor="middle" fill="#7fdbca" font-size="11">down</text>
  <text x="230" y="236" text-anchor="middle" fill="#7fdbca" font-size="11">left</text>
  <text x="450" y="236" text-anchor="middle" fill="#7fdbca" font-size="11">right</text>

  <!-- arrows from neighbors to center -->
  <line x1="340" y1="172" x2="340" y2="188" stroke="#82aaff" stroke-width="2" marker-end="url(#stencilArrow)"/>
  <line x1="340" y1="278" x2="340" y2="262" stroke="#82aaff" stroke-width="2" marker-end="url(#stencilArrow)"/>
  <line x1="272" y1="230" x2="298" y2="230" stroke="#82aaff" stroke-width="2" marker-end="url(#stencilArrow)"/>
  <line x1="408" y1="230" x2="382" y2="230" stroke="#82aaff" stroke-width="2" marker-end="url(#stencilArrow)"/>

  <!-- boundary note -->
  <rect x="90" y="370" width="520" height="42" rx="8" fill="#0b2942" stroke="#addb67" stroke-width="1.5"/>
  <text x="350" y="389" text-anchor="middle" fill="#addb67" font-size="12" font-weight="bold">boundary cells are fixed: top = 100, other edges = 0</text>
  <text x="350" y="404" text-anchor="middle" fill="#637777" font-size="10">each iteration spreads boundary information one cell further inward</text>
</svg>
