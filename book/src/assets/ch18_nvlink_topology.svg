<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">
  <rect x="0" y="0" width="860" height="420" rx="12" fill="#011627" stroke="#1d3b53" stroke-width="2"/>

  <text x="430" y="30" text-anchor="middle" fill="#d6deeb" font-size="14" font-weight="bold">NVLink topologies: direct link vs NVSwitch</text>

  <!-- Panel 1: direct NVLink -->
  <rect x="30" y="60" width="380" height="330" rx="10" fill="#01111f" stroke="#1d3b53" stroke-width="1.5"/>
  <text x="220" y="84" text-anchor="middle" fill="#d6deeb" font-size="12" font-weight="bold">2 GPUs - direct NVLink</text>

  <rect x="55" y="140" width="120" height="150" rx="10" fill="#0b2942" stroke="#7fdbca" stroke-width="2"/>
  <text x="115" y="168" text-anchor="middle" fill="#d6deeb" font-size="13" font-weight="bold">GPU 0</text>
  <text x="115" y="190" text-anchor="middle" fill="#637777" font-size="11">SMs</text>
  <text x="115" y="210" text-anchor="middle" fill="#637777" font-size="11">HBM</text>
  <text x="115" y="230" text-anchor="middle" fill="#637777" font-size="11">NVLink ports</text>

  <rect x="265" y="140" width="120" height="150" rx="10" fill="#0b2942" stroke="#7fdbca" stroke-width="2"/>
  <text x="325" y="168" text-anchor="middle" fill="#d6deeb" font-size="13" font-weight="bold">GPU 1</text>
  <text x="325" y="190" text-anchor="middle" fill="#637777" font-size="11">SMs</text>
  <text x="325" y="210" text-anchor="middle" fill="#637777" font-size="11">HBM</text>
  <text x="325" y="230" text-anchor="middle" fill="#637777" font-size="11">NVLink ports</text>

  <line x1="175" y1="185" x2="265" y2="185" stroke="#addb67" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="265" y1="235" x2="175" y2="235" stroke="#addb67" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <circle cx="175" cy="185" r="4" fill="#addb67"/>
  <circle cx="265" cy="185" r="4" fill="#addb67"/>
  <circle cx="265" cy="235" r="4" fill="#addb67"/>
  <circle cx="175" cy="235" r="4" fill="#addb67"/>
  <text x="220" y="212" text-anchor="middle" fill="#addb67" font-size="11" font-weight="bold">NVLink</text>
  <text x="220" y="260" text-anchor="middle" fill="#637777" font-size="10">bidirectional</text>
  <text x="220" y="274" text-anchor="middle" fill="#637777" font-size="10">peer DMA</text>

  <!-- Panel 2: NVSwitch -->
  <rect x="450" y="60" width="380" height="330" rx="10" fill="#01111f" stroke="#1d3b53" stroke-width="1.5"/>
  <text x="640" y="84" text-anchor="middle" fill="#d6deeb" font-size="12" font-weight="bold">4 GPUs - NVSwitch crossbar</text>

  <rect x="585" y="175" width="100" height="70" rx="10" fill="#0b2942" stroke="#82aaff" stroke-width="2"/>
  <text x="635" y="202" text-anchor="middle" fill="#82aaff" font-size="12" font-weight="bold">NVSwitch</text>
  <text x="635" y="220" text-anchor="middle" fill="#637777" font-size="10">crossbar</text>

  <rect x="470" y="100" width="100" height="60" rx="8" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="520" y="124" text-anchor="middle" fill="#d6deeb" font-size="11" font-weight="bold">GPU 0</text>
  <text x="520" y="144" text-anchor="middle" fill="#637777" font-size="10">NVLink</text>

  <rect x="710" y="100" width="100" height="60" rx="8" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="760" y="124" text-anchor="middle" fill="#d6deeb" font-size="11" font-weight="bold">GPU 1</text>
  <text x="760" y="144" text-anchor="middle" fill="#637777" font-size="10">NVLink</text>

  <rect x="470" y="280" width="100" height="60" rx="8" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="520" y="304" text-anchor="middle" fill="#d6deeb" font-size="11" font-weight="bold">GPU 2</text>
  <text x="520" y="324" text-anchor="middle" fill="#637777" font-size="10">NVLink</text>

  <rect x="710" y="280" width="100" height="60" rx="8" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="760" y="304" text-anchor="middle" fill="#d6deeb" font-size="11" font-weight="bold">GPU 3</text>
  <text x="760" y="324" text-anchor="middle" fill="#637777" font-size="10">NVLink</text>

  <!-- GPU 0 <-> switch -->
  <line x1="512" y1="160" x2="606" y2="175" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="624" y1="175" x2="528" y2="160" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <circle cx="512" cy="160" r="4" fill="#addb67"/>
  <circle cx="606" cy="175" r="4" fill="#addb67"/>
  <circle cx="624" cy="175" r="4" fill="#addb67"/>
  <circle cx="528" cy="160" r="4" fill="#addb67"/>
  <!-- GPU 1 <-> switch -->
  <line x1="752" y1="160" x2="664" y2="175" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="646" y1="175" x2="768" y2="160" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <circle cx="752" cy="160" r="4" fill="#addb67"/>
  <circle cx="664" cy="175" r="4" fill="#addb67"/>
  <circle cx="646" cy="175" r="4" fill="#addb67"/>
  <circle cx="768" cy="160" r="4" fill="#addb67"/>
  <!-- GPU 2 <-> switch -->
  <line x1="512" y1="280" x2="606" y2="245" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="624" y1="245" x2="528" y2="280" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <circle cx="512" cy="280" r="4" fill="#addb67"/>
  <circle cx="606" cy="245" r="4" fill="#addb67"/>
  <circle cx="624" cy="245" r="4" fill="#addb67"/>
  <circle cx="528" cy="280" r="4" fill="#addb67"/>
  <!-- GPU 3 <-> switch -->
  <line x1="752" y1="280" x2="664" y2="245" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="646" y1="245" x2="768" y2="280" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <circle cx="752" cy="280" r="4" fill="#addb67"/>
  <circle cx="664" cy="245" r="4" fill="#addb67"/>
  <circle cx="646" cy="245" r="4" fill="#addb67"/>
  <circle cx="768" cy="280" r="4" fill="#addb67"/>

  <text x="640" y="366" text-anchor="middle" fill="#637777" font-size="11">every GPU has high-bandwidth access to every other GPU</text>

  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#addb67"/>
    </marker>
  </defs>
</svg>
