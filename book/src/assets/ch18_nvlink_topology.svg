<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">
  <rect x="0" y="0" width="860" height="420" rx="12" fill="#011627" stroke="#1d3b53" stroke-width="2"/>

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" fill="#82aaff" font-size="14" font-weight="bold">NVLink topologies: direct link vs NVSwitch</text>

  <!-- Panel 1: direct NVLink -->
  <rect x="30" y="60" width="380" height="320" rx="10" fill="#01111f" stroke="#1d3b53" stroke-width="1.5"/>
  <text x="220" y="84" text-anchor="middle" fill="#d6deeb" font-size="12" font-weight="bold">2 GPUs - direct NVLink</text>

  <rect x="55" y="130" width="120" height="180" rx="10" fill="#0b2942" stroke="#7fdbca" stroke-width="2"/>
  <text x="115" y="160" text-anchor="middle" fill="#d6deeb" font-size="13" font-weight="bold">GPU 0</text>
  <text x="115" y="182" text-anchor="middle" fill="#637777" font-size="11">SMs</text>
  <text x="115" y="202" text-anchor="middle" fill="#637777" font-size="11">HBM</text>
  <text x="115" y="222" text-anchor="middle" fill="#637777" font-size="11">NVLink ports</text>

  <rect x="265" y="130" width="120" height="180" rx="10" fill="#0b2942" stroke="#7fdbca" stroke-width="2"/>
  <text x="325" y="160" text-anchor="middle" fill="#d6deeb" font-size="13" font-weight="bold">GPU 1</text>
  <text x="325" y="182" text-anchor="middle" fill="#637777" font-size="11">SMs</text>
  <text x="325" y="202" text-anchor="middle" fill="#637777" font-size="11">HBM</text>
  <text x="325" y="222" text-anchor="middle" fill="#637777" font-size="11">NVLink ports</text>

  <line x1="175" y1="218" x2="263" y2="218" stroke="#addb67" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="263" y1="238" x2="175" y2="238" stroke="#addb67" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="219" y="210" text-anchor="middle" fill="#addb67" font-size="11" font-weight="bold">NVLink</text>
  <text x="219" y="260" text-anchor="middle" fill="#637777" font-size="10">bidirectional</text>
  <text x="219" y="276" text-anchor="middle" fill="#637777" font-size="10">peer DMA</text>

  <!-- Panel 2: NVSwitch -->
  <rect x="450" y="60" width="380" height="320" rx="10" fill="#01111f" stroke="#1d3b53" stroke-width="1.5"/>
  <text x="640" y="84" text-anchor="middle" fill="#d6deeb" font-size="12" font-weight="bold">4 GPUs - NVSwitch crossbar</text>

  <rect x="590" y="180" width="100" height="60" rx="10" fill="#0b2942" stroke="#82aaff" stroke-width="2"/>
  <text x="640" y="207" text-anchor="middle" fill="#82aaff" font-size="12" font-weight="bold">NVSwitch</text>
  <text x="640" y="225" text-anchor="middle" fill="#637777" font-size="10">crossbar</text>

  <rect x="475" y="110" width="95" height="70" rx="8" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="522" y="134" text-anchor="middle" fill="#d6deeb" font-size="11" font-weight="bold">GPU 0</text>
  <text x="522" y="154" text-anchor="middle" fill="#637777" font-size="10">NVLink</text>

  <rect x="710" y="110" width="95" height="70" rx="8" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="757" y="134" text-anchor="middle" fill="#d6deeb" font-size="11" font-weight="bold">GPU 1</text>
  <text x="757" y="154" text-anchor="middle" fill="#637777" font-size="10">NVLink</text>

  <rect x="475" y="270" width="95" height="70" rx="8" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="522" y="294" text-anchor="middle" fill="#d6deeb" font-size="11" font-weight="bold">GPU 2</text>
  <text x="522" y="314" text-anchor="middle" fill="#637777" font-size="10">NVLink</text>

  <rect x="710" y="270" width="95" height="70" rx="8" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="757" y="294" text-anchor="middle" fill="#d6deeb" font-size="11" font-weight="bold">GPU 3</text>
  <text x="757" y="314" text-anchor="middle" fill="#637777" font-size="10">NVLink</text>

  <!-- GPU 0 <-> switch (two opposing arrows) -->
  <line x1="522" y1="176" x2="614" y2="183" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="626" y1="191" x2="522" y2="170" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <!-- GPU 1 <-> switch -->
  <line x1="757" y1="176" x2="666" y2="183" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="654" y1="191" x2="757" y2="170" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <!-- GPU 2 <-> switch -->
  <line x1="522" y1="274" x2="614" y2="237" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="626" y1="229" x2="522" y2="280" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <!-- GPU 3 <-> switch -->
  <line x1="757" y1="274" x2="666" y2="237" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="654" y1="229" x2="757" y2="280" stroke="#addb67" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="640" y="360" text-anchor="middle" fill="#637777" font-size="11">every GPU has high-bandwidth access to every other GPU</text>

  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#addb67"/>
    </marker>
  </defs>
</svg>
