<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">
  <rect x="0" y="0" width="900" height="400" rx="12" fill="#011627" stroke="#1d3b53" stroke-width="2"/>

  <text x="450" y="36" text-anchor="middle" fill="#82aaff" font-size="16" font-weight="bold">TILED MATMUL: REUSE DATA IN SHARED MEMORY</text>
  <text x="450" y="58" text-anchor="middle" fill="#637777" font-size="11">16x16 tiles of A and B are loaded once, then reused for 16x16 output cells</text>

  <!-- A tile -->
  <rect x="80" y="100" width="180" height="160" rx="10" fill="#0b2942" stroke="#7fdbca" stroke-width="2"/>
  <text x="170" y="136" text-anchor="middle" fill="#7fdbca" font-size="14" font-weight="bold">A tile</text>
  <text x="170" y="190" text-anchor="middle" fill="#637777" font-size="12">16 x 16</text>
  <text x="170" y="236" text-anchor="middle" fill="#637777" font-size="11">shared memory</text>

  <!-- B tile -->
  <rect x="360" y="100" width="180" height="160" rx="10" fill="#0b2942" stroke="#7fdbca" stroke-width="2"/>
  <text x="450" y="136" text-anchor="middle" fill="#7fdbca" font-size="14" font-weight="bold">B tile</text>
  <text x="450" y="190" text-anchor="middle" fill="#637777" font-size="12">16 x 16</text>
  <text x="450" y="236" text-anchor="middle" fill="#637777" font-size="11">shared memory</text>

  <!-- C tile -->
  <rect x="640" y="100" width="180" height="160" rx="10" fill="#01111f" stroke="#addb67" stroke-width="2"/>
  <text x="730" y="136" text-anchor="middle" fill="#addb67" font-size="14" font-weight="bold">C tile</text>
  <text x="730" y="190" text-anchor="middle" fill="#637777" font-size="12">16 x 16</text>
  <text x="730" y="236" text-anchor="middle" fill="#637777" font-size="11">output, registers</text>

  <!-- operators -->
  <text x="292" y="186" text-anchor="middle" fill="#c792ea" font-size="28" font-weight="bold">x</text>
  <text x="572" y="186" text-anchor="middle" fill="#c792ea" font-size="28" font-weight="bold">=</text>

  <!-- bottom annotation -->
  <rect x="120" y="300" width="660" height="56" rx="10" fill="#0b2942" stroke="#c792ea" stroke-width="1.5"/>
  <text x="450" y="326" text-anchor="middle" fill="#c792ea" font-size="13" font-weight="bold">for each K-tile: load A and B into shared memory, sync, multiply-accumulate, sync</text>
  <text x="450" y="344" text-anchor="middle" fill="#637777" font-size="11">global memory traffic drops from O(K) per output cell to O(1) per tile</text>
</svg>
