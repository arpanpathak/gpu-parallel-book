<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">
  <rect x="0" y="0" width="860" height="250" rx="12" fill="#011627" stroke="#1d3b53" stroke-width="2"/>

  <text x="430" y="30" text-anchor="middle" fill="#637777" font-size="12">time</text>
  <line x1="60" y1="44" x2="800" y2="44" stroke="#637777" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- copy stream lane -->
  <text x="60" y="90" fill="#7fdbca" font-size="12" font-weight="bold">copy stream</text>
  <rect x="110" y="70" width="110" height="30" rx="6" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="165" y="89" text-anchor="middle" fill="#7fdbca" font-size="11">c0 H2D</text>
  <rect x="240" y="70" width="110" height="30" rx="6" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="295" y="89" text-anchor="middle" fill="#7fdbca" font-size="11">c1 H2D</text>
  <rect x="380" y="70" width="110" height="30" rx="6" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="435" y="89" text-anchor="middle" fill="#7fdbca" font-size="11">c2 H2D</text>
  <rect x="520" y="70" width="110" height="30" rx="6" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="575" y="89" text-anchor="middle" fill="#7fdbca" font-size="11">c3 H2D</text>

  <!-- compute stream lane -->
  <text x="60" y="150" fill="#addb67" font-size="12" font-weight="bold">compute stream</text>
  <rect x="165" y="130" width="110" height="30" rx="6" fill="#0b2942" stroke="#addb67" stroke-width="1.5"/>
  <text x="220" y="149" text-anchor="middle" fill="#addb67" font-size="11">c0 kernel</text>
  <rect x="300" y="130" width="110" height="30" rx="6" fill="#0b2942" stroke="#addb67" stroke-width="1.5"/>
  <text x="355" y="149" text-anchor="middle" fill="#addb67" font-size="11">c1 kernel</text>
  <rect x="445" y="130" width="110" height="30" rx="6" fill="#0b2942" stroke="#addb67" stroke-width="1.5"/>
  <text x="500" y="149" text-anchor="middle" fill="#addb67" font-size="11">c2 kernel</text>
  <rect x="585" y="130" width="110" height="30" rx="6" fill="#0b2942" stroke="#addb67" stroke-width="1.5"/>
  <text x="640" y="149" text-anchor="middle" fill="#addb67" font-size="11">c3 kernel</text>

  <!-- overlap callouts -->
  <rect x="240" y="180" width="230" height="30" rx="6" fill="#82aaff" fill-opacity="0.12" stroke="#82aaff" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="355" y="199" text-anchor="middle" fill="#82aaff" font-size="11">copy c1 overlaps kernel c0</text>
  <rect x="380" y="214" width="230" height="26" rx="6" fill="#82aaff" fill-opacity="0.08" stroke="#82aaff" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="495" y="231" text-anchor="middle" fill="#82aaff" font-size="10">copy c2 overlaps kernel c1</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#82aaff"/>
    </marker>
  </defs>
</svg>
