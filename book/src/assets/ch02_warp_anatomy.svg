  <!-- Bottom callout -->
  <rect x="60" y="470" width="740" height="72" rx="8" fill="#0b2942" stroke="#1d3b53" stroke-width="1.5"/>
  <text x="430" y="490" text-anchor="middle" fill="#7fdbca" font-size="12" font-weight="bold">one instruction, fetched once - executed by 32 lanes in the SAME clock, each on its OWN data</text>
  <text x="430" y="508" text-anchor="middle" fill="#d6deeb" font-size="11">this is SIMT (Chapter 1, 1.7): the programming convenience of many threads, the cost of SIMD</text>
  <text x="430" y="526" text-anchor="middle" fill="#f78c6c" font-size="11">if lanes take different branches, the paths run one after another - that is divergence (Chapter 5)</text>
