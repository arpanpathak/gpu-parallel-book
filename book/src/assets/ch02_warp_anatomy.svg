<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">
  <!-- Night Owl background panel -->
  <rect x="0" y="0" width="860" height="560" rx="12" fill="#011627" stroke="#1d3b53" stroke-width="2"/>

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" fill="#82aaff" font-size="15" font-weight="bold" letter-spacing="1">THE WARP: 32 THREADS, ONE INSTRUCTION, LOCKSTEP</text>
  <text x="430" y="50" text-anchor="middle" fill="#637777" font-size="11">the hardware fetches ONE instruction; all 32 lanes (threads) execute it together, each on its OWN data</text>

  <!-- Scheduler -->
  <rect x="310" y="68" width="240" height="38" rx="7" fill="#01111f" stroke="#c792ea" stroke-width="1.5"/>
  <text x="430" y="92" text-anchor="middle" fill="#c792ea" font-size="11" font-weight="bold">warp scheduler picks one instruction</text>

  <!-- Instruction -->
  <rect x="350" y="120" width="160" height="36" rx="7" fill="#0b2942" stroke="#addb67" stroke-width="1.5"/>
  <text x="430" y="143" text-anchor="middle" fill="#addb67" font-size="12" font-weight="bold">LD R4, [R2+8]</text>

  <!-- Bus from instruction to all lanes -->
  <line x1="430" y1="156" x2="430" y2="172" stroke="#addb67" stroke-width="1.5"/>
  <line x1="96" y1="172" x2="764" y2="172" stroke="#addb67" stroke-width="1.5"/>
  <text x="430" y="167" text-anchor="middle" fill="#637777" font-size="9">one instruction, broadcast to all 32 lanes</text>

