<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace">
  <!-- Night Owl background panel -->
  <rect x="0" y="0" width="860" height="660" rx="12" fill="#011627" stroke="#1d3b53" stroke-width="2"/>

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" fill="#82aaff" font-size="15" font-weight="bold" letter-spacing="1">ARITHMETIC INTENSITY: HOW MUCH WORK PER BYTE</text>
  <text x="430" y="50" text-anchor="middle" fill="#637777" font-size="11">I = FLOPs / Bytes moved from memory - a kernel's "fuel efficiency": the work each byte must pay for</text>

  <!-- Region band: memory-bound left of the ridge (x=458), compute-bound right -->
  <polygon points="100,110 458,110 458,170 100,170" fill="#82aaff" opacity="0.08"/>
  <polygon points="458,110 760,110 760,170 458,170" fill="#addb67" opacity="0.10"/>
  <text x="240" y="145" text-anchor="middle" fill="#82aaff" font-size="11" font-weight="bold">memory-bound</text>
  <text x="620" y="145" text-anchor="middle" fill="#addb67" font-size="11" font-weight="bold">compute-bound</text>

  <!-- Ridge -->
  <line x1="458" y1="96" x2="458" y2="180" stroke="#ecc48d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="458" y="88" text-anchor="middle" fill="#ecc48d" font-size="11" font-weight="bold">ridge: I = P_peak/B ~ 18 (H100)</text>

  <!-- Axis -->
  <line x1="100" y1="170" x2="760" y2="170" stroke="#d6deeb" stroke-width="1.5"/>
  <!-- Decade ticks: 0.01, 0.1, 1, 10, 100, 1000, 10000 -->
  <line x1="100" y1="170" x2="100" y2="176" stroke="#d6deeb" stroke-width="1"/><text x="100" y="192" text-anchor="middle" fill="#d6deeb" font-size="10">0.01</text>
  <line x1="210" y1="170" x2="210" y2="176" stroke="#d6deeb" stroke-width="1"/><text x="210" y="192" text-anchor="middle" fill="#d6deeb" font-size="10">0.1</text>
  <line x1="320" y1="170" x2="320" y2="176" stroke="#d6deeb" stroke-width="1"/><text x="320" y="192" text-anchor="middle" fill="#d6deeb" font-size="10">1</text>
  <line x1="430" y1="170" x2="430" y2="176" stroke="#d6deeb" stroke-width="1"/><text x="430" y="192" text-anchor="middle" fill="#d6deeb" font-size="10">10</text>
  <line x1="540" y1="170" x2="540" y2="176" stroke="#d6deeb" stroke-width="1"/><text x="540" y="192" text-anchor="middle" fill="#d6deeb" font-size="10">100</text>
  <line x1="650" y1="170" x2="650" y2="176" stroke="#d6deeb" stroke-width="1"/><text x="650" y="192" text-anchor="middle" fill="#d6deeb" font-size="10">1000</text>
  <line x1="760" y1="170" x2="760" y2="176" stroke="#d6deeb" stroke-width="1"/><text x="760" y="192" text-anchor="middle" fill="#d6deeb" font-size="10">10000</text>

  <text x="430" y="216" text-anchor="middle" fill="#d6deeb" font-size="12" font-weight="bold">arithmetic intensity I (FLOP/byte) - log scale: how many FLOPs each byte must buy</text>

  <!-- Kernel dots on the axis -->
  <circle cx="199" cy="170" r="6" fill="#f78c6c" stroke="#ff9d5c" stroke-width="1.5"/>
  <circle cx="235" cy="170" r="6" fill="#f78c6c" stroke="#ff9d5c" stroke-width="1.5"/>
  <circle cx="353" cy="170" r="6" fill="#c792ea" stroke="#d6deeb" stroke-width="1.5"/>
  <circle cx="632" cy="170" r="6" fill="#7fdbca" stroke="#d6deeb" stroke-width="1.5"/>

  <!-- Legend -->
  <rect x="60" y="234" width="740" height="132" rx="8" fill="#0b2942" stroke="#1d3b53" stroke-width="1.5"/>
  <text x="76" y="256" fill="#82aaff" font-size="11" font-weight="bold">four kernels on the same machine - the only thing that changes is how many times each byte is reused:</text>
  <circle cx="84" cy="278" r="4.5" fill="#f78c6c" stroke="#ff9d5c" stroke-width="1"/>
  <text x="100" y="282" fill="#d6deeb" font-size="11">vector add: I = 0.08 FLOP/byte - 1 add for every 12 bytes (read a[i], read b[i], write c[i])</text>
  <circle cx="84" cy="300" r="4.5" fill="#f78c6c" stroke="#ff9d5c" stroke-width="1"/>
  <text x="100" y="304" fill="#d6deeb" font-size="11">SAXPY: I = 0.17 - 2 ops (multiply + add) for the same 12 bytes - still memory-bound</text>
  <circle cx="84" cy="322" r="4.5" fill="#c792ea" stroke="#d6deeb" stroke-width="1"/>
  <text x="100" y="326" fill="#d6deeb" font-size="11">FFT (typical): I ~ 2 - each datum is reused across several butterfly stages</text>
  <circle cx="84" cy="344" r="4.5" fill="#7fdbca" stroke="#d6deeb" stroke-width="1"/>
  <text x="100" y="348" fill="#d6deeb" font-size="11">SGEMM: I ~ 683 - every byte of A and B is reused ~N/6 times (N = 4096) - compute-bound</text>

  <!-- Bottom-left panel: low intensity -->
  <rect x="40" y="390" width="380" height="252" rx="8" fill="#01111f" stroke="#82aaff" stroke-width="1.5"/>
  <text x="230" y="412" text-anchor="middle" fill="#f78c6c" font-size="12" font-weight="bold">LOW INTENSITY: EACH BYTE WORKS ONCE</text>
  <!-- a[i], b[i] -> c[i] -->
  <rect x="70" y="462" width="80" height="46" rx="6" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="110" y="483" text-anchor="middle" fill="#7fdbca" font-size="11">a[i]</text>
  <text x="110" y="499" text-anchor="middle" fill="#637777" font-size="9">4 bytes</text>
  <rect x="70" y="536" width="80" height="46" rx="6" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="110" y="557" text-anchor="middle" fill="#7fdbca" font-size="11">b[i]</text>
  <text x="110" y="573" text-anchor="middle" fill="#637777" font-size="9">4 bytes</text>
  <circle cx="202" cy="502" r="27" fill="#0b2942" stroke="#addb67" stroke-width="1.5"/>
  <text x="202" y="509" text-anchor="middle" fill="#addb67" font-size="16" font-weight="bold">+</text>
  <rect x="288" y="479" width="80" height="46" rx="6" fill="#0b2942" stroke="#f78c6c" stroke-width="1.5"/>
  <text x="328" y="500" text-anchor="middle" fill="#f78c6c" font-size="11">c[i]</text>
  <text x="328" y="516" text-anchor="middle" fill="#637777" font-size="9">4 bytes</text>
  <!-- arrows -->
  <line x1="110" y1="508" x2="175" y2="508" stroke="#7fdbca" stroke-width="1.5" marker-end="url(#arrowT)"/>
  <line x1="110" y1="536" x2="177" y2="514" stroke="#7fdbca" stroke-width="1.5" marker-end="url(#arrowT)"/>
  <line x1="229" y1="502" x2="288" y2="502" stroke="#f78c6c" stroke-width="1.5" marker-end="url(#arrowT)"/>
  <text x="230" y="610" text-anchor="middle" fill="#d6deeb" font-size="11" font-weight="bold">12 bytes moved, 1 FLOP -> I ~ 0.08</text>
  <text x="230" y="628" text-anchor="middle" fill="#637777" font-size="10">every byte is read once, used once, written once: zero reuse</text>

  <!-- Bottom-right panel: high intensity -->
  <rect x="440" y="390" width="380" height="252" rx="8" fill="#01111f" stroke="#82aaff" stroke-width="1.5"/>
  <text x="630" y="412" text-anchor="middle" fill="#7fdbca" font-size="12" font-weight="bold">HIGH INTENSITY: EACH BYTE WORKS ~N/6 TIMES</text>
  <rect x="470" y="468" width="90" height="52" rx="6" fill="#0b2942" stroke="#7fdbca" stroke-width="1.5"/>
  <text x="515" y="490" text-anchor="middle" fill="#7fdbca" font-size="11">A[i][k]</text>
  <text x="515" y="507" text-anchor="middle" fill="#637777" font-size="9">4 bytes</text>
  <rect x="650" y="452" width="58" height="40" rx="5" fill="#01111f" stroke="#f78c6c" stroke-width="1.2"/>
  <text x="679" y="471" text-anchor="middle" fill="#f78c6c" font-size="9">C[i][0]</text>
  <rect x="650" y="496" width="58" height="40" rx="5" fill="#01111f" stroke="#f78c6c" stroke-width="1.2"/>
  <text x="679" y="515" text-anchor="middle" fill="#f78c6c" font-size="9">C[i][1]</text>
  <rect x="650" y="540" width="58" height="40" rx="5" fill="#01111f" stroke="#f78c6c" stroke-width="1.2"/>
  <text x="679" y="559" text-anchor="middle" fill="#f78c6c" font-size="9">C[i][2]</text>
  <text x="679" y="588" text-anchor="middle" fill="#637777" font-size="10">... and N-3 more</text>
  <line x1="560" y1="482" x2="650" y2="472" stroke="#f78c6c" stroke-width="1.5" marker-end="url(#arrowT)"/>
  <line x1="560" y1="500" x2="650" y2="516" stroke="#f78c6c" stroke-width="1.5" marker-end="url(#arrowT)"/>
  <line x1="560" y1="512" x2="650" y2="560" stroke="#f78c6c" stroke-width="1.5" marker-end="url(#arrowT)"/>
  <text x="630" y="610" text-anchor="middle" fill="#d6deeb" font-size="11" font-weight="bold">2N^3 FLOPs / (3N^2 x 4 bytes) -> I ~ N/6 ~ 683</text>
  <text x="630" y="628" text-anchor="middle" fill="#637777" font-size="10">one byte of A is multiplied into EVERY output of row i: massive reuse</text>

  <defs>
    <marker id="arrowT" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7fdbca"/>
    </marker>
  </defs>
</svg>
