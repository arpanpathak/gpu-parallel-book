[package]
name = "host_closure"
version = "0.1.0"
edition = "2021"

[workspace]

# CUDA-Oxide (Chapter 14) - experimental rustc backend compiling #[kernel]
# functions to PTX. The crates live in the NVlabs/cuda-oxide repository.
#
# This is the shape generated by `cargo oxide new` (plus cuda-core, which the
# host runtime needs). Pin a revision if you want reproducible builds; the
# book's companion is validated against the current CUDA-Oxide 0.2.1 API.
[dependencies]
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git" }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git" }
