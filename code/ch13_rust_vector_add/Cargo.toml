[package]
name = "vector-add"
version = "0.1.0"
edition = "2021"

# cudarc - safe CUDA bindings for Rust (Chapter 13).
# Choose the feature matching your CUDA toolkit version, e.g.:
#   cuda-12040  -> CUDA 12.4
#   cuda-13010  -> CUDA 13.1
# See https://crates.io/crates/cudarc for the full list.
[dependencies]
cudarc = { version = "0.13", features = ["cuda-12040"] }

# The kernel is compiled to PTX ahead of time with nvcc, exactly as in the
# book (13.3). main.rs loads vector_add.ptx from the filesystem via
# Ptx::from_file (13.4); see 13.5 for the include_str! embedded alternative.
#   nvcc -arch=compute_60 -ptx vector_add.cu -o vector_add.ptx
# (use compute_87 on Jetson Orin, compute_80 on A100, compute_90 on H100)
